# ============================================================
# CoreSwift CRM — PRODUCTION docker-compose (canonical)
# ============================================================
# NOTE: the authoritative compose lives at /opt/swift/docker/crm-swift/docker-compose.yml
# on the VPS. It runs the crm-swift image built from the HOST-BUILT binary
# (see Dockerfile above). This repo copy is the source of truth for that file.
# ============================================================
services:
  crm-swift:
    image: crm-swift:latest
    container_name: crm-swift
    restart: always
    network_mode: host
    env_file:
      - /etc/swift/env/coreswift.env
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf -o /dev/null 'http://127.0.0.1:8084/api/health' || curl -sk -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8084/api/health' | grep -qE '^(200|401|403|404|405)'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
