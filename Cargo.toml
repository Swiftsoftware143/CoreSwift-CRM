[package]
name = "crm-swift"
version = "0.1.0"
edition = "2021"
description = "CRM Swift — Multi-tenant Lead Management Operating System"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "set-header", "fs"] }
tokio = { version = "1", features = ["full", "signal"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# Auth
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }

# CSV import/export (src/csv_handler.rs)
csv = "1"

# Dates
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v1", "serde"] }

# Deterministic `regex_extract(pattern)` transform in the data mapper (src/data_mapping/transforms.rs)
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Config
dotenvy = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Background jobs
tokio-cron-scheduler = "0.11"

# Random
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

# Decimal type for NUMERIC columns
rust_decimal = { version = "1", features = ["serde"] }

# HTTP client (webhook delivery + n8n)
reqwest = { version = "0.12", features = ["json"] }

# HTTP headers
http = "1"
# Email provider abstraction (mig 056)
async-trait = "0.1"
# The fleet's one MCP door — JSON-RPC 2.0 transport, the credential-resolver contract, tenancy,
# 404-not-403, the redacted audit line and a startup-validated tool registry. PINNED BY REV: the
# crate is shared by every product and must not move under this app's build.
#
# 0.1.2 (axum-0.7 line, tag v0.1.2-axum07) filters `tools/list` by the resolved credential's role.
# CoreSwift is the only door in the fleet that already ships a read_only credential role
# (`personal_api_keys.api_role`), so on 0.1.0 a read_only key was OFFERED every write tool and only
# refused when it called one — the tool list lied. The 0.4.0 line carries the same filter but needs
# axum 0.8; this app is axum 0.7 (kanban t_46a81465).
mcp-door = { git = "https://github.com/Swiftsoftware143/mcp-door", rev = "795033790d27c98d74f0e9bdf2ca7ef3b12e5d61" }
hmac = "0.12"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport"] }
# Logo resizing at upload (src/image_store.rs, kanban t_b671a0f7). The logo the customer uploads is
# decoded ONCE, fitted to a mail-safe size at 2x for sharpness, and re-encoded as PNG — the one format
# Gmail, Outlook and Apple Mail all render without a fallback. Without this the app would forward
# whatever a camera produced (4 MB JPEG, WebP that Outlook cannot draw) into every signature.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde_urlencoded = "0.7"
url = "2"
calamine = "0.36.1"
# Ed25519 verification of Telnyx webhook deliveries (src/telnyx/verify.rs, kanban t_fd5000e1). ring is
# already in this crate's graph through sqlx/rustls, so the fleet's Alpine image needs no new package
# and no OpenSSL binding: `Ed25519KeyPair` also lets the module's tests sign, so the verifier is
# proven against real signatures rather than a fixture.
ring = "0.17"

[dev-dependencies]
# Tests only: `ServiceExt::oneshot` drives a real Router through the middleware stack so the
# body-read deadline is proven to fire (kanban t_59745689). The production graph does not enable
# tower's `util` feature, and tests must not widen it.
tower = { version = "0.4", features = ["util"] }
# Tests only: a request body that never arrives is built from a `futures_core::Stream` via
# `Body::from_stream`. futures-core is already in the production graph (axum-core depends on it),
# so this makes the trait nameable in tests without adding a package.
futures-core = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
