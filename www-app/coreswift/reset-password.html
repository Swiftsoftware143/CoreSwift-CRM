<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password — CoreSwift CRM</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e1e4ed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1d27;border:1px solid #2d3248;border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:22px;font-weight:700;text-align:center}
.sub{color:#8b8fa3;font-size:13px;text-align:center;margin:6px 0 20px;line-height:1.5}
label{display:block;font-size:12px;color:#8b8fa3;margin:12px 0 5px}
input{background:#232736;border:1px solid #2d3248;color:#e1e4ed;padding:11px 13px;border-radius:8px;font-size:14px;width:100%}
input:focus{outline:none;border-color:#38bdf8}
button{width:100%;margin-top:18px;background:#38bdf8;color:#0b1220;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.msg.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.msg.ok{display:block;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#6ee7b7}
.msg.info{display:block;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.35);color:#bae6fd}
.foot{text-align:center;font-size:12px;color:#8b8fa3;margin-top:18px}
a{color:#38bdf8}
</style>
</head>
<body>
<div class="card">
  <h1>Choose a new password</h1>
  <p class="sub">Enter the reset code from your email, then pick a new password. Minimum 8 characters.</p>
  <form id="f">
    <label for="t">Reset code</label>
    <input id="t" type="text" autocomplete="one-time-code" required>
    <label for="p">New password</label>
    <input id="p" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Confirm new password</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="b">Set new password</button>
  </form>
  <div class="msg" id="m"></div>
  <div class="foot"><a href="/login">&larr; Back to sign in</a></div>
</div>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f'), t = document.getElementById('t'), p = document.getElementById('p'),
      p2 = document.getElementById('p2'), b = document.getElementById('b'), m = document.getElementById('m');
  function show(k, html) { m.className = 'msg ' + k; m.innerHTML = html; }
  // The emailed link carries ?token=..., but this host masks credential-shaped query args
  // (nginx `$args ~* token=`), so the value is normally dropped and the user pastes the code
  // instead. Read it if it survived, never depend on it.
  try {
    var q = new URLSearchParams(window.location.search).get('token');
    if (q) { t.value = q; }
    else { show('info', 'Copy the reset code from your email and paste it above.'); }
  } catch (e) {}
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var code = t.value.trim(), pw = p.value, pw2 = p2.value;
    if (!code) { show('err', 'Enter the reset code from your email'); return; }
    if (pw.length < 8) { show('err', 'Password must be at least 8 characters'); return; }
    if (pw !== pw2) { show('err', 'The two passwords do not match'); return; }
    b.disabled = true; b.textContent = 'Saving...';
    fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: code, password: pw })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (x) {
      if (!x.ok) throw new Error((x.d && (x.d.error || x.d.message)) || 'Request failed');
      show('ok', ((x.d && x.d.message) || 'Your password has been reset') + ' — redirecting to sign in...');
      setTimeout(function () { window.location.href = '/login'; }, 1800);
    }).catch(function (err) {
      show('err', err.message); b.disabled = false; b.textContent = 'Set new password';
    });
  });
})();
</script>
</body>
</html>
