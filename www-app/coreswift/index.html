<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f1117;--bg-secondary:#1a1d27;--bg-card:#222532;
  --bg-hover:#2a2d3a;--bg-active:#2d3152;
  --text-primary:#e8eaed;--text-secondary:#9aa0a6;--text-muted:#8e96a3;
  --accent:#6366f1;--accent-hover:#818cf8;--accent-subtle:rgba(99,102,241,.12);
  --success:#22c55e;--warning:#f59e0b;--error:#ef4444;
  --border:#2d3148;--border-light:#383c52;
  --radius-sm:4px;--radius:8px;--radius-lg:12px;
  --sidebar-w:260px;--sidebar-collapsed:60px;--header-h:56px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
}
/* ── DAY MODE (David, 2026-11-21: "make sure all the apps have night and day mode so it doesn't
   always have to be so black"). One attribute on <html> swaps every surface, because the whole console
   is already painted from these variables — no rule below has to know which theme is active. Chosen for
   readability in daylight: near-white page, white cards, near-black text, and a slightly deeper accent
   so the primary buttons keep their contrast against a light background. */
html[data-theme="light"]{
  --bg-primary:#f6f7fb;--bg-secondary:#eef0f6;--bg-card:#ffffff;
  --bg-hover:#e9ecf4;--bg-active:#dfe3f2;
  --text-primary:#16181d;--text-secondary:#4b5563;--text-muted:#5d6673;
  --accent:#4f46e5;--accent-hover:#4338ca;--accent-subtle:rgba(79,70,229,.10);
  --success:#15803d;--warning:#b45309;--error:#b91c1c;
  --border:#dde1ea;--border-light:#c9cfdb;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 8px 32px rgba(16,24,40,.12);
}
html[data-theme="light"] body{background:var(--bg-primary);color:var(--text-primary)}
html[data-theme="light"] img,
html[data-theme="light"] svg{color-scheme:light}
html[data-theme="light"] .sidebar,
html[data-theme="light"] .topbar,
html[data-theme="light"] .card,
html[data-theme="light"] .modal,
html[data-theme="light"] .table-wrap,
html[data-theme="light"] input,
html[data-theme="light"] select,
html[data-theme="light"] textarea,
html[data-theme="light"] pre{color-scheme:light}
/* ── SURFACE LEVELS + TYPE SCALE (design tokens) ───────────────────────────────────────────────
   Level 0 page · level 1 task card · level 2 nested panel · level 3 modal. Reference material sits on a
   SUNKEN surface (--bg-secondary, no shadow, muted text) so it reads as documentation rather than as
   another thing to press. Every rule below uses tokens, so both themes get the same hierarchy. */
.lvl-1{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:16px}
.lvl-2{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.sunken{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;box-shadow:none}
.sunken h3,.sunken .card-title{font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}
.sunken p,.sunken li{font-size:13px;color:var(--text-secondary)}
.eyebrow{font-size:11px;letter-spacing:.09em;color:var(--text-muted);font-weight:700;margin-bottom:8px;text-transform:uppercase}
.task-title{font-size:18px;font-weight:700;margin-bottom:4px}
.task-sub{font-size:13px;color:var(--text-secondary);margin-bottom:14px;max-width:70ch}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);display:flex;min-height:100vh;overflow:hidden;line-height:1.5}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ===== LOGIN ===== */
.login-wrap{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;background:var(--bg-primary)}
.login-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:420px;max-width:90vw;box-shadow:var(--shadow-lg)}
.login-card .logo{font-size:2rem;margin-bottom:8px;text-align:center}
.login-card h1{font-size:1.4rem;margin-bottom:4px;text-align:center}
.login-card .sub{color:var(--text-secondary);margin-bottom:28px;text-align:center;font-size:.9rem}
.login-error{background:rgba(239,68,68,.12);color:var(--error);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:.85rem;display:none}
/* WCAG 1.4.3: white on indigo-500 is 4.47:1 (just under AA). The login button uses the same
   indigo one step darker so its label clears 4.5:1; the rest of the dark console is unchanged. */
#loginScreen .btn-primary{background:#4f46e5}#loginScreen .btn-primary:hover{background:#4338ca}

/* ===== FORMS ===== */
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:.82rem;color:var(--text-secondary);font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.88rem;outline:none;transition:border-color .2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-hint{font-size:.78rem;color:var(--text-muted);margin-top:4px}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:.88rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-secondary{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg-hover)}
.btn-danger{background:var(--error);color:#fff}.btn-danger:hover{opacity:.9}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid transparent}.btn-ghost:hover{color:var(--text-primary);background:var(--bg-hover)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-xs{padding:3px 8px;font-size:.75rem;border-radius:3px}
.btn-block{width:100%;justify-content:center}
.btn-icon{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center}.btn-icon:hover{color:var(--text-primary);background:var(--bg-hover)}

/* ===== LAYOUT ===== */
.sidebar{width:var(--sidebar-w);background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:100;transition:width .2s ease;overflow:hidden;flex-shrink:0}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar.collapsed .nav-text,.sidebar.collapsed .nav-arrow,.sidebar.collapsed .sidebar-brand-text,.sidebar.collapsed .nav-group-label{opacity:0;pointer-events:none;transition:opacity .1s}
.sidebar.collapsed .nav-item{padding:10px 0;justify-content:center}
.sidebar.collapsed .nav-icon{margin-right:0;font-size:1.2rem}
.main-wrap{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;transition:margin-left .2s ease}
.main-wrap.expanded{margin-left:var(--sidebar-collapsed)}

/* ===== HEADER ===== */
.header{height:var(--header-h);background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.header-title{font-size:1.1rem;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.user-btn{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);cursor:pointer;font-size:.85rem;transition:all .2s}
.user-btn:hover{background:var(--bg-hover)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;color:#fff;flex-shrink:0}
/* The account chip's LEVEL label. It is filled from the tenant's OWN plan row (checkPlan() ->
   GET /api/billing/subscription + /billing/plans/:id) and never from a literal — the FunnelSwift
   defect this fleet surface exists to close was a chip that read the word "User". Hidden until a
   plan is really read, so it cannot claim a level the console never loaded. */
.plan-chip{font-size:.68rem;font-weight:600;background:var(--accent-subtle);color:var(--accent-hover);border-radius:10px;padding:1px 8px;margin-left:2px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropdown{position:relative}
.dropdown-menu{position:absolute;top:100%;right:0;margin-top:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);min-width:200px;box-shadow:var(--shadow-lg);z-index:200;display:none;overflow:hidden}
.dropdown-menu.show{display:block}
.dropdown-item{padding:10px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.85rem;color:var(--text-primary);transition:background .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.dropdown-item:hover{background:var(--bg-hover)}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}

/* ===== SIDEBAR NAV ===== */
.sidebar-header{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;height:var(--header-h)}
.sidebar-brand{font-size:1rem;font-weight:700;white-space:nowrap}
.sidebar-logo{font-size:1.4rem}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{padding:4px 0}
.nav-divider{padding:8px 20px;font-size:.7rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--text-secondary);font-size:.88rem;transition:all .15s;border-left:3px solid transparent;white-space:nowrap;background:none;border:0;border-left:3px solid transparent;font-family:inherit;box-sizing:border-box;width:100%;text-align:left}
.nav-item:hover{color:var(--text-primary);background:var(--bg-hover)}
/* FIND A SCREEN (2026-11-20). This console's sidebar carries 61 entries (54 on the customer
   side); scrolling it to reach one screen is the slowest thing an operator does all day. One
   filter box, no new data: it hides the entries that do not match, expands the groups that
   hold a match, and restores the exact view you had when the box is cleared. Purely local —
   nothing is fetched, nothing is saved. */
.sidebar-search-wrap{padding:8px 12px 4px}
.sidebar-search{width:100%;box-sizing:border-box;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);font-size:13px;font-family:inherit}
.sidebar-search::placeholder{color:var(--text-secondary,#64748b)}
.sidebar-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.sidebar.collapsed .sidebar-search-wrap{display:none}
.sidebar-search-empty{padding:6px 16px 10px;font-size:12px;color:var(--text-secondary,#64748b)}
.nav-item.active{color:#fff;background:var(--accent-subtle);border-left-color:var(--accent)}
.nav-item .nav-icon{width:20px;text-align:center;flex-shrink:0;font-size:1rem}
.nav-item .nav-text{flex:1}
.nav-item .nav-arrow{font-size:.7rem;transition:transform .2s;color:var(--text-muted)}
.nav-item.group-expanded .nav-arrow{transform:rotate(90deg)}
.nav-group-items{overflow:hidden;max-height:0;transition:max-height .3s ease}
.nav-group-items.expanded{max-height:600px}
.nav-group-items .nav-item{padding-left:44px;font-size:.84rem}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0}
.collapse-btn{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-muted);font-size:.82rem;background:none;border:none;width:100%;padding:6px 0;font-family:inherit}
.collapse-btn:hover{color:var(--text-primary)}
.admin-section{display:none}
.admin-section.visible{display:block}

/* ===== MAIN CONTENT ===== */
.content{flex:1;overflow-y:auto;padding:0}
.content-inner{padding:24px;max-width:1400px}
.page-header{margin-bottom:24px}
.page-header h2{font-size:1.5rem;font-weight:600;margin-bottom:4px}
.page-header p{color:var(--text-secondary);font-size:.9rem}
.page-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===== BANNER ===== */
.upgrade-banner{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.1));border:1px solid var(--accent);border-radius:var(--radius);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.upgrade-banner p{font-size:.9rem;color:var(--text-primary);margin:0}
.upgrade-banner .plan-name{color:var(--accent-hover);font-weight:600}
.upgrade-banner .banner-actions{display:flex;gap:8px;flex-shrink:0}
.upgrade-banner.dismissed{display:none}

/* ===== CARDS ===== */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.9rem}
.card-body{padding:20px}
.card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px}

/* ===== STATS GRID ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:default}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .stat-icon{font-size:1.5rem;margin-bottom:8px}
.stat-card .stat-value{font-size:1.8rem;font-weight:700;margin-bottom:2px}
.stat-card .stat-label{font-size:.82rem;color:var(--text-secondary)}
.stat-card.accent{border-left:3px solid var(--accent)}

/* ===== TABLE ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 14px;font-size:.88rem;border-bottom:1px solid var(--border);color:var(--text-primary)}
tr:hover td{background:var(--bg-hover)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px}
.empty-state h3{font-size:1.1rem;margin-bottom:6px;color:var(--text-secondary)}
.empty-state p{font-size:.88rem;max-width:400px;margin:0 auto 16px}

/* ===== BADGES ===== */
.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:500}
.badge-primary{background:var(--accent-subtle);color:var(--accent-hover)}
.badge-success{background:rgba(34,197,94,.12);color:var(--success)}
.badge-warning{background:rgba(245,158,11,.12);color:var(--warning)}
.badge-error{background:rgba(239,68,68,.12);color:var(--error)}
.badge-muted{background:var(--bg-secondary);color:var(--text-muted)}

/* ===== TOASTS ===== */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:var(--radius);font-size:.88rem;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;display:flex;align-items:center;gap:10px;min-width:300px;max-width:450px}
.toast-success{background:#065f46;color:#d1fae5;border:1px solid #059669}
.toast-error{background:#7f1d1d;color:#fecaca;border:1px solid #dc2626}
.toast-info{background:#1e3a5f;color:#dbeafe;border:1px solid #3b82f6}
.toast-warning{background:#78350f;color:#fef3c7;border:1px solid #f59e0b}
.toast-close{margin-left:auto;cursor:pointer;opacity:.7;background:none;border:none;color:inherit;font-size:1rem}
.toast-close:hover{opacity:1}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:520px;max-width:90vw;max-height:85vh;overflow-y:auto;animation:modalIn .2s ease}
.modal-lg{width:700px}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg-card);z-index:1}
.modal-header h3{font-size:1.1rem;font-weight:600}
.modal-body{padding:24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--bg-card)}
@keyframes modalIn{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

/* ===== GRID ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ===== PROVIDER CARDS ===== */
.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.provider-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s}
.provider-card:hover{border-color:var(--accent)}
.provider-card.connected{border-color:var(--success)}
.provider-card .provider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.provider-card .provider-name{font-weight:600;font-size:.95rem}
.provider-card .provider-status{font-size:.78rem}
.provider-card .provider-status.coming-soon{background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:999px;font-weight:600}
.provider-card .provider-desc{font-size:.82rem;color:var(--text-secondary);margin-bottom:14px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.connected{background:var(--success)}
.status-dot.disconnected{background:var(--text-muted)}

/* ===== CHAT ===== */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 180px);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.chat-msg{padding:10px 14px;border-radius:var(--radius);max-width:80%;font-size:.88rem;line-height:1.5}
.chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.chat-msg.assistant{align-self:flex-start;background:var(--bg-secondary);border:1px solid var(--border)}
.chat-input-area{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border)}
.chat-input-area input{flex:1;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.88rem;outline:none}
.chat-input-area input:focus{border-color:var(--accent)}
.chat-msg .msg-role{font-size:.72rem;color:var(--text-muted);margin-bottom:4px}

/* ===== SEARCH BAR ===== */
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.88rem;outline:none}
.search-bar input:focus{border-color:var(--accent)}

/* ===== TOGGLE ===== */
.toggle{position:relative;display:inline-block;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.2s}
.toggle-slider:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:var(--text-primary);border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px)}

/* ===== CONFIG LIST ===== */
.config-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden}
.config-item{background:var(--bg-card);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.config-item .config-info{flex:1}
.config-item .config-label{font-weight:500;font-size:.9rem}
.config-item .config-desc{font-size:.8rem;color:var(--text-secondary);margin-top:2px}

/* ===== PLANS ===== */
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.plan-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;transition:all .2s;position:relative}
.plan-card:hover{border-color:var(--accent)}
.plan-card.current{border-color:var(--accent);background:var(--accent-subtle)}
.plan-card .plan-badge{position:absolute;top:12px;right:12px}
.plan-card .plan-name{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.plan-card .plan-price{font-size:2rem;font-weight:700;margin:12px 0}
.plan-card .plan-price span{font-size:.9rem;color:var(--text-secondary);font-weight:400}
.plan-card .plan-features{list-style:none;padding:0;margin:16px 0;text-align:left}
.plan-card .plan-features li{padding:6px 0;font-size:.85rem;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.plan-card .plan-features li.check{color:var(--text-primary)}

/* ===== PLACEHOLDER ===== */
.placeholder-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.placeholder-panel .placeholder-icon{font-size:3.5rem;margin-bottom:16px}
.placeholder-panel h3{font-size:1.2rem;margin-bottom:8px}
.placeholder-panel p{color:var(--text-secondary);font-size:.9rem;max-width:450px;margin:0 auto 20px}

/* ===== LOADING ===== */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--text-secondary)}

.hidden{display:none!important}

/* THE CHOICE CROSSES SUBDOMAINS (CEO correction, 2026-11-21): localStorage is per-ORIGIN, so a
   choice made in this console was invisible on booking./inbox. and vice versa. The shared value is a
   cookie on coreswiftcrm.com — the same one the standalone pages use — with localStorage kept as the
   per-origin fallback. */
(function(){
  function fromCookie(){try{var m=document.cookie.match(/(?:^|;\s*)cs_theme=(dark|light)/);return m?m[1]:null;}catch(e){return null;}}
  try{
    var t=fromCookie();
    if(!t){try{t=localStorage.getItem('crm_theme');}catch(e){}}
    if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)t='light';
    document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');
  }catch(e){document.documentElement.setAttribute('data-theme','dark');}
})();

<script>



const STATE = {
  token: null,
  user: null,
  activeTab: 'dashboard',
  portalUrl: '',   // CS-22: the customer "My Support" URL, filled from GET /api/tickets
  ticketView: 'open',   // which saved view the ticket list is showing (server-side predicate)
  ticketQuery: '',      // the search box: a number, an email, a name or words from the subject
  sidebarCollapsed: false,
  planName: '',    // set by checkPlan() from the tenant's OWN plan row; '' = not known, never a guess
  planId: null,    // that plan's id — the upgrade modal's Current badge keys off this, not off a name
  providers: {},
  integrations: {},
  workspace: null  // the workspace this session is working in {id,name,is_default}; set by loadWorkspaces()
};

// A module the workspace's plan does not include must not offer its own write action: the button
// can only answer 402. Measured 2026-10-16 in Chromium (Free workspace, app.coreswiftcrm.com): the
// Round Robin pane printed the lock AND its "+ New Team" opened a working Create form, whose POST
// was then refused — the customer filled in a form that could never save.
//
// Called from BOTH 402 doors: `API.call` and the Webhooks loader's own fetch (`err.locked`), which
// predates API.call and does not go through it. Gated on the pane body actually carrying the
// server's sentence, so a 402 raised by a single TILE (the dashboard's /tickets/stats) never hides
// a pane's unrelated actions. The observer re-applies the hide for a bounded window because a pane
// can render its lock and then re-render its own header, which would put the button straight back.
function hideLockedPaneActions(planMessage) {
  const panels = document.getElementById('tabPanels');
  if (!panels || !planMessage) return;
  const hide = function () {
    if ((panels.innerText || '').indexOf(planMessage) === -1) return;
    panels.querySelectorAll('.page-actions .btn').forEach(function (b) {
      // A control explicitly marked as navigation stays usable: the Support Tickets pane's
      // "My Support" opens the customer portal, whose intake is deliberately NOT plan-gated.
      if (b.hasAttribute('data-keep-on-lock')) return;
      if (b.style.display !== 'none') b.style.display = 'none';
    });
  };
  hide();
  const obs = new MutationObserver(hide);
  obs.observe(panels, { childList: true, subtree: true, characterData: true });
  setTimeout(function () { obs.disconnect(); }, 8000);
}

const API = {
  // Exchange the stored refresh token for a new access token. Returns true when the session was
  // extended, false when the refresh token is gone or refused (then the caller signs out).
  async tryRefresh() {
    let rt = null;
    try { rt = localStorage.getItem('crm_refresh'); } catch (_) { return false; }
    if (!rt) return false;
    try {
      const r = await fetch('/api/auth/refresh', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: rt })
      });
      if (!r.ok) return false;
      const d = await r.json();
      const tok = d.token || d.access_token || d.accessToken;
      if (!tok) return false;
      STATE.token = tok;
      localStorage.setItem('crm_token', tok);
      if (d.refresh_token) localStorage.setItem('crm_refresh', d.refresh_token);
      return true;
    } catch (_) { return false; }
  },
  async call(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (STATE.token) headers['Authorization'] = `Bearer ${STATE.token}`;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    let res = await fetch('/api' + path, opts);
    // ONE SILENT REFRESH (2026-11-21). POST /api/auth/refresh existed with no caller, so an
    // expiring token ended the session in the middle of a form. Try the refresh token once, replay
    // the request, and only sign out if THAT fails — a live session should not be interrupted by a
    // clock.
    if (res.status === 401 && !opts.__retried) {
      const fresh = await API.tryRefresh();
      if (fresh) {
        opts.__retried = true;
        headers['Authorization'] = `Bearer ${STATE.token}`;
        res = await fetch('/api' + path, opts);
      }
    }
    if (res.status === 401) { logout(true); throw new Error('Session expired'); }
    if (res.status === 402) {
      showUpgradeBanner();
      // The gate answers a human sentence on every module and every ceiling: "Support tickets is not
      // available on your current plan. Upgrade to access it." (measured 2026-10-11). That sentence
      // now goes on BOTH planMessage and message, so a panel or toast that prints e.message names the
      // limit instead of the old internal words "Payment required" — which a free-tier workspace used
      // to see on the Rules panel, on ticket creation and on the Industries ceiling toast (all three
      // measured in Chromium 2026-10-12). `planGate` is the flag to test; do NOT test the old string.
      let planMessage = 'This feature is not included in your current plan. Upgrade to access it.';
      try {
        const d = await res.clone().json();
        const pick = [d.error, d.message, d.detail].find(function (v) {
          return typeof v === 'string' && v.trim();
        });
        if (pick) planMessage = pick;
      } catch (_) {}
      const err = new Error(planMessage);
      err.planGate = true;
      err.planMessage = planMessage;
      hideLockedPaneActions(planMessage);
      throw err;
    }
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      // Failures answer {"error": true, "message": "<human text>"} (src/errors.rs) — a BOOLEAN
      // `error` flag with the text in `message`. Reading `e.error` first therefore threw the flag
      // and every failed request in the workspace reported the literal string "true" instead of
      // the reason (e.g. 404 "No affiliate profile" rendered as "true"). Only strings are usable.
      try {
        const e = await res.json();
        const pick = [e.error, e.message, e.detail, e.error_description]
          .find(v => typeof v === 'string' && v.trim());
        msg = pick || msg;
      } catch(_){}
      throw new Error(msg);
    }
    return res.status === 204 ? null : res.json();
  },
  get(path) { return this.call('GET', path); },
  post(path, body) { return this.call('POST', path, body); },
  put(path, body) { return this.call('PUT', path, body); },
  patch(path, body) { return this.call('PATCH', path, body); },
  del(path) { return this.call('DELETE', path); }
};

// ── Features & Plans: per-plan feature toggles ───────────────────────────────
// Source of truth is GET /api/billing/plans/registry (the same 21-key registry the
// server enforces). The server denies with 402 when a plan's flag is explicitly false;
// an ABSENT key means allowed.
let FP_DATA = null;

async function loadFeatureMatrix() {
  const wrap = document.getElementById('fpWrap');
  if (!wrap) return;
  try {
    const d = await API.get('/billing/plans/registry');
    FP_DATA = d;
    const plans = d.plans || [], feats = d.features || [];
    if (!plans.length || !feats.length) {
      wrap.innerHTML = '<div style="padding:20px;color:var(--text-muted)">Registry returned no plans or no features.</div>';
      return;
    }
    let h = '<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;min-width:820px">' +
      '<thead><tr><th style="text-align:left;padding:10px;border-bottom:2px solid var(--border,#333)">Feature</th>';
    plans.forEach(p => {
      h += '<th style="text-align:center;padding:10px;border-bottom:2px solid var(--border,#333)">' +
           escapeHtml(p.name || p.slug) + '</th>';
    });
    h += '</tr></thead><tbody>';
    feats.forEach(f => {
      h += '<tr><td style="padding:10px;border-bottom:1px solid var(--border,#2a2a2a)">' +
        '<strong>' + escapeHtml(f.label) + '</strong><br>' +
        '<span style="color:var(--text-muted);font-size:12px">' + escapeHtml(f.key) +
        ' &middot; ' + escapeHtml(f.module) + '</span></td>';
      plans.forEach(p => {
        const v = (p.features || {})[f.key];
        const on = v === true;
        h += '<td style="text-align:center;padding:10px;border-bottom:1px solid var(--border,#2a2a2a)">' +
          '<input type="checkbox" style="width:18px;height:18px;cursor:pointer"' +
          ' data-plan="' + escapeHtml(p.id) + '" data-slug="' + escapeHtml(p.slug) + '"' +
          ' data-key="' + escapeHtml(f.key) + '"' + (on ? ' checked' : '') +
          ' onchange="toggleFeature(this)" title="' +
          (v === undefined ? 'not set on this plan (allowed)' : (on ? 'enabled' : 'disabled')) + '">' +
          (v === undefined ? '<div style="font-size:11px;color:var(--text-muted)">unset</div>' : '') +
          '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>' +
      '<p style="color:var(--text-secondary);margin-top:14px;max-width:820px">' +
      'An <strong>unset</strong> box means the plan does not mention that feature, which the server treats as ' +
      '<em>allowed</em> (so existing tenants are never silently stripped). Unticking writes an explicit ' +
      '<code>false</code> and is what actually denies the request with HTTP 402. Changes save immediately.</p>';
    wrap.innerHTML = h + fpPaymentSection(plans);
    wrap.querySelectorAll('[data-pay-save]').forEach(function (b) {
      b.addEventListener('click', function () { fpSavePayLink(b.getAttribute('data-pay-save')); });
    });
  } catch (e) {
    wrap.innerHTML = '<div style="padding:20px;color:var(--danger,#f66)">Could not load the registry: ' +
      escapeHtml(e.message) + '</div>';
  }
}

// ── Payment page per plan — the money door the console could not open (2026-11-18) ──────────
// The customer's plan modal shows an "Open payment page" door whenever a plan carries a hosted
// checkout link (`plans.checkout_url`), and PATCH /api/billing/plans/:id has always accepted that
// field — but this console had NO control that could set it. Measured 2026-11-18: every active plan
// on this install has `checkout_url = NULL` and `payment_provider = NULL`, `payment_providers` holds
// no row, and real buyers are refused at checkout with `payment_provider_not_configured`. A hosted
// link needs no API integration at all: the operator creates a payment page (Stripe Payment Link,
// PayPal button page, any https checkout), pastes it here, the buyer pays on that page and the
// workspace is switched onto the plan by hand. The field only ever holds an https address and is
// validated with the same predicate the customer's modal uses (`payLinkKind`), so the admin screen
// and the buyer's screen can never disagree about whether a plan has a working door.
function fpPayState(link) {
  const k = payLinkKind(link);
  if (k === 'ok') return { tone: '#16a34a', text: 'Live — buyers see “Open payment page”' };
  if (k === 'not_https') return { tone: '#dc2626', text: 'Must start with https://' };
  if (k === 'probe') return { tone: '#dc2626', text: 'That address is a placeholder, not a real page' };
  return { tone: 'var(--text-muted)', text: 'No payment page — buyers can only ask the team' };
}

function fpPaymentSection(plans) {
  let h = '<div style="margin-top:26px;max-width:980px">' +
    '<h3 style="margin:0 0 6px">Payment page for each plan</h3>' +
    '<p style="color:var(--text-secondary);margin:0 0 14px;font-size:13px">' +
    'Paste the https address of the page that takes the money for a plan (a Stripe Payment Link, a ' +
    'PayPal button page, any hosted checkout). A buyer who presses that plan is sent there, and the ' +
    'account is switched onto the plan once the payment lands. Leave it empty and buyers can still ' +
    'press <strong>Request this plan</strong> — the ask reaches the team and nothing is lost.</p>' +
    '<div id="fpPayRows">';
  plans.forEach(function (p) {
    const st = fpPayState(p.checkout_url);
    h += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;' +
      'border-bottom:1px solid var(--border,#2a2a2a)">' +
      '<strong style="min-width:150px">' + escapeHtml(p.name || p.slug) + '</strong>' +
      '<input type="url" data-pay-input="' + escapeHtml(p.id) + '" placeholder="https://buy.stripe.com/…" ' +
      'value="' + escapeHtml(p.checkout_url || '') + '" style="flex:1;min-width:280px;padding:8px 10px;' +
      'border:1px solid var(--border,#333);border-radius:6px;background:transparent;color:inherit">' +
      '<button class="btn btn-secondary btn-sm" data-pay-save="' + escapeHtml(p.id) + '">Save</button>' +
      '<span data-pay-state="' + escapeHtml(p.id) + '" style="font-size:12px;color:' + st.tone + '">' +
      escapeHtml(st.text) + '</span></div>';
  });
  h += '</div><p id="fpPayMsg" style="font-size:13px;margin-top:10px"></p></div>';
  return h;
}

async function fpSavePayLink(planId) {
  const inp = document.querySelector('[data-pay-input="' + planId + '"]');
  const msg = document.getElementById('fpPayMsg');
  const stEl = document.querySelector('[data-pay-state="' + planId + '"]');
  if (!inp || !msg) return;
  const url = String(inp.value || '').trim();
  if (url && payLinkKind(url) !== 'ok') {
    msg.style.color = '#dc2626';
    msg.textContent = 'Not saved: that address is not a real https payment page.';
    return;
  }
  msg.style.color = 'var(--text-muted)';
  msg.textContent = 'Saving…';
  try {
    const plan = await API.patch('/billing/plans/' + planId, { checkout_url: url });
    const saved = (plan && typeof plan.checkout_url === 'string') ? plan.checkout_url : url;
    inp.value = saved;
    const s = fpPayState(saved);
    if (stEl) { stEl.style.color = s.tone; stEl.textContent = s.text; }
    if (FP_DATA && FP_DATA.plans) {
      const row = FP_DATA.plans.find(function (p) { return p.id === planId; });
      if (row) row.checkout_url = saved;
    }
    msg.style.color = '#16a34a';
    msg.textContent = saved
      ? 'Saved. Buyers on this plan now get “Open payment page”.'
      : 'Cleared. Buyers on this plan can only ask the team.';
  } catch (e) {
    msg.style.color = '#dc2626';
    msg.textContent = 'Could not save: ' + (e && e.message ? e.message : 'unknown error');
  }
}

async function toggleFeature(el) {
  const planId = el.dataset.plan, slug = el.dataset.slug, key = el.dataset.key;
  const on = el.checked;
  el.disabled = true;
  try {
    // features is replaced whole (COALESCE), never merged — so merge client-side or the
    // plan loses its numeric limits.
    const plan = ((FP_DATA && FP_DATA.plans) || []).find(p => p.id === planId);
    const merged = Object.assign({}, (plan && plan.features) || {});
    merged[key] = on;
    await API.patch('/billing/plans/' + planId, { features: merged });
    if (plan) plan.features = merged;
    toast(key + ' turned ' + (on ? 'ON' : 'OFF') + ' for ' + slug, 'success');
  } catch (e) {
    el.checked = !on;
    toast('Save failed: ' + e.message, 'error');
  } finally {
    el.disabled = false;
  }
}

// Toast
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const icons = { success:'✓', error:'✕', info:'ℹ', warning:'⚠' };
  const t = document.createElement('div');
  t.className = 'toast toast-'+type;
  t.innerHTML = `<span>${icons[type]||''}</span><span>${escapeHtml(msg)}</span><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(t);
  setTimeout(() => { if(t.parentElement) t.remove(); }, 5000);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Tag chips carry a COLOUR THE USER PICKED, so a fixed white label cannot be guaranteed to clear
// WCAG AA: white on indigo-500 is 4.46:1 (axe, kanban t_ba8d1cbf). Pick the ink that actually has
// the higher contrast against the stored colour, so every chip a customer creates is readable in
// both themes. Unknown/non-hex values fall back to the theme accent.
function csBadgeInk(colour) {
  var c = String(colour || '').trim();
  if (!/^#[0-9a-fA-F]{6}$/.test(c)) return '#fff';
  function ch(i) { return parseInt(c.substr(i, 2), 16) / 255; }
  function lin(v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  var L = 0.2126 * lin(ch(1)) + 0.7152 * lin(ch(3)) + 0.0722 * lin(ch(5));
  var whiteInk = 1.05 / (L + 0.05);        // contrast of #fff text on this colour
  var blackInk = (L + 0.05) / 0.05;        // contrast of #111827 text on this colour
  return blackInk >= whiteInk ? '#000000' : '#fff';
}

// Human-readable labels for the user_role enum. The admin Users panel used to print the raw DB
// enum (`agency_admin`, `company_admin`, `team_member`, …) and, when a role was missing, fell
// back to the bare word "user" — so an operator read database internals instead of a role.
// Known values get a proper label; an unknown value is shown as-is (honest, no invented role);
// a MISSING one shows an em-dash, never a made-up "user".
const ROLE_LABELS = {
  owner: 'Owner', admin: 'Admin', super_admin: 'Super admin',
  agency_admin: 'Agency admin', client_admin: 'Client admin', company_admin: 'Company admin',
  team_member: 'Team member', member: 'Member', user: 'Member'
};
function roleLabel(r) {
  if (!r) return '—';
  return ROLE_LABELS[r] || r;
}

// ── ACCESSIBLE NAMES FOR EVERY RENDERED CONTROL (kanban t_ba8d1cbf) ─────────────────────────────
// The console's forms are built as strings: `<div class="form-group"><label>First name *</label>
// <input id="ctAddFirst"></div>`. The visible label is there, but without `for`/`id` axe reports
// every one of them as an unlabelled control (the modal forms alone were ~110 nodes). Rather than
// restamp ~110 template strings — and have the next form reintroduce the defect — ONE pass binds
// each label to the control that follows it, and names any control that still has no label from its
// id (a stable, human word: ctAddFirst → "Add First"). Called on every modal and every tab render.
function a11yWords(id) {
  var s = String(id || '').replace(/^[a-z]{1,4}(?=[A-Z])/, '').replace(/([a-z0-9])([A-Z])/g, '$1 $2')
    .replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}
function a11yBindLabels(root) {
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll('label:not([for])').forEach(function (l) {
    if (l.querySelector('input,select,textarea')) return;   // wrapped label already names its control
    var n = l.nextElementSibling, hops = 0;
    while (n && hops < 3 && !/^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName)) { n = n.nextElementSibling; hops++; }
    if (n && /^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName) && n.id) l.setAttribute('for', n.id);
  });
  root.querySelectorAll('input,select,textarea').forEach(function (c) {
    if (c.type === 'hidden') return;
    if (c.getAttribute('aria-label') || c.getAttribute('aria-labelledby')) return;
    if (c.closest('label')) return;
    if (c.id && root.querySelector('label[for="' + c.id.replace(/"/g, '\\"') + '"]')) return;
    if (c.id && document.querySelector('label[for="' + c.id.replace(/"/g, '\\"') + '"]')) return;
    var word = a11yWords(c.id) || a11yWords(c.getAttribute('name')) || 'Field';
    c.setAttribute('aria-label', word);
  });
}
// Async panels (contact tags, integration targets, mail client) fill a loading placeholder AFTER
// showModal returned, so the render-time pass above never sees them. One childList observer sweeps
// whatever gets inserted; it watches childList only (never attributes), so the for/aria-label writes
// it makes cannot re-trigger it.
(function () {
  if (window.__crmA11yObserver) return;
  window.__crmA11yObserver = true;
  var queued = false;
  function sweep() { queued = false; try { a11yBindLabels(document); } catch (e) {} }
  function schedule() { if (queued) return; queued = true; setTimeout(sweep, 120); }
  try { new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedule);
  else schedule();
})();

// Auth
// A sign-in must never post twice: Enter is now wired on both fields as well as the
// button, and a held key would otherwise fire a request per repeat.
let loginBusy = false;
async function doLogin() {
  if (loginBusy) return;
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; errEl.style.display='block'; return; }
  loginBusy = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    if (!res.ok) {
      let msg = 'Invalid credentials';
      // The envelope is {"error": true, "message": "<human text>"} — `error` is a BOOLEAN, so
      // reading it first rendered every refusal as the literal string "true". Read strings only.
      try {
        const e = await res.json();
        const pick = [e.error, e.message, e.detail, e.error_description]
          .find(v => typeof v === 'string' && v.trim());
        msg = pick || msg;
      } catch(_){}
      throw new Error(msg);
    }
    const data = await res.json();
    STATE.token = data.access_token || data.token;
    // The API returns `team_member` and NEVER `user`, so `data.user || {...role:'agency_admin'}`
    // always fell through and stamped EVERY login as a platform admin — which silently
    // defeated the role-filtered nav (every tenant rendered the platform menu).
    // Read the real role; a missing role must never default to a platform one.
    const acct = data.team_member || data.user || {};
    STATE.user = Object.assign({ email: email, name: email.split('@')[0] }, acct);
    if (!STATE.user.role) STATE.user.role = 'member';
    localStorage.setItem('crm_token', STATE.token);
    // The sign-in response has always carried a refresh token and nothing stored it, so a session
    // simply DIED mid-work ("Session expired" - measured twice in one sitting). Keep it.
    try { if (data && data.refresh_token) localStorage.setItem('crm_refresh', data.refresh_token); } catch (_) {}
    localStorage.setItem('crm_user', JSON.stringify(STATE.user));
    showApp();
    toast('Welcome back, ' + (STATE.user.name || STATE.user.email), 'success');
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    loginBusy = false;
  }
}

// ── NIGHT / DAY MODE (David, 2026-11-21) ─────────────────────────────────────────────────────────
// The theme is one attribute on <html>, so every screen follows without a single component knowing
// about it. It is read from storage and applied in the <head> BEFORE the body paints: without that,
// a person who chose day mode gets a black flash on every reload, which reads as a broken setting.
var THEME_KEY = 'crm_theme';
function themeApply(name) {
  var t = (name === 'light') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  // And the SHARED value, so the choice made here holds on booking./inbox. and in the guides — the
  // cookie is the only store every *.coreswiftcrm.com origin can read (CEO correction, 2026-11-21).
  try { document.cookie = 'cs_theme=;path=/;max-age=0'; } catch (e) {}
  try { document.cookie = 'cs_theme=' + t + ';domain=coreswiftcrm.com;path=/;max-age=31536000;SameSite=Lax'; } catch (e) {}
  var b = document.getElementById('themeToggle');
  if (b) { b.textContent = (t === 'light') ? '\uD83C\uDF19' : '\uD83C\uDF12'; b.title = (t === 'light') ? 'Switch to night mode' : 'Switch to day mode'; }
  var s2 = document.getElementById('themeToggleSide');
  if (s2) s2.textContent = (t === 'light') ? '\uD83C\uDF19' : '\uD83C\uDF12';
}
function themeToggle() {
  themeApply(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}
(function themeBoot() {
  // THE SHARED COOKIE WINS (CEO correction, 2026-11-21). This function runs AFTER the <head> boot, so
  // reading localStorage first here would undo a choice made on another CoreSwift address — which is
  // exactly what happened: pressing night on the booking page, then opening the console, answered day.
  var cookie = null;
  try { var m = document.cookie.match(/(?:^|;\s*)cs_theme=(dark|light)/); cookie = m ? m[1] : null; } catch (e) {}
  var saved = cookie;
  if (!saved) { try { saved = localStorage.getItem(THEME_KEY); } catch (e) {} }
  // Nothing anywhere: follow the operating system, so a Mac or Windows user in light mode is not
  // handed a black console on their first visit.
  if (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) saved = 'light';
  document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
})();

function logout(silent) {
  // Server-side session invalidation. POST /api/auth/logout blacklists this token in
  // Redis for its remaining TTL; clearing the token client-side alone left the session
  // replayable until it expired. Fire-and-forget with keepalive: the local state MUST be
  // cleared even if the call fails (a dead backend must never trap the user in the shell),
  // and keepalive lets the request outlive the page transition.
  if (STATE.token) {
    try {
      fetch('/api/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + STATE.token },
        keepalive: true
      }).catch(function(){});
    } catch (_) { /* never block sign-out */ }
  }
  stopNotifPoll();
  STATE.token = null;
  STATE.user = null;
  localStorage.removeItem('crm_token');
  localStorage.removeItem('crm_user');
  // The impersonation label is session state; leaving it behind describes a session that has ended.
  localStorage.removeItem('crm_impersonating');
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  if (!silent) toast('Signed out', 'info');
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  // NOTE: #appWrap ships with class="hidden" and the stylesheet has
  // `.hidden{display:none!important}` — that !important beats any inline style, so clearing
  // the inline display alone left the whole workspace invisible (a blank dark page after every
  // login). Drop the class as well as the inline style.
  var appWrap = document.getElementById('appWrap');
  appWrap.classList.remove('hidden');
  appWrap.style.display = '';
  document.getElementById('userEmail').textContent = STATE.user.email;
  // ONE answer the tab modules can read: is this person an account administrator? The server
  // enforces it (auth::middleware::require_account_admin_for); this only keeps a control that
  // would always be refused off the screen.
  window.CS_ACCOUNT_ADMIN = ['owner','account_owner','admin','agency_admin'].indexOf(STATE.user.role) >= 0;
  paintAvatar();
  renderSidebar();
  switchTab('dashboard');
  // DEEP LINK (?tab=billing). The mail client's storage banner has to send an owner to the screen
  // that sells more storage; before this the console ignored the query string, so the only door was
  // "sign in, then find Plans & Billing yourself". Only a REAL tab id is honoured, so a typo can
  // never paint an empty screen.
  try {
    const wanted = new URLSearchParams(window.location.search).get('tab');
    const known = [...MENU, ...SETTINGS_MENU, ...ADMIN_MENU, ...BOTTOM_MENU].flatMap(it => it.type === 'group' && it.children ? it.children.map(c => c.id) : [it.id]);
    if (wanted && known.indexOf(wanted) >= 0) switchTab(wanted);
  } catch (_) { /* a malformed query string must never block the console */ }
  checkPlan();
  loadUsage();
  loadWorkspaces();
  loadNotifCount();
  startNotifPoll();
}
