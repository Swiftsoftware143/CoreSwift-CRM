      '<p style="color:var(--text-secondary);margin:0 0 10px">One file with everything this account holds: your contacts, companies, deals, pipelines, tags and lists, tickets and help-desk settings, calendars and bookings, automations and webhooks, messages, mail, plan and team. It is built fresh each time you press the button, and nothing that could be used to sign in as somebody &mdash; passwords, API-key secrets, webhook signing secrets &mdash; is ever in it.</p>' +
      '<button type="button" class="btn btn-secondary" id="dlDataBtn" data-ops="profile-download" onclick="downloadMyData()">Download my data</button>' +
      '<p id="dlDataMsg" role="status" style="margin:10px 0 0;font-size:13px;display:none"></p>', '') +
    '<br>' +
    // DANGER ZONE (fleet standard §7, kanban t_48b65042) — the account's own exit doors, below a
    // full-width divider and LAST on the page. TWO separate actions with two consequence sentences:
    // `Cancel plan` closes (access ends, data kept 30 days, support can restore) and `Delete account
    // and data` erases (irreversible; only the billing documents tax law requires are kept). The
    // danger is stated in WORDS and carried by an icon, never by colour alone; both arms open a
    // confirmation dialog that re-checks the password and the typed word — and the SERVER re-checks
    // both, so a bare API call cannot skip either.
    '<div style="margin-top:28px;border-top:1px solid var(--border);padding-top:20px">' +
      '<div style="border:1.5px solid #dc2626;border-radius:10px;padding:18px;background:rgba(220,38,38,.06)">' +
        '<h3 style="color:#dc2626;margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px"><span aria-hidden="true">&#9888;</span> Danger zone</h3>' +
        '<p style="color:var(--text-secondary);margin:0 0 14px">These actions affect this whole account and everyone who signs in to it. Read each one before you press it.</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">' +
          '<button type="button" class="btn btn-secondary" data-ops="danger-cancel-plan" onclick="dangerDialog(\'close\')">Cancel plan</button>' +
          '<button type="button" class="btn btn-primary" data-ops="danger-erase" onclick="dangerDialog(\'erase\')" style="background:#dc2626;border-color:#dc2626">Delete account and data</button>' +
        '</div>' +
        '<p style="color:var(--text-secondary);margin:12px 0 0;font-size:13px"><strong>Cancel plan</strong> ends your sign-in, every API key and billing, and keeps your data for 30 days. <strong>Delete account and data</strong> destroys the data and cannot be undone.</p>' +
      '</div>' +
    '</div>';
}

// Paint the header chip's picture (or the initial letter) from STATE.user.avatar_url, and keep the
// Profile screen's preview in step.
function paintAvatar() {
  const u = STATE.user || {};
  const el = document.getElementById('userAvatar');
  if (el) {
    if (u.avatar_url) {
      el.style.backgroundImage = 'url(' + u.avatar_url + ')';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      el.textContent = '';
    } else {
      el.style.backgroundImage = '';
      el.textContent = ((u.name || u.email || '?')[0] || '?').toUpperCase();
    }
  }
  const img = document.getElementById('avatarImg');
  if (img) {
    if (u.avatar_url) { img.src = u.avatar_url; img.style.display = ''; }
    else { img.removeAttribute('src'); img.style.display = 'none'; }
  }
  // The Remove control exists only while a picture does: an account with initials is never offered
  // a button that would remove nothing (kanban t_d6991cd1).
  const rm = document.getElementById('avatarRemove');
  if (rm) rm.style.display = u.avatar_url ? '' : 'none';
}

async function saveProfile() {
  const nameEl = document.getElementById('profileName');
  const compEl = document.getElementById('profileCompany');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) { toast('Name cannot be empty', 'error'); return; }
  const company = compEl ? compEl.value.trim() : '';
  const userEl  = document.getElementById('profileUsername');
  const username = userEl ? userEl.value.trim() : '';
  try {
    await API.put('/profile', { name: name, username: username, company: company });
    STATE.user.name = name;
    STATE.user.company = company;
    STATE.user.username = username;
    localStorage.setItem('crm_user', JSON.stringify(STATE.user));
    paintAvatar();
    toast('Profile updated', 'success');
  } catch(e) {
    toast('Failed to update profile: ' + e.message, 'error');
  }
}

// Ask to move the sign-in address (kanban t_bd31809e). This only REQUESTS the change: the app mails
// a confirmation link to the NEW address and `users.email` does not move until that link is opened.
// The console therefore says what will happen rather than what happened — the customer who typed a
// wrong address finds out from an inbox that never receives anything, and their sign-in is untouched.
async function requestEmailChange() {

// The picture is multipart, so it cannot go through API.call (which pins Content-Type: json).
async function uploadAvatar(input) {
  const f = input && input.files && input.files[0];
  if (!f) return;
  // The panel says "PNG, JPEG, GIF or WebP, up to 2 MB", and until now nothing enforced it: a
  // 3 MB photo was POSTed anyway and the customer was shown the raw sentence
  // "Upload failed: HTTP 413" (measured live 2026-10-25). Refuse it HERE, in the customer's own
  // words, before a byte leaves the page — the same guard the other five apps carry.
  const MAX_PICTURE = 2 * 1024 * 1024;
  const PICTURE_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
  if (f.size > MAX_PICTURE) {
    const mb = (f.size / 1048576).toFixed(1);
    toast('That picture is ' + mb + ' MB — the limit is 2 MB. Please choose a smaller one.', 'error');
    try { input.value = ''; } catch (_) { }
    return;
  }
  if (f.type && PICTURE_TYPES.indexOf(String(f.type).toLowerCase()) < 0) {
    toast('That file is ' + String(f.type) + ' — please choose a PNG, JPEG, GIF or WebP picture.', 'error');
    try { input.value = ''; } catch (_) { }
    return;
  }
  const fd = new FormData();
  fd.append('file', f, f.name);
  try {
    const res = await fetch('/api/profile/avatar', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + STATE.token },
      body: fd
    });
    if (!res.ok) {
      // A 413 here means the picture passed the browser guard and the SERVER refused the size
      // (a proxy limit lower than 2 MB). Say that in words rather than echoing the status code.
      if (res.status === 413) {
        try { input.value = ''; } catch (_) { }
        throw new Error('that picture is too large for the server to accept — please choose a smaller one');
      }
      let msg = 'HTTP ' + res.status;
      try { const e = await res.json(); if (e && typeof e.message === 'string') msg = e.message; } catch(_){}
      throw new Error(msg);
    }
    const d = await res.json();
    STATE.user.avatar_url = d.avatar_url || '';
    localStorage.setItem('crm_user', JSON.stringify(STATE.user));
    paintAvatar();
    toast('Picture updated', 'success');
  } catch(e) {
    toast('Upload failed: ' + e.message, 'error');
  }
}

// The REMOVAL twin of uploadAvatar (kanban t_d6991cd1). Until this existed the picture could only
// ever be REPLACED — the upload upserts the row — so a customer who wanted their initials back had
// no way to ask. DELETE /api/profile/avatar clears BOTH the stored bytes and `users.avatar_url`
// server-side, in one transaction, and answers `avatar_url: ""` so this can repaint from the
// response rather than re-reading the profile. The route writes the SESSION's own user: there is no
// id in the request, so nothing here can remove anyone else's picture.
async function removeAvatar() {
  if (!(STATE.user && STATE.user.avatar_url)) { toast('There is no picture to remove', 'error'); return; }
  if (!window.confirm('Remove your profile picture?')) return;
  try {
    const res = await fetch('/api/profile/avatar', {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + STATE.token }
    });
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const e = await res.json(); if (e && typeof e.message === 'string') msg = e.message; } catch(_){}
      throw new Error(msg);
    }
    STATE.user.avatar_url = '';
    localStorage.setItem('crm_user', JSON.stringify(STATE.user));
    paintAvatar();
    toast('Picture removed', 'success');
  } catch(e) {
    toast('Remove failed: ' + e.message, 'error');
  }
}

async function changePassword() {
  const current = document.getElementById('currentPw').value;
  const newPw = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;
  if (newPw !== confirm) { toast('Passwords do not match', 'error'); return; }
  if (newPw.length < 8) { toast('New password must be at least 8 characters', 'error'); return; }
  try {
    // Deliberately NOT through API.call: a wrong current password is the contract's 401
    // "Current password is incorrect", and API.call's generic 401 handler would sign the user OUT
    // (and lose their typed input) instead of showing the sentence. Only an expired session's 401
    // means "log out", and that is not what this route reports.
    const res = await fetch('/api/profile/password', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + STATE.token
      },
      body: JSON.stringify({ current_password: current, new_password: newPw })
    });
    let d = {};
    try { d = await res.json(); } catch(_) {}
    if (!res.ok) {
      throw new Error(d && typeof d.message === 'string' ? d.message : ('HTTP ' + res.status));
    }
    toast('Password updated', 'success');
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';
    document.getElementById('confirmPw').value = '';
  } catch(e) {
    // The API's own sentence (e.g. "Current password is incorrect") is what the user acts on.
    toast(e.message, 'error');
  }
}

// ── DOWNLOAD MY DATA (kanban t_e2ec5452) ───────────────────────────────────────────────────────
// The route answers a DOCUMENT (a JSON file the browser must
// SAVE), not a value this page renders, so it is fetched directly instead of through API.call,
// which always parses the body as JSON. The filename comes from the server's Content-Disposition
// when it sends one, and every refusal is printed in the card rather than swallowed.
function downloadMyData() {
  const btn = document.getElementById('dlDataBtn');
  const msg = document.getElementById('dlDataMsg');
  const say = (text, ok) => {
    if (!msg) return;
    msg.textContent = text;
    msg.style.color = ok ? '#047857' : '#b91c1c';
    msg.style.display = 'block';
  };
  const refusal = (body, status) => {
    try {
      const d = JSON.parse(body);
      if (d && typeof d.error === 'string' && d.error) return d.error;
      if (d && typeof d.message === 'string' && d.message) return d.message;
    } catch (e) { /* not JSON — fall through to the status */ }
    return 'Could not build your copy (error ' + status + ').';
  };
  if (msg) msg.style.display = 'none';
  if (btn) { btn.disabled = true; btn.textContent = 'Building your file…'; }
  fetch('/api/v1/account/export', {
    headers: STATE.token ? { 'Authorization': 'Bearer ' + STATE.token } : {},
    cache: 'no-store'
  })
    .then(r => {
      if (!r.ok) return r.text().then(t => { throw new Error(refusal(t, r.status)); });
      let name = 'coreswift-account-' + new Date().toISOString().slice(0, 10) + '.json';
      const m = /filename="?([^";]+)"?/i.exec(r.headers.get('content-disposition') || '');
      if (m && m[1]) name = m[1];
      return r.blob().then(bl => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(bl);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) { /* revoked */ } a.remove(); }, 1500);
        say('Your copy has been downloaded.', true);
      });
    })
    .catch(e => say((e && e.message) || 'Could not build your copy', false))
    .then(() => { if (btn) { btn.disabled = false; btn.textContent = 'Download my data'; } });
}

// ── DANGER ZONE: cancel plan (close) and delete account and data (erase) ─────────────────────────
// Fleet standard §3-§7 (docs/account-closure-erasure-standard-2026-11-24.md). TWO operations, never
// one button: `close` ends access and keeps the data (reversible for 30 days), `erase` destroys the
// workspace (irreversible, only the billing documents tax law requires are kept). One dialog shape
// serves both; the SERVER owns every rule — the typed word, the password, the platform-admin
// refusal, the portfolio refusal — so each refusal sentence is printed here exactly as received.
// Posted directly, not through API.call, for the same reason changePassword is: API.call's 401 arm
// calls logout(), so a wrong password would look like an expired session instead of the sentence the
// customer needs to read.
const DANGER_ACTIONS = {
  close: {
    title: 'Cancel plan?',
    word: 'CLOSE',
    endpoint: '/api/auth/close-account',
    intro: 'This ends your sign-in, every API key on the account and billing. <strong>Your data is kept for 30 days</strong> &mdash; contact support inside that window and they can restore the account.',
    deleted: ['Nothing. Closing keeps every contact, deal, booking and message.'],
    kept: 'nothing is deleted &mdash; support can restore the account within 30 days.',
    confirmLabel: 'Cancel plan',
    busyLabel: 'Cancelling',
    done: 'Your account is closed. You can restore it within 30 days by contacting support.'
  },
  erase: {
    title: 'Delete account and data?',
    word: 'DELETE',
    endpoint: '/api/auth/erase-data',
    intro: 'This permanently deletes this workspace and everything in it. <strong>It cannot be undone</strong> and there is no restore.',
    deleted: [
      'contacts, companies, deals, pipelines, tags and lists',
      'tickets, help-desk articles and conversations',
      'calendars, bookings and booking forms',
      'automations, webhooks and connected apps',
      'email campaigns, templates, mailboxes and messages',
      'every person who signs in to this workspace, their sessions and every API key'
    ],
    kept: 'only the billing documents we must keep for tax (the plan you were on, its price history and payment records). They are detached from your workspace name; nothing else survives.',
    confirmLabel: 'Delete permanently',
    busyLabel: 'Deleting',
    done: 'Your account and its data have been deleted. Billing documents kept for tax were retained. You cannot sign in with this address again.'
  }
};

var DANGER_KIND = 'close';

function dangerDialog(kind) {
  const a = DANGER_ACTIONS[kind];
  if (!a) return;
  DANGER_KIND = kind;
  showModal(a.title,
    '<p style="margin:0 0 10px">' + a.intro + '</p>' +
    '<p style="margin:0 0 4px"><strong>What is deleted</strong></p>' +
    '<ul style="margin:0 0 12px 18px;color:var(--text-secondary)">' +
      a.deleted.map(function (x) { return '<li>' + x + '</li>'; }).join('') +
    '</ul>' +
    '<p style="margin:0 0 14px"><strong>What is kept:</strong> ' + a.kept + '</p>' +
    '<div class="form-group"><label for="dangerPw">Your password (proves it is you)</label>' +
      '<input type="password" id="dangerPw" autocomplete="current-password" data-ops="danger-password" oninput="dangerArmCheck()"></div>' +
    '<div class="form-group"><label for="dangerWord">Type ' + a.word + ' to confirm</label>' +
      '<input type="text" id="dangerWord" autocomplete="off" placeholder="' + a.word + '" data-ops="danger-word" oninput="dangerArmCheck()"></div>' +
    '<p id="dangerMsg" role="status" style="margin:0;font-size:13px"></p>',
    '<button type="button" class="btn btn-ghost" data-ops="danger-cancel" onclick="closeModal()">Cancel</button>' +
    '<button type="button" class="btn btn-primary" id="dangerConfirm" data-ops="danger-confirm" disabled onclick="dangerSubmit()" ' +
      'style="background:#dc2626;border-color:#dc2626;opacity:.6">' + a.confirmLabel + '</button>');
  const pw = document.getElementById('dangerPw');
  if (pw) pw.focus();
}

// The red confirm stays DISABLED until a password AND the exact word are present — a stray click on
// a destructive control must do nothing. The server re-checks both, so this is only the mirror.
function dangerArmCheck() {
  const a = DANGER_ACTIONS[DANGER_KIND];
  const pw = document.getElementById('dangerPw');
  const w = document.getElementById('dangerWord');
  const b = document.getElementById('dangerConfirm');
  if (!a || !pw || !w || !b) return;
  const ok = pw.value.length > 0 && w.value.trim() === a.word;
  b.disabled = !ok;
  b.style.opacity = ok ? '1' : '.6';
}

async function dangerSubmit() {
  const a = DANGER_ACTIONS[DANGER_KIND];
  const pwEl = document.getElementById('dangerPw');
  const wordEl = document.getElementById('dangerWord');
  const btn = document.getElementById('dangerConfirm');
  const msgEl = document.getElementById('dangerMsg');
  function say(text, colour) {
    if (!msgEl) return;
    msgEl.textContent = text || '';
    msgEl.style.color = colour || 'var(--text-secondary)';
  }
  if (!a) return;
  const pw = pwEl ? pwEl.value : '';
  const word = wordEl ? wordEl.value.trim() : '';
  if (!pw) { say('Enter your password', '#dc2626'); return; }
  if (word !== a.word) { say('Type ' + a.word + ' in the box to confirm', '#dc2626'); return; }
  if (btn) { btn.disabled = true; btn.textContent = a.busyLabel + '…'; }
  say(a.busyLabel + '…');
  try {
    const res = await fetch(a.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + STATE.token },
      body: JSON.stringify({ password: pw, confirm: word })
    });
    let d = {};
    try { d = await res.json(); } catch (_) {}
    if (!res.ok) {
      // Boolean `error` flag first renders as "true"; read strings only (same rule as doLogin).
      const pick = d && [d.message, d.error].find(function (v) { return typeof v === 'string' && v.trim(); });
      throw new Error(pick || ('HTTP ' + res.status));
    }
    let done = a.done;
    if (DANGER_KIND === 'erase') done = 'Your account and its data were deleted on ' + new Date().toLocaleString() + '. Billing documents kept for tax were retained. You cannot sign in with this address again.';
    closeModal();
    // The session is over either way (erase destroys the user row; close moves its session line), so
    // drop the local token WITHOUT waiting for a round trip, then state what happened on the plain
    // sign-in screen — the customer must never be left guessing.
    logout(true);
    const errEl = document.getElementById('loginError');
    if (errEl) { errEl.textContent = done; errEl.style.display = 'block'; }
    toast(DANGER_KIND === 'erase' ? 'Account and data deleted' : 'Plan cancelled', 'success');
  } catch (e) {
    say((e && e.message) || 'Could not complete this action', '#dc2626');
    if (btn) { btn.textContent = a.confirmLabel; }
    dangerArmCheck();
  }
}

async function saveNewCompany() {

async function saveCompanyEdit() {
  const cur = CO_EDIT;
  if (!cur || !cur.id) { toast('No company selected', 'error'); return; }
  const name = coModalValue('coEditName');
  if (!name) { toast('Company name is required', 'error'); return; }
  // Only CHANGED fields are sent: PATCH binds every column as COALESCE($n, column)
  // (src/companies/handlers.rs::update), so NULL means "leave it alone" and an empty string is the
  // one value that CLEARS a text column. That is survivable here because `companies.domain` is
  // indexed but NOT unique — the contact editor's blank-email 500 (idx_contacts_tenant_email) has
  // no counterpart on this table (measured: \d companies).
  const body = {};
  CO_FORM_FIELDS.forEach(f => {
    const v = coModalValue('coEdit' + f.id);
    const raw = cur.orig[f.key];
    const was = (raw === null || raw === undefined) ? '' : String(raw);
    if (v !== was) body[f.key] = v;
  });
  if (!Object.keys(body).length) { closeModal(); toast('No changes to save', 'info'); return; }
  try {
    await API.patch('/companies/' + encodeURIComponent(cur.id), body);
    closeModal();
    toast('Company updated', 'success');
    if (typeof TAB_LOADERS !== 'undefined' && TAB_LOADERS['companies']) TAB_LOADERS['companies']();

    toast('Update failed: ' + e.message, 'error');

}
// ── Automation rule builder (kanban t_990c386e) ──────────────────────────────────────────────────
// The engine's own vocabulary: trigger_type is validated by src/automation/handlers.rs::create_rule,
// the wait is read from trigger_config.delay_minutes, the no-reply condition from
// trigger_config.condition (src/automation/engine.rs), and the action's config from
// action_config.template_id / tag_id / list_id (src/automation/actions.rs).
//
// DRAFTS FIRST. "Save as draft" always sends is_active:false, and the engine's every filter is
// `is_active IS NOT FALSE`, so a draft can never fire, enrol anyone or send mail. Nothing on this
// screen arms a rule behind the operator's back: only their own "Save & activate" does.
const RULE_TRIGGERS = [
  ['TagAdded', 'Tag added'],
  ['TagRemoved', 'Tag removed'],
  ['ListAdded', 'Added to a list'],
  ['ListRemoved', 'Removed from a list'],
  ['StageChanged', 'Deal stage changed'],
  ['ScoreChanged', 'Lead score changed'],
  ['contact.created', 'Contact created (new lead)'],
  ['date.renewal', 'A date is coming up (renewal)'],
  ['contact.inactive', 'No activity for N days']
];
const RULE_ACTIONS = [
  ['send_email', 'Send an email template'],
  ['send_sms', 'Send an SMS template'],
  ['AddTag', 'Add a tag'],
  ['RemoveTag', 'Remove a tag'],
  ['AddToList', 'Add to a list'],
  ['RemoveFromList', 'Remove from a list'],
  ['NotifyUser', 'Notify a user'],
  ['Webhook', 'Call a webhook']
];
let RULE_PICKERS = { tags: [], lists: [], templates: [] };

function rulePickerOpts(kind, selected) {
  const rows = RULE_PICKERS[kind] || [];
  if (!rows.length) return '<option value="">(none yet — create one first)</option>';
  return rows.map(o => '<option value="' + escapeHtmlAttr(o.id) + '"' + (selected === o.id ? ' selected' : '') + '>' + escapeHtml(o.name || o.subject || o.id) + '</option>').join('');
}

async function loadRulePickers(force) {
  if (RULE_PICKERS.loaded && !force) return RULE_PICKERS;
  const grab = async (path, key) => { try { return famList(await API.get(path), key); } catch (e) { return []; } };
  const [tags, lists, templates] = await Promise.all([
    grab('/tags', 'tags'), grab('/lists', 'lists'), grab('/comms/templates', 'templates')
  ]);
  RULE_PICKERS = { tags: tags || [], lists: lists || [], templates: templates || [], loaded: true };
  return RULE_PICKERS;
}

// Show only the config rows that matter for the chosen trigger/action.
function ruleConfigChanged() {
  const t = (document.getElementById('newRuleTrigger') || {}).value || '';
  const a = (document.getElementById('newRuleAction') || {}).value || '';
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.style.display = on ? '' : 'none'; };
  show('ruleCfgTags', t === 'TagAdded' || t === 'TagRemoved');
  show('ruleCfgList', t === 'ListAdded' || t === 'ListRemoved');
  show('ruleCfgScore', t === 'ScoreChanged');
  show('ruleCfgRenewal', t === 'date.renewal');
  show('ruleCfgInactive', t === 'contact.inactive');
  show('ruleCfgTemplate', a === 'send_email' || a === 'send_sms');
  show('ruleCfgActionTag', a === 'AddTag' || a === 'RemoveTag');
  show('ruleCfgActionList', a === 'AddToList' || a === 'RemoveFromList');
  show('ruleCfgNotify', a === 'NotifyUser');
  show('ruleCfgWebhook', a === 'Webhook');
  const tpl = document.getElementById('ruleTplSubject');
  if (tpl) {
    const sel = document.getElementById('ruleTemplate');
    const row = (RULE_PICKERS.templates || []).find(x => sel && x.id === sel.value);
    tpl.textContent = row ? ('Subject: ' + (row.subject || '(no subject — the template body is used as-is)')) : '';
  }
}

// Wired to the real backend (POST /api/automation/rules -> src/automation/handlers.rs::create_rule).
// This control used to close the modal and toast "Rule created" with NO request, so the operator was
// told an automation existed while automation_rules held nothing. Body:
// {name, trigger_type, trigger_config, action_type, action_config, is_active}; POST answers 201 with
// the created rule. The panel refreshes from TAB_LOADERS['rules'].
async function createAutomationRule(saveAsDraft){
  const name=((document.getElementById('newRuleName')||{}).value||'').trim();
  const trigger_type=((document.getElementById('newRuleTrigger')||{}).value||'').trim();
  const action_type=((document.getElementById('newRuleAction')||{}).value||'').trim();
  if(!name){ toast('Rule name is required','error'); return; }
  if(!trigger_type||!action_type){ toast('A trigger and an action are required','error'); return; }

  const trigger_config = {};
  if (trigger_type === 'TagAdded' || trigger_type === 'TagRemoved') {
    const sel = document.getElementById('ruleTagIds');
    const ids = sel ? Array.from(sel.selectedOptions).map(o => o.value).filter(Boolean) : [];
    if (!ids.length) { toast('Pick at least one tag for this trigger','error'); return; }
    if (ids.length === 1) trigger_config.tag_id = ids[0]; else trigger_config.tag_ids = ids;
  } else if (trigger_type === 'ListAdded' || trigger_type === 'ListRemoved') {
    const lid = ((document.getElementById('ruleListId')||{}).value||'').trim();
    if (!lid) { toast('Pick a list for this trigger','error'); return; }
    trigger_config.list_id = lid;
  } else if (trigger_type === 'ScoreChanged') {
    const min = ((document.getElementById('ruleMinScore')||{}).value||'').trim();
    if (min) trigger_config.min_score = parseInt(min, 10);
  } else if (trigger_type === 'date.renewal') {
    trigger_config.field = ((document.getElementById('ruleRenewalField')||{}).value||'renewal_date').trim() || 'renewal_date';
    trigger_config.days_before = parseInt(((document.getElementById('ruleRenewalDays')||{}).value||'30'), 10) || 0;
  } else if (trigger_type === 'contact.inactive') {
    trigger_config.days = parseInt(((document.getElementById('ruleInactiveDays')||{}).value||'30'), 10) || 30;
  }

  const dval = parseInt(((document.getElementById('ruleDelayValue')||{}).value||'0'), 10) || 0;
  const dunit = ((document.getElementById('ruleDelayUnit')||{}).value||'minutes');
  const mult = dunit === 'days' ? 1440 : (dunit === 'hours' ? 60 : 1);
  const delay_minutes = dval * mult;
  if (delay_minutes > 0) trigger_config.delay_minutes = delay_minutes;
  if ((document.getElementById('ruleNoReply')||{}).checked) trigger_config.condition = { type: 'no_reply' };

  const action_config = {};
  if (action_type === 'send_email' || action_type === 'send_sms') {
    const tpl = ((document.getElementById('ruleTemplate')||{}).value||'').trim();
    if (!tpl) { toast('Pick a template — an email step needs one','error'); return; }
    action_config.template_id = tpl;
  } else if (action_type === 'AddTag' || action_type === 'RemoveTag') {
    const tid = ((document.getElementById('ruleActionTag')||{}).value||'').trim();
    if (!tid) { toast('Pick the tag to apply','error'); return; }
    action_config.tag_id = tid;
  } else if (action_type === 'AddToList' || action_type === 'RemoveFromList') {
    const lid = ((document.getElementById('ruleActionList')||{}).value||'').trim();
    if (!lid) { toast('Pick the list','error'); return; }
    action_config.list_id = lid;
  } else if (action_type === 'NotifyUser') {
    const msg = ((document.getElementById('ruleNotifyMsg')||{}).value||'').trim();
    if (!msg) { toast('Notification text is required','error'); return; }
    action_config.message = msg;
  } else if (action_type === 'Webhook') {
    const url = ((document.getElementById('ruleWebhookUrl')||{}).value||'').trim();
    if (!url) { toast('Webhook URL is required','error'); return; }
    action_config.url = url;
  }

  const btn=document.getElementById(saveAsDraft?'newRuleDraft':'newRuleActivate');
  if(btn){ btn.disabled=true; btn.textContent = saveAsDraft ? 'Saving draft...' : 'Saving...'; }
  try {
    await API.post('/automation/rules', {
      name: name, trigger_type: trigger_type, trigger_config: trigger_config,
      action_type: action_type, action_config: action_config, is_active: !saveAsDraft
    });
    closeModal();
    toast(saveAsDraft ? 'Rule saved as draft — it will not run until you activate it' : 'Rule created and active','success');
    if (typeof TAB_LOADERS !== 'undefined' && TAB_LOADERS['rules']) TAB_LOADERS['rules']();
  } catch(e){
    toast('Could not create rule: '+((e&&e.message)||e),'error');
    if(btn){ btn.disabled=false; btn.textContent = saveAsDraft ? 'Save as draft' : 'Save & activate'; }
  }
}

// Pause / resume from the rules list (PATCH /api/automation/rules/:id {is_active}).
// Pausing cancels a step that is still WAITING in the queue (the server answers
// cancelled_pending), so the sentence names the number instead of promising a blanket "it will
// not fire" the queue disagreed with.
async function toggleAutomationRule(id, currentlyActive){
  try {
    const res = await API.patch('/automation/rules/' + id, { is_active: !currentlyActive });
    const cancelled = (res && typeof res.cancelled_pending === 'number') ? res.cancelled_pending : 0;
    toast(currentlyActive
      ? ('Rule paused — it will not fire again' + (cancelled
          ? ', and ' + cancelled + ' waiting step' + (cancelled === 1 ? ' was' : 's were') + ' cancelled'
          : '') + '. Anything already sent is untouched.')
      : 'Rule resumed — it fires on new triggers only; a step cancelled while paused stays cancelled',
      'success');
    if (typeof TAB_LOADERS !== 'undefined' && TAB_LOADERS['rules']) TAB_LOADERS['rules']();
  } catch (e) { toast('Could not change the rule: ' + ((e && e.message) || e), 'error'); }
}
// A 402 from API.call is the PLAN GATE, not a failed load. The client collapses every 402 onto the
// sentinel message 'Payment required' (it fires the upgrade banner first) and carries the SERVER's
// own sentence on err.planMessage — so a panel that prints e.message raw shows the customer the
// internal words instead of naming the limit. This returns the sentence to show. The sentinel itself
// is deliberately left intact: the AI panel (loadAiTab) and the Tracked Links panel still test it.
function planGateText(e){
  if (e && e.planGate) return e.planMessage || 'This feature is not included in your current plan.';
  return String((e && e.message) || e);
}
function ruleNameOf(kind, id) {
  const row = (RULE_PICKERS[kind] || []).find(x => x.id === id);
  return row ? (row.name || row.subject || id) : id;
}
function ruleHumanDelay(mins) {
  if (!mins) return 'no wait';
  if (mins % 1440 === 0) return (mins / 1440) + ' day' + (mins / 1440 === 1 ? '' : 's');
  if (mins % 60 === 0) return (mins / 60) + ' hour' + (mins / 60 === 1 ? '' : 's');
  return mins + ' min';
}
// Live list for the Automation Rules panel. GET /api/automation/rules answers
// {"rules":[{name,trigger_type,action_type,is_active,...}]} (src/automation/handlers.rs::list_rules).
async function loadRulesTab(){
  // Picker names make the config readable ("tag VIP" not "tag 4f2c...").
  try { await loadRulePickers(); } catch (e) {}
  // A rule that sends email needs the automation lane; say so before they build one that cannot run.
  try {
    const mrReady = await loadMailReadiness();
    const mrBanner = mailLaneBanner(mrReady, 'automation', 'Email actions in these rules cannot send yet.');
    const mrPanel = document.getElementById('tabPanels');
    if (mrBanner && mrPanel) mrPanel.insertAdjacentHTML('afterbegin', mrBanner);
  } catch (e) {}
  const el=document.getElementById('rulesList');
  if(!el) return;
  try {
    const rules=famList(await API.get('/automation/rules'), 'rules');
    let rows=[];
    if(Array.isArray(rules)) rows=rules.map(r=>{
      const active = r.is_active !== false;
      const tc = r.trigger_config || {};
      const bits = [];
      if (tc.tag_id) bits.push('tag: ' + ruleNameOf('tags', tc.tag_id));
      if (Array.isArray(tc.tag_ids) && tc.tag_ids.length) bits.push('tags: ' + tc.tag_ids.map(id=>ruleNameOf('tags', id)).join(', '));
      if (tc.list_id) bits.push('list: ' + ruleNameOf('lists', tc.list_id));
      if (tc.days_before !== undefined) bits.push('field ' + (tc.field || 'renewal_date') + ', ' + tc.days_before + ' days before');
      if (tc.days !== undefined) bits.push(tc.days + ' days quiet');
      if (tc.min_score !== undefined) bits.push('score \u2265 ' + tc.min_score);
      if (tc.delay_minutes) bits.push('wait ' + ruleHumanDelay(tc.delay_minutes));
      if (tc.condition && tc.condition.type === 'no_reply') bits.push('only if no reply');
      const ac = r.action_config || {};
      if (ac.template_id) bits.push('template: ' + ruleNameOf('templates', ac.template_id));
      return '<div class="config-item"><div class="config-info"><div class="config-label">'+escapeHtml(r.name||'\u2014')+

// ── Received mail (2026-11-19) ───────────────────────────────────────────────────────────────────
// MEASURED WHY: the console's mail tab renders domains, mailboxes, auto-replies, keys and the send
// card, and never a single received message — while this account held 78 in
// `private_email_messages` (GET /api/private-email/messages = 200; the counts read reports inbox: 78).
// The page's only other message list reads `/api/messages`, the UNIFIED OUTBOUND table (total 0), so a
// customer's letter had no screen at all. POST /private-email/messages/:id/summarize had no control
// either, though its own doc comment calls it "this button".
//
// Placement: an entry point in the header that opens a list in a modal, then the message in the same
// modal. It is deliberately self-contained — the mail tab repaints from its own awaited reads and
// replaces its container, so anything appended inside it is wiped a moment later (measured).
//
// Rules kept: bodies are rendered as TEXT (escapeHtml + pre-wrap), never as HTML — a customer's mail is
// untrusted input and this page holds a session; and the Summarise control exists only when the counts
// read says `ai_summary` is true, so nobody is offered a button whose route would answer 503.
var peInboxAiSummary = false;

function peEsc(s) { return escapeHtml(String(s == null ? '' : s)); }

// An id inside an HTML attribute that is itself delimited by double quotes: entity-escape the quotes
// and keep only UUID-safe characters, so the attribute cannot be closed early (measured: JSON.stringify
// here produced onclick="peOpenMessage("uuid")", which threw on click).
function peAttrId(id) {
  const safe = String(id == null ? '' : id).replace(/[^A-Za-z0-9-]/g, '');
  return '&quot;' + safe + '&quot;';
}

function peMessageText(m) {
  const plain = String((m && m.body_plain) || '').trim();
  if (plain) return plain;
  return String((m && m.body_html) || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}

async function peShowInbox() {
  let list = [];
  try {
    const r = await API.get('/private-email/messages?limit=50');
    list = (r && Array.isArray(r.messages)) ? r.messages : [];
  } catch (e) {
    showModal('Received mail',
      '<div class="danger-text">Could not read the inbox: ' + peEsc((e && e.message) ? e.message : e) + '</div>',
      '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
    return;
  }
  try {
    const c = await API.get('/private-email/messages/counts');
    peInboxAiSummary = !!(c && c.ai_summary);
  } catch (e) {
    peInboxAiSummary = false;
  }
  if (!list.length) {
    showModal('Received mail',
      '<p style="color:var(--text-secondary)">No received messages yet.</p>',
      '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
    return;
  }
  const rows = list.map(function (m) {
    const sub = peEsc(m.subject || '(no subject)');
    const from = peEsc(m.from_name || m.from_address || '');
    const when = peEsc(String(m.received_at || '').replace('T', ' ').slice(0, 16));
    return '<div class="config-item" style="cursor:pointer" onclick="peOpenMessage(' + peAttrId(m.id) + ')">' +
      '<div class="config-info"><div class="config-label">' + sub + '</div>' +
      '<div class="config-desc">' + from + (when ? ' \u00b7 ' + when : '') +
      (m.is_read === false ? ' \u00b7 unread' : '') + '</div></div>' +
      '<span class="btn btn-ghost btn-xs">Open</span></div>';
  });
  showModal('Received mail (' + list.length + ')',
    '<p style="font-size:12px;color:var(--text-secondary)">The last ' + list.length +
    ' message(s) this account received. Open one to read it.</p><div class="config-list">' + rows.join('') + '</div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Close</button>', true);
}

async function peOpenMessage(id) {
  if (!id) return;
  let m = null;
  try {
    const r = await API.get('/private-email/messages/' + encodeURIComponent(id));
    m = (r && r.message) ? r.message : r;
  } catch (e) {
    toast('Could not open that message: ' + ((e && e.message) ? e.message : e), 'error');
    return;
  }
  if (!m || !m.id) { toast('That message could not be read', 'error'); return; }
  const fromName = String(m.from_name || '');
  const fromAddr = String(m.from_address || '');
  const from = fromName && fromAddr ? fromName + ' <' + fromAddr + '>' : (fromAddr || fromName);
  const when = String(m.received_at || '').replace('T', ' ').slice(0, 16);
  const meta = [from, when, m.to_address ? ('to ' + String(m.to_address)) : '']
    .filter(function (x) { return !!x; }).join(' \u00b7 ');
  const body = peMessageText(m) || '(this message has no readable text)';
  const html =
    '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">' + peEsc(meta) + '</div>' +
    '<div style="white-space:pre-wrap;max-height:50vh;overflow:auto">' + peEsc(body) + '</div>' +
    '<div id="peSummary" style="margin-top:12px"></div>';
  const footer =
    '<button class="btn btn-ghost" onclick="peShowInbox()">Back</button>' +
    '<button class="btn btn-ghost" onclick="closeModal()">Close</button>' +
    (peInboxAiSummary ? '<button class="btn btn-primary" id="peSummariseBtn">Summarise this message</button>' : '');
  showModal(peEsc(m.subject || '(no subject)'), html, footer, true);
  const b = document.getElementById('peSummariseBtn');
  if (b) b.addEventListener('click', function () { peSummariseMessage(String(m.id), b); });
}

// The server's own sentence is shown verbatim: "AI summaries need an AI provider key …" and
// "This message has no text to summarise." are both written for the operator.
async function peSummariseMessage(id, btn) {
  const out = document.getElementById('peSummary');
  if (btn) btn.disabled = true;
  if (out) out.innerHTML = '<div style="font-size:12px;color:var(--text-secondary)">Summarising\u2026</div>';
  try {
    const r = await API.post('/private-email/messages/' + encodeURIComponent(id) + '/summarize', {});
    const s = (r && r.summary) ? String(r.summary) : '';
    if (out) {
      out.innerHTML = s
        ? '<div class="card"><div class="card-body"><div style="font-size:11px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px">Summary</div><div style="white-space:pre-wrap">' + peEsc(s) + '</div></div></div>'
        : '<div style="color:#b45309">The summariser answered with nothing, so there is no summary to show.</div>';
    }
  } catch (e) {
    if (out) out.innerHTML = '<div class="danger-text">' + peEsc((e && e.message) ? e.message : e) + '</div>';
  } finally {
    if (btn) btn.disabled = false;
  }
}

// One entry point, installed once the console has painted a header (bounded retries).
function peInstallInboxButton(n) {
  n = n || 0;
  if (document.getElementById('peInboxBtn')) return;
  const host = document.querySelector('.topbar') || document.querySelector('header') ||
               document.querySelector('.header') || document.querySelector('.topbar-actions');
  if (!host) { if (n < 40) setTimeout(function () { peInstallInboxButton(n + 1); }, 250); return; }
  const b = document.createElement('button');
  b.id = 'peInboxBtn';
  b.className = 'btn btn-ghost btn-sm';
  b.type = 'button';
  b.title = 'Read the mail this account has received';
  b.textContent = '\uD83D\uDCEC Received mail';
  b.addEventListener('click', function () { peShowInbox(); });
  host.appendChild(b);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { peInstallInboxButton(0); });
} else {
  peInstallInboxButton(0);
}

// What was promised, and how much of it is left. Colour is the whole point: amber means the deadline is
// close enough to act on, red means it has already passed. Shows the NEAREST promise still owed — the
// first reply until the ticket is answered, the resolution after that — so the second clock is not
// invisible once the first one is met. The admin console's ticket list speaks the same words
// (`slaPlaque`), so an operator and a customer reading the same ticket read the same sentence.
function ticketDueCell(t) {
  if (t.solved_at && !t.resolution_due) return '<span style="color:var(--text-muted)">solved</span>';
  const now = Date.now();
  const parse = s => { const v = s ? Date.parse(s) : NaN; return isNaN(v) ? null : v; };
  const span = ms => {
    const m = Math.round(ms / 60000);
    if (m < 1) return 'under a minute';
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
    return Math.floor(h / 24) + 'd' + (h % 24 ? ' ' + (h % 24) + 'h' : '');
  };
  const owed = (dueStr, metStr, label) => {
    const due = parse(dueStr);
    if (due === null || parse(metStr) !== null) return null;
    return { due, late: due < now, text: label + (due < now ? ' breached ' + span(now - due) + ' ago' : ' in ' + span(due - now)) };
  };
  const live = [
    owed(t.first_response_due, t.first_responded_at, 'reply'),
    owed(t.resolution_due, t.solved_at, 'resolve')
  ].filter(x => x !== null);
  if (!live.length) return '<span style="color:var(--text-muted)">' + (t.solved_at ? 'solved' : '—') + '</span>';
  live.sort((a, b) => a.due - b.due);
  const w = live[0];
  let colour = 'var(--text-muted)';
  if (w.late) colour = '#dc2626';
  else if (w.due - now <= 3600000) colour = '#d97706';
  // BOTH promises stay visible (2026-11-18): the column used to show only the nearest clock, so an
  // operator who met the first reply could not see how much of the resolution window was left, and
  // could not see the resolution deadline at all while the reply clock was still live.
  const rest = live.slice(1).map(x => x.text).join(' · ');
  return '<span style="color:' + colour + ';font-weight:600">' + w.text + '</span>'
    + (rest ? '<span style="color:var(--text-muted);font-weight:400"> · ' + rest + '</span>' : '');
}

async function tkAssign(ticketId) {

async function tkAssignSave(ticketId) {

  const body = (clear && clear.checked)

    switchTab('tickets');   // repaint from the server rather than guessing locally

// ── What this customer has sent before (David, 2026-11-14) ──────────────────────────────────────
// The single most useful thing an agent can know: is this a new person or the fifth time this month. The
// history is read from the account's own queue, narrowed to this address, so it can never be another
// customer's — the server applies the account scope, this only asks the question.
async function loadTicketHistory(currentId, email, contactId) {
  const el = document.getElementById('tkHistory');
  if (!el) return;
  if (!email && !contactId) return;
  const q = email
    ? 'contact_email=' + encodeURIComponent(email)
    : 'contact_id=' + encodeURIComponent(contactId);
  try {
    const d = await API.get('/tickets?view=all&limit=50&' + q);
    const all = ((d && d.tickets) || []).filter(x => String(x.id) !== String(currentId));
    if (!all.length) return;
    const open = all.filter(x => ['new', 'open', 'pending', 'on_hold'].includes(x.status)).length;
    const rows = all.slice(0, 5).map(x =>
      '<div style="display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border)">' +
        '<span style="font-size:12px;color:var(--text-muted);min-width:64px">' +
          (x.number ? '#' + escapeHtml(String(x.number)) : '—') + '</span>' +
        '<a href="#" style="flex:1;font-size:13px" onclick="event.preventDefault();closeModal();openTicket(\'' +
          escapeHtml(String(x.id)) + '\')">' + escapeHtml(x.subject || '') + '</a>' +
        '<span class="badge ' + (['solved', 'closed'].includes(x.status) ? 'badge-success' : 'badge-warning') + '">' +
          escapeHtml(x.status) + '</span>' +
      '</div>').join('');
    el.innerHTML = '<div class="card"><div class="card-body">' +
      '<div style="font-size:13px;margin-bottom:6px"><strong>' + all.length + '</strong> earlier ticket(s) from this customer' +
        (open ? ' — <span style="color:#b45309">' + open + ' still open</span>' : '') + '</div>' +
      rows + '</div></div>';
  } catch (e) {
    el.innerHTML = '';
  }
}

// ── Attachments (David, 2026-11-14) ──────────────────────────────────────────────────────────────
// The file is fetched with the session token and handed to the browser as a blob: a plain link would be an
// anonymous request, and the download route refuses those.
async function downloadAttachment(messageRowId, attachmentId, filename) {
  try {
    const res = await fetch('/api/private-email/messages/' + messageRowId + '/attachments/' + attachmentId, {
      headers: { 'Authorization': 'Bearer ' + STATE.token }
    });
    if (!res.ok) { toast('Could not fetch that file (' + res.status + ')', 'error'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename || 'attachment';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { toast(e.message, 'error'); }
}

// ── The report strip (David, 2026-11-14) ─────────────────────────────────────────────────────────
// Four questions: how fast did we answer, how fast did we finish, what is open, what is late. A median of
// nothing is shown as a dash, never as "0 min" — a desk nobody has asked anything would otherwise look
// perfect.
async function loadDeskReport() {
  const el = document.getElementById('tkReport');
  if (!el) return;
  try {
    const r = await API.get('/helpdesk/reports?days=30');
    const mins = v => (v == null ? '—' : (v < 90 ? Math.round(v) + ' min' : (v / 60).toFixed(1) + ' h'));
    const chip = (label, value, tone) =>
      '<div style="flex:1 1 130px;min-width:120px;border:1px solid var(--border);border-radius:10px;padding:10px 12px">' +
        '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)">' + label + '</div>' +
        '<div style="font-size:18px;font-weight:600;' + (tone ? 'color:' + tone : '') + '">' + value + '</div></div>';
    el.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        chip('New (30 days)', r.created) +
        chip('Solved (30 days)', r.solved) +
        chip('Open now', r.open_now) +
        chip('Waiting on us', r.unanswered_now, r.unanswered_now ? '#b45309' : '') +
        chip('Late now', r.breached_now, r.breached_now ? '#dc2626' : '') +
        chip('First reply', mins(r.first_response_median_mins)) +
        chip('First reply (9 in 10)', mins(r.first_response_p90_mins)) +
        chip('Resolution', mins(r.resolution_median_mins)) +
      '</div>' +
      (r.breached_now
        ? '<p style="font-size:12px;color:#dc2626;margin-top:6px">' + r.breached_now +
          ' ticket(s) are past the deadline somebody promised. They are in “Due soon”.</p>'
        : '');
  } catch (e) {
    el.innerHTML = '';
  }
}

// ── Saved answers (David, 2026-11-14) ────────────────────────────────────────────────────────────
// The same question fifty times should cost one answer. The placeholders are filled by the SERVER at the
// moment of insertion (POST /helpdesk/canned/:id/render), so what an agent sees in the box is exactly what
// the customer receives; a browser-side substitution could quietly disagree with the server's.
const CR = { replies: [] };

async function loadCanned() {
  const el = document.getElementById('crTable');
  if (!el) return;
  try {
    const d = await API.get('/helpdesk/canned');
    CR.replies = (d && d.replies) || [];
    const rows = CR.replies.map(r => [
      escapeHtml(r.title || '—'),
      r.shortcut ? '<code>/' + escapeHtml(r.shortcut) + '</code>' : '—',
      escapeHtml((r.body_md || '').slice(0, 70)) + ((r.body_md || '').length > 70 ? '…' : ''),
      escapeHtml(String(r.use_count || 0)),
      '<button class="btn btn-ghost btn-xs" onclick="crEdit(\'' + escapeHtml(String(r.id)) + '\')">Edit</button>' +
      ' <button class="btn btn-ghost btn-xs" onclick="crDelete(\'' + escapeHtml(String(r.id)) + '\')">Delete</button>'
    ]);
    el.innerHTML = dataTable(['Title', 'Shortcut', 'Text', 'Used', ''], rows,
      'No saved answers yet. Write the ones you type most: refunds, how to export, how to reset a password.');
  } catch (e) {
    el.innerHTML = '<p style="color:var(--text-secondary)">' + escapeHtml(e.message) + '</p>';
  }
}

// ── Merge and split (David, 2026-11-14) ─────────────────────────────────────────────────────────
// Two tickets that are really one conversation, and one ticket that is really two. The customer's words
// exist once at every moment: both operations MOVE messages inside a transaction, they never copy them.
async function mergeTicket(id) {
  const entered = (prompt('Merge this ticket INTO which ticket number?\n\nThe other ticket keeps its number; this one closes and points at it.') || '').replace('#', '').trim();
  if (!entered) return;
  if (!/^[0-9]+$/.test(entered)) { toast('That is not a ticket number', 'error'); return; }
  try {
    // the number is resolved against the account's own queue — never a free-typed id
    const d = await API.get('/tickets?view=all&limit=100');
    const all = (d && d.tickets) || [];
    const target = all.find(t => String(t.number) === String(entered));
    if (!target) { toast('No ticket #' + entered + ' in this account', 'error'); return; }
    if (String(target.id) === String(id)) { toast('A ticket cannot be merged into itself', 'error'); return; }
    const res = await API.post('/tickets/' + id + '/merge', { into: target.id });
    toast('Merged into #' + res.survivor_number + ' — ' + res.messages_moved + ' message(s) moved', 'success');
    closeModal();
    openTicket(target.id);
  } catch (e) { toast(e.message, 'error'); }
}

async function splitTicket(id, messageId) {
  if (!confirm('Move this message into its own new ticket?')) return;
  try {
    const res = await API.post('/tickets/' + id + '/split', { message_id: messageId });
    toast('Split into #' + res.number, 'success');
    closeModal();
    openTicket(id);
  } catch (e) { toast(e.message, 'error'); }
}

async function replyTicket(id, isNote) {
  const el = document.getElementById('tkReplyBox');
  const message = el ? el.value.trim() : '';
  if (!message) { toast(isNote ? 'Write the note first' : 'Write a reply first', 'error'); return; }
  try {
    // CS-22: a reply written in the tenant console is the STAFF side of the thread. It used to be
    // stored as sender_type 'contact', which made the agent's own answer read as the customer's —
    // wrong in this console and wrong in the customer portal, where 'contact' renders as "you".
    // The server decides what is emailed, from `kind`: a note is never sent anywhere.
    await API.post('/tickets/' + id + '/messages',
      { message: message, sender_type: 'agent', kind: isNote ? 'note' : 'reply' });
    toast(isNote ? 'Note saved — only your team can see it' : 'Reply sent', 'success');
    openTicket(id);
  } catch (e) { toast((isNote ? 'Note failed: ' : 'Reply failed: ') + e.message, 'error'); }
}

// tenant Google-Calendar integration (loadCalendarTab -> gcOpenNewCalendar),
// never a /api/events list, so a click on it could not be reached. Deleted after a caller census
// (grep -o showAddEventModal -> 1 occurrence = the definition only).
// The admin console's own '+ New Event' is wired to POST /api/events (createEvent above).
// -- Tracked Links (kanban t_bd9470b6; copy-ready URL added by t_8feaf6e0) -------------------
// SOURCE OF TRUTH: GET /api/tracked-links answers {"links":[{id,tenant_id,tag_id,slug,target_url,
// created_at,click_count,tag_name,tag_color}]} (TrackedLinkWithClicks, src/tracked_links/handlers.rs).
// EVERY cell below is one of those keys - no column is invented - and the count in the card header is
// the length of the array the route returned. The list answer carries NO tracking_url key (only the
// CREATE response does, and that one is host-relative: "/track/<slug>"), so the tracking URL is
// COMPOSED here from the row's own slug and this page's origin - no API change, no new column.
// WHY location.origin is the right host: sites/coreswift.conf proxies `location ^~ /track/` to the app
// on BOTH vhosts that serve this shell (app.coreswiftcrm.com and admin.coreswiftcrm.com, kanban
// t_0d241bc7), so the host that served this page is exactly the host that resolves the link - which is
// also what makes rows created BEFORE this change retrievable. `+ Generate Link` POSTs the same route
// with {tag_id, target_url} (CreateTrackedLinkRequest); a row's Delete calls DELETE /api/tracked-links/:id.
function tlAbsUrl(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;                  // already absolute: leave it alone
  const origin = (window.location && window.location.origin) || '';
  return origin + (s.charAt(0) === '/' ? s : '/track/' + encodeURIComponent(s));
}

// Copy-to-clipboard. navigator.clipboard needs a secure context; the readonly input / rendered text
// next to every Copy control keeps the URL selectable when it is unavailable.
function tlCopyUrl(text, btn) {
  const s = String(text == null ? '' : text);
  const done = function () {
    if (btn) { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = t; }, 1500); }
    toast('Copied: ' + s, 'success');
  };
  const fallback = function () {
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(done, function () {
      if (fallback()) { done(); } else { toast('Could not copy - the URL is: ' + s, 'error'); }
    });
  } else if (fallback()) { done(); }
  else { toast('Could not copy - the URL is: ' + s, 'error'); }
}

// ── Webhooks: outbound endpoints, driven by the workspace's own token (kanban t_c6049ec8) ──────
// The API is REAL and this screen is its only console surface: GET/POST/PATCH/DELETE
// /api/integrations/webhooks (src/integrations/handlers.rs), Enterprise-only via the plan module
// `webhooks`. Two behaviours the rest of the shell's API.call cannot give this panel:
//   * a 402 on the SAVE arm matters as much as on the read: this screen re-renders the refusal
//     (marked `locked`) instead of only toasting it, and it reads the refusal's own sentence.
//   * the gate answers "Outbound webhooks is not available on your current plan. Upgrade to access it."
// So it does its own fetch through whCall and marks the refusal `locked`. Every write below still
// goes to the real route — nothing here fabricates a row.
let WH_ROWS = [];

async function whCall(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (STATE.token) headers['Authorization'] = 'Bearer ' + STATE.token;
  const opts = { method: method, headers: headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (res.status === 401) { logout(true); throw new Error('Session expired'); }
  const pick = data ? [data.error, data.message, data.detail].find(function (v) {
    return typeof v === 'string' && v.trim();
  }) : null;
  if (res.status === 402) {
    showUpgradeBanner();
    const err = new Error(pick || 'Payment required');
    err.locked = true;          // the plan gate, not a failure to load
    // The locked pane must not keep offering "+ Add Endpoint" (the same rule API.call applies).
    hideLockedPaneActions(pick || '');
    throw err;
  }
  if (!res.ok) throw new Error(pick || ('HTTP ' + res.status));
  return data;
}

      // status code in front of the customer — the server's sentence is already a plain one.
      el.innerHTML = card('Webhooks', '<div class="empty-state"><div class="empty-icon">🔒</div>' +

        '<p>' + escapeHtml(msg) + '</p>' +
        '<button class="btn btn-secondary" onclick="openUpgradeModal()">View Plans</button></div>');
      return;
    }
    el.innerHTML = card('Webhooks', '<p style="color:var(--text-secondary)">Could not load webhooks: ' +
      escapeHtml(msg) + '</p>');
  }
}

function whField(id) {
  const el = document.getElementById(id);
  return el ? String(el.value).trim() : '';

async function whSave(id) {
  const name = whField('whName');
  const url = whField('whUrl');
  const secret = whField('whSecret');
  const events = whField('whEvents') ? whField('whEvents').split(',').map(function (s) { return s.trim(); }).filter(Boolean) : [];
  const retry = whField('whRetry');
  const timeout = whField('whTimeout');
  const activeEl = document.getElementById('whActive');
  if (!name) { toast('Name is required', 'error'); return; }
  if (!url) { toast('URL is required', 'error'); return; }
  const body = { name: name, url: url, events: events };
  if (secret) body.secret = secret;
  if (retry !== '') body.retry_count = parseInt(retry, 10);
  if (timeout !== '') body.timeout_ms = parseInt(timeout, 10);
  if (id && activeEl) body.is_active = activeEl.checked;
  try {
    if (id) { await whCall('PATCH', '/integrations/webhooks/' + id, body); toast('Endpoint updated', 'success'); }
    else { await whCall('POST', '/integrations/webhooks', body); toast('Endpoint created', 'success'); }
    closeModal();
    loadWebhooksTab();
  } catch (e) {
    toast((id ? 'Update failed: ' : 'Create failed: ') + e.message, 'error');
    if (e && e.locked) { closeModal(); loadWebhooksTab(); }   // render the plan refusal, not just a toast
  }
}

async function whToggle(id, currentlyActive) {
  try {
    await whCall('PATCH', '/integrations/webhooks/' + id, { is_active: !currentlyActive });
    toast(currentlyActive ? 'Endpoint paused' : 'Endpoint activated', 'success');
    loadWebhooksTab();
  } catch (e) {
    if (e && e.locked) { loadWebhooksTab(); return; }

// kanban t_5f314e9a: a teammate is a REAL login into this account. The owner types an address, the
// server generates the password and emails it, and the person signs in to the shared inbox. The
// roster below is the same list the Inbox's "Assign to" picker reads, so the two screens cannot
// describe different teams.
async function loadTeamMembers() {
  var wrap = document.getElementById('teamPeopleWrap');
  if (!wrap) return;
  try {
    var d = await API.get('/auth/team/members');
    wrap.innerHTML = teamPeopleHtml(d);
  } catch (e) {
    wrap.innerHTML = card('People in this account',
      '<p style="color:var(--danger,#f66);margin:0">Could not load your team: ' + escapeHtml(e.message) + '</p>');
  }
}

function teamPeopleHtml(d) {
  var members = (d && d.members) || [];
  var seats = (d && d.seats) || {};
  var canManage = !!(d && d.can_manage);
  var limit = (seats.limit === null || seats.limit === undefined) ? null : Number(seats.limit);
  var used = Number(seats.used || 0);
  var seatLine = (limit === null)
    ? used + ' active ' + (used === 1 ? 'person' : 'people') + ' — your plan does not cap the number of seats.'
    : used + ' of ' + limit + ' ' + (limit === 1 ? 'seat' : 'seats') + ' used';
  if (!members.length) {
    return card('People in this account', '<div class="empty-state"><div class="empty-icon">👥</div>' +
      '<h3>Nobody here yet</h3><p>Add your first teammate with the form above.</p></div>');
  }
  var now = Date.now();
  var body = members.map(function (m) {
    var added = m.joined_at ? fmtTeamDate(m.joined_at) : '—';
    var via = m.invited_by ? ('invited by ' + m.invited_by) : 'owner of the account';
    var state = m.is_active === false
      ? '<span style="color:var(--text-muted)">Removed</span>'
      : '<span style="color:var(--success,#34d399)">Active</span>';
    var warn = m.password_undelivered
      ? '<div style="font-size:.75rem;color:var(--warning,#fbbf24)">The password email did not go out — ask them to use “Forgot password”.</div>'
      : '';
    var action = '';
    if (canManage && m.is_active !== false) {
      action = (m.is_owner || m.is_me)
        ? '<span style="color:var(--text-muted);font-size:.8rem">' + (m.is_owner ? 'Owner' : 'You') + '</span>'
        : '<button class="btn btn-ghost btn-xs" onclick="removeTeammate(\'' + escapeHtmlAttr(String(m.id)) + '\',\'' + escapeHtmlAttr(m.email || '') + '\')">Remove access</button>';
    }
    return '<tr>' +
      '<td><strong>' + escapeHtml(m.name || m.email || '—') + '</strong>' +
        (m.is_owner ? ' <span style="font-size:.72rem;color:var(--text-muted)">owner</span>' : '') + warn + '</td>' +
      '<td>' + escapeHtml(m.email || '—') + '</td>' +
      '<td>' + escapeHtml(roleLabel(m.role)) + '</td>' +
      '<td>' + escapeHtml(added) + '<div style="font-size:.72rem;color:var(--text-muted)">' + escapeHtml(via) + '</div></td>' +
      '<td>' + state + '</td>' +
      '<td>' + action + '</td>' +
    '</tr>';
  }).join('');
  return card('People in this account — ' + seatLine,
    '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Added</th><th>Status</th><th></th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div>' +
    '<p style="color:var(--text-secondary);font-size:.8rem;margin:10px 0 0">Removing somebody takes their access away and puts their conversations and inboxes back in the workspace. Nothing is deleted.</p>');
}

async function inviteTeammate() {
  if (!canManageTeam()) { toast('Only the owner or an admin can add teammates', 'error'); return; }
  var emailEl = document.getElementById('teamEmail');
  var nameEl = document.getElementById('teamName');
  var roleEl = document.getElementById('teamRole');
  var msg = document.getElementById('teamInviteMsg');
  var btn = document.getElementById('teamInviteBtn');
  var email = ((emailEl && emailEl.value) || '').trim();
  if (!email) { showTeamMsg('Type their email address first.', false); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    var d = await API.post('/auth/team/invite', {
      email: email,
      name: (nameEl && nameEl.value || '').trim() || null,
      role: (roleEl && roleEl.value) || 'member'
    });
    showTeamMsg(d.message || 'Invitation sent.', true);
    if (emailEl) emailEl.value = '';
    if (nameEl) nameEl.value = '';
    await loadTeamMembers();
  } catch (e) {
    // A 402 is the plan's seat ceiling and carries the whole sentence (which plan adds seats, what
    // it costs). Show it as written — it is the upsell, not an error string.
    showTeamMsg(e.message, false);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Send the invitation'; }
  }
}

function showTeamMsg(text, ok) {
  var box = document.getElementById('teamInviteMsg');
  if (!box) return;
  box.style.display = 'block';
  box.style.color = ok ? 'var(--success,#34d399)' : 'var(--danger,#f66)';
  box.textContent = text || '';
}

async function removeTeammate(id, email) {
  if (!canManageTeam()) { toast('Only the owner or an admin can remove a teammate', 'error'); return; }
  if (!window.confirm('Remove ' + (email || 'this person') + ' from the account?\n\n' +
    'They will not be able to sign in any more. Their conversations and inboxes come back to the ' +
    'account and nothing is deleted.')) return;
  try {
    var d = await API.del('/auth/team/members/' + id);
    var un = (d && d.unassigned) || {};
    var extra = [];
    if (Number(un.conversations || 0)) extra.push(Number(un.conversations) + ' conversation' + (Number(un.conversations) === 1 ? '' : 's') + ' back in the inbox');
    if (Number(un.mailboxes || 0)) extra.push(Number(un.mailboxes) + ' inbox' + (Number(un.mailboxes) === 1 ? '' : 'es') + ' unassigned');
    toast((d && d.message) || 'Access removed', 'success');
    if (extra.length) toast(extra.join(' · '), 'info');
    await loadTeamMembers();
  } catch (e) {
    toast('Could not remove them: ' + e.message, 'error');
  }
}
window.inviteTeammate = inviteTeammate;
window.removeTeammate = removeTeammate;
window.loadTeamMembers = loadTeamMembers;

// ========== TEAM & INVITES (POST /api/auth/invite, GET /api/auth/invites) ==========
// The API is the real gate: create_invite/list_invites answer 403 for any role other than
// owner/admin. canManageTeam() only decides whether the controls are rendered at all, so a
// member never sees a button that would dead-end on an error.
function canManageTeam() {
  return !!(STATE.user && (STATE.user.role === 'owner' || STATE.user.role === 'admin'));
}

async function createInvite() {
  if (!canManageTeam()) { toast('Only the owner or an admin can invite teammates', 'error'); return; }
  const sel = document.getElementById('inviteRole');
  const role = sel ? sel.value : 'member';
  const btn = document.getElementById('inviteBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  try {
    const d = await API.post('/auth/invite', { role: role });
    const full = window.location.origin + (d.invite_url || ('/auth/register?invite_token=' + d.invite_token));
    const inp = document.getElementById('inviteUrl');
    if (inp) inp.value = full;
    const box = document.getElementById('inviteResult');
    if (box) box.style.display = 'block';
    // The server answers with the STORED enum ('member'/'admin' — src/auth/handlers.rs::create_invite
    // binds the column value). The Role select two lines up reads "Member — day-to-day CRM access",
    // so the raw word in the toast was the one place this screen named a role as its database value.
    toast('Invite link created — ' + roleLabel(d.role || role) + ', expires in ' + (d.expires_in_days || 7) + ' days', 'success');
    loadInvites();
  } catch (e) {
    toast('Could not create the invite: ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '➕ Create invite link'; }
  }
}

function copyInviteUrl() {
  const inp = document.getElementById('inviteUrl');
  if (!inp || !inp.value) return;
  inp.focus();
  inp.select();
  const done = () => toast('Invite link copied — send it to your teammate', 'success');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(inp.value).then(done, () => { document.execCommand('copy'); done(); });
    } else if (document.execCommand('copy')) { done(); }
  } catch (e) { /* the selection is left in place as the manual fallback */ }
}

async function loadInvites() {
  const wrap = document.getElementById('invitesWrap');
  if (!wrap) return;
  if (!canManageTeam()) { wrap.innerHTML = ''; return; }
  try {
    const d = await API.get('/auth/invites');
    wrap.innerHTML = invitesTable((d && d.invites) || []);

    wrap.innerHTML = card('Invites', '<p style="color:var(--danger,#f66);margin:0">Could not load invites: ' + escapeHtml(e.message) + '</p>');

function invitesTable(rows) {

      '<p>Create one above — the link is what lets a teammate join this account.</p></div>');

// ========== INIT ==========
window.addEventListener('DOMContentLoaded', () => {
  // Invite landing: POST /api/auth/invite returns /auth/register?invite_token=<uuid>. That path is
  // routed to /login BY NGINX (sites/coreswift.conf: `location = /auth/register`, added 2026-11-10)
  // because there is no /auth/register file here and try_files answered it 404 — measured live, so
  // this shell never loaded for an invite link at all. The guard below still covers an invite_token
  // that reaches the shell by any other route (an old bookmark, a hand-edited link).
  const landingInvite = new URLSearchParams(window.location.search).get('invite_token');
  if (landingInvite && !localStorage.getItem('crm_token')) {
    window.location.replace('/login?invite_token=' + encodeURIComponent(landingInvite));
    return;
  }
  const token = localStorage.getItem('crm_token');
  const userStr = localStorage.getItem('crm_user');
  if (token && userStr) {
    try {
      STATE.token = token;
      STATE.user = JSON.parse(userStr);
      showApp();
    } catch(e) {
      logout(true);
    }
  }
  // Dismiss banner if it was dismissed
  if (localStorage.getItem('crm_banner_dismissed')) {
    document.getElementById('upgradeBanner').classList.add('dismissed');
  }
});

// Gmail-style navigation. ? = help. g + key = go to tab. single keys = quick actions.
(function () {
  if (window.__crmShortcutsInstalled) return;
  window.__crmShortcutsInstalled = true;

  var pendingG = null; // 'g' two-key navigation buffer
  var gTimer = null;

  // key -> { desc, fn }
  var NAV = {
    d: { desc: 'g d  → Dashboard', tab: 'dashboard' },
    c: { desc: 'g c  → Contacts', tab: 'contacts' },
    o: { desc: 'g o  → Companies', tab: 'companies' },
    p: { desc: 'g p  → Pipelines & Deals', tab: 'pipelines' },
    m: { desc: 'g m  → Campaigns', tab: 'campaigns' },
    l: { desc: 'g l  → Lists', tab: 'lists' },
    a: { desc: 'g a  → Analytics', tab: 'analytics' },
    r: { desc: 'g r  → Rules', tab: 'rules' },
    t: { desc: 'g t  → Tags', tab: 'tags' },
    s: { desc: 'g s  → Lead Scoring', tab: 'lead-scoring' },
    e: { desc: 'g e  → Email Templates', tab: 'email-templates' },
    i: { desc: 'g i  → Messages', tab: 'messages' },
    n: { desc: 'g n  → Notifications', tab: 'notifications' },
    x: { desc: 'g x  → Telnyx SMS/Voice', tab: 'telnyx' },
    k: { desc: 'g k  → Support Tickets', tab: 'tickets' },
    b: { desc: 'g b  → Shared Inbox', tab: 'inbox' },
    v: { desc: 'g v  → Email Domains & Sending', tab: 'email-settings' },
    y: { desc: 'g y  → Calendar', tab: 'calendar' },
    u: { desc: 'g u  → Bookings', tab: 'bookings' },
    q: { desc: 'g q  → AI Assistant', tab: 'ai-assistant' },
    g: { desc: 'g g  → Tracked Links', tab: 'tracked-links' },
    h: { desc: 'g h  → Checklists', tab: 'checklists' },
    w: { desc: 'g w  → Round Robin', tab: 'round-robin' },
    f: { desc: 'g f  → Profile', tab: 'profile' },
    z: { desc: 'g z  → Integration Center', tab: 'integrations' }
  };

  // single-key quick actions
  var ACTIONS = {
    c: { desc: 'c  → New Contact', fn: function () { showAddContactModal(); } },
    o: { desc: 'o  → New Company', fn: function () { showAddCompanyModal(); } },
    d: { desc: 'd  → New Deal', fn: function () { plQuickDeal(); } },
    l: { desc: 'l  → New List', fn: function () { switchTab('lists'); lsNewList(); } },
    t: { desc: 't  → New Tag', fn: function () { switchTab('tags'); tgNewTag(); } },
    k: { desc: 'k  → New Ticket', fn: function () { showAddTicketModal(); } },
    m: { desc: 'm  → Compose Message', fn: function () { showComposeModal(); } },
    p: { desc: 'p  → New Campaign', fn: function () { switchTab('campaigns'); cmNewCampaign(); } },
    e: { desc: 'e  → New Email Template', fn: function () { showAddTemplateModal(); } }
  };

  function isTyping(el) {
    if (!el) return false;
    var tag = (el.tagName || '').toLowerCase();
    var editable = el.isContentEditable || el.getAttribute && el.getAttribute('contenteditable') === 'true';
    return tag === 'input' || tag === 'textarea' || tag === 'select' || editable;
  }

  function modalOpen() {
    var el = document.getElementById('modalContainer');
    return !!(el && el.innerHTML && el.innerHTML.trim() !== '');
  }

  function clearG() { pendingG = null; if (gTimer) { clearTimeout(gTimer); gTimer = null; } }

  function toastShortcuts(list) {
    var rows = list.map(function (it) {
      var k = it.desc.split('→')[0].trim();
      var label = it.desc.indexOf('→') > -1 ? it.desc.split('→')[1].trim() : it.desc;
      return '<div class="shortcut-row" style="display:flex;justify-content:space-between;gap:20px;padding:6px 0;border-bottom:1px solid var(--border,#eee)">' +
        '<span style="color:var(--muted,#666)">' + escapeHtml(label) + '</span>' +
        '<code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">' + escapeHtml(k) + '</code></div>';
    }).join('');
    showModal('⌨️ Keyboard Shortcuts',
      '<div style="font-size:13px;max-height:60vh;overflow:auto">' + rows +
      '<div class="shortcut-row" style="padding:6px 0;border-bottom:1px solid var(--border,#eee)"><span style="color:var(--muted,#666)">Help — all shortcuts</span><code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">?</code></div>' +
      '<div class="shortcut-row" style="padding:6px 0"><span style="color:var(--muted,#666)">Close / cancel</span><code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">Esc</code></div>' +
      '</div>',
      '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
  }

  function focusSearch() {
    var first = document.querySelector('#tabPanels input[type="search"], #tabPanels input[placeholder*="earch"], #tabPanels input[placeholder*="Search"]');
    if (first) { first.focus(); return true; }
    return false;
  }

  document.addEventListener('keydown', function (e) {
    // Always allow Escape to close modal / clear g-buffer
    if (e.key === 'Escape') { clearG(); closeModal(); return; }

    if (isTyping(e.target)) return; // never hijack while typing

    // handle 'g' prefix
    if (pendingG) {
      var k2 = (e.key || '').toLowerCase();
      if (e.key === 'Escape' || e.key === '?' || e.key === 'g') { clearG(); }
      else if (NAV[k2]) {
        e.preventDefault(); e.stopPropagation();
        clearG();
        if (STATE && STATE.user) { switchTab(NAV[k2].tab); }
      } else { clearG(); return; }
      return;
    }

    var key = (e.key || '').toLowerCase();
    var ctrl = e.ctrlKey || e.metaKey;

    // '?' help
    if (e.key === '?' || (e.shiftKey && key === '/')) {
      e.preventDefault();
      toastShortcuts(Object.keys(NAV).map(function (k) { return NAV[k]; }).concat(
        Object.keys(ACTIONS).map(function (k) { return ACTIONS[k]; })));
      return;
    }

    // '/' global search (non-shift)
    if (key === '/' && !e.shiftKey && !ctrl) {
      e.preventDefault();
      if (!focusSearch()) toastShortcuts([{ desc: 'No search box on this tab' }]);
      return;
    }

    // step through modal actions
    if (modalOpen()) return;

    if (key === 'g') {
      e.preventDefault(); pendingG = 'g';
      if (gTimer) clearTimeout(gTimer);
      gTimer = setTimeout(clearG, 1200);
      return;
    }

    if (!ctrl && ACTIONS[key]) {
      e.preventDefault();
      ACTIONS[key].fn();
    }
  });
})();

// ===== INDUSTRIES (GET/POST/DELETE /api/industries) =====
// The industry-dashboard module ("industry tabs"). Nothing in this panel is invented: the catalogue
// is GET /industries/available, the Active badges are GET /industries (which filters is_active), and
// the counter is GET /industries/limit's current/max — the same number GET /auth/me/usage reports,
// so the panel cannot claim a tab the server does not count. A 402 (the plan's limit_max_industries
// assignment is off) is reported verbatim instead of being rendered as "0 of 1".
async function loadIndustriesPanel() {
  const el = document.getElementById('industriesPanel');
  if (!el) return;
  try {
    const [limit, available, active] = await Promise.all([
      API.get('/industries/limit'),
      API.get('/industries/available'),
      API.get('/industries'),
    ]);
    const all = famList(available, 'industries');
    const activeSlugs = new Set(famList(active, 'industries').map(d => d.industry_slug));
    const max = (limit && typeof limit.max === 'number') ? limit.max : -1;
    const current = (limit && typeof limit.current === 'number') ? limit.current : activeSlugs.size;
    const cap = (max < 0)
      ? (current + ' active · no ceiling on this plan')
      : (current + ' of ' + max + ' active');
    let rows = all.map(i => {
      const on = activeSlugs.has(i.slug);
      const action = on
        ? '<button class="btn btn-secondary btn-sm" onclick="deactivateIndustry(\'' + i.slug + '\')">Deactivate</button>'
        : '<button class="btn btn-primary btn-sm" onclick="activateIndustry(\'' + i.slug + '\')">Activate</button>';
      return '<tr>' +
        '<td>' + escapeHtml((i.icon || '') + ' ' + (i.name || i.slug)) + '</td>' +
        '<td>' + escapeHtml(i.description || '—') + '</td>' +
        '<td>' + (on ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-muted">Inactive</span>') + '</td>' +
        '<td>' + action + '</td></tr>';
    });
    const head = card('Industry tabs',
      '<p style="color:var(--text-secondary);margin-bottom:12px">' + escapeHtml(cap) +
      ' — an active industry tab is what the account dashboard and its automations are shaped from.</p>');
    el.innerHTML = head + (all.length
      ? '<div class="card"><div class="table-wrap"><table><thead><tr><th>Industry</th><th>What it configures</th><th>Status</th><th></th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div></div>'
      : '<div class="card"><div class="card-body"><div class="empty-state"><div class="empty-icon">🏭</div><h3>No industries</h3><p>The catalogue is empty.</p></div></div></div>');
  } catch (e) {
    el.innerHTML = card('Industry tabs',
      '<p style="color:var(--text-secondary)">Industry tabs unavailable: ' + escapeHtml(String(e.message || e)) + '</p>');
  }
}

async function activateIndustry(slug) {
  try {
