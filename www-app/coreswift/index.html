function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let h = '';
  function item(it, indent) {
    if (it.roles && (!STATE.user || it.roles.indexOf(STATE.user.role) < 0)) return;
    const isGroup = it.type === 'group';
    if (isGroup) {
      const gid = 'group-'+it.label.toLowerCase().replace(/[^a-z]/g,'');
      h += `<button type="button" class="nav-item" onclick="toggleGroup('${gid}')" data-group="${gid}" aria-label="${it.label}">
        <span class="nav-icon">${it.icon}</span>
        <span class="nav-text">${it.label}</span>
        <span class="nav-arrow">▶</span>
      </button>`;
      h += `<div class="nav-group-items" id="${gid}">`;
      it.children.forEach(c => item(c, true));
      h += '</div>';
    } else {
      h += `<button type="button" class="nav-item${STATE.activeTab===it.id?' active':''}" onclick="switchTab('${it.id}')" data-tab="${it.id}" aria-label="${it.label}">
        <span class="nav-icon">${it.icon}</span>
        <span class="nav-text">${it.label}</span>
      </button>`;
    }
  }
  MENU.forEach(it => item(it, false));
  h += '<div class="nav-divider">── SETTINGS ──</div>';
  SETTINGS_MENU.forEach(it => item(it, false));
  // The SERVER decides platform authority from users.is_platform_admin, resolved from the
  // DATABASE by the token subject (src/auth/platform_admin.rs) — every /api/admin/* route 403s
  // for anyone else. The role string is not authority: 'owner'/'admin' are TENANT vocabularies
  // (every real tenant user is 'owner'), so including them exposed the whole platform menu
  // (Features & Plans, Site Configuration, Telnyx/Email admin, Billing, Users) to customers.
  // The nav must follow the SERVER's answer, or the two disagree after the first grant/revoke:
  // invisible menu for a freshly-granted operator, or a menu whose every page 403s after a
  // revoke. Keep tenant-visible items in MENU or SETTINGS_MENU instead.
  const PLATFORM_ROLES = ['agency_admin', 'platform_admin', 'superadmin'];
  // `platform_admin` rides in the auth payload (data.team_member -> STATE.user). An ABSENT
  // field means UNKNOWN — a session stored in localStorage before this field shipped — and only
  // then is the old role list consulted, so an already-signed-in operator keeps their menu.
  const isPlatform = STATE.user && (STATE.user.platform_admin === undefined
    ? PLATFORM_ROLES.indexOf(STATE.user.role) >= 0
    : STATE.user.platform_admin === true);
  if (isPlatform) {
    h += '<div class="nav-divider">── ADMIN ──</div>';
    ADMIN_MENU.forEach(it => item(it, false));
  }
  // MCP is the LAST entry in the menu for every signed-in user, customer or operator alike.
  BOTTOM_MENU.forEach(it => item(it, false));
  nav.innerHTML = h;

  // Restore expanded groups
  document.querySelectorAll('.nav-group-items').forEach(g => {
    if (STATE.expandedGroups && STATE.expandedGroups[g.id]) {
      g.classList.add('expanded');
      const btn = g.previousElementSibling;
      if (btn) btn.classList.add('group-expanded');
    }
  });
}

// ── FIND A SCREEN (2026-11-20) ───────────────────────────────────────────────────────────────
// 61 sidebar entries (54 for a customer) with no way to jump to one by name. This filters what is
// already rendered — it fetches nothing and stores nothing — and it remembers which groups were
// open so clearing the box gives the operator back exactly the sidebar they had.
function filterSidebar(raw) {
  const q = String(raw || '').trim().toLowerCase();
  const nav = document.getElementById('sidebarNav');
  if (!nav) return;
  const divider = nav.querySelectorAll('.nav-divider');
  const groups = Array.prototype.slice.call(nav.querySelectorAll('.nav-group-items'));
  const empty = document.getElementById('sidebarSearchEmpty');
  if (!q) {
    nav.querySelectorAll('.nav-item').forEach(function (el) { el.style.display = ''; });
    divider.forEach(function (el) { el.style.display = ''; });
    groups.forEach(function (g) {
      g.style.display = '';
      const wasOpen = !!(filterSidebar._open && filterSidebar._open[g.id]);
      g.classList.toggle('expanded', wasOpen);
      const btn = nav.querySelector('[data-group="' + g.id + '"]');
      if (btn) btn.classList.toggle('group-expanded', wasOpen);
    });
    if (empty) empty.style.display = 'none';
    filterSidebar._open = null;
    return;
  }
  if (!filterSidebar._open) {
    filterSidebar._open = {};
    groups.forEach(function (g) { filterSidebar._open[g.id] = g.classList.contains('expanded'); });
  }
  divider.forEach(function (el) { el.style.display = 'none'; });
  let shown = 0;
  nav.querySelectorAll('.nav-item[data-tab]').forEach(function (el) {
    const label = String(el.getAttribute('aria-label') || el.textContent || '').toLowerCase();
    const hit = label.indexOf(q) > -1;
    el.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  groups.forEach(function (g) {
    const btn = nav.querySelector('[data-group="' + g.id + '"]');
    const groupLabel = btn ? String(btn.getAttribute('aria-label') || '').toLowerCase() : '';
    // A group whose own NAME matches keeps all of its screens: searching "admin" should show the
    // Admin Settings drawer, not hide it because no child is literally called "admin".
    const children = Array.prototype.slice.call(g.querySelectorAll('.nav-item[data-tab]'));
    if (groupLabel.indexOf(q) > -1) {
      children.forEach(function (el) { el.style.display = ''; shown++; });
    }
    const any = children.some(function (el) { return el.style.display !== 'none'; });
    g.style.display = any ? '' : 'none';
    g.classList.toggle('expanded', any);
    if (btn) {
      btn.style.display = any ? '' : 'none';
      btn.classList.toggle('group-expanded', any);
    }
  });
  if (empty) empty.style.display = shown ? 'none' : '';
}

// "/" jumps to the box from anywhere except a field the user is already typing in.
document.addEventListener('keydown', function (e) {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  const box = document.getElementById('sidebarSearch');
  if (!box) return;
  e.preventDefault();
  box.focus();
  box.select();
});

function toggleGroup(gid) {
  const items = document.getElementById(gid);
  const btn = document.querySelector(`[data-group="${gid}"]`);
  if (!items) return;
  const isExpanded = items.classList.toggle('expanded');
  if (btn) btn.classList.toggle('group-expanded', isExpanded);
  if (!STATE.expandedGroups) STATE.expandedGroups = {};
  STATE.expandedGroups[gid] = isExpanded;
}

function switchTab(tabId) {
  STATE.activeTab = tabId;
  document.getElementById('pageTitle').textContent = getTabLabel(tabId);
  // Update sidebar active
  document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tabId);
  });
  renderTab(tabId);
  // Tell the inline guide which console screen is now open. The tab switch changes no path and no
  // hash, so the widget cannot follow it on its own — it needs this forced key (fleet standard).
  if (window.inlineGuidePage) window.inlineGuidePage(tabId);
  // Close user menu
  document.getElementById('userMenu').classList.remove('show');
}


// The setup card's three controls. Delegated, because the card is rebuilt on every Dashboard visit and
// because an inline onclick carrying a server-supplied string is how this console has been broken.
document.addEventListener('click', function (ev) {
  const t = ev.target;
  if (!t || !t.closest) return;
  const go = t.closest('[data-setup-go]');
  if (go) { ev.preventDefault(); switchTab(go.getAttribute('data-setup-go')); return; }
  if (t.closest('[data-setup-hide]')) {
    ev.preventDefault();
    localStorage.setItem('crm_setup_hidden', '1');
    switchTab('dashboard');
    return;
  }
  if (t.closest('[data-setup-show]')) {
    ev.preventDefault();
    localStorage.removeItem('crm_setup_hidden');
    switchTab('dashboard');
  }
});

function getTabLabel(id) {
  const all = [...MENU, ...SETTINGS_MENU, ...ADMIN_MENU, ...BOTTOM_MENU];
  for (const it of all) {
    if (it.id === id) return it.label;
    if (it.type === 'group' && it.children) {
      for (const c of it.children) if (c.id === id) return c.label;
    }
  }
  return id.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}



// ===== UPGRADE BANNER =====
async function checkPlan() {
  try {
    // SOURCE OF TRUTH for "this account's plan": GET /api/billing/subscription answers the tenant's
    // OWN tenant_plans row and its plan_id IS the plan the account is on; a tenant with no row gets
    // the route's own declared default (default_plan = the Free row). The display NAME is then read BY
    // ID from GET /api/billing/plans/:id — never by position, never hardcoded. This replaces
    // plans.find(p => p.is_current || p.is_default) || plans[0], which fell back to plans[0] because no
    // plan carries is_current/is_default — every paid workspace was told it was on Free and upsold.
    // (GET /api/billing/features was measured as an alternative source and 404s for the 58 tenants with
    // no tenant_plans row, so it cannot be used here.)
    const sub = await API.get('/billing/subscription');
    const mine = (sub && sub.plan_id)
      ? await API.get('/billing/plans/' + sub.plan_id)
      : ((sub && sub.default_plan) || null);
    STATE.planId = (mine && mine.id) ? String(mine.id) : null;
    STATE.planName = (mine && mine.name) ? String(mine.name) : '';
    const label = document.getElementById('currentPlanName');
    if (label) label.textContent = STATE.planName;
    // The account chip's LEVEL badge: the REAL plan name, or nothing. Never a literal.
    const badge = document.getElementById('userPlanBadge');
    if (badge) { badge.textContent = STATE.planName; badge.style.display = STATE.planName ? '' : 'none'; }
    // The "You're on the X plan." half shows ONLY when a plan was really read: showUpgradeBanner()
    // also runs on the 402 path (API.call), before/without this, and may not claim a plan it never read.
    const wrap = document.getElementById('currentPlanWrap');
    if (wrap) wrap.style.display = STATE.planName ? '' : 'none';
    // the banner's whole job: upsell an account that really is on free/starter. Unknown -> silent.
    const tier = STATE.planName.toLowerCase();
    if ((tier === 'free' || tier === 'starter') && !localStorage.getItem('crm_banner_dismissed')) {
      showUpgradeBanner();
    }
  } catch(e) {
    // No source, no claim: with no plan read we name none, badge none and upsell none.
  }
}

function showUpgradeBanner() {
  // kanban cron 2026-10-31: a dismissal is the USER's answer and it must outrank the upsell.
  // Every plan-gated call answers 402 and the 402 path calls this function, and a Free workspace
  // fires six gated calls on load — so removing the class unconditionally re-showed the banner on
  // every reload even though dismissBanner() had written `crm_banner_dismissed`. Respect the flag;
  // the gated pane's own lock card still explains the gate to whoever lands on it.
  if (localStorage.getItem('crm_banner_dismissed')) return;
  document.getElementById('upgradeBanner').classList.remove('dismissed');
}

function dismissBanner() {
  document.getElementById('upgradeBanner').classList.add('dismissed');
  localStorage.setItem('crm_banner_dismissed', '1');
}

// Ask CoreSwift to move this account onto a plan (fleet convention: ADASwift, FunnelSwift,
// MissedCall, WorkflowSwift and IncentiveSwift all give a customer a one-press way to ASK while
// self-serve checkout is closed. CoreSwift had only the sentence "plan changes are made by
// CoreSwift", i.e. a plan screen with no action at all — a dead end for the customer who wants up).
//
// WHY the PUBLIC contact intake and not the tenant ticket route: checkout and the plan writers are
// retired here (tenant tokens get 403 from POST/PATCH /api/billing/subscription) and the tenant
// ticket route is plan-gated AND tenant-scoped — measured live 2026-10-22 on a fresh Free workspace:
//   POST /api/tickets -> 402 {"message":"Support tickets is not available on your current plan..."}
// and every ticket read is `WHERE tenant_id = <caller's own>` (src/tickets/handlers.rs), so a request
// filed in the customer's own store would be a black hole: the operator's Support Tickets screen only
// ever lists the OPERATOR's own workspace. CoreSwift's tickets are a tenant's support desk for ITS
// customers, not a platform inbox.
// WHICH INTAKE (measured 2026-11-11): /api/public/support-request, the same route the app's own
// contact page uses. It writes the ticket with NO workspace (the queue labels it "Website visitor"
// and the platform admin's list carries it — `tenant_id IS NULL` is one of the arms the operator's
// read includes), and it QUEUES THE OPERATOR ALERT: "A support request needs an answer: ...".
// The older /api/public/contact intake wrote the row and told nobody — measured live on a probe
// identity: 201 with the ticket stored and the owner-alert row count unchanged, while the same
// probe through /api/public/support-request queued exactly one alert. On an install with no payment
// provider this request is the only way a customer can buy, so a silent ticket is a lost sale.
// Nothing is charged and no plan changes here: the team reads the alert and makes the switch.
const PLAN_REQUEST_INTAKE = '/api/public/support-request';
async function requestPlanChange(idx, btn) {
  const p = (window.__csUpgradePlans || [])[idx];
  if (!p || !btn || btn.disabled) return;
  const user = STATE.user || {};
  if (!user.account_id) { toast('Please sign in again to send a plan request', 'error'); return; }
  const name = p.name || p.slug || 'this';
  const price = p.price_monthly || p.price || 0;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch(PLAN_REQUEST_INTAKE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        subject: 'Upgrade request: ' + name + ' plan',
        message: 'This account asked to move to the ' + name + ' plan ($' + price + '/month) from '
          + 'Plans & Billing. It is on ' + (STATE.planName || 'no plan') + ' today.'
          + (String(STATE.planName || '').toLowerCase() === 'inbox'
            ? ' IMPORTANT: this upgrade must cancel the $1 Inbox subscription in the same step — the '
              + 'workspace must never be billed $1 on top of the new plan.'
            : '')
          + ' Self-serve '
          + 'checkout is not open on this install, so the switch has to be made by the CoreSwift team.'
          + ' Account: ' + (user.company || user.account_name || '(unnamed)')
          + ' [' + user.account_id + ']. Requester: ' + (user.email || '(no address)') + '.',
        name: user.name || user.email || '',
        // Required by this intake: the address the team replies to, and the one the queue shows.
        email: user.email || ''
      })
    });
    const d = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      throw new Error((d && (d.message || d.error)) || ('HTTP ' + res.status));
    }
    btn.textContent = '✓ Request sent';
    btn.disabled = true;
    const note = document.querySelector('[data-plan-request-note]');
    if (note) {
      note.style.display = 'block';
      note.textContent = 'Request sent — CoreSwift has been notified and will review this account'
        + ' for the ' + name + ' plan and email you. Nothing was charged.';
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Request this plan';
    toast('The request could not be sent: ' + e.message, 'error');
  }
}

// Pressing "Open payment page" is a HAND-OFF, and a hand-off this installation cannot see is a
// purchase it can never fulfil. There is no card checkout here (retired 2026-09-25) and no provider
// key, so the operator's own hosted page takes the money and nothing tells CoreSwift which workspace
// paid. This files the same public support request the "Request this plan" button files — naming the
// plan, its price and the workspace — so the payment and the plan switch meet. It runs before the new
// tab opens, never blocks it, and its failure costs only the note.
async function recordPaymentHandoff(idx) {
  const p = (window.__csUpgradePlans || [])[idx];
  if (!p) return;
  const user = STATE.user || {};
  const name = p.name || p.slug || 'this';
  const price = p.price_monthly || p.price || 0;
  const note = document.querySelector('#modalContainer [data-pay-note="' + idx + '"]');
  if (note) {
    note.style.display = 'block';
    note.textContent = 'Opening ' + name + '’s payment page — CoreSwift is told you are paying for it.';
  }
  if (!user.email) return;   // no address means no way to reach this buyer; the page still opens
  try {
    const res = await fetch(PLAN_REQUEST_INTAKE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({
        subject: 'Payment started: ' + name + ' plan',
        message: 'This account pressed Open payment page for the ' + name + ' plan ($' + price
          + '/month) from Plans & Billing, so payment is happening on CoreSwift’s own payment page.'
          + ' The account is on ' + (STATE.planName || 'no plan') + ' today and must be switched onto '
          + name + ' once the money lands — nothing about this is automatic.'
          + (String(STATE.planName || '').toLowerCase() === 'inbox'
            ? ' IMPORTANT: the $1 Inbox subscription must be cancelled in the same step, so the account is never billed $1 on top of the new plan.'
            : '')
          + ' Account: ' + (user.company || user.account_name || '(unnamed)')
          + ' [' + (user.account_id || '') + ']. Payer: ' + (user.email || '') + '.',
        name: user.name || user.email || '',
        email: user.email || ''
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (note) {
      note.textContent = 'Noted — CoreSwift will switch this account onto ' + name
        + ' once your payment lands. Nothing is charged by this app.';
    }
  } catch (e) {
    // The payment page is already opening; a failed note is not a failed purchase.
    if (note) {
      note.textContent = 'Your payment page is opening. If you pay, reply to our email so we can switch '
        + 'your account onto ' + name + '.';
    }
  }
}

// A hosted payment page a buyer can actually be SENT to. A URL-syntax test alone is not enough:
// the fleet's probe/reserved hosts (`*.invalid`, `*.test`, `*.example`, localhost, test.com, x.com)
// are exactly what a leftover probe row points at, and `https://example.invalid/probe-pay-...`
// passes every syntax check while resolving to nothing. MEASURED 2026-11-17: the live `starter`
// plan carried such a link, so it counted as a payable plan and a buyer who pressed "Open payment
// page" landed on a host that does not resolve. Server-verified `dead` verdicts are the other half
// (`/billing/readiness` on the admin console); this helper refuses what a link obviously is not.
function payLinkKind(link) {
  const s = String(link || '').trim();
  if (!s) return 'none';
  if (!/^https:\/\//i.test(s)) return 'not_https';
  let host = '';
  try { host = new URL(s).hostname.toLowerCase(); } catch (_) { return 'not_https'; }
  if (host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' ||
      /(^|\.)(invalid|test|example|localhost)$/.test(host) ||
      host === 'test.com' || host === 'www.test.com' ||
      host === 'x.com' || host === 'www.x.com') return 'probe';
  return 'ok';
}
async function openUpgradeModal() {
  let plansHtml = '<div class="loading-wrap"><div class="spinner"></div> Loading plans...</div>';
  showModal('Compare Plans', plansHtml, '', true);
  try {
    // same envelope: without the unwrap `plans.forEach` did not exist and the modal could not list a
    // single plan (it painted an error instead of "No plans available")
    const plans = famList(await API.get('/billing/plans'), 'plans');
    // The Inbox door ($1/mo, $10/yr): a STANDALONE plan, not a rung of the CRM ladder. It ships
    // inactive until a payment page exists, so `GET /plans` (active only) never returns it — the
    // console still has to SHOW it, with its own annual price and a request path, or the receive-only
    // banner's "Keep inbox — $1/mo" would lead nowhere. Best-effort: if the read fails the modal
    // simply lists the active plans.
    try {
      const inbox = await API.get('/billing/plans/slug/inbox');
      const inboxPlan = inbox && (inbox.plan || inbox);
      if (inboxPlan && inboxPlan.id && !plans.some(x => String(x.id) === String(inboxPlan.id))) {
        plans.splice(Math.min(1, plans.length), 0, inboxPlan);
      }
    } catch (e) { /* the active ladder still renders */ }
    if (plans.length === 0) {
      document.querySelector('#modalContainer .modal-body').innerHTML = '<p class="empty-state">No plans available</p>';
      return;
    }
    plansHtml = '<div class="plans-grid">';
    plans.forEach((p, i) => {
      // the workspace's OWN plan row decides the badge (STATE.planId from checkPlan); a name match can
      // badge two rows, and the plans[0] fallback badged Free for every tenant
      const isCurrent = String(p.id) === String(STATE.planId);
      const price = p.price_monthly || p.price || 0;
      // The Inbox door is priced as a standalone door: monthly first, then the annual saving, and it
      // must never be described as free (brief §5).
      const isInbox = String(p.slug || '') === 'inbox';
      const features = isInbox
        ? ['One private inbox on your own domain', 'Send and receive with your own Mailgun account',
           'Mailbox only — no CRM, calendar or campaigns']
        : planFeatureList(p.features);
      const priceLine = isInbox
        ? `${price}<span>/mo</span><div style="font-size:12px;opacity:.75;margin-top:2px">$${p.price_yearly || 10}/yr — two months free</div>`
        : `${price}<span>/mo</span>`;
      plansHtml += `<div class="plan-card${isCurrent?' current':''}">
        ${isCurrent ? '<span class="badge badge-primary plan-badge">Current</span>' : ''}
        <div class="plan-name">${escapeHtml(p.name)}</div>
        <div class="plan-price">$${priceLine}</div>
        <ul class="plan-features">
          ${features.map(f => `<li class="check">✓ ${escapeHtml(f)}</li>`).join('')}
        </ul>
        ${isCurrent ? '' : `<button class="btn btn-primary btn-sm" data-request-plan="${i}" style="margin-top:10px">Request this plan</button>`}
        ${(!isCurrent && p.is_active !== false && payLinkKind(p.checkout_url) === 'ok')
          ? `<a class="btn btn-secondary btn-sm" data-pay-link="${i}" href="${escapeHtml(String(p.checkout_url).trim())}" target="_blank" rel="noopener" style="margin-top:8px;display:inline-block">Open payment page</a>`
          : ''}
        <div data-pay-note="${i}" style="display:none;font-size:12px;color:var(--text-secondary);margin-top:6px"></div>
        ${(!isCurrent && p.is_active === false)
          ? `<div data-plan-not-on-sale="1" style="font-size:12px;opacity:.8;margin-top:8px">Sales are not open for this plan yet — pressing Request reaches our team, and nothing is charged.</div>`
          : ''}
      </div>`;
    });
    plansHtml += '</div>';
    // No press on a non-current card: checkout and both provider webhooks are retired (t_0fe500d4)
    // and the plan writers are operator-only -- POST/PATCH /api/billing/subscription answers 403 for
    // every tenant token (t_8d91f70c) -- so a per-plan press could never complete a change. It used
    // to render with no handler at all (kanban t_fa43f3e8). The comparison is informational and
    // CoreSwift assigns the plan to the workspace (PUT /api/admin/tenants/:id/plan).
    // 2026-11-08: a plan the operator has given a hosted payment page (`plans.checkout_url`) ALSO
    // shows that page as a second door. Nothing about it runs on this installation -- the buyer pays
    // on the operator's own page and the workspace is switched on by hand -- which is exactly why the
    // request button stays first and stays wired. If the page does not open, the request still works.
    // THE STANDALONE $1 RULE (kanban t_5d1d6d31). A workspace on Inbox that upgrades must be told
    // the $1 ENDS in the same step — never $30, no stacked subscriptions, no proration surprise.
    // The server enforces it (one open plan line, closed by the plan write itself); this sentence
    // is how the customer knows it BEFORE pressing anything.
    var onInbox = plans.some(function (p) {
      return String(p.slug || '').toLowerCase() === 'inbox' && String(p.id) === String(STATE.planId);
    });
    if (onInbox) {
      plansHtml += '<p data-inbox-upgrade-note="1" style="color:var(--text-secondary);font-size:13px;'
        + 'margin-top:14px;text-align:center;border:1px solid rgba(128,128,128,.3);border-radius:8px;padding:10px">'
        + '<strong>Upgrading cancels your Inbox subscription in the same step.</strong> You pay only the '
        + 'new plan’s price — never $1 on top of it — and the new period starts today, so there is no '
        + 'proration. Moving back down to Inbox returns you to $1, and your mailbox and all its mail stay '
        + 'exactly where they are.</p>';
    }
    var anyPayLink = plans.some(p => payLinkKind(p.checkout_url) === 'ok'
      && String(p.id) !== String(STATE.planId));
    plansHtml += '<p style="color:var(--text-secondary);font-size:13px;margin-top:14px;text-align:center">'
      + (anyPayLink
        ? 'A plan with a payment page can be paid for now: <strong>Open payment page</strong> takes you to our own secure checkout, and your account is switched onto the plan once the payment lands. Prefer a hand-off from our team? Press <strong>Request this plan</strong>.'
        : 'Plan changes are made by CoreSwift for your account. Press <strong>Request this plan</strong> and it reaches our team.')
      + '</p>';
    plansHtml += '<p id="planRequestNote" data-plan-request-note style="display:none;color:var(--success);font-size:13px;margin-top:8px;text-align:center"></p>';
    document.querySelector('#modalContainer .modal-body').innerHTML = plansHtml;
    // HOW TO PAY (kanban t_3f4c16a7). This installation has no card till, so a buyer who asks for a
    // paid plan is told a person will switch the workspace on — and nothing ever said WHERE the money
    // goes. The operator's own words are read from the ANONYMOUS price list (the same payload the
    // public pricing page reads), so one box in the admin console reaches every buyer. A failed read
    // shows nothing: a buy screen must never turn a network blip into an error, and empty = off.
    fetch('/api/v1/public/plans', { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var words = (d && typeof d.payment_instructions === 'string') ? d.payment_instructions.trim() : '';
        var body = document.querySelector('#modalContainer .modal-body');
        if (!words || !body || body.querySelector('[data-how-to-pay]')) return;
        var box = document.createElement('div');
        box.setAttribute('data-how-to-pay', '1');
        box.style.cssText = 'margin-top:16px;padding:14px 16px;border:1px solid rgba(128,128,128,.35);border-left:4px solid #2563eb;border-radius:8px;text-align:left';
        var h = document.createElement('div');
        h.style.cssText = 'font-weight:700;margin-bottom:6px';
        h.textContent = 'How to pay for a paid plan';
        var para = document.createElement('p');
        para.style.cssText = 'margin:0;font-size:13px;white-space:pre-wrap;color:var(--text-secondary)';
        para.textContent = words;
        box.appendChild(h);
        box.appendChild(para);
        body.appendChild(box);
      })
      .catch(function () { /* the plan ladder above still works */ });
    // Wire the request buttons AFTER the markup exists (the pane is rebuilt on every open, so a
    // per-render listener cannot go stale). The plan list is kept on window because the handler is
    // called from an inline attribute-free listener and needs the row, not a name match.
    window.__csUpgradePlans = plans;
    document.querySelectorAll('#modalContainer [data-request-plan]').forEach(b => {
      b.addEventListener('click', () => requestPlanChange(Number(b.getAttribute('data-request-plan')), b));
    });
    // THE PAYMENT PAGE IS A DOOR WITH NO POST-BOX unless the press is recorded. Measured 2026-11-12
    // (kanban t_a27fd2a4): a plan carrying a hosted page rendered "Open payment page" and pressing it
    // left NO record anywhere on this installation — no session row (the card checkout that used to
    // write one was retired 2026-09-25), no ticket, nothing. A buyer who then paid was invisible: the
    // workspace stayed on its old plan until an operator happened to recognise the payment. The press
    // now files the same public support request "Request this plan" files, naming the plan, the price
    // and the workspace, BEFORE the new tab opens. It can never block the purchase: the anchor is
    // target=_blank so this page survives, the fetch carries keepalive so a slow reply cannot cancel
    // it, and a failure only loses the note, never the navigation.
    document.querySelectorAll('#modalContainer [data-pay-link]').forEach(a => {
      a.addEventListener('click', () => recordPaymentHandoff(Number(a.getAttribute('data-pay-link'))));
    });
  } catch(e) {
    document.querySelector('#modalContainer .modal-body').innerHTML = `<p style="color:var(--error)">Failed to load plans: ${escapeHtml(e.message)}</p>`;
  }
}

// ===== TAB RENDERING =====
function renderTab(tabId) {
  const container = document.getElementById('tabPanels');
  const fn = TAB_RENDERERS[tabId];
  if (fn) {
    container.innerHTML = fn();
    a11yBindLabels(container);
    // If there's an async loader, call it
    if (TAB_LOADERS[tabId]) {
      TAB_LOADERS[tabId]();
    }
  } else {
    container.innerHTML = placeholderPanel(getTabLabel(tabId), 'This feature is under development.', '🚧');
  }
}

function placeholderPanel(title, desc, icon) {
  return `<div class="placeholder-panel">
    <div class="placeholder-icon">${icon||'🚧'}</div>
    <h3>${title}</h3>
    <p>${desc||'Configure this feature to get started.'}</p>
    <button class="btn btn-secondary" onclick="switchTab('integrations')">🔌 Open Integration Center</button>
  </div>`;
}

function pageHeader(title, desc, actions) {
  return `<div class="page-header">
    <h2>${title}</h2>
    ${desc ? `<p>${desc}</p>` : ''}
    ${actions ? `<div class="page-actions">${actions}</div>` : ''}
  </div>`;
}

function card(header, body, footer) {
  return `<div class="card">
    ${header ? `<div class="card-header">${header}</div>` : ''}
    ${body ? `<div class="card-body">${body}</div>` : ''}
    ${footer ? `<div class="card-footer">${footer}</div>` : ''}
  </div>`;
}

function dataTable(headers, rows, emptyMsg) {
  if (!rows || rows.length === 0) {
    return `<div class="card"><div class="card-body"><div class="empty-state">
      <div class="empty-icon">📭</div>
      <h3>No data yet</h3>
      <p>${emptyMsg || 'Nothing to display right now.'}</p>
    </div></div></div>`;
  }
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></div>`;
}

async function saveSiteConfig() {
  const getVal = (id) => {
    const el = document.getElementById(id);
    if (!el) return '';
    if (el.type === 'checkbox') return el.checked;
    return el.value;
  };

  const payload = {
    title: getVal('cfg_title'),
    description: getVal('cfg_description'),
    keywords: getVal('cfg_keywords'),
    og_title: getVal('cfg_og_title'),
    og_description: getVal('cfg_og_description'),
    og_image_url: getVal('cfg_og_image_url'),
    favicon_url: getVal('cfg_favicon_url'),
    canonical_url: getVal('cfg_canonical_url'),
    ga_id: getVal('cfg_ga_id'),
    gtm_id: getVal('cfg_gtm_id'),
    head_scripts: getVal('cfg_head_scripts'),
    body_scripts: getVal('cfg_body_scripts'),
    homepage: {
      headline: getVal('cfg_homepage_headline'),
      subheadline: getVal('cfg_homepage_subheadline')
    },
    legal_tos: getVal('cfg_legal_tos'),
    legal_privacy: getVal('cfg_legal_privacy'),
    legal_refunds: getVal('cfg_legal_refunds'),
    schema_json: getVal('cfg_schema_json'),
    enable_signups: getVal('cfg_enable_signups'),
    maintenance_mode: getVal('cfg_maintenance_mode'),
    rate_limit: parseInt(getVal('cfg_rate_limit')) || 60,
    session_timeout: parseInt(getVal('cfg_session_timeout')) || 30
  };

  try {
    const res = await API.put('/admin/site', payload);
    // The save is the DB row. The static marketing/legal pages are materialized on the HOST by
    // /opt/swift/bin/cs-site-apply.sh (the app runs in a container with no mount for them), so the
    // honest copy names that hop instead of claiming this request rewrote them.
    const applied = (res && res.static_pages) || null;
    toast(applied
      ? 'Site configuration saved. Marketing + legal pages refresh within ' + (applied.within_minutes || 5) + ' minutes.'
      : 'Site configuration saved.', 'success');
    SITE_CONFIG = { ...SITE_CONFIG, ...payload };
  } catch(e) {
    toast('Save failed: ' + e.message, 'error');
  }
}

/* A FAILED READ MUST SPEAK TO A CUSTOMER, NOT A DEVELOPER (2026-11-18). Eleven panels in this
   console printed "<Thing> endpoint: <raw error text>" — measured live copies of that pattern, e.g.
   "Contacts endpoint: HTTP 500" — which tells a business owner nothing they can act on and leaks
   our own vocabulary into the product. One sentence everywhere; it never claims data was lost,
   only that this read did not answer. */
function readFailed(what) {
  return 'We could not load ' + what + ' just now. Nothing was changed — reload the page to try again.';
}

function escapeHtmlAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== ASYNC TAB LOADERS (fetch real data) ==========
// Harness identities (fleet walkers + the tenancy canary) live on RESERVED addresses — RFC 2606 /
// 6761 domains that can never receive mail — and the send path already suppresses them at source.
// They are machinery, not customers, so the operator's People list hides them by default with an
// always-available Show control (the same contract the sibling apps' account lists ship).
let CS_SHOW_TEST_USERS = false;
function csIsTestIdentity(email) {
  const e = String(email || '').trim().toLowerCase();
  if (!e || e.indexOf('@') < 1) return false;
  const at = e.lastIndexOf('@');
  const local = e.slice(0, at);
  const domain = e.slice(at + 1);
  if (domain === 'swiftsoftware.dev' || domain.endsWith('.swiftsoftware.dev')) return local.indexOf('probe') === 0;
  if (domain === 'example.com' || domain === 'example.net' || domain === 'example.org') return true;
  return /\.(invalid|test|example|localhost)$/.test(domain);
}

  'tickets': async () => {
    // A ticket queue still works when mail does not, so this WARNS: replies from the shared inbox and the
    // customer's own email thread are what inbound setup buys, and it is said on the page rather than
    // discovered later (David, 2026-11-20).
    try {
      const tkReady = await loadMailReadiness();
      const tkBanner = mailLaneBanner(tkReady, 'inbox', 'Replying to customers from the shared inbox needs inbound mail set up.');
      const tkPanel = document.getElementById('tabPanels');

    } catch (e) {}
    const ticketsTableEl = document.getElementById('ticketsTable');
    if (!ticketsTableEl) return;
    try {
      // CS-22: the API answers {tickets, count} — `Array.isArray` on that is false, which is why
      // this tab always said "No support tickets" no matter what the customer had raised.
      // The view is a saved predicate on the server (GET /api/tickets?view=...), not a client-side
      // filter: "due soon" and "mine" depend on clocks and on who is asking, and neither belongs in
      // the browser where it can disagree with the queue.
      loadDeskReport();
      // A search looks across the whole account, not inside the current view: "where is ticket 42" has one
      // answer and the view you happen to be looking at cannot change it.
      const searching = (STATE.ticketQuery || '').trim();
      const resp = searching
        ? await API.get('/tickets?view=all&limit=100&q=' + encodeURIComponent(searching))
        : await API.get('/tickets?view=' + encodeURIComponent(STATE.ticketView || 'open'));
      if (resp && resp.portal_url) STATE.portalUrl = resp.portal_url;   // CS-22
      const tickets = Array.isArray(resp) ? resp : ((resp && resp.tickets) || []);
      let rows = [];
      if (Array.isArray(tickets)) {
        rows = tickets.slice(0, 50).map(t => [
          (t.number ? '<code style="opacity:.7">#' + escapeHtml(String(t.number)) + '</code> ' : '') +
            escapeHtml(t.subject || t.title || '—'),
          `<span class="badge ${t.status==='open'?'badge-error':t.status==='in_progress'?'badge-warning':'badge-success'}">${escapeHtml(t.status||'open')}</span>`,
          escapeHtml(t.priority || 'medium'),
          escapeHtml(t.contact_name || t.contact_email || t.requester || '—'),
          // The SAME assignment the shared inbox writes (kanban t_5f314e9a): one conversation, two
          // views. A ticket raised by hand has no conversation behind it, so it shows nobody.
          tkAssignCell(t),
          ticketDueCell(t),
          escapeHtml(t.created_at ? new Date(t.created_at).toLocaleDateString() : '—'),
          `<button class="btn btn-ghost btn-xs" onclick="openTicket('${t.id}')">View</button>`
        ]);
      }
      renderTicketViews();
      ticketsTableEl.innerHTML = dataTable(
        ['Subject','Status','Priority','Contact','Assigned to','Due','Created',''], rows,
        (STATE.ticketQuery || '').trim()
          ? 'Nothing matches “' + (STATE.ticketQuery || '').replace(/[<>&]/g, '') + '”.'
          : STATE.ticketView === 'due'
            ? 'Nothing is due in the next four hours.'
            : 'No tickets in this view.'
      );
    } catch(e) {
      ticketsTableEl.innerHTML = (e && e.planGate)
        ? `<div class="card"><div class="card-body"><p style="color:var(--text-secondary)">\u{1F512} ${escapeHtml(e.planMessage || 'Support tickets is not available on your current plan. Upgrade to access it.')}</p><p style="color:var(--text-secondary);margin-top:10px">Requests your customers submit through the 💬 My Support portal or the embed widget are still accepted and stored while you are on this plan — the intake is not plan-gated — and they appear in this list as soon as the plan includes Support tickets.</p></div></div>`
        : `<div class="card"><div class="card-body"><p style="color:var(--text-secondary)">${escapeHtml(readFailed('your support tickets'))}</p></div></div>`;
    }
  },

// private-email limits, retention and purge. Every control calls an EXISTING route:

let PE_TENANTS = [];

function peTenantOptions(selected) {
  if (!PE_TENANTS.length) return '<option value="">(no tenants returned)</option>';
  return '<option value="">— select tenant —</option>' + PE_TENANTS.map(t =>
    '<option value="' + escapeHtmlAttr(t.id) + '"' + (t.id === selected ? ' selected' : '') + '>' +
    escapeHtml(t.name || t.slug || t.id) + '</option>').join('');
}

function showTargetsModal(companyId, companyName) {
  showModal('Integration Targets — ' + companyName,
    '<div id="targetsBody" data-ops="portfolio-targets"><div style="text-align:center;padding:20px;color:var(--text-muted)">Loading targets...</div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Close</button>', true);
  loadTargets(companyId);
}

async function testIntegrationTarget(companyId, targetId, btn) {
  const label = btn ? btn.innerText : '';
  if (btn) { btn.disabled = true; btn.innerText = 'Sending...'; }
  try {
    const d = await API.post('/portfolio/' + companyId + '/targets/' + targetId + '/test', {});
    toast((d && d.detail) ? d.detail : (d && d.delivered ? 'The endpoint answered.' : 'The endpoint did not accept the test.'),
          (d && d.delivered) ? 'success' : 'error');
  } catch (e) {
    toast((e && e.message) ? e.message : 'The test could not be sent', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.innerText = label || 'Send a test'; }
  }
}

function removeIntegrationTarget(companyId, targetId) {
  confirmThen('Remove this target? The automation behind it stops receiving events for this company.', function () {
    API.del('/portfolio/' + companyId + '/targets/' + targetId)
      .then(function () { toast('Target removed', 'success'); loadTargets(companyId); })
      .catch(function (e) { toast('Could not remove that target: ' + e.message, 'error'); });
  });
}

    }
    html += '<div class="card" style="margin-top:16px"><div class="card-header">Add Target</div><div class="card-body">' +
      '<div class="form-group"><label>Name *</label><input type="text" id="tgName" placeholder="e.g. Slack alerts"></div>' +

      '<div class="form-group"><label>Webhook URL *</label><input type="url" id="tgUrl" placeholder="https://..."></div>' +

async function addIntegrationTarget(companyId) {
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const name = g('tgName').trim();
  const provider = g('tgProvider') || 'webhook';
  const webhook_url = g('tgUrl').trim();
  const api_key = g('tgKey').trim();
  const events = g('tgEvents').split(',').map(s => s.trim()).filter(Boolean);
  if (!name || !webhook_url) { toast('Name and webhook URL are required', 'error'); return; }
  const body = { name: name, provider: provider, webhook_url: webhook_url, events: events };
  if (api_key) body.api_key = api_key;
  try {
    await API.post('/portfolio/' + companyId + '/targets', body);
    toast('Integration target added', 'success');
    loadTargets(companyId);
  } catch(e) {
    toast('Add failed: ' + e.message, 'error');
  }
}

// The picker reads the app's own ACTIVE tier list (GET /api/billing/plans) — the same list the
// customer's plan screens use — so a tier offered here is a tier the app really sells. The empty
// value means "seat the entry plan", which the server resolves to the platform default (free).
// PS_PLAN_INFO keeps the NAME of each tier: the sync reply reports the seated tier by its SLUG
// (`res.plan`), and a slug is jargon in a confirmation an operator reads ("Plan: agency").
const PS_PLAN_INFO = {};
async function loadPortfolioSyncPlans() {
  const sel = document.getElementById('psPlan');
  if (!sel) return;
  try {
    const plans = famList(await API.get('/billing/plans'), 'plans');
    plans.forEach(p => { PS_PLAN_INFO[String(p.slug)] = p; });
    const free = plans.find(p => Number(p.price_monthly || 0) === 0);
    sel.innerHTML = '<option value="">' + escapeHtml((free ? free.name : 'Entry plan') + ' — free') + '</option>' +
      plans.map(p => {
        const price = Number(p.price_monthly || 0);
        const label = p.name + (price > 0 ? ' — $' + price.toFixed(0) + '/mo' : ' — free');
        return '<option value="' + escapeHtmlAttr(p.slug) + '">' + escapeHtml(label) + '</option>';
      }).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">(plans could not be listed: ' + escapeHtml(e.message) + ')</option>';
  }
}

async function runPortfolioSync() {
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const name = g('psName'); const email = g('psEmail'); const desc = g('psDesc'); const plan = g('psPlan');
  if (!email) { toast('Owner email is required', 'error'); return; }
  const body = { name: name || 'Company', email: email, description: desc };
  if (plan) body.plan_slug = plan;
  try {
    const res = await API.post('/admin/portfolio-sync', body);
    closeModal();
    const synced = !!(res && res.status === 'synced');
    const emailed = !!(res && res.credentials_emailed);
    const who = escapeHtml((res && res.name) || name);
    // The reply names the seated tier by SLUG; show the tier's own NAME (and its price) the way the
    // picker showed it. An unknown slug still reads as a capitalised word, never lowercase jargon.
    const planSlug = String((res && res.plan) || 'free');
    const planRow = PS_PLAN_INFO[planSlug];
    const planLabel = planRow
      ? String(planRow.name || planSlug) + (Number(planRow.price_monthly || 0) > 0 ? ' — $' + Number(planRow.price_monthly).toFixed(0) + '/mo' : '')
      : (planSlug ? planSlug.charAt(0).toUpperCase() + planSlug.slice(1) : 'Free');
    let head;
    if (!synced) {
      head = '<p><strong>' + who + ' already has an account.</strong> Nothing new was created — only its contact details were refreshed, so no password email was sent.</p>';
    } else if (emailed) {
      head = '<p><strong>' + who + ' now has an account.</strong> The login details and the password were emailed to ' +
        escapeHtml((res && res.email) || email) + '.</p>' +
        '<p>Plan: <strong>' + escapeHtml(planLabel) + '</strong>. They sign in at app.coreswiftcrm.com and can change the password in Settings.</p>';
    } else {
      head = '<p><strong>' + who + ' now has an account, but the email did not go out.</strong> The owner has no password yet — ' +
        'they can set one with &ldquo;Forgot password?&rdquo; on the sign-in page, or run this again once mail is working.</p>' +
        '<p>Plan: <strong>' + escapeHtml(planLabel) + '</strong> — it is seated already, so the account is on that tier as soon as the owner signs in.</p>';
    }
    toast(!synced ? 'Already has an account — details refreshed'
      : (emailed ? 'Account created — login emailed' : 'Account created — email did NOT go out'),
      synced && !emailed ? 'error' : 'success');
    showModal('Sync Result', head +
      '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--text-secondary)">Technical detail</summary>' +
      '<pre style="white-space:pre-wrap;font-size:.8rem;margin-top:8px">' + escapeHtml(JSON.stringify(res, null, 2)) + '</pre></details>',
      '<button class="btn btn-primary" onclick="closeModal()">Close</button>');
    if (TAB_LOADERS['portfolio']) TAB_LOADERS['portfolio']();
  } catch(e) {
    toast('Sync failed: ' + e.message, 'error');
  }
}

// ========== MODAL GENERATORS ==========
// ── INTEGRATION CENTER ───────────────────────────────────────────────────────
// One surface for every credential this account owns (BYOK), sourced from the API —
// never from a hardcoded list:
//   GET    /native/apps                    -> the first-party capture connectors
//   GET    /native/apps/:slug/status       -> THIS account's connection state
//   POST   /native/apps/:slug/test         -> live test, stores nothing
//   POST   /native/apps/:slug/connect      -> test, then store the credentials
//   POST   /native/apps/:slug/disconnect   -> forget the credentials
//   GET    /available-providers            -> the provider catalogue (DB-backed)
//   GET    /provider-keys                  -> stored keys, returns {count, items}
//   POST   /provider-keys                  -> upsert a key
//   PATCH  /provider-keys/:provider        -> toggle is_active without resending the secret
//   DELETE /provider-keys/:provider        -> remove
//
// What this replaced, so nobody reintroduces it: the old view hardcoded ten providers
// (five of which do not exist in available_providers, so saving them always 422'd),
// named none of the six native connectors, and read the key list as a bare array even
// though the API returns {count, items} — which is why every provider read
// "Not connected" no matter what the account had stored.

const IC = { apps: [], status: {}, providers: [], keys: {}, overview: null, isAdmin: false, loaded: false };

const IC_ADMIN_ROLES = ['owner', 'account_owner', 'admin', 'agency_admin'];

// The sister products, as cross-sell/upgrade paths. A tenant who already runs one of
// these and not CoreSwift is exactly who the upsell targets.
const IC_SISTERS = [
  { slug:'funnelswift',          name:'FunnelSwift',          url:'https://app.funnelswift.net',         pitch:'Sales funnels and landing pages. Funnel opt-ins land in CoreSwift as contacts.' },
  { slug:'workflowswift',        name:'WorkflowSwift',        url:'https://app.workflowswift.com',       pitch:'Workflow automation on n8n — enrich and route leads before they reach the CRM.' },
  { slug:'missedcall-responder', name:'MissedCall Responder', url:'https://app.missedcallrespondr.com',   pitch:'Missed-call text-back. Every recovered caller becomes a lead in CoreSwift.' },
  { slug:'adaswift',             name:'AdaSwift',             url:'https://app.adaswift.com',            pitch:'Accessibility scanning and client reporting for agencies.' },
  { slug:'multi-directory',      name:'Multi-Directory',      url:'https://zaarhub.com',                 pitch:'Publish and follow up across business directories.' },
  { slug:'incentiveswift',       name:'IncentiveSwift',       url:'https://app.incentiveswift.com',      pitch:'Loyalty programmes and rewards campaigns. Pull its campaigns and contacts into the CRM, push CRM contacts into a programme.' },
];

// Pre-filled API base per connector. The connector health-checks <base>/api/health
// (WorkflowSwift: <base>/health, FunnelSwift: <base>/v1/health), so a wrong value is
// caught by the test before anything is stored.
const IC_BASE_DEFAULT = {
  'adaswift': 'https://app.adaswift.com',
  'funnelswift': 'https://app.funnelswift.net',
  'workflowswift': 'https://app.workflowswift.com',
  'missedcall-responder': 'https://app.missedcallrespondr.com',
  'multi-directory': 'https://zaarhub.com',
  'incentiveswift': 'https://app.incentiveswift.com'
};

const IC_FIELD_LABEL = { api_key: 'API Key', base_url: 'API Base URL', webhook_secret: 'Webhook Secret' };

const IC_FIELD_HINT = {
  base_url: 'The address this app answers on, e.g. https://app.funnelswift.net — the connection test calls it directly.',
  webhook_secret: 'The signing secret this app sends with its webhook payloads.'
};

const IC_PROVIDER_ICON = { brain:'🤖', mail:'✉️', newspaper:'📰', database:'🗄️', key:'🔑', phone:'📱', message:'💬', chart:'📈', search:'🔎', globe:'🌐' };

function icIsAdmin() {
  return !!(STATE.user && IC_ADMIN_ROLES.indexOf(STATE.user.role) >= 0);
}

function icErr(title, msg) {
  // The gate's own sentence is now "... is not available/included on your current plan. Upgrade to
  // access it." (API.call carries it verbatim), so match that shape too — not only the old sentinel.
  const upgrade = /payment required|forbidden|not entitled|not (?:available|included) (?:in|on) your current plan/i.test(msg || '')
    ? ' This module may be switched off on your plan — check <strong>Features &amp; Plans</strong>.'
    : '';
  // A PLAN REFUSAL ALREADY NAMES ITS OWN MODULE. The gate text is the server's own sentence
  // ("AI scoring is not available on your current plan. Upgrade to access it."), so prefixing the
  // same label again stutters the sentence the customer reads — measured 2026-10-16 in Chromium on a
  // Free workspace: the AI Assistant pane rendered "AI scoring: AI scoring is not available on your
  // current plan. Upgrade to access it." Drop the prefix when the message already opens with it, and
  // keep it for every other caller (a title that says WHAT failed, e.g. "Could not read your domains").
  const m = msg || 'request failed';
  const head = (title && m.toLowerCase().indexOf(String(title).toLowerCase()) === 0)
    ? ''
    : escapeHtml(title) + ': ';
  return '<div class="card"><div class="card-body"><p style="color:var(--error);margin:0">' +
    head + escapeHtml(m) + upgrade + '</p></div></div>';
}

function icBind(el) {
  el.querySelectorAll('[data-ic]').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.getAttribute('data-ic');
      const slug = b.getAttribute('data-slug');
      const provider = b.getAttribute('data-provider');
      const id = b.getAttribute('data-id');
      if (act === 'connect') icOpenConnect(slug);
      else if (act === 'disconnect') icDisconnectApp(slug);
      else if (act === 'provider') icOpenProvider(provider);
      else if (act === 'provider-del') icDeleteProvider(provider);
      else if (act === 'sync') icSyncOpen(slug);
      else if (act === 'history') icSyncHistory(slug);
    });
  });
  el.querySelectorAll('[data-ic-toggle]').forEach(c => {
    c.addEventListener('change', () => icToggleProvider(c.getAttribute('data-ic-toggle'), c.checked));
  });
}

async function loadIntegrationCenter() {
  IC.isAdmin = icIsAdmin();
  await Promise.all([icLoadApps(), icLoadProviders(), icLoadOverview()]);
  icRenderUpgradePaths();

}

// ── Native connectors: the capture apps that push leads INTO CoreSwift ──
async function icLoadApps() {
  const wrap = document.getElementById('icNativeWrap');
  if (!wrap) return;
  let apps = [];
  try {
    const d = await API.get('/native/apps');
    apps = (d && d.apps) || [];
  } catch (e) {
    wrap.innerHTML = icErr('Could not load native connectors', e.message);
    return;
  }
  IC.apps = apps;

  // Connection state is per-connector (and per-account) — one call each, in parallel.
  const status = {};
  await Promise.all(apps.map(async a => {
    try { status[a.slug] = await API.get('/native/apps/' + encodeURIComponent(a.slug) + '/status'); }
    catch (e) { status[a.slug] = { connected: false, status_error: e.message }; }
  }));
  IC.status = status;
  icRenderApps();
}

function icRenderApps() {
  const el = document.getElementById('icNativeWrap');
  if (!el) return;
  const rows = IC.apps.map(a => {
    const st = IC.status[a.slug] || {};
    const connected = !!st.connected;
    const access = a.access_level === 'admin_tenant' ? 'This account' : 'Platform admin';

    let statusCell;
    if (connected) {
      statusCell = '<span class="status-dot connected"></span> ' +
        (st.last_test_ok === false
          ? '<span class="badge badge-warning">connected, last test failed</span>'
          : '<span class="badge badge-success">connected</span>');
      if (st.last_test_at) {
        statusCell += '<div style="font-size:.72rem;color:var(--text-muted)">tested ' +
          escapeHtml(new Date(st.last_test_at).toLocaleString()) + '</div>';
      }
      if (st.error_message) {
        statusCell += '<div style="font-size:.72rem;color:var(--warning,#f0ad4e)">' + escapeHtml(st.error_message) + '</div>';
      }
    } else {
      statusCell = '<span class="status-dot disconnected"></span> <span class="badge badge-muted">not connected</span>';
      if (st.status_error) {
        statusCell += '<div style="font-size:.72rem;color:var(--text-muted)">' + escapeHtml(st.status_error) + '</div>';
      }
    }

    // Platform-level connectors need an admin; tenant-level ones any account owner.
    const canManage = a.access_level === 'admin_tenant' || IC.isAdmin;
    let actions = '';
    if (canManage) {
      actions += '<button class="btn ' + (connected ? 'btn-secondary' : 'btn-primary') + ' btn-xs" data-ic="connect" data-slug="' +
        escapeHtmlAttr(a.slug) + '">' + (connected ? 'Reconfigure' : 'Connect') + '</button>';
      if (connected) {
        actions += ' <button class="btn btn-ghost btn-xs" data-ic="disconnect" data-slug="' +
          escapeHtmlAttr(a.slug) + '">Disconnect</button>';
      }
      // The sync half of this contract: pull/push/history were registered with no caller. They are
      // offered on EVERY connector — History reads this account's own sync log and needs no
      // credential, and Sync surfaces the API's refusal ("No active connection for '<slug>'") as a
      // message instead of hiding the feature until a credential exists.
      actions += '<div style="margin-top:4px">' +
        '<button class="btn btn-secondary btn-xs" data-ic="sync" data-slug="' +
        escapeHtmlAttr(a.slug) + '">Sync</button> ' +
        '<button class="btn btn-ghost btn-xs" data-ic="history" data-slug="' +
        escapeHtmlAttr(a.slug) + '">History</button></div>';
    } else {
      actions += '<span style="font-size:.72rem;color:var(--text-muted)">platform-admin connection</span>';
    }

    return [
      '<strong>' + escapeHtml(a.name) + '</strong>' +
        '<div style="font-size:.74rem;color:var(--text-muted);max-width:360px">' + escapeHtml(a.description || '') + '</div>',
      escapeHtml(access),
      statusCell,
      actions
    ];
  });

  el.innerHTML = card('📥 Lead capture apps &rarr; CoreSwift',
    '<p style="color:var(--text-secondary);margin:0">Each of these apps captures leads. Connect it and its captured leads flow <strong>into this account</strong> — ' +
    'CoreSwift is the single home for them, so you work every lead here instead of in six places. ' +
    'Credentials are stored per account (never as a platform-wide default) and the connection is only saved after a live test passes.</p>') +
    dataTable(['App', 'Credentials', 'Status', ''], rows,
      IC.apps.length ? 'No connectors registered.' : 'No native connectors are registered on this platform yet.');

  icBind(el);
}

function icOpenConnect(slug) {
  const a = IC.apps.find(x => x.slug === slug);
  if (!a) return;
  const fields = (a.auth_fields && a.auth_fields.length) ? a.auth_fields : ['api_key'];
  const st = IC.status[slug] || {};
  const sister = IC_SISTERS.find(s => s.slug === slug);

  let body = '<p style="color:var(--text-secondary);margin-bottom:14px">' + escapeHtml(a.description || '') + '</p>';
  if (sister) {
    body += '<p style="color:var(--text-secondary);margin-bottom:14px">Direction in CoreSwift is <strong>inbound</strong>: once live, ' +
      escapeHtml(sister.name) + ' pushes its captured leads into this account.</p>';
  }
  fields.forEach(f => {
    const secret = /key|secret|token|password/i.test(f);
    const def = f === 'base_url' ? ((st.config && st.config.base_url) || IC_BASE_DEFAULT[slug] || '') : '';
    body += '<div class="form-group"><label>' + escapeHtml(IC_FIELD_LABEL[f] || f) + '</label>' +
      '<input type="' + (secret ? 'password' : 'text') + '" id="icF_' + escapeHtmlAttr(f) + '" value="' + escapeHtmlAttr(def) + '" autocomplete="off">' +
      (IC_FIELD_HINT[f] ? '<span class="form-hint">' + escapeHtml(IC_FIELD_HINT[f]) + '</span>' : '') +
      '</div>';
  });
  body += '<p class="form-hint">Connecting runs a live test first — a bad key or URL is reported here and nothing is stored.</p>';

  showModal('Connect ' + escapeHtml(a.name), body,
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-secondary" id="icTestBtn">Test only</button>' +
    '<button class="btn btn-primary" id="icConnectBtn">Test &amp; connect</button>');

  const readCreds = () => {
    const c = {};
    fields.forEach(f => {
      const el = document.getElementById('icF_' + f);
      c[f] = el ? el.value.trim() : '';
    });
    return c;
  };
  const tb = document.getElementById('icTestBtn');
  if (tb) tb.addEventListener('click', () => icTestCreds(slug, readCreds(), tb));
  const cb = document.getElementById('icConnectBtn');
  if (cb) cb.addEventListener('click', () => icConnect(slug, readCreds(), cb));
}

async function icTestCreds(slug, credentials, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await API.post('/native/apps/' + encodeURIComponent(slug) + '/test', { credentials: credentials });
    if (r && r.success) toast((r.app_name || slug) + ': ' + r.message, 'success');
    else toast('Test failed: ' + ((r && r.message) || 'no response'), 'error');
  } catch (e) {
    toast('Test failed: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function icConnect(slug, credentials, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await API.post('/native/apps/' + encodeURIComponent(slug) + '/connect', { credentials: credentials });
    closeModal();

async function icLoadProviders() {
  const wrap = document.getElementById('icProviderWrap');
  if (!wrap) return;
  let providers = [], keys = {};
  try {
    const res = await Promise.all([API.get('/available-providers'), API.get('/provider-keys'),
                                   API.get('/ai/usage').catch(() => null)]);
    providers = (res[0] && res[0].items) || [];
    ((res[1] && res[1].items) || []).forEach(k => { keys[k.provider] = k; });
    IC.aiUsage = res[2] || null;

  IC.providers = providers;
  IC.keys = keys;
  icRenderProviders();
}

function icOpenProvider(pkey) {
  const p = IC.providers.find(x => x.key === pkey);
  if (!p) return;
  const existing = IC.keys[pkey];
  let body = '<p style="color:var(--text-secondary);margin-bottom:14px">' + escapeHtml(p.description || '') + '</p>' +
    '<div class="form-group"><label>API Key</label>' +
    '<input type="password" id="icPk_api_key" placeholder="paste your ' + escapeHtmlAttr(p.name) + ' key" autocomplete="off"></div>';
  if (p.requires_base_url) {
    body += '<div class="form-group"><label>Base URL</label>' +
      '<input type="text" id="icPk_base_url" value="' + escapeHtmlAttr((existing && existing.base_url) || '') + '" autocomplete="off">' +
      '<span class="form-hint">' + escapeHtml(IC_FIELD_HINT.base_url) + '</span></div>';
  }
  // The catalogue can require companion fields beside the secret (`requires_metadata`).
  // google_calendar asks for `client_id`; before this, the slot existed in the catalogue but no
  // shipped surface could ever fill it — the same "a customer cannot configure this" defect as an
  // env-var-only key.
  (p.requires_metadata || []).forEach(f => {
    const cur = (existing && existing.metadata && existing.metadata[f]) || '';
    body += '<div class="form-group"><label>' + escapeHtml(f) + '</label>' +
      '<input type="text" id="icPkMeta_' + escapeHtmlAttr(f) + '" value="' + escapeHtmlAttr(cur) + '" autocomplete="off">' +
      '<span class="form-hint">' + escapeHtml(IC_FIELD_HINT[f] || ('Required by ' + p.name + ' alongside the key.')) + '</span></div>';
  });
  body += '<p class="form-hint">Stored on this account only. ' +
    (existing ? 'Saving replaces the current key immediately. ' : '') +
    'The full key is never shown again after saving.</p>';

  showModal((existing ? 'Replace ' : 'Add ') + escapeHtml(p.name) + ' key', body,
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="icPkSave">Save key</button>');

  const btn = document.getElementById('icPkSave');

async function icSaveProvider(pkey) {
  const keyEl = document.getElementById('icPk_api_key');
  const baseEl = document.getElementById('icPk_base_url');
  const apiKey = keyEl ? keyEl.value.trim() : '';
  if (!apiKey) { toast('Enter the API key', 'error'); return; }
  const btn = document.getElementById('icPkSave');
  if (btn) btn.disabled = true;
  const payload = { provider: pkey, api_key: apiKey, is_active: true };
  if (baseEl && baseEl.value.trim()) payload.base_url = baseEl.value.trim();
  const prov = IC.providers.find(x => x.key === pkey) || {};
  const required = (prov.requires_metadata || []);
  const meta = {};
  required.forEach(f => {
    const el = document.getElementById('icPkMeta_' + f);
    if (el && el.value.trim()) meta[f] = el.value.trim();
  });
  if (Object.keys(meta).length) payload.metadata = meta;
  const missing = required.filter(f => !meta[f]);
  try {
    await API.post('/provider-keys', payload);
    closeModal();
    toast(missing.length
      ? 'Key saved, but ' + missing.join(', ') + ' is still empty — the provider will refuse until it is filled'
      : 'Key saved for this account', missing.length ? 'info' : 'success');
    await icLoadProviders();
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
    if (btn) btn.disabled = false;
  }
}

async function icToggleProvider(pkey, on) {
  try {
    await API.patch('/provider-keys/' + encodeURIComponent(pkey), { is_active: !!on });
    toast(pkey + (on ? ' enabled' : ' disabled') + ' for this account', 'success');

async function icDeleteProvider(pkey) {

}

// The example questions live in accordions (David, 2026-11-21): three open groups of six cards made the
// page very long, and a person scanning for "what can I ask" wants the headings first, not the wall.
// Inside each group the questions keep the two-column layout and their own Copy buttons.
function mcpAccordion(title, hint, items) {
  function card(q) {
    return '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;' +
      'padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px">' +
      '<span style="font-size:13px">' + escapeHtml(q) + '</span>' +
      '<button class="btn btn-ghost btn-xs" onclick="tlCopyUrl(' + JSON.stringify(q).replace(/"/g, '&quot;') + ', this)">Copy</button></div>';
  }
  var left = items.filter(function (_, i) { return i % 2 === 0; }).map(card).join('');
  var right = items.filter(function (_, i) { return i % 2 === 1; }).map(card).join('');
  return '<details style="border-bottom:1px solid var(--border);padding:10px 0">' +
    '<summary style="cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<span style="font-weight:600">' + title + '</span>' +
      '<span style="color:var(--text-muted);font-size:12px">' + items.length + ' questions</span>' +
      '<span style="flex:1"></span>' +
      '<span style="color:var(--text-secondary);font-size:12px">' + hint + '</span>' +
    '</summary>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px">' +
      '<div>' + left + '</div><div>' + right + '</div>' +
    '</div></details>';
}

// The check asks the server whether it is there, WITHOUT the key. A 401 means "reachable, and it
// wants a key", which is exactly the state a customer is in before they paste one. Saying "connected"
// here would be a lie, so the wording reports reachability only.
function mcpCheckServer(btn) {
  var out = document.getElementById('mcpCheckOut');
  var label = btn ? btn.innerText : '';
  if (btn) { btn.disabled = true; btn.innerText = 'Checking…'; }
  fetch('https://mcp.swiftsoftware.net/mcp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/list', params: {} })
  }).then(function (r) {
    if (out) out.textContent = (r.status === 401)
      ? 'The server answered and asked for a key — that is the right state. Paste your key into the client.'
      : 'The server answered with status ' + r.status + '. If your client reports nothing, regenerate the key.';
  }).catch(function () {
    if (out) out.textContent = 'This browser could not reach the server (it may be blocked on your network). The service itself is up — check from the client.';
  }).then(function () {
    if (btn) { btn.disabled = false; btn.innerText = label || 'Check the server answers'; }
  });
}

async function mcpLoadKey() {
  // Paint the client steps first: they are the top of the page, and a blank step list reads as a
  // broken screen while the key request is still in flight.
  try { mcpPaintSteps(); } catch (e) {}
  const el = document.getElementById('mcpKeyWrap');
  // The page names the account the key belongs to ("Ready to connect — your account: …"), so the
  // person can see WHICH account their AI client will be reading before they paste anything.
  const who = document.getElementById('mcpAccountEmail');
  if (who && STATE.user && STATE.user.email) who.textContent = STATE.user.email;
  if (!el) return;
  try {
    const d = await API.get('/personal-api-keys');
    const keys = (d && d.keys) || [];
    const active = keys.filter(k => k.is_active);
    if (!active.length) {
      el.innerHTML = '<p style="margin:0">No API key yet — an MCP client needs one to read this account. ' +
        '<button class="btn btn-primary btn-sm" onclick="icCreateKey()">+ Create API key</button></p>';
      return;
    }
    // The MCP page shows the SAME list the Integration Center does, role included: an account can
    // hold several active keys and they are not interchangeable — a read-only key answers questions
    // and refuses every write, a workspace key can change the account. Before this the page showed
    // only the newest prefix, so a customer could not tell which key their AI client was using.
    const rows = active.map(key => [
      '<strong>' + escapeHtml(key.name || 'default') + '</strong>',
      '<code>' + escapeHtml(key.prefix || 'csk_') + '…</code>',
      icKeyRoleBadge(key.role),
      (key.recoverable
        ? '<button class="btn btn-secondary btn-sm" onclick="icViewKey(\'' + escapeHtmlAttr(key.id) + '\')">View &amp; copy</button>'
        : '<button class="btn btn-secondary btn-sm" onclick="icRotateKey(\'' + escapeHtmlAttr(key.id) + '\')">Regenerate to view</button>')
    ]);
    el.innerHTML =
      dataTable(['Name', 'Prefix', 'Role', ''], rows, 'No active API key.') +
      '<p style="color:var(--text-muted);font-size:12px;margin:8px 0 0">This is the token an MCP client uses. Press <b>View &amp; copy</b>, re-enter your password, and the full key appears. ' +
      'For an assistant that should only answer questions, use a <b>read-only</b> key: it can read this account and every make-or-change call through it is refused. ' +
      'Create, regenerate and revoke these keys in the <b>Integration Center</b>.</p>';
  } catch (e) {
    el.innerHTML = '<p style="margin:0;color:var(--text-muted)">Could not load your API key. ' +
      '<button class="btn btn-secondary btn-sm" onclick="switchTab(\'integrations\')">Open Integration Center</button></p>';
  }
}

// ONE vocabulary for a key's role, shared by the Integration Center list, the once-shown card and
// the MCP page. The API answers `workspace` | `read_only` (src/personal_api_keys.rs::ROLE_*); the
// customer-facing words are the same ones the create control offers.
function icKeyRoleIsReadOnly(role) { return role === 'read_only'; }
function icKeyRoleBadge(role) {
  return icKeyRoleIsReadOnly(role)
    ? '<span class="badge badge-warning" style="white-space:nowrap" title="Reads only — cannot create or change anything">read-only</span>'
    : '<span class="badge badge-muted" style="white-space:nowrap" title="Reads and writes inside this account">read + write</span>';
}
function icKeyRoleDetail(role) {
  return icKeyRoleIsReadOnly(role)
    ? 'it can read this account and cannot create or change anything; every make-or-change call is refused and writes nothing.'
    : 'it can read and change this account.';
}

function icRenderKeys() {
  const el = document.getElementById('icKeysWrap');
  if (!el) return;
  const o = IC.overview || {};
  if (o.error) { el.innerHTML = icErr('Could not load API keys', o.error); return; }
  const items = (o.personal_keys && o.personal_keys.items) || [];
  const active = items.filter(k => k.is_active).length;
  const rows = items.map(k => [
    '<strong>' + escapeHtml(k.name || 'default') + '</strong>',
    '<code>' + escapeHtml(k.prefix || '') + '…</code>',
    icKeyRoleBadge(k.role),
    k.is_active ? '<span class="badge badge-success">active</span>' : '<span class="badge badge-muted">revoked</span>',
    escapeHtml(icFmtDate(k.last_used_at)),
    escapeHtml(icFmtDate(k.created_at)),
    (k.is_active
      ? (k.recoverable
          ? '<button class="btn btn-ghost btn-xs" onclick="icViewKey(\'' + escapeHtmlAttr(k.id) + '\')">View</button> '
          : '<button class="btn btn-ghost btn-xs" title="Created before keys were stored recoverably — regenerate to get a key you can view" onclick="icRotateKey(\'' + escapeHtmlAttr(k.id) + '\')">Regenerate to view</button> ')
      : '') +
    '<button class="btn btn-ghost btn-xs" onclick="icRotateKey(\'' + escapeHtmlAttr(k.id) + '\')">Regenerate</button> ' +
    '<button class="btn btn-ghost btn-xs" onclick="icRevokeKey(\'' + escapeHtmlAttr(k.id) + '\')">Revoke</button>'
  ]);
  const body = '<p style="color:var(--text-secondary);margin:0 0 10px">A key is this account&#39;s identity: a capture app uses one to deliver leads in, and an AI/MCP client uses one to read this account. ' +
    'A <strong>read + write</strong> key can read and change this account; a <strong>read-only</strong> key can only read — every make-or-change call through it is refused with a sentence and writes nothing. ' +
    'The key itself stays retrievable: press <strong>View</strong> and re-enter your password to see it and copy it again at any time. <strong>' + active + '</strong> active of ' + items.length + ' total.</p>' +
    dataTable(['Name', 'Prefix', 'Role', 'Status', 'Last used', 'Created', ''], rows,
      'No keys yet — create one and paste it into a capture app\'s CoreSwift integration, or into an AI client.');
  const footer = '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">' +
    '<div class="form-group" style="margin:0"><label for="icNewKeyName">Name (optional)</label>' +
      '<input id="icNewKeyName" placeholder="e.g. Claude desktop" style="width:170px"></div>' +
    '<div class="form-group" style="margin:0"><label for="icNewKeyRole">Role</label>' +
      '<select id="icNewKeyRole" style="width:270px;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary)">' +
        '<option value="workspace">Read and write (workspace)</option>' +
        '<option value="read_only">Read-only — cannot create or change anything</option>' +
      '</select></div>' +
    '<button class="btn btn-primary btn-sm" onclick="icCreateKey()">+ Create API key</button>' +
    '</div>';
  el.innerHTML = card('🔑 API keys (csk_…)', body, footer);
}

async function icCreateKey() {
  // The role picker lives in the Integration Center card; the MCP page also calls this when the
  // account has no key yet, and there the default (a read-write workspace key) is the right answer.
  const roleEl = document.getElementById('icNewKeyRole');
  const nameEl = document.getElementById('icNewKeyName');
  const role = (roleEl && roleEl.value) || 'workspace';
  if (role !== 'workspace' && role !== 'read_only') { toast('Choose a key role', 'error'); return; }
  const fallback = icKeyRoleIsReadOnly(role) ? 'Read-only key' : 'Workspace key';
  const name = ((nameEl && nameEl.value) || '').trim() || fallback;
  try {
    const d = await API.post('/personal-api-keys', { name: name, role: role });
    await icShowKeyOnce(d, 'Key created');
  } catch (e) {
    toast('Could not create key: ' + e.message, 'error');
  }
}

async function icRotateKey(id) {
  // The API keeps the key's ROLE across a rotation (src/personal_api_keys.rs::rotate_key mints with
  // the role the row already carries), so say it here instead of leaving the customer to guess
  // whether regenerating a read-only key hands back a credential that can suddenly write.
  if (!confirm('Regenerate this key? It keeps its role, and the current key stops working immediately, so anything you have already wired up with it stops until you paste the new one in. You can copy the new key from this screen.')) return;
  try {
    const d = await API.post('/personal-api-keys/' + encodeURIComponent(id) + '/rotate', {});
    await icShowKeyOnce(d, 'Key regenerated');
  } catch (e) {
    toast('Could not rotate: ' + e.message, 'error');
  }
}

async function icRevokeKey(id) {
  if (!confirm('Revoke this key? Any app still using it stops delivering leads.')) return;
  try {
    await API.del('/personal-api-keys/' + encodeURIComponent(id));
    toast('Key revoked', 'success');
    await icLoadOverview();
  } catch (e) {
    toast('Could not revoke: ' + e.message, 'error');
  }
}

async function icShowKeyOnce(d, title) {
  const role = d && d.role;
  icShowKeyCard(title, d && d.key, d && d.prefix,
    (icKeyRoleIsReadOnly(role)
      ? 'Paste this into the app or AI client that should only READ this account. It is a read-only key, so every make-or-change call through it is refused and writes nothing. '
      : 'Paste this into the capture app or AI client. It is a read-and-write key: it can read and change this account. ') +
    'You can come back and view or copy it again any time — press View and re-enter your password.',
    role);
  await icLoadOverview();
}

// One key modal shared by creation, regeneration and View: the value is a readonly input (selectable
// if the clipboard API is unavailable) plus a one-click Copy button, and the key's ROLE is named so
// the person can see what they are holding.
function icShowKeyCard(title, key, prefix, blurb, role) {
  showModal(escapeHtml(title),
    '<p style="margin:0 0 8px">' + escapeHtml(blurb) + '</p>' +
    '<p style="margin:0 0 8px" id="icNewKeyRoleLine">Role: <strong>' + (icKeyRoleIsReadOnly(role) ? 'Read-only' : 'Read and write (workspace)') + '</strong> — ' +
      escapeHtml(icKeyRoleDetail(role)) + '</p>' +
    '<div class="form-group"><label>Key</label><input id="icNewKey" readonly value="' + escapeHtmlAttr(key || '') + '"></div>' +
    '<div style="font-size:.75rem;color:var(--text-muted)">Prefix ' + escapeHtml(prefix || '') + '</div>',
    '<button class="btn btn-secondary" onclick="closeModal()">Close</button>' +
    '<button class="btn btn-primary" onclick="icCopyShownKey()">Copy key</button>');

  if (inp) { inp.focus(); inp.select(); }

function icCopyShownKey() {
  const inp = document.getElementById('icNewKey');
  if (!inp || !inp.value) return;
  tlCopyUrl(inp.value);
}

// View = re-authenticate, then show the SAME stored key. Repeatable: nothing is consumed.
async function icViewKey(id) {
  showModal('View your API key',
    '<p style="margin:0 0 8px">Confirm it is you before the key is shown. Enter your account password.</p>' +
    '<div class="form-group"><label>Password</label><input type="password" id="icViewPassword" autocomplete="current-password"></div>',
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="icDoViewKey(\'' + escapeHtmlAttr(id) + '\')">Show key</button>');

async function icDoViewKey(id) {
  const pw = (document.getElementById('icViewPassword') || {}).value || '';
  if (!pw) { toast('Enter your password', 'error'); return; }
  try {
    const d = await API.post('/personal-api-keys/' + encodeURIComponent(id) + '/reveal', { password: pw });
    icShowKeyCard('Your API key', d && d.key, d && d.prefix, 'This is the same key as before. Every view is recorded.', d && d.role);
  } catch (e) {
    toast('Could not show key: ' + e.message, 'error');
  }
}
