async function bkLoadConfirmation() {
  const box = document.getElementById('bkConfBody');
  if (!box) return;
  try {
    const r = await API.get('/booking/calendars/' + encodeURIComponent(BK.current) + '/confirmation-email');
    const own = r.override || {};
    box.innerHTML =
      '<p class="muted" style="margin-top:-6px">' +
        (r.sends_to_customer
          ? 'Sent automatically when a booking is confirmed. This is the message a customer actually receives.'
          : 'This calendar is set NOT to email the customer. The wording below is what it would send if you switch it on.') +
        (r.has_own_wording ? ' <strong>Your own wording is in use.</strong>' : ' <strong>The built-in wording is in use.</strong>') +
      '</p>' +
      '<h4 style="margin:14px 0 6px">Subject</h4>' +
      '<input id="bkConfSubject" value="' + escapeHtml(own.subject != null ? own.subject : r.effective.subject) + '">' +
      '<h4 style="margin:14px 0 6px">Body</h4>' +
      '<textarea id="bkConfBodyText" rows="16" style="width:100%;font-family:ui-monospace,monospace;font-size:12.5px">' +
        escapeHtml(own.body != null ? own.body : r.effective.body) + '</textarea>' +
      '<p class="muted" style="font-size:12px">Leave the body empty and save to go back to the built-in wording. ' +
        'You can use: ' + (r.merge_fields || []).map(function (m) { return '<code>' + escapeHtml(m) + '</code>'; }).join(' ') + '</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
        '<button class="btn btn-primary btn-sm" onclick="bkSaveConfirmation()">Save my wording</button>' +
        '<button class="btn btn-secondary btn-sm" onclick="bkShowConfirmationNow()">Show what it sends right now</button>' +
        (r.has_own_wording ? '<button class="btn btn-secondary btn-sm" onclick="bkResetConfirmation()">Back to the built-in wording</button>' : '') +
      '</div>' +
      '<div id="bkConfFlash" class="bk-flash"></div>' +
      '<div id="bkConfPreview" style="margin-top:12px"></div>';
  } catch (e) {
    box.innerHTML = '<p class="muted">Could not read the confirmation email: ' + escapeHtml(e.message) + '</p>';
  }
}

async function bkSaveConfirmation() {
  const flash = document.getElementById('bkConfFlash');
  const say = function (m, ok) { if (flash) { flash.textContent = m; flash.className = 'bk-flash ' + (ok === false ? 'bad' : 'good'); } };
  try {
    const subject = (document.getElementById('bkConfSubject') || {}).value || '';
    const body = (document.getElementById('bkConfBodyText') || {}).value || '';
    const r = await API.put('/booking/calendars/' + encodeURIComponent(BK.current) + '/confirmation-email',
      { subject: subject, body: body });
    await bkLoadConfirmation();
    say(r.restored_default ? 'Back to the built-in wording.' : 'Saved — new bookings use this wording.', true);
  } catch (e) { say(e.message, false); }
}

async function bkResetConfirmation() {
  try {
    await API.put('/booking/calendars/' + encodeURIComponent(BK.current) + '/confirmation-email',
      { subject: '', body: '' });
    await bkLoadConfirmation();
  } catch (e) { bkFlash(e.message, false); }
}

async function bkShowConfirmationNow() {
  const box = document.getElementById('bkConfPreview');
  if (!box) return;
  box.innerHTML = '<p class="muted">Rendering&hellip;</p>';
  try {
    const r = await API.get('/booking/calendars/' + encodeURIComponent(BK.current) + '/confirmation-email');
    box.innerHTML = '<h4>As the mailer produces it</h4>' +
      '<p><strong>Subject:</strong> ' + escapeHtml(r.effective.subject) + '</p>' +
      '<pre style="white-space:pre-wrap;font-size:12.5px;background:rgba(128,128,128,.08);padding:12px;border-radius:8px">' +
      escapeHtml(r.effective.body) + '</pre>';
  } catch (e) { box.innerHTML = '<p class="muted">' + escapeHtml(e.message) + '</p>'; }
}

function bkDetailPanel() {
  const d = BK.detail || {};
  const cal = d.calendar || d;
  const res = d.resources || [];
  const bundles = d.bundles || [];
  const pub = '/api/public/booking/c/' + cal.slug;

  let html = '<div id="bkReady"></div>' +
    '<div class="card" style="margin-bottom:18px">' +
    '<button class="btn btn-secondary btn-sm" onclick="bkBack()">← All calendars</button>' +
    '<h3 style="margin:12px 0 4px">' + escapeHtml(cal.name) + '</h3>' +
    '<p class="muted" style="margin:0">' + bkTypeWords(cal.kind) + ' · ' + escapeHtml(cal.timezone || '') + ' · holds ' + (cal.hold_minutes || 30) + ' min</p>' +
    '<p style="margin:10px 0 0"><strong>Public link:</strong> <a href="' + pub + '" target="_blank" rel="noopener">' + bkFullLink(cal.slug) + '</a></p>' +
    // THIS CALENDAR'S OWN NAME AND ADDRESS (ZaarHub, 2026-11-23). "Save name" on the Calendar screen
    // changes the ACCOUNT's address; a calendar's web address could only be set when it was created,
    // which is why renaming one looked impossible. Both are editable here, together.
    '<div class="bk-form" style="margin-top:10px">' +
      '<label>Calendar name<input id="bkCalName" value="' + escapeHtml(cal.name) + '"></label>' +
      '<label>Web address<input id="bkCalSlug" value="' + escapeHtml(cal.slug) + '">' +
        '<span class="muted" style="font-weight:400">Letters, numbers and dashes. Changing it stops the OLD address working — links already published will 404.</span></label>' +
    '</div>' +
    '<button class="btn btn-secondary btn-sm" onclick="bkSaveCalAddress()">Save name and address</button>' +
    '<span class="bk-flash" id="bkCalAddrFlash"></span>' +
    (bkSharedLink(cal.slug) !== bkFullLink(cal.slug)
      ? '<p class="muted" style="margin:4px 0 0;font-size:12px">Also: <a href="' + bkSharedLink(cal.slug) + '" target="_blank" rel="noopener">' + bkSharedLink(cal.slug) + '</a> — the same calendar, and the link to publish if this name might be used by another workspace.</p>'
      : '') +
    (bkWsLink(cal.slug)
      ? '<p class="muted" style="margin:4px 0 0;font-size:12px">On your own workspace address: <code>' + bkWsLink(cal.slug) + '</code></p>'
      : '') +
    '<span class="bk-flash" id="bkFlash"></span>' +
    bkEmbedPanel(cal.slug) + '</div>';

  html += bkThemePanel(cal);
  html += bkRulesPanel(cal);
  html += bkPayPanel(cal);
  setTimeout(bkLoadPayWire, 0);
  html += bkResourcePanel(res, cal.kind);
  html += bkFormPanel();
  html += bkManualPanel(res);
  if (cal.kind === 'appointment') html += bkHoursPanel();
  if (cal.kind !== 'appointment') html += bkSlotsPanel(res);
  html += bkBundlePanel(bundles);
  html += bkNotifyPanel();
  // The message a customer receives, beside the settings that decide who hears about a booking.
  html += bkConfirmationPanel();
  html += bkOrdersPanel();
  return html;
}


function bkFullLink(slug) {
  return 'https://booking.coreswiftcrm.com/book/' + slug;
}

/* The addresses this calendar answers on. The SHARED one carries the workspace in the path, because
 * a calendar's name is unique per workspace and two owners may hold the same name — so that link is
 * the safe one to publish, and it always resolves. */
function bkWsLink(slug) {
  var ws = (BK_WS || '');
  return ws ? 'https://' + ws + '.coreswiftcrm.com/b/' + slug : '';
}
function bkSharedLink(slug) {
  var ws = (BK_WS || '');
  return ws
    ? 'https://booking.coreswiftcrm.com/b/' + ws + '/' + slug
    : 'https://booking.coreswiftcrm.com/book/' + slug;
}
window.BK_WS = '';

/* Where the calendar can be put on the customer's own website. Two snippets, both copy-paste, both
 * driven by one script served from the booking address so nothing can go stale. */
function bkEmbedPanel(slug) {
  var inline = '<div id="my-bookings"></div>\n<script src="https://booking.coreswiftcrm.com/embed.js"\n        data-calendar="' + slug + '"\n        data-mode="inline"\n        data-target="my-bookings"></' + 'script>';
  var popup = '<script src="https://booking.coreswiftcrm.com/embed.js"\n        data-calendar="' + slug + '"\n        data-mode="popup"\n        data-label="Book a call"></' + 'script>';
  function box(title, hint, code, id) {
    return '<div style="margin-top:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      '<strong style="font-size:13px">' + title + '</strong>' +
      '<button class="btn btn-secondary btn-sm" onclick="bkCopy(\'' + id + '\')">Copy</button></div>' +
      '<p class="muted" style="margin:2px 0 6px;font-size:12px">' + hint + '</p>' +
      '<textarea id="' + id + '" readonly rows="4" style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;' +
      'border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:#f8fafc;color:#0f172a">' + escapeHtml(code) + '</textarea></div>';
  }
  return '<div style="margin-top:16px;border-top:1px dashed #e2e8f0;padding-top:12px">' +
    '<strong>Put this calendar on a website</strong>' +
    '<p class="muted" style="margin:4px 0 0;font-size:12px">Paste either snippet on any page. The calendar keeps its own address, so the customer\'s site never handles a booking or a card.</p>' +
    box('Inline — sits in the page', 'The frame resizes itself as the customer filters or picks.', inline, 'bkCodeInline') +
    box('Popup — floats over the page', 'A button in the corner opens the calendar in a modal, so the visitor never leaves what they were reading.', popup, 'bkCodePopup') +
    '</div>';
}

function bkCopy(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.select();
  try { document.execCommand('copy'); bkFlash('Snippet copied.'); }
  catch (e) { bkFlash('Select the text and copy it.', false); }
}

/* The calendar's look: what the owner's customers see. Stored in settings.theme, validated on the
 * server (colours must be hex, the font must be one of the listed stacks), and applied by the public
 * page as CSS variables. */
function bkThemePanel(cal) {
  var t = (cal.settings && cal.settings.theme) || {};
  var fonts = [['system','System sans'],['inter','Inter'],['rounded','Rounded'],['geometric','Geometric'],
               ['humanist','Humanist'],['serif','Serif'],['mono','Monospace']];
  return '<div class="card" style="margin-bottom:18px">' +
    '<h3 style="margin-top:0">Look and feel</h3>' +
    '<p class="muted" style="margin-top:-6px">What your customers see on the booking page.</p>' +
    '<div class="bk-form">' +
      '<label>Brand colour<input id="bkThBrand" type="color" value="' + escapeHtml(t.brand || '#6366f1') + '"></label>' +
      '<label>Text colour<input id="bkThInk" type="color" value="' + escapeHtml(t.ink || '#0f172a') + '"></label>' +
      '<label>Page background<input id="bkThBg" type="color" value="' + escapeHtml(t.bg || '#f8fafc') + '"></label>' +
      '<label>Font<select id="bkThFont">' + fonts.map(function (f) {
        return '<option value="' + f[0] + '"' + ((t.font || 'system') === f[0] ? ' selected' : '') + '>' + f[1] + '</option>';
      }).join('') + '</select></label>' +
      '<label>Logo address (https)<input id="bkThLogo" placeholder="https://…/logo.png" value="' + escapeHtml(t.logo_url || '') + '"></label>' +
      '<label>Checkout link for paid items<input id="bkCheckout" placeholder="https://…/pay" value="' + escapeHtml((cal.settings && cal.settings.checkout_url) || '') + '"><span class="muted" style="font-weight:400">When a booking costs money, the buyer is sent here with their reference. Leave empty and the thank-you page says a payment link is coming.</span></label>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="bkSaveTheme()">Save look</button>' +
    '<a class="btn btn-secondary" style="margin-left:8px" href="' + bkFullLink(cal.slug) + '" target="_blank" rel="noopener">Preview</a>' +
    '</div>';
}

async function bkSaveTheme() {
  var theme = {
    brand: document.getElementById('bkThBrand').value,
    ink: document.getElementById('bkThInk').value,
    bg: document.getElementById('bkThBg').value,
    font: document.getElementById('bkThFont').value
  };
  var logo = (document.getElementById('bkThLogo').value || '').trim();
  if (logo) theme.logo_url = logo;
  try {
    var checkout = (document.getElementById('bkCheckout').value || '').trim();
    await bkCall('PATCH', '/calendars/' + BK.current, {
      settings: { theme: theme, checkout_url: checkout }
    });
    await bkOpenDetail(BK.current, true);
    bkRender();
    bkFlash('Look saved — your booking page uses it now.');
  } catch (e) { bkFlash(e.message, false); }
}

/* Who hears about a booking, when to remind them, and what tag the contact gets. Three lists saved
 * together (PUT), because they are one decision and a partial save is how half-configured calendars
 * happen. */
function bkNotifyPanel() { return '<div id="bkNotifyCard"></div>'; }

async function bkLoadNotify() {
  var card = document.getElementById('bkNotifyCard');
  if (!card || !BK.current) return;
  try {
    var n = await bkCall('GET', '/calendars/' + BK.current + '/notifications');
    BK.notify = n || { notify_emails: [], reminders: [], tag_rules: [], list_rules: [] };
  // The list picker needs the account's own lists. Loaded once, silently: a failure here must not stop
  // the rest of the panel rendering, it leaves the picker empty with its own explanation.
  if (!BK.lists) {
    try {
      var lr = await API.get('/lists');
      BK.lists = (lr && (lr.lists || lr)) || [];
    } catch (e) { BK.lists = []; }
  }
    bkRenderNotify();
  } catch (e) {
    card.innerHTML = '<div class="card"><p class="muted">Could not load notification settings — ' + escapeHtml(e.message) + '</p></div>';
  }
}

function bkRenderNotify() {
  var card = document.getElementById('bkNotifyCard');
  if (!card) return;
  var n = BK.notify || { notify_emails: [], reminders: [], tag_rules: [], list_rules: [] };
  // A SAVED RULE IS A ROW YOU CAN SEE, CORRECT AND REMOVE (ZaarHub, 2026-11-23). A rule that saved
  // but could not be read back, changed or deleted is a rule nobody can trust: the counter said
  // "1 rule" while the screen showed only a blank form, so the only way to check it was by looking in
  // the database.
  function rowList(items, render, removeFn, editFn) {
    return items.length
      ? '<div style="margin:6px 0 10px">' + items.map(function (it, i) {
          return '<div class="line" style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px">' +
            '<span style="font-size:13px">' + render(it) + '</span>' +
            '<span style="white-space:nowrap">' +
            (editFn ? '<button class="btn btn-secondary btn-sm" onclick="' + editFn + '(' + i + ')">Edit</button> ' : '') +
            '<button class="btn btn-secondary btn-sm" onclick="' + removeFn + '(' + i + ')">Remove</button></span></div>';
        }).join('') + '</div>'
      : '<p class="muted" style="margin:4px 0 10px;font-size:12.5px">None yet.</p>';
  }
  card.innerHTML = '<div class="card" style="margin-bottom:18px">' +
    '<h3 style="margin-top:0">Who hears about a booking</h3>' +
    '<p class="muted" style="margin-top:-6px">The customer always gets a confirmation. Add the people who should know too, and choose when to remind.</p>' +

    '<strong style="font-size:13px">Team members</strong>' +
    rowList(n.notify_emails, function (e) { return escapeHtml(e.email) + (e.label ? ' <span class="muted">· ' + escapeHtml(e.label) + '</span>' : ''); }, 'bkRemoveEmail') +
    '<div class="bk-form"><label>Add an address<input id="bkNewEmail" placeholder="team@yourcompany.com"></label>' +
    '<label>Label (optional)<input id="bkNewEmailLabel" placeholder="Bookings"></label></div>' +
    '<button class="btn btn-secondary btn-sm" onclick="bkAddEmail()">Add address</button>' +

    '<hr style="border:none;border-top:1px dashed #e2e8f0;margin:16px 0">' +
    '<strong style="font-size:13px">Reminders</strong>' +
    rowList(n.reminders, function (r) {
      return bkOffsetWords(r.offset_minutes) + ' — to the ' + escapeHtml(r.audience);
    }, 'bkRemoveReminder') +
    '<div class="bk-form">' +
      '<label>When<select id="bkNewOffset">' +
        '<option value="60">1 hour before</option><option value="180">3 hours before</option>' +
        '<option value="1440" selected>1 day before</option><option value="2880">2 days before</option>' +
        '<option value="10080">1 week before</option></select></label>' +
      '<label>Who<select id="bkNewAudience"><option value="customer">The customer</option><option value="team">The team</option></select></label>' +
    '</div>' +
    '<button class="btn btn-secondary btn-sm" onclick="bkAddReminder()">Add reminder</button>' +

    '<hr style="border:none;border-top:1px dashed #e2e8f0;margin:16px 0">' +
    '<strong style="font-size:13px">Tags on the contact</strong>' +
    rowList(n.tag_rules, function (t) {
      return 'Tag <b>' + escapeHtml(t.tag_name) + '</b> <span class="muted">· on ' + escapeHtml(t.stage) + ' · ' + escapeHtml(t.mode) + '</span>';
    }, 'bkRemoveTagRule', 'bkEditTagRule') +
    '<div class="bk-form">' +
      '<label>Tag name<input id="bkNewTag" placeholder="Consultation Booked"></label>' +
      '<label>When<select id="bkNewStage"><option value="confirm">On confirm</option><option value="cancel">On cancel</option></select></label>' +
      '<label>Do<select id="bkNewMode"><option value="add">Add it</option><option value="remove">Remove it</option></select></label>' +
    '</div>' +
    '<button class="btn btn-secondary btn-sm" onclick="bkAddTagRule()">Add tag rule</button>' +
    '<div class="muted" id="bkRuleNoteTag" style="font-size:12.5px;margin-top:6px"></div>' +
    '<p class="muted" style="font-size:12px;margin:10px 0 0">Tags are matched ignoring case, so “Webinar” and “webinar” stay one tag.</p>' +
    '<hr style="border:none;border-top:1px dashed #e2e8f0;margin:16px 0">' +
    '<strong style="font-size:13px">Lists on the contact</strong>' +
    '<p class="muted" style="font-size:12px;margin:2px 0 8px">A booking can put the person in a list as well as tag them — either one can be what an automation watches.</p>' +
    rowList(n.list_rules, function (l) {
      return 'List <b>' + escapeHtml(l.list_name || l.list_id) + '</b> <span class="muted">· on ' + escapeHtml(l.stage) + ' · ' +
        (l.mode === 'remove' ? 'take out' : 'add') + '</span>';
    }, 'bkRemoveListRule', 'bkEditListRule') +
    '<div class="bk-form">' +
    // NO SILENT FIRST OPTION (the bug that made a Palm Bay calendar appear to save an Apopka list):
    // the dropdown starts empty, so submitting without choosing cannot store whichever list happens to
    // sort first. The workspace's own city is suggested first to make the right choice the easy one.
    '<label>List<select id="bkNewList">' +
      '<option value="">Choose a list…</option>' +
      (BK.lists || []).slice().sort(function (a, b) {
        var cal = ((BK.detail && BK.detail.calendar && BK.detail.calendar.name) || '').toLowerCase();
        var hit = function (l) {
          var first = (l.name || '').split(' - ')[0].toLowerCase();
          return cal.indexOf(first) >= 0 ? 0 : 1;
        };
        return hit(a) - hit(b) || (a.name || '').localeCompare(b.name || '');
      }).map(function (l) {
        return '<option value="' + escapeHtml(l.id) + '">' + escapeHtml(l.name) + '</option>';
      }).join('') + '</select></label>' +
    '<label>When<select id="bkNewListStage"><option value="confirm">On confirm</option><option value="cancel">On cancel</option></select></label>' +
    '<label>Do<select id="bkNewListMode"><option value="add">Add to list</option><option value="remove">Take out of list</option></select></label>' +
    '</div>' +
    '<button class="btn btn-secondary btn-sm" onclick="bkAddListRule()">Add list rule</button>' +
    '<div class="muted" id="bkRuleNoteList" style="font-size:12.5px;margin-top:6px"></div>' +
    ((BK.lists && BK.lists.length) ? '' :
      '<p class="muted" style="font-size:12px;margin:10px 0 0">No lists yet — create one under Contacts → Lists and it appears here.</p>') +
    '</div>';
}

function bkOffsetWords(mins) {
  if (mins % 10080 === 0) return (mins / 10080) + (mins === 10080 ? ' week' : ' weeks');
  if (mins % 1440 === 0) return (mins / 1440) + (mins === 1440 ? ' day' : ' days');
  if (mins % 60 === 0) return (mins / 60) + (mins === 60 ? ' hour' : ' hours');
  return mins + ' minutes';
}

function bkAddEmail() {
  var v = (document.getElementById('bkNewEmail').value || '').trim();
  if (!v) return;
  BK.notify.notify_emails.push({ email: v, label: (document.getElementById('bkNewEmailLabel').value || '').trim() });
  bkSaveNotify();
}
function bkRemoveEmail(i) { BK.notify.notify_emails.splice(i, 1); bkSaveNotify(); }
function bkAddReminder() {
  BK.notify.reminders.push({
    offset_minutes: parseInt(document.getElementById('bkNewOffset').value, 10),
    audience: document.getElementById('bkNewAudience').value
  });
  bkSaveNotify();
}
function bkRemoveReminder(i) { BK.notify.reminders.splice(i, 1); bkSaveNotify(); }
function bkAddTagRule() {
  var name = (document.getElementById('bkNewTag').value || '').trim();
  if (!name) { bkFlash('Give the tag a name.', false); return; }
  var tagRule = {
    tag_name: name,
    stage: document.getElementById('bkNewStage').value,
    mode: document.getElementById('bkNewMode').value
  };
  BK.notify.tag_rules = BK.notify.tag_rules || [];
  if (BK.editingTag != null && BK.notify.tag_rules[BK.editingTag]) {
    BK.notify.tag_rules[BK.editingTag] = tagRule;
    BK.editingTag = null;
    var tnote = document.getElementById('bkRuleNoteTag');
    if (tnote) tnote.innerHTML = '';
  } else {
    BK.notify.tag_rules.push(tagRule);
  }
  bkSaveNotify();
}
function bkRemoveTagRule(i) { BK.notify.tag_rules.splice(i, 1); bkSaveNotify(); }
/* EDITING A SAVED RULE: the form is filled with what is stored, and pressing the Add button saves the
 * change to THAT rule instead of appending a second one. Without this, a rule pointing at the wrong
 * list could only be removed and retyped — and nothing on screen showed which rule was wrong. */
function bkEditTagRule(i) {
  var t = (BK.notify.tag_rules || [])[i];
  if (!t) return;
  BK.editingTag = i;
  document.getElementById('bkNewTag').value = t.tag_name || '';
  document.getElementById('bkNewStage').value = t.stage || 'confirm';
  document.getElementById('bkNewMode').value = t.mode || 'add';
  var note = document.getElementById('bkRuleNoteTag');
  if (note) note.innerHTML = 'Editing a saved tag rule — press <b>Add tag rule</b> to save the change. ' +
    '<a href="#" onclick="event.preventDefault();bkCancelRuleEdit(\'tag\')">Cancel</a>';
  bkFlash('Editing a saved tag rule.');
}

function bkEditListRule(i) {
  var l = (BK.notify.list_rules || [])[i];
  if (!l) return;
  BK.editingList = i;
  var sel = document.getElementById('bkNewList');
  if (sel) sel.value = l.list_id || '';
  document.getElementById('bkNewListStage').value = l.stage || 'confirm';
  document.getElementById('bkNewListMode').value = l.mode || 'add';
  var note = document.getElementById('bkRuleNoteList');
  if (note) note.innerHTML = 'Editing a saved list rule — press <b>Add list rule</b> to save the change. ' +
    '<a href="#" onclick="event.preventDefault();bkCancelRuleEdit(\'list\')">Cancel</a>';
  bkFlash('Editing a saved list rule.');
}

function bkCancelRuleEdit(kind) {
  if (kind === 'tag') { BK.editingTag = null; document.getElementById('bkRuleNoteTag').innerHTML = ''; document.getElementById('bkNewTag').value = ''; }
  else { BK.editingList = null; document.getElementById('bkRuleNoteList').innerHTML = ''; }
}

function bkAddListRule() {
  var sel = document.getElementById('bkNewList');
  var listId = sel ? sel.value : '';
  if (!listId) { bkFlash('Choose the list this booking should go into — the dropdown does not pick one for you.', false); return; }
  BK.notify.list_rules = BK.notify.list_rules || [];
  var rule = {
    list_id: listId,
    stage: document.getElementById('bkNewListStage').value,
    mode: document.getElementById('bkNewListMode').value
  };
  if (BK.editingList != null && BK.notify.list_rules[BK.editingList]) {
    // REPLACE, never append: an edit that added a second rule would leave the wrong one still firing.
    BK.notify.list_rules[BK.editingList] = rule;
    BK.editingList = null;
    var note = document.getElementById('bkRuleNoteList');
    if (note) note.innerHTML = '';
  } else {
    BK.notify.list_rules.push(rule);
  }
  bkSaveNotify();
}

async function bkLoadOpenSlots() {
  var sel = document.getElementById('bkManSlot');
  if (!sel || !BK.current) return;
  sel.innerHTML = '<option value="">Loading…</option>';
  var resId = document.getElementById('bkManRes').value;
  var today = new Date().toISOString().slice(0, 10);
  var later = new Date(Date.now() + 120 * 864e5).toISOString().slice(0, 10);
  try {
    var rows = await bkCall('GET', '/calendars/' + BK.current + '/availability?from=' + today + '&to=' + later);
    var open = (rows || []).filter(function (a) { return a.resource_id === resId && a.remaining > 0; });
    if (!open.length) { sel.innerHTML = '<option value="">Nothing open right now</option>'; return; }
    sel.innerHTML = open.map(function (a) {
      var key = a.slot_id || a.starts_at;
      return '<option value="' + escapeHtml(key) + '" data-slot="' + (a.slot_id || '') + '" data-start="' + (a.starts_at || '') + '">' +
        escapeHtml(new Date(a.starts_at).toLocaleString()) + '</option>';
    }).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">Could not load positions</option>';
  }
}

async function bkManualBook() {
  var sel = document.getElementById('bkManSlot');
  var opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) { bkFlash('Pick an open position first.', false); return; }
  var body = {
    resource_id: document.getElementById('bkManRes').value,
    customer_name: (document.getElementById('bkManName').value || '').trim(),
    customer_email: (document.getElementById('bkManEmail').value || '').trim(),
    notes: (document.getElementById('bkManNote').value || '').trim(),
    confirm: true
  };
  if (opt.getAttribute('data-slot')) body.slot_id = opt.getAttribute('data-slot');
  else body.starts_at = opt.getAttribute('data-start');
  try {
    await bkCall('POST', '/calendars/' + BK.current + '/bookings', body);
    bkFlash('Booked — the position is now blocked for buyers.');
    await bkOpenDetail(BK.current, true);
    bkRender();
    await bkLoadOpenSlots();
    await bkLoadOrders();
  } catch (e) { bkFlash(e.message, false); }
}

async function bkSaveCalAddress() {
  var name = ((document.getElementById('bkCalName') || {}).value || '').trim();
  var slug = ((document.getElementById('bkCalSlug') || {}).value || '').trim().toLowerCase();
  var flash = document.getElementById('bkCalAddrFlash');
  var say = function (msg, ok) {
    if (!flash) { bkFlash(msg, ok); return; }
    flash.textContent = msg;
    flash.className = 'bk-flash ' + (ok === false ? 'bad' : 'good');
  };
  if (!name) { say('The calendar needs a name.', false); return; }
  if (slug && !/^[a-z0-9-]{3,60}$/.test(slug)) { say('The address uses letters, numbers and dashes only.', false); return; }
  try {
    await API.patch('/booking/calendars/' + encodeURIComponent(BK.current), { name: name, slug: slug || undefined });
    // Reload the LIST as well as the detail: a stale row label is what sent a rename hunt in circles.
    await bkInit();
    await bkOpenDetail(BK.current, true);
    bkRender();
    say('Saved — the link below is the new address. Anything published with the old one will not open.', true);
  } catch (e) { say(e.message, false); }
}

/* GETTING PAID — the default for this calendar, and where each product's own checkout goes.
 *
 * The product's checkout wins; this is what applies to any product that has not set one. Both are
 * shown here so an owner can see the whole payment story on one screen instead of wondering why a
 * product is or is not taking money.
 */
function bkPayPanel(cal) {
  var own = (cal.settings && cal.settings.checkout_url) || '';
  var withOwn = ((BK.detail && BK.detail.resources) || []).filter(function (r) { return r.checkout_embed; }).length;
  return '<div class="card" style="margin-bottom:18px"><h3 style="margin-top:0">Getting paid</h3>' +
    '<p class="muted" style="margin-top:-6px">The payment is taken <strong>inside the booking page</strong> in a panel that slides up — ' +
      'the buyer is never sent to another site. Set a checkout per product below; this is the default for products that have none.</p>' +
    '<div class="bk-form">' +
      '<label style="grid-column:1/-1">Checkout link or embed code' +
        '<textarea id="bkCalPay" rows="3" placeholder="https://checkout.example.com/… or <iframe src=&quot;https://…&quot;>">' +
          escapeHtml(cal.payment_embed || own) + '</textarea>' +
        '<span class="muted" style="font-weight:400">Only the https address is used; nothing pasted here runs as code. Leave empty for no checkout.</span></label>' +
      '<label>When the buyer pays' +
        '<select id="bkCalPayMode">' +
          '<option value=""' + (!cal.payment_mode ? ' selected' : '') + '>Follow the calendar type (appointments before, newsletter slots after)</option>' +
          '<option value="before"' + (cal.payment_mode === 'before' ? ' selected' : '') + '>Before — pay to secure the booking</option>' +
          '<option value="after"' + (cal.payment_mode === 'after' ? ' selected' : '') + '>After — pay on the confirmation</option>' +
        '</select></label>' +
    '</div>' +
    '<button class="btn btn-primary btn-sm" onclick="bkSavePay()">Save payment settings</button>' +
    '<span class="bk-flash" id="bkPayFlash"></span>' +
    // WHAT TO PASTE INTO THE PROVIDER (2026-11-25). Without this the loop cannot be closed: the
    // provider needs an address to post to and a key to post with, and the owner needs to see the
    // reference the checkout carries. Shown, copyable, rotatable.
    '<div id="bkPayWire" style="margin-top:14px"></div>' +
    '<p class="muted" style="font-size:12px;margin-top:10px">' +
      (withOwn ? withOwn + ' product(s) here have their own checkout, which overrides this. ' : '') +
      'A product with its own checkout shows it in <em>What customers can book</em>.</p>' +

async function bkLoadPayWire() {

        '<label style="grid-column:1/-1">Key<input readonly value="' + escapeHtml(w.key) + '" onclick="this.select()">' +

function bkResourcePanel(res, kind) {
  const priceLabel = kind === 'date_range' ? 'Price per day (cents)' : 'Price (cents)';
  const rows = res.map(function (r) {
    return '<tr><td><strong>' + escapeHtml(r.name) + '</strong>' +
      (r.exclusive ? ' <span class="badge" title="Closes every other position on a date this one is sold">Exclusive</span>' : '') + '</td>' +
      '<td>' + bkPriceCell(r) + '</td>' +
      '<td>' + (r.duration_min || 0) + ' min</td>' +
      '<td>' + (r.capacity || 1) + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();bkEditResource(\'' + r.id + '\')">Edit</button> ' +
        '<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();bkDeleteResource(\'' + r.id + '\', ' + JSON.stringify(r.name).replace(/"/g, '&quot;') + ')">Delete</button> ' +
        '<button class="btn btn-secondary btn-sm" onclick="bkEditSlotPrices(\'' + r.id + '\')">Slots</button></td></tr>';
  }).join('');
  return '<div class="card" style="margin-bottom:18px"><h3 style="margin-top:0">What customers can book</h3>' +
    (res.length ? '<table class="table"><thead><tr><th>Name</th><th>' + priceLabel + '</th><th>Length</th><th>Places</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
                : '<p class="muted">Nothing bookable yet. Add the first one below.</p>') +
    '<div class="bk-form" id="bkResAddForm" style="margin-top:12px">' +
      '<label>Name<input id="bkResName" placeholder="' + (kind === 'inventory' ? 'Top sponsor' : kind === 'date_range' ? 'Featured listing 30 days' : 'Discovery call') + '"></label>' +
      '<label>' + priceLabel + '<input id="bkResPrice" type="number" value="' + (kind === 'appointment' ? 0 : 20000) + '"></label>' +
      // THE "WAS" PRICE (2026-11-23): a founders rate needs the old figure beside it. Display only —
      // the amount charged is always the price above, and this never reaches pricing or checkout.
      '<label>Compare-at price (cents)<input id="bkResCompare" type="number" min="0" placeholder="leave empty for none">' +
        '<span class="muted" style="font-weight:400">Shown struck through beside the price, only when it is higher. Customers are charged the price above.</span></label>' +
      '<label>Length (min)<input id="bkResDur" type="number" value="' + (kind === 'appointment' ? 30 : 60) + '"></label>' +
      // THE ARTWORK SPEC (ZaarHub, 2026-11-24): the confirmation email states it, so it belongs to the
      // position rather than being hardcoded per product name in a mail template.
      // THE CHECKOUT BELONGS TO THE PRODUCT (David, 2026-11-24): "we have multiple different
      // newsletters and it's priced differently... in the product section is where we connected to a
      // certain checkout link or embed." Empty here means the calendar's default is used.
      '<label style="grid-column:1/-1">Checkout for this product &mdash; link or embed code' +
        '<textarea id="bkResPay" rows="3" placeholder="https://checkout.example.com/… or <iframe src=&quot;https://…&quot;>"></textarea>' +
        '<span class="muted" style="font-weight:400">Pasted in, and shown INSIDE your booking page in a panel that slides up — the buyer is never sent to another site. Only the https address is used; nothing you paste runs as code. Leave empty to use the calendar&rsquo;s default.</span></label>' +
      '<label>When this product is paid for' +
        '<select id="bkResPayMode">' +
          '<option value="">Use the calendar&rsquo;s setting</option>' +
          '<option value="before">Before &mdash; pay to secure the booking (a consultant&rsquo;s time)</option>' +
          '<option value="after">After &mdash; pay on the confirmation (a newsletter slot)</option>' +
        '</select></label>' +
      '<label>Artwork size<input id="bkResSize" placeholder="600x150">' +
        '<span class="muted" style="font-weight:400">Stated in the confirmation email. Leave empty if a sponsor can send any size.</span></label>' +
      '<label>Places<input id="bkResCap" type="number" value="1" min="1"></label>' +
      '<label>Padding after (min)<input id="bkResBuf" type="number" value="0" min="0"></label>' +
      '<label>Spacing (min)<input id="bkResInterval" type="number" value="' + (kind === 'appointment' ? 30 : 60) + '"></label>' +
      // EXCLUSIVE (2026-11-23): a Full Takeover sells all four positions in one issue. Without this, the
      // takeover and the four individual slots could all be sold on the same date — the same inventory
      // twice. It blocks in BOTH directions: every other position on a date this one is sold, and this
      // one when anything else sells that date.
      '<label style="grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-weight:600">' +
        '<input type="checkbox" id="bkResExclusive" style="margin-top:3px">' +
        '<span>Exclusive &mdash; closes every other position on a date this one is sold, and is itself closed ' +
        'when another position sells that date.<span class="muted" style="display:block;font-weight:400">' +
        'Use it for a Full Takeover. Two ordinary positions on one date are unaffected.</span></span></label>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="bkAddResource()">Add</button></div>';
}

/* The price column, and whether a "was" price is honest: only when it is strictly higher. */
function bkPriceCell(r) {
  const was = r.compare_at_price_cents;
  const mine = (r.price_cents || 0);
  let out = bkMoney(mine);
  if (was != null && was > mine) {
    out = '<span style="text-decoration:line-through;opacity:.65">' + bkMoney(was) + '</span> ' + out;
  }
  return out;
}

/* A POSITION CAN BE CORRECTED OR REMOVED (ZaarHub, 2026-11-23). A mis-priced slot used to be
 * un-fixable once created: every row's only control was "Slots", so the price could not be changed and
 * the row could not be deleted without rebuilding the calendar. Edit loads the row into the form above
 * and the button turns into "Save changes"; Delete asks first, and the server refuses while a live
 * booking depends on it. */
function bkResourceById(id) {
  var list = (BK.detail && BK.detail.resources) || [];
  return list.filter(function (r) { return String(r.id) === String(id); })[0] || null;
}

function bkEditResource(id) {
  var r = bkResourceById(id);
  if (!r) { bkFlash('That position is no longer on this calendar.', false); return; }
  BK.editing = id;
  var set = function (elId, v) { var el = document.getElementById(elId); if (el) el.value = (v == null ? '' : v); };
  set('bkResName', r.name);
  set('bkResPrice', r.price_cents);
  set('bkResCompare', r.compare_at_price_cents);
  set('bkResDur', r.duration_min);
  set('bkResCap', r.capacity);
  set('bkResBuf', r.buffer_min);
  set('bkResInterval', r.slot_interval_min);
  var ex = document.getElementById('bkResExclusive'); if (ex) ex.checked = !!r.exclusive;
  set('bkResSize', r.size);
  set('bkResPay', r.checkout_embed);
  set('bkResPayMode', r.payment_mode || '');
  var btn = document.querySelector('#bkWrap button[onclick="bkAddResource()"]');
  if (btn) {
    btn.textContent = 'Save changes';
    btn.setAttribute('onclick', 'bkSaveResource()');
  }
  var cancel = document.getElementById('bkResCancel');
  if (!cancel) {
    var holder = document.getElementById('bkResEditNote');
    if (!holder) {
      holder = document.createElement('div');
      holder.id = 'bkResEditNote';
      holder.className = 'muted';
      holder.style.cssText = 'margin-top:8px;font-size:12.5px';
      var form = document.getElementById('bkResAddForm');
      if (form) form.parentNode.insertBefore(holder, form.nextSibling);
    }
    holder.innerHTML = 'Editing <b>' + escapeHtml(r.name) + '</b> — change what you need and press Save changes. ' +
      '<a href="#" onclick="event.preventDefault();bkCancelResourceEdit()">Cancel</a>';
  }
  bkFlash('Editing “' + r.name + '”. Change the values and press Save changes.');
}

async function bkSaveResource() {
  var id = BK.editing;
  var name = ((document.getElementById('bkResName') || {}).value || '').trim();
  if (!id) return;
  if (!name) { bkFlash('Give it a name.', false); return; }
  try {
    await bkCall('PATCH', '/resources/' + encodeURIComponent(id), bkResourceBody(name));
    BK.editing = null;
    await bkInit();
    if (BK.current) { await bkOpenDetail(BK.current, true); bkRender(); }
    bkFlash('Saved — the booking page uses the new values.');
  } catch (e) { bkFlash(e.message, false); }
}

function bkResourceBody(name) {
  var num = function (id, dflt) {
    var el = document.getElementById(id);
    var raw = el ? String(el.value || '').trim() : '';
    if (raw === '') return dflt;
    var n = parseInt(raw, 10);
    return isNaN(n) ? dflt : n;
  };
  var cmpEl = document.getElementById('bkResCompare');
  var cmpRaw = cmpEl ? String(cmpEl.value || '').trim() : '';
  return {
    name: name,
    price_cents: num('bkResPrice', 0),
    compare_at_price_cents: cmpRaw === '' ? null : parseInt(cmpRaw, 10),
    duration_min: num('bkResDur', 30),
    capacity: num('bkResCap', 1),
    buffer_min: num('bkResBuf', 0),
    slot_interval_min: num('bkResInterval', 30),
    // Sent on every save, so unticking it in the form actually clears it.
    exclusive: !!(document.getElementById('bkResExclusive') || {}).checked,
    size: ((document.getElementById('bkResSize') || {}).value || '').trim() || null,
    checkout_embed: ((document.getElementById('bkResPay') || {}).value || '').trim() || null,
    payment_mode: ((document.getElementById('bkResPayMode') || {}).value || '').trim() || null
  };
}

/* Cancel leaves the form ready for a NEW position, not the one that was being edited. */
function bkCancelResourceEdit() {
  BK.editing = null;
  ['bkResName', 'bkResCompare', 'bkResSize', 'bkResPay'].forEach(function (i) { var el = document.getElementById(i); if (el) el.value = ''; });
  var pm = document.getElementById('bkResPayMode'); if (pm) pm.value = '';
  var ex = document.getElementById('bkResExclusive'); if (ex) ex.checked = false;
  var btn = document.querySelector('#bkWrap button[onclick="bkSaveResource()"]');
  if (btn) { btn.textContent = 'Add'; btn.setAttribute('onclick', 'bkAddResource()'); }
  var note = document.getElementById('bkResEditNote');
  if (note) note.innerHTML = '';
  bkFlash('Edit cancelled.');
}

function bkDeleteResource(id, name) {
  confirmThen('Remove “' + name + '” from what customers can book? Its open dates go with it. If any booking is still live against it, this is refused and tells you how many.', async function () {
    try {
      var r = await bkCall('DELETE', '/resources/' + encodeURIComponent(id));
      await bkInit();
      if (BK.current) { await bkOpenDetail(BK.current, true); bkRender(); }
      bkFlash(r.message || 'Removed.', true);
    } catch (e) { bkFlash(e.message, false); }
  });
}

async function bkAddResource() {
  const name = (document.getElementById('bkResName').value || '').trim();
  if (!name) { bkFlash('Give it a name.', false); return; }
  try {
    await bkCall('POST', '/calendars/' + BK.current + '/resources', {
      name: name,
      price_cents: parseInt(document.getElementById('bkResPrice').value, 10) || 0,
      compare_at_price_cents: (function () {
        const v = (document.getElementById('bkResCompare').value || '').trim();
        return v === '' ? null : parseInt(v, 10);
      })(),
      duration_min: parseInt(document.getElementById('bkResDur').value, 10) || 30,
      capacity: parseInt(document.getElementById('bkResCap').value, 10) || 1,
      buffer_min: parseInt(document.getElementById('bkResBuf').value, 10) || 0,
      slot_interval_min: parseInt(document.getElementById('bkResInterval').value, 10) || 30,
      exclusive: !!(document.getElementById('bkResExclusive') || {}).checked,
      size: ((document.getElementById('bkResSize') || {}).value || '').trim() || null,
      checkout_embed: ((document.getElementById('bkResPay') || {}).value || '').trim() || null,
      payment_mode: ((document.getElementById('bkResPayMode') || {}).value || '').trim() || null
    });
    await bkOpenDetail(BK.current, true); bkRender(); bkFlash('Added.');
  } catch (e) { bkFlash(e.message, false); }
}

/* ---- open hours (appointment) ----------------------------------------------------------------- */
const BK_DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

function bkHoursPanel() {
  const rows = BK_DAYS.map(function (d, i) {
    return '<tr><td>' + d + '</td>' +
      '<td><input id="bkFrom' + i + '" type="time" value="09:00"></td>' +
      '<td><input id="bkTo' + i + '" type="time" value="17:00"></td>' +
      '<td><input id="bkOn' + i + '" type="checkbox" checked></td></tr>';
  }).join('');
  return '<div class="card" style="margin-bottom:18px"><h3 style="margin-top:0">Open hours</h3>' +
    '<p class="muted" style="margin-top:-6px">Set the hours once, then use the shortcuts so a week is two clicks.</p>' +
    '<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="bkSameEveryDay" type="checkbox" onchange="bkApplyToAllDays()"> Same hours every weekday</label>' +
    '<table class="table"><thead><tr><th>Day</th><th>From</th><th>To</th><th>Open</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
      '<button class="btn btn-secondary btn-sm" onclick="bkCopyMonday()">Copy Monday to Tue–Fri</button>' +
      '<button class="btn btn-primary btn-sm" onclick="bkSaveHours()">Save hours</button>' +
    '</div>' +
    '<p class="muted" style="font-size:12px;margin-bottom:0">Hours are saved per bookable item. Pick one below to apply them.</p>' +
    '<div id="bkHoursTarget"></div></div>';
}

function bkApplyToAllDays() {
  const on = document.getElementById('bkSameEveryDay').checked;
  if (!on) return;
  const f = document.getElementById('bkFrom0').value, t = document.getElementById('bkTo0').value;
  for (let i = 1; i < 5; i++) { document.getElementById('bkFrom' + i).value = f; document.getElementById('bkTo' + i).value = t; }
}

function bkCopyMonday() {
  const f = document.getElementById('bkFrom0').value, t = document.getElementById('bkTo0').value;
  for (let i = 1; i < 5; i++) {
    document.getElementById('bkFrom' + i).value = f; document.getElementById('bkTo' + i).value = t;
    document.getElementById('bkOn' + i).checked = true;
  }
  bkFlash('Monday copied to Tuesday–Friday.');
}

async function bkSaveHours() {
  const res = (BK.detail && BK.detail.resources) || [];
  if (!res.length) { bkFlash('Add a bookable item first — hours belong to one.', false); return; }
  const rid = window.BK_HOURS_RESOURCE || res[0].id;
  const rules = [];
  for (let i = 0; i < 7; i++) {
    if (!document.getElementById('bkOn' + i).checked) continue;
    const f = document.getElementById('bkFrom' + i).value, t = document.getElementById('bkTo' + i).value;
    if (!f || !t || f >= t) continue;
    rules.push({ weekday: i, start_time: f + ':00', end_time: t + ':00' });
  }
  try {
    await bkCall('PUT', '/resources/' + rid + '/availability-rules', rules);
    bkFlash('Hours saved — ' + rules.length + ' open block' + (rules.length === 1 ? '' : 's') + '.');
  } catch (e) { bkFlash(e.message, false); }
}

/* ---- dated slots (inventory / date_range) ------------------------------------------------------ */
function bkSlotsPanel(res) {
  if (!res.length) return '<div class="card" style="margin-bottom:18px"><p class="muted">Add a bookable item first — slots belong to one.</p></div>';
  return '<div class="card" style="margin-bottom:18px"><h3 style="margin-top:0">Generate dated slots</h3>' +
    '<p class="muted" style="margin-top:-6px">One run fills a whole quarter. Running it again never duplicates a position.</p>' +
    // WHICH POSITIONS (measured 2026-11-23): the generator had no position selector at all and always
    // took the first one, so three of four products could never be given dates. Every position is
    // listed with a tick, all ticked by default, and the run reports what each position got.
    '<div class="bk-form">' +
      '<label style="grid-column:1/-1">Positions to fill' +
        '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:6px">' +
          '<label style="display:flex;gap:6px;align-items:center;font-weight:600">' +
            '<input type="checkbox" id="bkGenAll" checked onchange="bkGenToggleAll(this.checked)"> All positions</label>' +
          res.map(function (r) {
            return '<label style="display:flex;gap:6px;align-items:center;font-weight:400">' +
              '<input type="checkbox" class="bk-gen-res" value="' + r.id + '" checked> ' +
              escapeHtml(r.name) + ' <span class="muted">' + bkMoney(r.price_cents) + '</span></label>';
          }).join('') +
        '</div>' +
        '<span class="muted" style="font-weight:400">Each position keeps its own price unless you type one below. Clear the price box to use the position&rsquo;s price.</span>' +
      '</label>' +
      '<label>From<input id="bkGenFrom" type="date"></label>' +
      '<label>To<input id="bkGenTo" type="date"></label>' +
      '<label>Weekdays<input id="bkGenDays" value="1,3" placeholder="0=Mon … 6=Sun, e.g. 1,3"></label>' +
      '<label>Time<input id="bkGenTime" type="time" value="07:00"></label>' +

async function bkGenSlots() {
  const res = (BK.detail && BK.detail.resources) || [];
  if (!res.length) { bkFlash('Add a bookable item first.', false); return; }
  const picked = Array.prototype.filter.call(
    document.querySelectorAll('.bk-gen-res'), function (el) { return el.checked; }
  ).map(function (el) { return el.value; });
  if (!picked.length) { bkFlash('Tick at least one position.', false); return; }
  const days = (document.getElementById('bkGenDays').value || '').split(',')
    .map(function (d) { return parseInt(d.trim(), 10); }).filter(function (d) { return d >= 0 && d <= 6; });
  const body = {
    from: document.getElementById('bkGenFrom').value,
    to: document.getElementById('bkGenTo').value,
    weekdays: days,
    time: (document.getElementById('bkGenTime').value || '07:00') + ':00',
    price_cents: (function () {
      var raw = String((document.getElementById('bkGenPrice') || {}).value || '').trim();
      if (!raw) return null;                    // no override: the position's price is used
      var n = parseInt(raw, 10);
      return (!n || n <= 0) ? null : n;         // zero is not a price
    })(),
    label: document.getElementById('bkGenLabel').value || ''
  };
  const tue = parseInt(document.getElementById('bkGenTue').value, 10);
  if (!isNaN(tue)) body.weekday_prices = { '1': tue };
  try {
    // One call fills every ticked position and returns a per-position report, so the operator sees
    // what happened without loading the public page and counting tiles.
    const report = await bkCall(
      'POST',
      '/calendars/' + encodeURIComponent(BK.current) + '/slots/generate',
      Object.assign({}, body, { resource_ids: picked.length === res.length ? [] : picked })
    );
    const box = document.getElementById('bkSlotList');
    const rows = (report || []).map(function (r) {
      if (r.error) {
        return '<li><strong>' + escapeHtml(r.resource) + '</strong> — refused: ' + escapeHtml(r.error) + '</li>';
      }
      return '<li><strong>' + escapeHtml(r.resource) + '</strong> — ' +
        (r.created || 0) + ' date(s) added, ' + (r.corrected || 0) + ' corrected · ' +
        (r.open_slots || 0) + ' open now' +
        (r.prices ? ' at $' + escapeHtml(r.prices) : '') + '</li>';
    }).join('');
    const total = (report || []).reduce(function (n, r) { return n + (r.created || 0); }, 0);
    bkFlash('Generated ' + total + ' date(s).');
    if (box) box.innerHTML = '<h4>What this run produced</h4><ul>' + rows + '</ul>';
    await bkOpenDetail(BK.current, true);
    bkRender();
    if (box) box.innerHTML = '<h4>What this run produced</h4><ul>' + rows + '</ul>';
  } catch (e) { bkFlash(e.message, false); }
}

async function dmInit() {
  const wrap = document.getElementById('dmWrap');
  if (wrap) wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Loading mappings…</div>';
  try {
    DM.dest = await dmCall('GET', '/data-mapping/destinations');
    const list = await dmCall('GET', '/data-mapping/mappings');
    DM.mappings = list.mappings || [];
    if (DM.mappings.length) {
      dmLoadMapping(DM.mappings[0]);
    } else {
      DM.current = null;
      DM.fieldMap = {};
      DM.sourceApp = '';
      DM.entity = '';
      DM.schema = null;
      DM.dirty = false;
      // A SOURCE IS ONLY A SOURCE IF THIS ACCOUNT CAN READ IT (measured 2026-11-18). The
      // destinations list is the fleet's APP CATALOGUE, not this account's connections: a Free
      // workspace with nothing connected used to land here with `funnelswift` pre-selected, fire
      // /data-mapping/schema?app=funnelswift, and paint the backend's 400 as a red "Fields
      // unavailable" card — a dead end whose next step (connect the app) was never named. Ask each
      // catalogue entry for its fields and keep the first one that ANSWERS; when none does, the
      // screen says so and links to the place that fixes it.
      const picked = await dmFindUsableSource();
      if (!picked) {
        dmRenderAll();
        dmRenderNoSource();
        return;
      }
      DM.sourceApp = picked.app;
      DM.schema = picked.schema;
      if (!DM.entity && DM.schema.entities && DM.schema.entities[0]) DM.entity = DM.schema.entities[0].name;
      dmRenderAll();
      dmRenderSource();
      dmRenderPreview();
    }
  } catch (e) {
    if (wrap) wrap.innerHTML = card('Could not load the mapper',
      '<p class="form-hint">' + dmEsc(e.message) + '</p>', '');
  }
}

function dmEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

function dmLoadMapping(m) {
  DM.current = m;
  DM.fieldMap = {};
  (m.field_map || []).forEach(function (f) { DM.fieldMap[f.to] = f.template || ''; });
  DM.sourceApp = (m.source && m.source.app) || '';
  DM.entity = (m.source && m.source.entity) || '';
  DM.dirty = false;
  dmRenderAll();
  dmLoadSchema();
}

/** Pull the source app's own field description. Never a hardcoded list. */
async function dmLoadSchema() {
  DM.schema = null;
  const box = document.getElementById('dmSource');
  if (box) box.innerHTML = '<p class="form-hint">Reading ' + dmEsc(DM.sourceApp || 'the source') + '’s fields…</p>';
  if (!DM.sourceApp) { if (box) box.innerHTML = '<p class="form-hint">Pick a source app first.</p>'; return; }
  try {
    DM.schema = await dmCall('GET', '/data-mapping/schema?app=' + encodeURIComponent(DM.sourceApp));
    if (!DM.entity && DM.schema.entities && DM.schema.entities[0]) DM.entity = DM.schema.entities[0].name;
    dmRenderSource();
    dmRenderPreview();
  } catch (e) {
    if (box) {
      const needsConnect = /connection/i.test(String(e.message || ''));
      box.innerHTML = card('Fields unavailable',
        '<p style="color:var(--warning,#b45309)">' + dmEsc(e.message) + '</p>' +
        '<p class="form-hint">The mapper lists what the other app says it has. It will not invent field names — ' +
        'a made-up name would resolve to nothing at run time.</p>' +
        (needsConnect
          ? '<button class="btn btn-primary btn-sm" onclick="switchTab(\'integrations\')">Open the Integration Center</button>'
          : ''), '');
    }
  }
}

/**
 * The first catalogue source whose fields THIS ACCOUNT can actually read, with its schema.
 *
 * `/data-mapping/destinations` lists every app the fleet knows, connected or not; only the schema
 * route knows the difference (it answers `This account has no <app> connection` for the rest). So
 * the pick is made by asking, once per candidate, and the answer is cached on DM.probed so a
 * later re-render does not repeat the round-trips. Returns null when nothing is connected.
 */
async function dmFindUsableSource() {
  const sources = (DM.dest && DM.dest.sources) || [];
  DM.probed = DM.probed || {};
  for (let i = 0; i < sources.length; i++) {
    const app = sources[i] && sources[i].app;
    if (!app) continue;
    if (DM.probed[app] === false) continue;
    if (DM.probed[app]) return { app: app, schema: DM.probed[app] };
    const connected = await dmIsConnected(app);
    if (connected === false) { DM.probed[app] = false; continue; }
    try {
      const schema = await dmCall('GET', '/data-mapping/schema?app=' + encodeURIComponent(app));
      if (schema && (schema.entities || []).length) {
        DM.probed[app] = schema;
        return { app: app, schema: schema };
      }
      DM.probed[app] = false;
    } catch (e) {
      DM.probed[app] = false;
    }
  }
  return null;
}

/**
 * Is this app connected to the CALLER's workspace? `GET /native/apps/<slug>/status` is the
 * connector's own answer (`connected: true|false`), so asking it costs one small read and keeps
 * `/data-mapping/schema` (which refuses with a 400 for an unconnected app) off the wire entirely.
 * A status route that cannot answer is treated as "try the schema", never as "not connected".
 */
async function dmIsConnected(app) {
  try {
    const st = await dmCall('GET', '/native/apps/' + encodeURIComponent(app) + '/status');
    return !!(st && st.connected);
  } catch (e) {
    return null;
  }
}

    'real fields and never invents them, so there is nothing to map until one is connected.</p>' +
    '<p class="form-hint">Connect FunnelSwift, IncentiveSwift, WorkflowSwift or MissedCall Respondr in the ' +
    'Integration Center, then open this screen again.</p>' +

}

function dmSourceFields() {
  if (!DM.schema || !DM.schema.entities) return [];
  const ent = DM.schema.entities.filter(function (e) { return e.name === DM.entity; })[0] ||
              DM.schema.entities[0];
  return (ent && ent.fields) || [];
}

function dmSample() {
  const row = {};
  dmSourceFields().forEach(function (f) {
    if (f.sample !== null && f.sample !== undefined) dmSetPath(row, f.path, f.sample);
  });
  return row;
}

function dmSetPath(obj, path, value) {
  const parts = String(path).split('.').filter(Boolean);
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (typeof cur[parts[i]] !== 'object' || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  if (parts.length) cur[parts[parts.length - 1]] = value;
  return obj;
}

function dmRenderSource() {

    ? '<p class="form-hint" style="margin-bottom:8px">' + dmEsc(DM.schema.note) + '</p>' : '';
  const q = (document.getElementById('dmSearch') || {}).value || '';
  const needle = q.trim().toLowerCase();

  if (!fields.length) { box.innerHTML = note + '<p class="form-hint">No fields yet.</p>'; return; }

  });
  if (!shown.length) { box.innerHTML = note + '<p class="form-hint">Nothing matches “' + dmEsc(q) + '”.</p>'; return; }
  box.innerHTML = note + shown.map(function (f) {
    const sample = f.sample === null || f.sample === undefined ? '<em>no sample</em>'
      : '<code style="font-size:11px">' + dmEsc(typeof f.sample === 'object' ? JSON.stringify(f.sample) : f.sample) + '</code>';

function dmDestFields() {
  const list = [];
  ((DM.dest && DM.dest.entities) || []).forEach(function (e) {
    if (e.entity === 'contact' && e.available) {
      (e.fields || []).forEach(function (f) { list.push({ to: f.path, label: f.label, type: f.type }); });
    }
  });
  // Anything already mapped that is not in the catalogue (metadata paths) still gets a row.
  Object.keys(DM.fieldMap).forEach(function (to) {
    if (!list.some(function (f) { return f.to === to; })) list.push({ to: to, label: to, type: 'auto' });
  });

}

function dmRenderDest() {
  const box = document.getElementById('dmDest');
  if (!box) return;
  DM.rows = [];
  const fields = dmDestFields();
  fields.forEach(function (f, i) {
    DM.rows.push(f.to);
    f.idx = i;
  });
  const openHint = (DM.dest && DM.dest.entities || []).filter(function (e) { return !e.available; })
    .map(function (e) { return '<p class="form-hint">🚫 ' + dmEsc(e.label) + ' — ' + dmEsc(e.reason) + '</p>'; }).join('');
  box.innerHTML = openHint + fields.map(function (f) {
    return '<div style="margin-bottom:10px">' +
      '<label style="font-size:12px;display:flex;justify-content:space-between">' +
        '<span>' + dmEsc(f.label) + '</span><span>' + dmEsc(f.to) + '</span></label>' +
      '<div class="dm-token" id="dmTok-' + f.idx + '" contenteditable="true" data-to="' + dmEsc(f.to) + '" ' +
        'oninput="dmSerialize(' + f.idx + ')" onkeyup="dmSerialize(' + f.idx + ')" ' +
        'style="min-height:34px;border:1px solid var(--border,#ccc);border-radius:6px;padding:6px 8px;font-size:13px"></div>' +
    '</div>';

    '<input id="dmMetaPath" type="text" placeholder="metadata.path" style="flex:1">' +
    '<button class="btn btn-secondary btn-sm" onclick="dmAddMetadata()">+ Map extra field</button>' +
  '</div>';
  // Paint the stored templates into the inputs as text + chips.
  fields.forEach(function (f) { dmPaintTemplate(f.idx, DM.fieldMap[f.to] || ''); });

function dmPaintTemplate(idx, template) {
  const el = document.getElementById('dmTok-' + idx);
  if (!el) return;
  el.innerHTML = '';
  const re = /\{\{([^}]+)\}\}/g;
  let last = 0, m;
  while ((m = re.exec(template)) !== null) {
    if (m.index > last) el.appendChild(document.createTextNode(template.slice(last, m.index)));
    const chip = document.createElement('span');
    chip.className = 'dm-chip';
    chip.contentEditable = 'false';
    chip.dataset.path = m[1].trim();
    chip.textContent = m[1].trim();
    chip.style.cssText = 'display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;' +
      'padding:1px 8px;margin:0 2px;font-size:12px;white-space:nowrap';
    el.appendChild(chip);
    last = m.index + m[0].length;
  }
  if (last < template.length) el.appendChild(document.createTextNode(template.slice(last)));
}

/** Read a token input back into a template string. A chip is one whole token, never half of one. */
function dmSerialize(idx) {
  const el = document.getElementById('dmTok-' + idx);
  if (!el) return;
  let out = '';
  el.childNodes.forEach(function (n) {
    if (n.nodeType === 3) out += n.textContent;
    else if (n.nodeType === 1) {
      if (n.dataset && n.dataset.path) out += '{{' + n.dataset.path + '}}';
      else if (n.tagName === 'BR') out += '\n';
      else out += n.textContent;
    }
  });
  const to = (DM.rows || [])[idx];
  if (to) DM.fieldMap[to] = out;
  DM.dirty = true;
  dmRenderPreview();
}

function dmInsertPill(path) {
  const active = document.activeElement;
  const target = (active && active.classList && active.classList.contains('dm-token')) ? active
    : document.querySelector('.dm-token');
  if (!target) { dmSetStatus('Click a destination field first, then the source field.', true); return; }
  target.focus();
  const chip = document.createElement('span');
  chip.className = 'dm-chip';
  chip.contentEditable = 'false';
  chip.dataset.path = path;
  chip.textContent = path;
  chip.style.cssText = 'display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;' +
    'padding:1px 8px;margin:0 2px;font-size:12px;white-space:nowrap';
  const sel = window.getSelection && window.getSelection();
  if (sel && sel.rangeCount && target.contains(sel.anchorNode)) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(chip);
    range.setStartAfter(chip);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    target.appendChild(chip);
  }
  const idx = parseInt(String(target.id).replace('dmTok-', ''), 10);
  dmSerialize(idx);
}

function dmAddMetadata() {
  const el = document.getElementById('dmMetaPath');
  const path = (el && el.value || '').trim();
  if (!/^metadata\.[A-Za-z0-9_.]+$/.test(path)) {
    dmSetStatus('An extra field must be named metadata.<something>, e.g. metadata.utm_source.', true);
    return;
  }
  if (DM.fieldMap[path] === undefined) DM.fieldMap[path] = '';
  DM.dirty = true;
  dmRenderDest();
}

function dmSetStatus(msg, bad) {
  const el = document.getElementById('dmStatus');
  if (el) { el.textContent = msg || ''; el.style.color = bad ? 'var(--danger,#b91c1c)' : 'var(--success,#166534)'; }
}

/* ---- client-side preview: identical rules to the server resolver ---- */
function dmResolveTemplate(template, row) {
  const re = /\{\{([^}]+)\}\}/g;
  let out = '', last = 0, m, any = false;
  const single = template.trim().match(/^\{\{([^}]+)\}\}$/);
  if (single) {
    const v = dmPathValue(row, single[1].trim());
    return v === undefined || v === null || v === '' ? null : dmText(v);
  }
  while ((m = re.exec(template)) !== null) {
    out += template.slice(last, m.index);
    const v = dmPathValue(row, m[1].trim());
    if (v !== undefined && v !== null && v !== '') { out += dmText(v); any = true; }
    last = m.index + m[0].length;
  }
  out += template.slice(last);
  if (!out.trim() && !any) return null;
  return out;
}

function dmPathValue(row, path) {
  let cur = row;
  const parts = String(path).split('.').filter(Boolean);
  for (let i = 0; i < parts.length; i++) {
    if (cur === null || cur === undefined) return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}

function dmText(v) {
  if (Array.isArray(v)) return v.filter(function (x) { return x !== null && x !== undefined && x !== ''; }).join(', ');
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function dmPreviewPayload() {
  const row = DM.previewRow || dmSample();
  const out = {};
  Object.keys(DM.fieldMap).forEach(function (to) {
    const tpl = DM.fieldMap[to];
    if (!tpl || !tpl.trim()) return;
    const v = dmResolveTemplate(tpl, row);
    if (v === null) return;
    if (to.indexOf('metadata.') === 0) dmSetPath(out, to, v);
    else dmSetPath(out, to, v);
  });
  return out;
}

function dmRenderPreview() {
  const box = document.getElementById('dmPreview');
  if (!box) return;
  const payload = dmPreviewPayload();
  const n = Object.keys(payload).length;
  box.innerHTML = '<pre style="font-size:11px;white-space:pre-wrap;margin:0;max-height:52vh;overflow:auto">' +
    dmEsc(JSON.stringify(payload, null, 2)) + '</pre>' +
    '<p class="form-hint" style="margin-top:6px">' + (n ? n + ' field(s) would be written' : 'Nothing mapped yet') + '</p>' +
    (DM.lastRun ? '<div style="margin-top:8px;border-top:1px solid var(--border,#eee);padding-top:8px">' +
      '<strong style="font-size:12px">Server said:</strong> ' + dmEsc(DM.lastRun.status || '') +
      (DM.lastRun.reason ? ' — ' + dmEsc(DM.lastRun.reason) : '') + '</div>' : '');
}

function dmBody() {
  const name = (document.getElementById('dmName') || {}).value || '';
  const onMatch = (document.getElementById('dmOnMatch') || {}).value || 'update';
  const listId = (document.getElementById('dmList') || {}).value || '';
  const fieldMap = Object.keys(DM.fieldMap)
    .filter(function (to) { return (DM.fieldMap[to] || '').trim(); })
    .map(function (to) { return { to: to, template: DM.fieldMap[to] }; });
  return {
    name: name.trim(),
    source: { app: DM.sourceApp, entity: DM.entity, schema_version: (DM.schema && DM.schema.version) || 1 },
    destination: { entity: 'contact', list_id: listId || null },
    field_map: fieldMap,
    dedupe: { keys: ['email'], on_match: onMatch },
    options: { skip_empty: true },
    enabled: true
  };
}

async function dmSave() {
  const body = dmBody();
  if (!body.name) { dmSetStatus('Give the mapping a name.', true); return; }
  if (!body.field_map.length) { dmSetStatus('Map at least one destination field.', true); return; }
  try {
    let res;
    if (DM.current && DM.current.id) res = await dmCall('PUT', '/data-mapping/mappings/' + DM.current.id, body);
    else res = await dmCall('POST', '/data-mapping/mappings', body);
    DM.current = res.mapping;
    DM.dirty = false;
    dmSetStatus('Saved.', false);
    await dmInit();
  } catch (e) {
    dmSetStatus(e.message, true);
  }
}

async function dmTest() {
  if (!DM.current || !DM.current.id) { dmSetStatus('Save the mapping first, then test it.', true); return; }
  DM.previewRow = dmSample();
  try {
    const res = await dmCall('POST', '/data-mapping/mappings/' + DM.current.id + '/run',
      { row: DM.previewRow, dry_run: true });
    DM.lastRun = res;
    const client = JSON.stringify(dmPreviewPayload(), Object.keys(dmPreviewPayload()).sort());
    const server = JSON.stringify(res.payload || {}, Object.keys(res.payload || {}).sort());
    dmRenderPreview();
    dmSetStatus(res.status === 'refused'
      ? 'Server refused it: ' + (res.reason || '') 
      : (client === server ? 'Preview matches the server exactly.' : 'Server resolved a different payload — see the preview panel.'),
      res.status === 'refused');
  } catch (e) {
    dmSetStatus(e.message, true);
  }
}

async function dmLoadRuns() {
  const box = document.getElementById('dmRuns');
  if (!box) return;
  if (!DM.current || !DM.current.id) { box.innerHTML = '<p class="form-hint">Save the mapping first.</p>'; return; }
  try {
    const res = await dmCall('GET', '/data-mapping/mappings/' + DM.current.id + '/runs');
    const runs = res.runs || [];
    if (!runs.length) {
      box.innerHTML = '<p class="form-hint">No runs yet. This mapping has never fired — that is a fact, not an error.</p>';
      return;
    }
    box.innerHTML = '<table class="data-table" style="width:100%;font-size:12px"><thead><tr>' +
      '<th>When</th><th>Event</th><th>Result</th><th>Detail</th><th>ms</th></tr></thead><tbody>' +
      runs.map(function (r) {
        return '<tr><td>' + dmEsc((r.created_at || '').replace('T', ' ').slice(0, 19)) + '</td>' +
          '<td><code style="font-size:11px">' + dmEsc(r.event_id || '—') + '</code></td>' +
          '<td>' + dmEsc(r.status) + '</td>' +
          '<td>' + dmEsc(r.reason || (r.refused && r.refused.length ? JSON.stringify(r.refused) : '')) + '</td>' +
          '<td>' + dmEsc(r.ms == null ? '' : r.ms) + '</td></tr>';

/* ==========================================================================================
 * MAIL COMPLIANCE (kanban t_bec0f198)
 * ------------------------------------------------------------------------------------------
 * Everything this account sends passes one gate: transactional (receipts, password resets)
 * cannot be opted out of but is still refused to a known-bad address; notification and bulk
 * mail can be stopped. This page is the screen for that gate: what was sent, what the provider
 * did with it, who has asked this account to stop, and the two downloads a customer takes to an
 * address-verification service.
 *
 * Two things the panel refuses to fake:
 *   * A RATE with no mail behind it. Over an account that has sent nothing, the API reports
 *     `no_events_yet` and the tiles say so — never a red "0.0% delivered".
 *   * A CEILING without the number. The complaint rate is shown against the 0.3% limit the
 *     mailbox providers actually enforce, because the limit is the actionable fact.
 * ========================================================================================== */

window.MC = { rows: [] };

var MC_CLASSES = [
  { id: 'all', label: 'Everything except receipts' },
  { id: 'bulk', label: 'Campaigns and sequences only' },
  { id: 'notification', label: 'Notifications only' }
];

TAB_RENDERERS['mail-compliance'] = function () {
  return pageHeader(
    'Mail compliance',
    'What this account sent, what the provider did with it, and who asked us to stop',
    '<button class="btn btn-secondary btn-sm" data-ops="mc-refresh" onclick="mcLoad()">↻ Reload</button>'
  ) + '<div id="mcWrap"><div class="loading-wrap"><div class="spinner"></div> Loading…</div></div>';
};
TAB_LOADERS['mail-compliance'] = async function () { await mcLoad(); };

function mcEsc(v) { return escapeHtml(v == null ? '' : String(v)); }

function mcTile(label, value, note) {
  return '<div class="stat-tile" style="flex:1 1 150px;min-width:150px">' +
    '<div class="stat-label" style="font-size:12px;color:var(--text-muted)">' + mcEsc(label) + '</div>' +
    '<div class="stat-value" style="font-size:22px;font-weight:700">' + mcEsc(value) + '</div>' +
    (note ? '<div class="form-hint" style="margin:2px 0 0">' + mcEsc(note) + '</div>' : '') +
    '</div>';
}

async function mcLoad() {
  var wrap = document.getElementById('mcWrap');
  if (!wrap) return;
  var ov = null, list = [];
  try {
    ov = await API.get('/mail-compliance/overview');
  } catch (e) {
    wrap.innerHTML = '<div class="card"><div class="card-body"><p>Delivery evidence could not be read: ' +
      mcEsc(e.message) + '</p></div></div>';
    return;
  }
  try {
    var r = await API.get('/mail-compliance/suppressions');
    list = (r && r.suppressions) || [];
  } catch (e) {
    wrap.innerHTML = '<div class="card"><div class="card-body"><p>The do-not-mail list could not be read: ' +
      mcEsc(e.message) + '</p></div></div>';
    return;
  }
  var cp = null;
  try {
    cp = await API.get('/mail-compliance/unsubscribe-page');
  } catch (e) { cp = null; }
  MC.copy = cp;
  var lanes = null;
  try {
    lanes = await API.get('/mail-compliance/domains');
  } catch (e) { lanes = null; }
  MC.lanes = lanes;
  MC.rows = list;
  mcRender(ov || {}, list, wrap);
}

function mcRender(ov, list, wrap) {

    tiles = mcTile('Mail sent (30 days)', String(rates.sent || 0), 'No delivery events yet — rates appear once the provider reports.');
  } else {

      mcTile('Mail sent (30 days)', String(rates.sent || 0)) +
      mcTile('Delivered', (rates.delivery_rate || 0) + '%', String(rates.delivered || 0) + ' messages') +
      mcTile('Bounced', (rates.bounce_rate || 0) + '%', String(rates.bounced || 0) + ' messages') +
      mcTile('Complained', (rates.complaint_rate || 0) + '%',

    '</div></div></div>';

  var rows = list.map(function (r) {

    return '<tr>' +

      '<td>' + mcEsc(when) + '</td>' +
      '<td><button class="btn btn-ghost btn-sm" data-ops="mc-remove" onclick="mcRemove(\'' +
        mcEsc(r.id) + '\')">Remove</button></td>' +

    : '<div class="card"><div class="card-body"><div class="empty-state">' +
      '<div class="empty-icon">🛡️</div><h3>Nobody has asked this account to stop</h3>' +

      '</div></div></div>';

    var L = MC.lanes || {};
