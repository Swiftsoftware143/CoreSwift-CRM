async function loadBrandingTab() {
  const status = document.getElementById('brandingStatus');
  try {
    const d = await API.get('/account/' + currentAid() + '/settings');
    const b = (d && d.settings && d.settings.email_branding) || {};
    const nameEl = document.getElementById('brandName');
    const colorEl = document.getElementById('brandColor');
    // The SERVER's stored values, not the last thing typed: the panel renders what is in the row.
    if (nameEl) nameEl.value = b.brand_name || '';
    if (colorEl && /^#[0-9a-fA-F]{6}$/.test(b.brand_color || '')) colorEl.value = b.brand_color;
    renderBrandLogoPreview(b.logo_url || '');
    // oninput (not addEventListener): loadBrandingTab runs on every tab entry, and a stacked
    // listener would repaint the preview N times for one keystroke.
    const nameIn = document.getElementById('brandName');
    const colourIn = document.getElementById('brandColor');
    if (nameIn) nameIn.oninput = markBrandingUnsaved;
    if (colourIn) colourIn.oninput = markBrandingUnsaved;
    loadBrandPreview();
    loadSignatureFields();
    if (status) status.textContent = '';
  } catch (e) {
    if (status) status.textContent = 'Could not load branding: ' + e.message;
  }
}

// The email this account REALLY sends, fetched from the mail path — never redrawn here.
//
// GET /api/account/branding/preview-body renders the subject and body through the SAME renderer
// every real send uses (template selection, merge fields, branded header, support footer) and
// returns them WITHOUT mailing anything. Before this the pane mirrored `Branding::header_html` in
// JavaScript and printed a made-up body line, so it could describe a message this app never emits
// and could not prove an uploaded logo reached the mail. With the renderer's own output on screen
// there is no second implementation to drift.
function markBrandingUnsaved() {
  const note = document.getElementById('brandPreviewNote');
  if (note) note.textContent = 'Unsaved changes — press Save branding to see them in this preview.';
}

async function loadBrandPreview() {
  const frame = document.getElementById('brandPreviewFrame');
  if (!frame) return;
  const subject = document.getElementById('brandPreviewSubject');
  const note = document.getElementById('brandPreviewNote');
  try {
    const d = await API.get('/account/branding/preview-body');
    // `sandbox=""` on the frame means this markup cannot run a script or reach this document.
    const body = d.html
      ? d.html
      : '<pre style="white-space:pre-wrap;margin:0;font:13.5px/1.5 -apple-system,\'Segoe UI\',Roboto,Helvetica,Arial,sans-serif;color:#111827">' +
        escapeHtml(d.text || '') + '</pre>';
    frame.srcdoc = '<!doctype html><meta charset="utf-8">' +
      '<body style="margin:0;padding:16px 14px;background:#fff;font:13.5px/1.5 -apple-system,\'Segoe UI\',Roboto,Helvetica,Arial,sans-serif;color:#111827">' +
      body + '</body>';
    if (subject) subject.textContent = d.subject ? ('Subject: ' + d.subject) : '';
    if (note) {
      note.textContent = d.branded
        ? (d.logo_is_own

            : 'The real message, built from your saved display name and colour.')

    }

    if (subject) subject.textContent = '';

// Mail that same message to the operator's OWN address (POST /api/account/branding/preview,
// kanban t_90845bc1). The pane proves what the mailer BUILDS; only a real inbox proves what a
// customer's client RENDERS. No body is sent: the server reads the recipient from the signed-in
// user's own row, so this control can never mail anyone else. The sentence under the preview is the
// SERVER'S `detail`, printed verbatim — never composed here, so the console cannot claim a send the
// backend refused.
async function sendBrandPreviewEmail() {
  const note = document.getElementById('brandPreviewNote');
  const btn = document.querySelector('[data-ops="branding-preview-send"]');
  if (btn) btn.disabled = true;
  if (note) note.textContent = 'Sending a test email to your own address…';
  try {
    const d = await API.post('/account/branding/preview');
    if (note) note.textContent = (d && d.detail) || 'No preview was sent.';
  } catch (e) {
    if (note) note.textContent = 'Could not send the test email: ' + ((e && e.message) || 'unknown error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function saveSignature() {
  const box = document.getElementById('sigPreview');
  const val = (id) => ((document.getElementById(id) || {}).value || '').trim();
  const payload = {
    full_name: val('sigName'),
    job_title: val('sigTitle'),
    company: val('sigCompany'),
    phone: val('sigPhone'),
    line: val('sigLine'),
  };
  if (box) box.textContent = 'Saving\u2026';
  try {
    const d = await API.put('/private-email/signature/workspace', payload);
    await loadSignatureFields();
    // The SERVER's sentence, printed verbatim: the console never composes a claim of its own.
    if (box && d && d.detail) {
      const note = document.createElement('div');
      note.style.cssText = 'font-size:12px;color:var(--text-muted);margin-top:8px';
      note.textContent = d.detail;
      box.appendChild(note);
    }
  } catch (e) {
    if (box) box.textContent = 'Could not save the signature: ' + ((e && e.message) || 'unknown error');
  }
}

async function saveBranding() {
  const status = document.getElementById('brandingStatus');
  const name = (document.getElementById('brandName') || {}).value || '';
  const color = (document.getElementById('brandColor') || {}).value || '';
  try {
    // Full-document read-modify-write so no other setting of this account is lost. `logo_url` is
    // ECHOED from the stored document — the logo endpoints are its only writer, and the server
    // inherits the stored value anyway when the key is omitted (one writer per field).
    const cur = await API.get('/account/' + currentAid() + '/settings');
    const settings = Object.assign({}, (cur && cur.settings) || {});
    const prev = settings.email_branding || {};
    settings.email_branding = { brand_name: name, brand_color: color, logo_url: prev.logo_url || '' };
    // The workspace settings route is PATCH /api/account/:id/settings — a PUT answers 405 (measured
    // in a real browser on the live console, kanban t_feab8aff).
    await API.patch('/account/' + currentAid() + '/settings', settings);
    if (status) status.textContent = 'Branding saved.';
    loadBrandPreview();
  } catch (e) {
    if (status) status.textContent = 'Could not save: ' + e.message;
  }
}

// The logo endpoints write `logo_url` with jsonb_set, and jsonb_set cannot CREATE a missing
// intermediate key: on an account whose settings have no `email_branding` object yet — i.e. anyone
// who uploads a logo before ever saving a name or colour — the pointer was silently dropped. The
// tab then re-read "No logo uploaded" after a reload, and Branding::load (which reads only that
// document) put NO header at all in the workspace's mail. Persist the pointer through the settings
// write, which stores the whole document, so the logo survives a reload and reaches every email.
// Name and colour come from the STORED document, never from the inputs, so an upload cannot save a
// half-typed brand name the customer has not pressed Save on.
async function persistLogoUrl(logoUrl) {
  const cur = await API.get('/account/' + currentAid() + '/settings');
  const settings = Object.assign({}, (cur && cur.settings) || {});
  const prev = settings.email_branding || {};
  settings.email_branding = {
    brand_name: prev.brand_name || '',
    brand_color: prev.brand_color || '',
    logo_url: logoUrl,
  };
  await API.patch('/account/' + currentAid() + '/settings', settings);
}

async function uploadBrandingLogo() {
  const status = document.getElementById('brandingStatus');
  const input = document.getElementById('brandLogoFile');
  if (!input || !input.files || !input.files[0]) { if (status) status.textContent = 'Choose an image first.'; return; }
  const file = input.files[0];
  // The picker checks the SAME ceiling the server does, so the two refuse the same set of files.
  if (file.size > BRANDING_MAX_BYTES) {
    if (status) status.textContent = 'That image is ' + file.size + ' bytes; the limit is ' + BRANDING_MAX_BYTES + '.';
    return;
  }
  const fd = new FormData();
  fd.append('file', file, file.name);
  try {
    const res = await fetch('/api/account/branding/logo', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + STATE.token }, body: fd,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    await persistLogoUrl(d.logo_url || '');
    renderBrandLogoPreview(d.logo_url);
    if (status) status.textContent = 'Logo uploaded.';
  } catch (e) { if (status) status.textContent = 'Upload failed: ' + e.message; }
}

async function removeBrandingLogo() {
  const status = document.getElementById('brandingStatus');
  try {
    const res = await fetch('/api/account/branding/logo', {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + STATE.token },
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await persistLogoUrl('');
    renderBrandLogoPreview('');
    if (status) status.textContent = 'Logo removed. Your name and colour were kept.';
  } catch (e) { if (status) status.textContent = 'Remove failed: ' + e.message; }
}

// ── Duplicates: the pipeline-cleanliness report ── (kanban 2026-11-01)
// GET /api/account-match/duplicates answers
//   { groups:[{kind:'phone'|'name', key, count, contact_ids:[uuid]}], total_groups, contacts_in_groups }
// — contacts of the SIGNED-IN workspace that share a normalised phone number, or a normalised
// first+last name. Email is deliberately not a key: `idx_contacts_tenant_email` is unique per
// tenant, so an email collision is impossible and a report keyed on it could only return {}.
//
// The route is gated by the `account_match` module (granted on every paid plan, off on Free), so a
// Free workspace gets a 402 and this pane must print the SERVER's sentence rather than an empty
// "no duplicates" table — "you have none" and "you are not allowed to look" are different answers.
//
// This pane is READ-ONLY on purpose: nothing here merges. The engine explicitly names the rows an
// operator has to look at instead of silently merging them, so every row carries an Edit button into
// the existing contact editor (editContact) and the operator decides what the merged record says.
// The name lookup is paged (100/page, the server's ceiling) and BOUNDED: if a group names a contact
// beyond the page budget the row falls back to the id, and the header says the lookup was partial,
// so a truncated read can never look like "that contact does not exist".
const DUP_MAX_GROUPS = 25;
const DUP_PAGE_BUDGET = 5; // x100 = at most 500 contacts resolved by name

function duplicatesShell() {
  return pageHeader('Duplicates', 'Contacts in this account that look like the same person',
    '<button class="btn btn-secondary btn-sm" onclick="loadDuplicatesTab()">Refresh</button>') +
  '<div id="duplicatesBody"><div class="loading-wrap"><div class="spinner"></div> Loading duplicates...</div></div>';
}

async function loadDuplicatesTab() {
  const el = document.getElementById('duplicatesBody');
  if (!el) return;
  el.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Loading duplicates...</div>';
  let report;
  try {
    report = await API.get('/account-match/duplicates?limit=' + DUP_MAX_GROUPS);
  } catch (e) {
    // The 402 arm carries the server's own sentence (API.call fills err.planMessage) — print that,
    // never a bare "HTTP 402", and never an empty table a reader would mistake for a clean bill.
    if (e && e.planGate) {
      el.innerHTML = card('Duplicate detection is not on this plan',
        '<p style="color:var(--text-secondary);margin:0 0 10px">' + escapeHtml(e.planMessage || 'This feature is not included in your current plan.') + '</p>' +
        '<button class="btn btn-primary btn-sm" onclick="showUpgradeBanner()">See plans</button>');
      return;
    }
    el.innerHTML = card('Duplicates unavailable',
      '<p style="color:var(--text-secondary);margin:0">' + escapeHtml(e && e.message ? e.message : String(e)) + '</p>');
    return;
  }

  const groups = (report && Array.isArray(report.groups)) ? report.groups : [];
  const totalGroups = (report && typeof report.total_groups === 'number') ? report.total_groups : groups.length;
  const inGroups = (report && typeof report.contacts_in_groups === 'number') ? report.contacts_in_groups : 0;

  if (!groups.length) {
    el.innerHTML = card('No duplicates found',
      '<div class="empty-state"><div style="font-size:32px">✅</div>' +
      '<h3>Every contact looks distinct</h3>' +
      '<p style="color:var(--text-secondary)">No two active contacts in this account share a phone number or a first and last name. This screen re-reads the report every time you open it — run it again after an import.</p></div>');
    return;
  }

  // Resolve the ids the report named to real people, so a row reads "Dana Ruiz" and not a uuid.
  const wanted = new Set();
  groups.slice(0, DUP_MAX_GROUPS).forEach(function (g) {
    (g.contact_ids || []).forEach(function (id) { wanted.add(String(id)); });
  });
  const byId = {};
  let resolvedAll = true;
  try {
    for (let pg = 1; pg <= DUP_PAGE_BUDGET; pg++) {
      const rows = famList(await API.get('/contacts?page=' + pg + '&per_page=100'), 'contacts');
      rows.forEach(function (c) { byId[String(c.id)] = c; });
      if (rows.length < 100) break;
      const stillMissing = [...wanted].filter(function (id) { return !byId[id]; });
      if (!stillMissing.length) break;
      if (pg === DUP_PAGE_BUDGET) resolvedAll = false;
    }
  } catch (_) {
    resolvedAll = false; // names are a nicety; the ids and the Edit button still work
  }
  const missingNames = [...wanted].filter(function (id) { return !byId[id]; }).length;
  if (missingNames) resolvedAll = false;

  function who(id) {
    const c = byId[String(id)];
    if (!c) return { name: String(id).slice(0, 8) + '…', sub: 'not on the first pages of Contacts' };
    const nm = ((c.first_name || '') + ' ' + (c.last_name || '')).trim() || c.name || '(no name)';
    const bits = [];
    if (c.email) bits.push(c.email);
    if (c.phone) bits.push(c.phone);
    return { name: nm, sub: bits.join(' · ') || 'no email or phone on file' };
  }

  const phoneGroups = groups.filter(function (g) { return g.kind === 'phone'; });
  const nameGroups = groups.filter(function (g) { return g.kind === 'name'; });

  function groupCard(g, title, why) {
    const ids = (g.contact_ids || []);
    const rows = ids.map(function (id) {
      const w = who(id);
      return [
        escapeHtml(w.name),
        escapeHtml(w.sub),
        '<button class="btn btn-ghost btn-xs" onclick="editContact(\'' + String(id) + '\')">Edit</button>'
      ];
    });
    return card(title + ' — ' + escapeHtml(g.key) + ' <span class="badge">' + ids.length + ' records</span>',
      '<p style="color:var(--text-secondary);font-size:12px;margin:0 0 8px">' + escapeHtml(why) + '</p>' +
      dataTable(['Contact', 'Email · Phone', ''], rows, 'No contacts in this group.'));
  }

  let h = card('What this report is',
    '<p style="margin:0;color:var(--text-secondary);font-size:13px">' +
    escapeHtml(String(inGroups)) + ' active contacts sit in ' + escapeHtml(String(totalGroups)) +
    ' group' + (totalGroups === 1 ? '' : 's') + ' that look like the same person — ' +
    'by shared phone number, or by the same first and last name. Nothing is merged automatically: ' +
    'open a record, decide which one you keep, and edit or delete the others on the Contacts screen.' +
    (resolvedAll ? '' : ' <strong>Some names could not be resolved</strong> (the lookup stops after ' +
      (DUP_PAGE_BUDGET * 100) + ' contacts) — those rows show the record id instead, and their Edit button still opens the right contact.') +
    '</p>');
  h += '<br>';

  if (phoneGroups.length) {
    h += '<h3 style="margin:0 0 8px">Same phone number (' + phoneGroups.length + ')</h3>';
    phoneGroups.forEach(function (g) {
      h += groupCard(g, '📞 Share', 'These records have the same phone number once punctuation and spacing are ignored.');
      h += '<div style="height:10px"></div>';
    });
    h += '<br>';
  }
  if (nameGroups.length) {
    h += '<h3 style="margin:0 0 8px">Same name (' + nameGroups.length + ')</h3>';
    nameGroups.forEach(function (g) {
      h += groupCard(g, '👤 Share', 'These records have the same first and last name. Two real people can share a name — this is a prompt to look, not a verdict.');
      h += '<div style="height:10px"></div>';
    });
  }
  if (totalGroups > groups.length) {
    h += '<p style="color:var(--text-secondary);font-size:12px">Showing the first ' + groups.length +
         ' of ' + escapeHtml(String(totalGroups)) + ' groups.</p>';
  }
  el.innerHTML = h;
}

// ── BYOK / OAuth-gated blocks (t_cb0ddb83) ─────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
// BYOK / OAuth-gated blocks — google-calendar, telnyx, private-email, native sync
//
// Every route in these four blocks was registered on the backend with no shipped
// caller. This is the caller. Ground rules that shaped it:
//  * a PER-TENANT credential (provider_keys, via the Integration Center) is the only
//    way in. With no key there is no fake success: each surface renders the exact
//    sentence the API answered, plus where to fix it;
//  * a machine surface (Google's OAuth redirect, provider webhooks) is never driven
//    from here — Google calls it, this only STARTS the flow;
//  * every request body is what the Rust struct actually requires, probed live first
//    (send-sms wants from/to/body; numbers wants `number`; sync/pull wants
//    entity_type; auto-replies wants domain_id; send wants from_address).
// ═══════════════════════════════════════════════════════════════════════════════

// ── Google Calendar mirroring: rendered inside the Booking screen ─────────────
const GC = { configured: false, items: [], loaded: false };

// ── The hosted calendar address ────────────────────────────────────────────────────────────────
// GET /api/calendar-host returns the address and its custom-domain state. Nothing here is invented:
// every sentence reads a field the server sent, so "verified" on screen means a request to that
// domain really reached this account.
let CALHOST = null;

async function loadCalendarHost() {
  const el = document.getElementById('calHost');
  if (!el) return;
  try {
    CALHOST = await API.get('/calendar-host');
    calHostRender();
  } catch (e) {

function calHostBadge(status) {
  if (status === 'verified') return '<span class="badge badge-success">domain verified</span>';
  if (status === 'pending') return '<span class="badge badge-warning">waiting for DNS</span>';
  return '<span class="badge badge-muted">system address only</span>';
}

/// The address that WORKS RIGHT NOW. A custom domain is only the customer's address once a request
/// to it has really reached this account ('verified'); until then the system address is the live
/// one and the custom domain is a target they are still pointing DNS at. Showing an unpointed domain
/// as "your calendar address … works right away" would hand the customer a broken address to print.
function calHostShownUrl() {
  if (!CALHOST) return '';
  if (CALHOST.custom_domain && CALHOST.custom_domain_status === 'verified') {
    return CALHOST.public_url || CALHOST.calendar_url;
  }
  return CALHOST.calendar_url;
}

function calHostSay(text, bad) {
  const st = document.getElementById('calHostStatus');
  if (!st) return;
  st.textContent = text || '';
  st.style.color = bad ? '#b42318' : 'var(--text-muted)';
}

function calHostCopy() {
  const url = calHostShownUrl();
  if (!url) return;
  const done = function () { calHostSay('Address copied.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, function () { calHostSay(url); });
  } else {
    calHostSay(url);
  }
}

async function calHostSaveSub() {
  const inp = document.getElementById('calHostSub');

async function calHostSaveDomain() {

function gcRender() {

  if (!el) return;
  const rows = GC.items.map(c => {

      : '<span class="badge badge-muted">not linked</span>';

      escapeHtmlAttr(c.id) + '">Connect Google Calendar</button>' +
      ' <button class="btn btn-secondary btn-xs" data-gc="edit" data-id="' +
      escapeHtmlAttr(c.slug) + '">Edit</button>';

      actions += ' <button class="btn btn-secondary btn-xs" data-gc="sync" data-id="' +
        escapeHtmlAttr(c.id) + '">Sync now</button>';
    }
    // Per-calendar own address (kanban t_d4ac5433): the owner may give one calendar its own
    // subdomain; the account then becomes the first path segment of that calendar's URL.
    const ownAddress = c.subdomain
      ? '<code>' + escapeHtml(c.subdomain) + '</code>' +

  });

  el.innerHTML = card('📅 Booking calendars &rarr; Google Calendar',
      '<p style="color:var(--text-secondary);margin:0">CoreSwift pushes a calendar\'s bookings OUT as Google Calendar events and pulls busy times back IN. ' +
      (GC.configured
        ? 'A Google OAuth client is stored on this account, so consent can start now.'
        : '<strong>No Google OAuth client is stored on this account yet.</strong> Add your client ID and secret under <em>Provider keys</em> in the ' +
          'Integration Center — the connect button will then print the exact redirect URI to register on your Google client.') +
      '</p>') +
    dataTable(['Calendar', 'Slug', 'Google Calendar', 'Own address', ''], rows,
      'No booking calendars yet — use “+ New Calendar” to create one.');

function gcBind(root) {
  root.querySelectorAll('[data-gc]').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.getAttribute('data-gc');
      const id = b.getAttribute('data-id');
      if (act === 'connect') gcConnect(id, b);
      else if (act === 'sync') gcSync(id, b);
      else if (act === 'edit') gcEditCalendar(id);
      else if (act === 'setsub') gcSetSubdomain(id);
      else if (act === 'clearsub') gcClearSubdomain(id);
    });
  });
}

async function gcConnect(calendarId, btn) {
  const flow = document.getElementById('gcFlow');
  if (btn) btn.disabled = true;
  try {
    const d = await API.get('/google-calendar/connect-url?calendar_id=' + encodeURIComponent(calendarId));
    if (flow) {
      flow.innerHTML = card('🔗 Finish the Google handshake',
        '<p style="color:var(--text-secondary)">1. This deployment\'s callback URL — it must be registered byte-for-byte on your Google OAuth client:<br>' +
        '<code>' + escapeHtml(d.redirect_uri || '') + '</code></p>' +
        '<p style="color:var(--text-secondary)">2. Open the consent screen and approve. Google sends the browser back to CoreSwift, which stores the refresh token on this calendar.</p>' +
        '<a class="btn btn-primary btn-sm" href="' + escapeHtmlAttr(d.connect_url || '#') + '" target="_blank" rel="noopener">Open Google consent</a>');

  } catch (e) {
    if (flow) flow.innerHTML = icErr('Google Calendar is not ready for this account', e.message);
    toast('Connect failed: ' + e.message, 'error');

async function gcSync(calendarId, btn) {
  const flow = document.getElementById('gcFlow');
  if (btn) btn.disabled = true;
  try {
    const r = await API.post('/google-calendar/sync/' + encodeURIComponent(calendarId), { full_sync: true });
    const pushed = (r && r.pushed_events) || [];
    const pulled = (r && r.pulled_events) || [];
    toast('Sync complete — pushed ' + pushed.length + ', pulled ' + pulled.length, 'success');

        '<p style="color:var(--text-secondary);margin:0">pushed ' + pushed.length + ' · pulled ' + pulled.length + '</p>');
    }
  } catch (e) {
    toast('Sync failed: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── Telnyx tab: the account's own Telnyx key, numbers and outbound SMS ─────────
const TX = { config: null, numbers: [], available: null };

function telnyxShell() {
  return pageHeader('Telnyx SMS/Voice', 'Send SMS and manage the numbers this account owns',
    '<button class="btn btn-secondary btn-sm" onclick="switchTab(\'integrations\')">🔑 Telnyx credentials</button>') +
    '<div id="txConfig"><div class="loading-wrap"><div class="spinner"></div> Loading Telnyx configuration...</div></div>' +
    '<br><div id="txNumbers"><div class="loading-wrap"><div class="spinner"></div> Loading numbers...</div></div>' +

}

async function loadTelnyxTab() {
  const cfgEl = document.getElementById('txConfig');
  if (!cfgEl) return;
  let cfg = null, cfgErr = null, nums = [], numErr = null;
  try { cfg = await API.get('/telnyx/config'); } catch (e) { cfgErr = e.message; }
  try { const d = await API.get('/telnyx/numbers'); nums = (d && d.items) || []; } catch (e) { numErr = e.message; }
  TX.config = cfg; TX.numbers = nums;

  if (cfgErr) {
    cfgEl.innerHTML = icErr('Could not read the Telnyx configuration', cfgErr);
  } else {
    const on = !!(cfg && cfg.api_key_set);
    cfgEl.innerHTML = card('☎️ Telnyx configuration',
      '<p style="color:var(--text-secondary)">Mode: <strong>' + escapeHtml((cfg && cfg.mode) || 'none') + '</strong>' +
      (on ? ' · key <code>' + escapeHtml((cfg && cfg.api_key_masked) || '') + '</code>' : '') + '</p>' +
      (on
        ? '<p style="color:var(--text-secondary);margin:0">Reads and sends below use the key stored on THIS account.</p>'
        : '<p style="color:var(--text-secondary);margin:0"><strong>Telnyx is not configured for this account.</strong> Number search and sending both call ' +
          'api.telnyx.com, so nothing below can succeed until a key is stored. Add it here or under <em>Provider keys</em> in the ' +
          'Integration Center — both write the same per-account slot (never a platform-wide default).</p>'),
      '<button class="btn ' + (on ? 'btn-secondary' : 'btn-primary') + ' btn-sm" onclick="txOpenKey()">' +
      (on ? 'Replace Telnyx key' : 'Add Telnyx key') + '</button>');
  }

  const numEl = document.getElementById('txNumbers');
  if (numErr) {
    numEl.innerHTML = icErr('Could not read this account\'s numbers', numErr);
  } else {
    const rows = TX.numbers.map(n => [
      '<code>' + escapeHtml(n.phone_number || '') + '</code>',
      escapeHtml(n.friendly_name || '—'),
      escapeHtml(n.provider || 'telnyx'),
      n.is_active ? '<span class="badge badge-success">active</span>' : '<span class="badge badge-muted">inactive</span>',
      '<button class="btn btn-ghost btn-xs" data-tx="release" data-id="' + escapeHtmlAttr(n.id) + '">Release</button>'
    ]);
    numEl.innerHTML = card('📱 Numbers this account owns',
      '<p style="color:var(--text-secondary);margin:0">An outbound SMS can only be sent FROM a number listed here — the API refuses any other sender.</p>',
      '<button class="btn btn-primary btn-sm" onclick="txOpenAddNumber()">+ Add number</button>') +
      dataTable(['Number', 'Name', 'Provider', 'State', ''], rows,
        'No numbers on this account yet — add one, or search Telnyx for an available number below.');
  }
  txRenderSend();
  txRenderAvailable();
  txBind(document.getElementById('tabPanels'));
}

function txConfigured() { return !!(TX.config && TX.config.api_key_set); }

function txRenderSend() {
  const el = document.getElementById('txSend');
  if (!el) return;
  const options = TX.numbers.filter(n => n.is_active)
    .map(n => '<option value="' + escapeHtmlAttr(n.phone_number) + '">' + escapeHtml(n.phone_number) + '</option>').join('');
  const blocked = !txConfigured()
    ? 'Telnyx is not configured for this account — add a key above before sending.'
    : (TX.numbers.length === 0
        ? 'This account owns no numbers yet, and the API only sends from a number you own.'
        : '');
  el.innerHTML = card('✉️ Send an SMS',
    (blocked ? '<p style="color:var(--text-secondary)">' + escapeHtml(blocked) + '</p>' : '') +
    '<div class="form-group"><label for="txFrom">From</label><select id="txFrom">' + (options || '<option value="">no numbers</option>') + '</select></div>' +
    '<div class="form-group"><label>To</label><input type="text" id="txTo" placeholder="+15551234567" autocomplete="off"></div>' +
    '<div class="form-group"><label>Message</label><input type="text" id="txBody" placeholder="Hello from CoreSwift" autocomplete="off"></div>',
    '<button class="btn btn-primary btn-sm" id="txSendBtn"' + (blocked ? ' disabled' : '') + '>Send SMS</button>');
  const b = document.getElementById('txSendBtn');
  if (b) b.addEventListener('click', txSend);
}

async function txSend() {
  const el = document.getElementById('txSendBtn');
  const from = document.getElementById('txFrom').value.trim();
  const to = document.getElementById('txTo').value.trim();
  const body = document.getElementById('txBody').value.trim();
  if (!from || !to || !body) { toast('From, To and Message are all required', 'error'); return; }
  if (el) el.disabled = true;
  try {
    const r = await API.post('/telnyx/send-sms', { from: from, to: to, body: body });
    // A WITHHELD NUMBER IS NOT A SENT TEXT (2026-11-22). The API answers `suppressed` when the
    // number is in the range reserved for fiction: nothing was attempted and nothing was charged,
    // so reporting "SMS sent" would be a lie the operator could only discover from the bill.
    if (r && r.status === 'suppressed') {
      toast('Not sent — ' + ((r && r.detail) || 'this number cannot receive a text'), 'error');
    } else {
      toast('SMS sent — ' + ((r && r.status) || 'ok'), 'success');
    }
    document.getElementById('txBody').value = '';
  } catch (e) {
    toast('Send failed: ' + e.message, 'error');
  } finally {
    if (el) el.disabled = false;
  }
}

function txRenderAvailable() {
  const el = document.getElementById('txAvailable');
  if (!el) return;
  let body = '<p style="color:var(--text-secondary)">Searches Telnyx for numbers you can buy. This call goes straight to api.telnyx.com with this account\'s key.</p>';
  if (TX.available === null) {
    body += '<div class="form-group"><label for="txFilter">Starts with</label>' +
      '<input type="text" id="txFilter" value="305" autocomplete="off"><span class="form-hint">Area code or prefix.</span></div>';
  } else {
    const rows = (TX.available || []).map(n => [
      '<code>' + escapeHtml(n.phone_number || '') + '</code>',
      escapeHtml(n.region || '—'),
      escapeHtml(n.rate_center || '—'),
      escapeHtml(n.cost || '—'),
      '<button class="btn btn-secondary btn-xs" data-tx="claim" data-number="' + escapeHtmlAttr(n.phone_number || '') + '">Claim</button>'
    ]);
    body = dataTable(['Number', 'Region', 'Rate center', 'Monthly', ''], rows,
      'Telnyx returned no numbers for that search.') +
      '<button class="btn btn-ghost btn-sm" style="margin-top:8px" id="txSearchAgain">Search again</button>';
  }
  el.innerHTML = card('🔎 Search available numbers', body,
    TX.available === null ? '<button class="btn btn-secondary btn-sm" id="txSearchBtn"' + (txConfigured() ? '' : ' disabled') + '>Search Telnyx</button>' : '');
  const sb = document.getElementById('txSearchBtn');
  if (sb) sb.addEventListener('click', txSearchAvailable);
  const sa = document.getElementById('txSearchAgain');
  if (sa) sa.addEventListener('click', () => { TX.available = null; txRenderAvailable(); txBind(document.getElementById('tabPanels')); });
  txBind(el);
}

async function txSearchAvailable() {
  const filter = (document.getElementById('txFilter') || {}).value || '305';
  const btn = document.getElementById('txSearchBtn');
  if (btn) btn.disabled = true;
  try {
    const d = await API.get('/telnyx/available?filter=' + encodeURIComponent(filter.trim()) + '&limit=10');
    TX.available = (d && d.items) || [];
    txRenderAvailable();
  } catch (e) {
    TX.available = [];
    txRenderAvailable();
    toast('Search failed: ' + e.message, 'error');
  }
}

    '<input type="text" id="txNewName" autocomplete="off"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="txAddSave">Add number</button>');
  const b = document.getElementById('txAddSave');
  if (b) b.addEventListener('click', async () => {
    const number = document.getElementById('txNewNumber').value.trim();
    if (!number) { toast('Enter the number', 'error'); return; }
    b.disabled = true;
    const payload = { number: number };
    const nm = document.getElementById('txNewName').value.trim();
    if (nm) payload.friendly_name = nm;
    try {
      await API.post('/telnyx/numbers', payload);
      closeModal(); toast('Number added', 'success'); await loadTelnyxTab();
    } catch (e) { toast('Could not add: ' + e.message, 'error'); b.disabled = false; }

async function txRelease(id) {
  if (!confirm('Release this number from your account? Inbound SMS to it will stop arriving as leads.')) return;
  try {
    await API.del('/telnyx/numbers/' + encodeURIComponent(id));
    toast('Number released', 'success'); await loadTelnyxTab();
  } catch (e) { toast('Could not release: ' + e.message, 'error'); }
}

async function txClaim(number) {
  if (!number) return;
  if (!confirm('Claim ' + number + '? If your Telnyx account does not own it, this PURCHASES it and can incur a charge.')) return;
  try {
    await API.post('/telnyx/numbers', { number: number });
    toast(number + ' added to this account', 'success');
    TX.available = null; await loadTelnyxTab();
  } catch (e) { toast('Could not claim: ' + e.message, 'error'); }
}

function txBind(root) {
  if (!root) return;
  root.querySelectorAll('[data-tx]').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.getAttribute('data-tx');
      if (act === 'release') txRelease(b.getAttribute('data-id'));
      else if (act === 'claim') txClaim(b.getAttribute('data-number'));
    });
  });
}

const PE = { domains: [], boxes: [], autoReplies: [], support: null, keys: [], keysError: null, planNote: '', available: true, transport: null };
// The mail client's own host. The vhost (/opt/swift/nginx/sites/mail-coreswift.conf) proxies /api/ to
// THIS same container, so a customer signs in once and reads the same mail here and in the CRM; the
// per-customer branded name (inbox.<their domain>) only answers once THEY finish the CNAME, so the
// button in the Mailboxes list always points at the name that works today.
const MAIL_CLIENT_URL = 'https://inbox.coreswiftcrm.com/';

/* SESSION HANDOFF TO THE MAIL CLIENT (2026-11-20). The mailboxes card says "Open inbox opens the mail
   client where you read and answer what arrives" and the guide says the chosen address travels in the
   URL — but the button carried neither the session nor the address: the customer landed on a login
   form with a password they saw once, in the welcome email. Rewrite the href on the way out with the
   mailbox's own address (?address=) and the SAME session in the URL FRAGMENT (#token=...). A fragment is
   never sent to a server, so the token cannot land in an nginx access log or a Referer header; the mail
   client stores it as its own session and strips it before its first render. DELEGATED, capture phase,
   because the mailbox table is re-rendered after every add/edit. */
document.addEventListener('click', function (ev) {
  var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="https://inbox.coreswiftcrm.com"]') : null;
  if (!a) return;
  var t = '';
  try { t = localStorage.getItem('crm_token') || ''; } catch (e) {}
  var addr = '';
  try {
    var tr = a.closest('tr');
    var code = tr && tr.querySelector('code');
    if (code) addr = (code.textContent || '').trim();
  } catch (e) {}
  var u = 'https://inbox.coreswiftcrm.com/' + (addr ? '?address=' + encodeURIComponent(addr) : '');
  if (t) u += '#token=' + encodeURIComponent(t);
  a.href = u;
}, true);

// ── Mail transport banner (t_d9d6120a) ─────────────────────────────────────────
// Which transport carries THIS workspace's mail, straight from GET /api/comms/providers. The
// delivery path resolves the transport from the same two stores, so this panel cannot name one the
// send path would not use. "none" is rendered as an explicit error: without it, messages are
// queued and then fail permanently without the workspace ever finding out.
function peTransportCard(t) {
  if (!t) return icErr('Mail transport unknown', 'the provider panel returned no transport block, so it cannot say where your mail goes.');
  var dom = escapeHtml(t.domain || ''), from = escapeHtml(t.from || '');
  if (t.source === 'tenant') {
    return card('<span class="badge badge-success">your domain</span> Mail transport',
      '<p style="margin:0">Mail from this account leaves on <code>' + dom + '</code>, sent as <code>' + from + '</code>' +
      (t.byok_source === 'private_email_domains'
        ? ' &mdash; the verified domain you added in this tab.'
        : ' &mdash; the provider domain saved in your provider settings.') +
      ' The transport is decided per message, from this same configuration.</p>');
  }
  if (t.source === 'platform') {
    return card('<span class="badge badge-warning">platform mail transport</span> Mail transport',
      '<p style="margin:0">Mail from this account leaves on the <b>platform mail transport</b> as <code>' + from +
      '</code>, not on a domain you own, so it is the platform (not your brand) that receivers see. ' +
      'Add your own domain below &mdash; Mailgun has to report it as <b>verified</b> &mdash; and mail will leave on your domain instead.</p>');
  }
  return icErr('No mail transport: email cannot be delivered from this account',
    'Nothing is configured to carry this account\u2019s mail, so any message queued now fails permanently. Add a provider domain in this tab before sending.');
}

// ── Plan and limits card (the console's view of mailbox-status) ────────────────
// Every number here comes from GET /api/private-email/mailbox-status, the same read the send path
// makes its own decisions from — so this card cannot promise a limit the server does not enforce.
function pePlanMb(bytes) {
  if (bytes == null) return '—';
  var mb = bytes / (1024 * 1024);
  if (mb >= 1024) return (mb / 1024).toFixed(mb >= 10240 ? 0 : 1) + ' GB';
  return (mb < 10 ? mb.toFixed(1) : String(Math.round(mb))) + ' MB';
}

function pePlanCard(st, domainCount) {
  if (!st) {
    return icErr('Could not read your mailbox plan and limits',
      'the mailbox status endpoint returned no answer, so the limits cannot be shown.');
  }
  var sendBadge = st.can_send
    ? '<span class="badge badge-success">sending allowed</span>'
    : '<span class="badge badge-error">sending blocked</span>';
  var sendLine;
  if (st.can_send) {
    sendLine = 'This account can send mail.';
  } else if (st.plan_sells_sending === false) {
    sendLine = 'Your plan does not sell sending, so mail is receive-only. Upgrade to send from your own domain.';
  } else {
    sendLine = escapeHtml(st.send_blocked_reason || 'This account cannot send mail right now.');
  }
  var cap = st.send_cap_per_day;
  var sendUse = String(st.sent_last_24h == null ? 0 : st.sent_last_24h) +
    (cap ? ' of ' + escapeHtml(String(cap)) + ' sent in the last 24 hours'
         : ' sent in the last 24 hours — your plan has no daily cap');
  var pct = Math.max(0, Math.min(100, Number(st.storage_percent || 0)));
  var colour = st.storage_level >= 100 ? 'var(--error,#dc2626)'
    : (st.storage_level > 0 ? 'var(--warning,#d97706)' : 'var(--success,#16a34a)');
  var storageLine = pePlanMb(st.storage_used_bytes) + ' of ' + pePlanMb(st.storage_quota_bytes) +
    ' used (' + Math.round(pct) + '%)' +
    '<div style="height:6px;background:var(--border,#e5e7eb);border-radius:3px;overflow:hidden;margin:6px 0 2px">' +
    '<div style="height:100%;width:' + pct + '%;background:' + colour + '"></div></div>' +
    (st.attachments_accepted === false
      ? '<div style="color:var(--error,#dc2626);font-size:12px">Storage is full — new attachments are refused until space frees up.</div>'
      : '');
  var rows = [
    ['Sending', sendBadge + ' <span style="color:var(--text-secondary)">' + sendLine + '</span>'],
    ['Today', sendUse],
    ['Storage', storageLine],
    ['Mail kept', escapeHtml(st.retention_sentence || '—')],
    ['Mailboxes', escapeHtml(String((st.mailboxes || []).length)) + ' of ' +
      (st.mailbox_limit == null ? 'unlimited' : escapeHtml(String(st.mailbox_limit)))],
    ['Domains', escapeHtml(String(domainCount == null ? 0 : domainCount)) + ' of ' +
      (st.domain_limit == null ? 'unlimited' : escapeHtml(String(st.domain_limit)))]
  ];
  if (st.on_trial) {
    var trial = st.days_left == null ? 'on trial' : escapeHtml(String(st.days_left)) + ' day(s) left';
    if (st.trial_ends_at) trial += ' — ends ' + escapeHtml(String(st.trial_ends_at).slice(0, 10));
    rows.splice(1, 0, ['Trial', trial]);
  }
  var table = '<table class="data-table" style="width:100%"><tbody>' + rows.map(function (r) {
    return '<tr><th style="text-align:left;white-space:nowrap;vertical-align:top;padding:6px 12px 6px 0">' +
      r[0] + '</th><td style="padding:6px 0">' + r[1] + '</td></tr>';
  }).join('') + '</tbody></table>';
  return card('📊 Your mailbox plan and limits', table);
}

async function loadInboxTab() {
  const el = document.getElementById('peDomains');

  const peSupportEl = document.getElementById('peSupport');
  const peBoxesEl = document.getElementById('peBoxes');
  const peAutoEl = document.getElementById('peAuto');
  const peSendEl = document.getElementById('peSend');
  let domains = [], boxes = [], auto = [], support = null, errs = {};
  try { const d = await API.get('/private-email/domains'); domains = Array.isArray(d) ? d : ((d && (d.items || d.domains)) || []); }
  catch (e) { errs.domains = e.message; }
  try { const d = await API.get('/private-email/boxes'); boxes = Array.isArray(d) ? d : ((d && (d.items || d.boxes)) || []); }
  catch (e) { errs.boxes = e.message; }
  try { const d = await API.get('/private-email/auto-replies'); auto = Array.isArray(d) ? d : ((d && (d.items || d.auto_replies)) || []); }
  catch (e) { errs.autoReplies = e.message; }
  try { support = await API.get('/private-email/support-box'); } catch (e) { errs.support = e.message; }
  // The saved-key store is where a domain's credential can live by reference; read it here so the
  // tab can show a key that exists but cannot be opened (t_72f0bc83).
  let keys = [], keysErr = null;
  try { const d = await API.get('/private-email/keys'); keys = Array.isArray(d) ? d : ((d && (d.items || d.keys)) || []); }
  catch (e) { keysErr = e.message; }
  PE.domains = domains; PE.boxes = boxes; PE.autoReplies = auto; PE.support = support;
  PE.keys = keys; PE.keysError = keysErr;
  // Which transport will carry this account's mail (t_d9d6120a). Read from the same endpoint the
  // delivery path's decision comes from, so this panel cannot promise a transport the send path
  // would not use.
  let transport = null, transportErr = null;
  try { transport = await API.get('/comms/providers'); }
  catch (e) { transportErr = e.message; }
  PE.transport = (transport && transport.email_transport) ? transport.email_transport : null;
  // The plan and the limits under it. /private-email/mailbox-status is the console's own read: the
  // send path consults the same function for can_send / the daily cap, so the card below cannot
  // show a limit the server does not enforce. A failed read paints an error, never a clean sheet.
  const planEl = document.getElementById('pePlan');
  // Read ONCE, above the plan card, and used again by the Mailboxes card below: the create-inbox
  // button and the plan card must not be able to disagree about how many inboxes the plan allows.
  let planStatus = null, planErr = null;
  try { planStatus = await API.get('/private-email/mailbox-status'); }
  catch (e) { planErr = e.message; }
  if (planEl) {
    planEl.innerHTML = planErr
      ? icErr('Could not read your mailbox plan and limits', planErr)
      : pePlanCard(planStatus, domains.length);
  }

  const transportEl = document.getElementById('peTransport');
  if (transportEl) {
    transportEl.innerHTML = transportErr
      ? icErr('Could not read which transport carries your mail', transportErr)
      : peTransportCard(PE.transport);
  }

  if (errs.support) peSupportEl.innerHTML = icErr('Could not read the support box', errs.support);
  else {
    const on = !!(support && support.configured);
    peSupportEl.innerHTML = card('🎫 Support box &rarr; tickets',
      '<p style="color:var(--text-secondary);margin:0">' + (on
        ? 'Mail forwarded to <code>' + escapeHtml(support.email_address || '') + '</code> becomes a support ticket automatically.' +
          (support.forwarding_instructions ? '<br>' + escapeHtml(support.forwarding_instructions) : '')
        : 'No support box yet. Pick one of this account\'s mailboxes and forwarding to it will open tickets automatically.') + '</p>',
      '<button class="btn btn-primary btn-sm" onclick="peOpenSupportBox()">' + (on ? 'Change support box' : 'Set support box') + '</button>');
  }

  if (errs.domains) el.innerHTML = icErr('Could not read your domains', errs.domains);
  else {
    const rows = PE.domains.map(d => [
      '<code>' + escapeHtml(d.domain || '') + '</code>',
      escapeHtml(d.label || '—'),
      escapeHtml(d.provider_type || 'mailgun'),
      peReceivingCell(d),
      peVerifyCell(d),
      peCatchAllCell(d),
      peCredentialCell(d),

      '<p style="color:var(--text-secondary);margin:0">Each domain is the provider-level identity CoreSwift sends and receives with. Credentials are per account, never a platform default.</p>',
      '<button class="btn btn-primary btn-sm" onclick="peOpenAddDomain()">+ Add domain</button>') +
      dataTable(['Domain', 'Label', 'Sending', 'Receiving', 'Verification', 'Catch-all', 'Credential', 'Inbound mail'], rows,
        'No domains on this account yet.') + peKeysCard();
  }

  // ── Mailboxes: the list a customer works from, the door into the mail client, and the create
  // button the plan and the domain's own verification decide ─────────────────────────────────
  // Every control here is an EXISTING route: GET /api/private-email/boxes, POST
  // /api/private-email/boxes ({domain_id, local_part}) and GET /api/private-email/domains/:id/records,
  // whose `can_create_mailbox` is the SERVER's own answer to "may this domain carry an inbox yet".

    boxesFoot = '<p style="color:var(--text-secondary);margin:10px 0 0">Your plan includes ' +

      (boxCount === boxLimit ? 'all of them are' : 'they are all') + ' in use. ' +

      'Add a domain above, add the DNS records it lists, then press <b>Re-check</b> — the create button appears as soon as a domain is verified.</p>';
  } else {
    boxesAction = '<button class="btn btn-primary btn-sm" onclick="peOpenNewBox()">+ New inbox</button>';
  }
  peBoxesEl.innerHTML = card('📬 Mailboxes',
    '<p style="color:var(--text-secondary);margin:0">A mailbox is an address on one of your domains. Outbound mail can only be sent FROM a mailbox; <b>Open inbox</b> opens the mail client where you read and answer what arrives.</p>',
    boxesAction) +
    dataTable(['Address', 'Local part', 'Status', 'Forwarding', 'Actions'],
      PE.boxes.map(b => [
        '<code>' + escapeHtml(b.email_address || '') + '</code>',
        escapeHtml(b.local_part || ''),
        b.status === 'active' ? '<span class="badge badge-success">active</span>' : '<span class="badge badge-muted">' + escapeHtml(b.status || '') + '</span>',
        b.forwarding_enabled ? 'on' : 'off',
        (b.status === 'active'
          ? '<a class="btn btn-ghost btn-xs" href="' + escapeHtmlAttr(MAIL_CLIENT_URL) + '" target="_blank" rel="noopener">Open inbox ↗</a> '

        (b.status === 'active'
          ? ' <button class="btn btn-ghost btn-xs" onclick="peDeactivateBox(\'' + b.id + '\')">Deactivate</button>'
          : '')
      ]),
      'No mailboxes yet — add a domain first.') + boxesFoot;

  if (errs.autoReplies) peAutoEl.innerHTML = icErr('Could not read auto-replies', errs.autoReplies);
  else {
    peAutoEl.innerHTML = card('↩️ Auto-replies',
      '<p style="color:var(--text-secondary);margin:0">Automatic answers for inbound mail on one of your domains.</p>',
      '<button class="btn btn-primary btn-sm" onclick="peOpenAutoReply()">+ New auto-reply</button>') +
      dataTable(['Name', 'Trigger', 'Subject', 'Delay', 'Active', 'Actions'],

          escapeHtml(a.subject || '—'),
          escapeHtml(String(a.delay_minutes == null ? 0 : a.delay_minutes)) + ' min',
          a.is_active ? '<span class="badge badge-success">on</span>' : '<span class="badge badge-muted">off</span>',
          '<button class="btn btn-ghost btn-xs" onclick="peEditAutoReply(\'' + a.id + '\')">Edit</button>' +
          ' <button class="btn btn-ghost btn-xs" onclick="peDeleteAutoReply(\'' + a.id + '\')">Delete</button>'
        ]),
        'No auto-replies yet.');
  }

  const activeBoxes = PE.boxes.filter(b => b.status === 'active')
    .map(b => '<option value="' + escapeHtmlAttr(b.email_address) + '">' + escapeHtml(b.email_address) + '</option>').join('');
  // Keep a half-typed message alive across a re-render. Every control on this panel reloads the tab
  // (catch-all, credential, re-check), and rebuilding the send form used to blank the subject and
  // body mid-sentence — a one-click switch discarding what the customer had typed on the same screen.
  const draft = {};
  ['peFrom', 'peTo', 'peSubject', 'peBody'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) draft[id] = el.value;
  });
  peSendEl.innerHTML = card('✉️ Send from your domain',
    (activeBoxes ? '' : '<p style="color:var(--text-secondary)">No active mailbox on this account yet, and outbound mail must be sent FROM one.</p>') +
    '<div class="form-group"><label for="peFrom">From</label><select id="peFrom">' + (activeBoxes || '<option value="">no mailboxes</option>') + '</select></div>' +
    '<div class="form-group"><label>To</label><input type="text" id="peTo" placeholder="lead@example.com" autocomplete="off"></div>' +
    '<div class="form-group"><label for="peSubject">Subject</label><input type="text" id="peSubject" autocomplete="off"></div>' +
    '<div class="form-group"><label for="peBody">Body</label><input type="text" id="peBody" autocomplete="off"></div>',
    '<button class="btn btn-primary btn-sm" id="peSendBtn"' + (activeBoxes ? '' : ' disabled') + '>Send email</button>');
  const sb = document.getElementById('peSendBtn');

// ── Credential health: a stored key nobody can open must not read as configured ────────────────
// The server decides credential_status / key_status by OPENING the stored ciphertext, never from its
// shape (t_72f0bc83): 'usable' | 'unreadable' | 'empty' | 'missing'. Before this, a row that exists
// but cannot be opened rendered exactly like a healthy one, and the only symptom was a failed send.
function peCredentialCell(d) {
  const s = d.credential_status;
  if (s === 'usable') return '<span class="badge badge-success">readable</span>';
  if (s === 'unreadable') {
    return '<span class="badge badge-error">re-enter key</span> ' +
      '<button class="btn btn-primary btn-xs" onclick="peReenterDomainKey(\'' + d.id + '\')">Re-enter</button>';
  }
  if (s === 'empty') return '<span class="badge badge-warning">empty key</span>';
  return '<span class="badge badge-muted">no key</span>';
}

// ── Catch-all switch (kanban t_5e47191a) ──────────────────────────────────────────────────────
// The column used to be display-only: PATCH /api/private-email/domains/:id accepted
// {catch_all_enabled} and the plan gate answered correctly, but NO shipped surface sent it, so a
// customer who bought catch-all had to call the API. This cell is that missing screen: it reads the
// row's own value and offers the opposite state.
//
// The SERVER is the only judge of the entitlement. On refusal (a free/starter workspace answers 400)
// the toast prints the server's sentence VERBATIM — the plan it names AND its price are read from
// the plan catalogue by the server — instead of a client-side guess about which plans sell it, so
// the copy cannot drift from
// the gate. The success message is only shown when the returned row really carries the new value.
function peCatchAllCell(d) {
  // The stored switch is NOT the entitlement (kanban t_6b54961b). Catch-all is sold by the plan,
  // and the inbound router asks the plan at the moment a delivery needs it, so an account that
  // enabled it and was then moved to a plan that does not sell it keeps this switch remembered
  // while every unmatched delivery is refused. The server reports exactly that state as
  // catch_all_off_plan, and painting "on" there would promise mail the router is dropping — the
  // panel has to say what is actually true, and the server's hint names the one remedy.
  const on = !!d.catch_all_enabled;
  if (d.catch_all_off_plan) {
    // The remembered switch is still a customer setting, so it stays visible and clearable: "Clear"
    // writes catch_all_enabled=false (the server only gates the =true arm), which forgets the
    // preference instead of leaving a value the panel shows and the router ignores.
    return '<span class="badge badge-warning">off — not on your plan</span>' +
      ' <button class="btn btn-ghost btn-xs" title="Forget the remembered catch-all switch"' +
      ' onclick="peToggleCatchAll(\'' + d.id + '\', false)">Clear</button>' +
      (d.catch_all_hint
        ? '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">' + escapeHtml(d.catch_all_hint) + '</div>'
        : '');
  }
  return (on
      ? '<span class="badge badge-success">on</span>'
      : '<span class="badge badge-muted">off</span>') +
    ' <button class="btn btn-ghost btn-xs" onclick="peToggleCatchAll(\'' + d.id + '\', ' + (on ? 'false' : 'true') + ')">' +
    (on ? 'Disable' : 'Enable catch-all') + '</button>';
}

async function peToggleCatchAll(domainId, next) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  const dom = d.domain || 'this domain';
  const btns = document.querySelectorAll('[onclick*="peToggleCatchAll(\'' + domainId + '\'"]');
  Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
  try {
    const r = await API.patch('/private-email/domains/' + encodeURIComponent(domainId),
      { catch_all_enabled: next });
    const got = !!(r && r.catch_all_enabled);
    if (got === next) {
      // Catch-all only DELIVERS if this domain's inbound receiver is armed: without the webhook
      // signing key, POST /api/v1/webhooks/mailgun/inbound refuses every delivery (t_fbd607a7) and
      // the row beside this button says so. Promising "it now lands in your account" while the
      // same row reads "no key — inbound refused" would be a false confirmation.
      const armed = !!(r && r.webhook_signing_key_status === 'usable');
      if (next && !armed) {
        toast('Catch-all on — but this domain has no inbound signing key, so deliveries are still ' +
          'refused. Set the key in the Inbound mail column to start receiving.', 'error');
      } else {
        toast(next
          ? 'Catch-all on — mail to an address that does not exist on ' + dom + ' now lands in this account'
          : 'Catch-all off — mail to an unknown address on ' + dom + ' is now refused', 'success');
      }
    } else {
      toast('Saved, but the server reports catch-all ' + (got ? 'on' : 'off') + ' for ' + dom,
        got ? 'success' : 'error');
    }
    await loadInboxTab();
  } catch (e) {
    // A 400 here is the plan gate's own refusal sentence; print it as the server wrote it.
    toast(e.message, 'error');
    Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
  }
}

// ── Inbound mail: the domain's Mailgun WEBHOOK SIGNING KEY (kanban t_fbd607a7) ─────────────────
// POST /api/v1/webhooks/mailgun/inbound authenticates a delivery with the domain's Mailgun webhook
// signing key (HMAC-SHA256(key, timestamp + token), sent as timestamp/token/signature). Mailgun
// presents no session and cannot carry an internal key, so this signature IS the receiver's only
// credential — and since t_7f134e77 the receiver REFUSES every delivery it cannot authenticate,
// including one for a domain with no key configured. Until this cell existed there was no surface
// anywhere that could write the column, so an account that set up private email received nothing
// and had no way to arm its own receiver.
// The server reports presence + LENGTH only (it opens the stored ciphertext to decide
// `usable | unreadable | missing`); the value is sealed at rest and never echoed back here — the
// same posture as the Mailgun API key field.
// HOW THIS DOMAIN RECEIVES — a choice of its own, not a consequence of how it sends (kanban
// t_04db9228). Only the receivers that exist in this build are offered: Mailgun, SendGrid, or
// nowhere. Switching never touches sending and never deletes mail; the server refuses a switch to
// Mailgun without its signing key, and its sentence is shown verbatim.
function peReceivingCell(d) {
  const cur = d.inbound_provider || 'mailgun';
  const label = cur === 'sendgrid' ? 'SendGrid' : (cur === 'none' ? 'nowhere' : 'Mailgun');
  const opts = [['mailgun', 'Mailgun'], ['sendgrid', 'SendGrid'], ['none', 'Nowhere (send only)']]
    .map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
  return '<span class="badge ' + (cur === 'none' ? 'badge-muted' : 'badge-success') + '">' + label + '</span> '
    + '<select aria-label="Receiving provider for ' + escapeHtmlAttr(d.domain || 'this domain') + '" onchange="peSetReceiving(\'' + d.id + '\', this.value)" style="max-width:150px;margin-left:6px">'
    + opts + '</select>';
}

async function peSetReceiving(domainId, value) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  try {
    const r = await API.patch('/private-email/domains/' + domainId, { receiving_provider: value });
    toast(value === 'none'
      ? 'Mail to ' + (d.domain || 'this domain') + ' will not arrive here any more. Sending is unchanged.'
      : 'Receiving through ' + (value === 'sendgrid' ? 'SendGrid' : 'Mailgun') + ' — sending is unchanged.', 'success');
    if (value === 'sendgrid') {
      toast('Open DNS records on this domain for the MX row and the Inbound Parse address to paste into SendGrid.', 'info');
    }
    return r;
  } catch (e) {
    toast(e.message || 'Could not change the receiving provider', 'error');
  } finally {
    if (typeof loadInboxTab === 'function') loadInboxTab();
  }
}

function peInboundCell(d) {
  // A SendGrid receiver is armed in the customer's own SendGrid account, not by a key here, so the
  // Mailgun signing-key verdict would be a lie on such a domain (and "inbound refused" would be
  // false: mail is arriving).
  if ((d.inbound_provider || 'mailgun') === 'sendgrid') {
    return '<span class="badge badge-success">SendGrid Inbound Parse</span> '
      + '<button class="btn btn-ghost btn-xs" onclick="peShowDomainRecords(\'' + d.id + '\')">DNS records</button>';
  }
  if ((d.inbound_provider || 'mailgun') === 'none') {
    return '<span class="badge badge-muted">send only — nothing arrives</span>';
  }
  const s = d.webhook_signing_key_status;
  const badge = s === 'usable'
    ? '<span class="badge badge-success">signing key set</span>'
    : s === 'unreadable'
      ? '<span class="badge badge-error">key unreadable</span>'
      : '<span class="badge badge-warning">no key — inbound refused</span>';
  const len = s === 'usable'
    ? ' <span style="color:var(--text-muted)">(' + escapeHtml(String(d.webhook_signing_key_length || 0)) + ' chars)</span>'
    : '';
  return badge + len + ' <button class="btn btn-ghost btn-xs" onclick="peWebhookKey(\'' + d.id + '\')">' +
    (s === 'usable' ? 'Rotate' : 'Set key') + '</button>';
}

// The modal that arms (or disarms) the receiver. Rotate = paste a new key; "Turn inbound off" =
// explicit JSON null, which is the ONLY way to clear the column (an empty input means "leave the
// stored key alone" — see UpdateDomainRequest::webhook_signing_key). Both answers are read back
// from the server's own verdict (`webhook_signing_key_status`), never assumed.
function peWebhookKey(domainId) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  const set = d.webhook_signing_key_status === 'usable';
  const dom = d.domain || 'this domain';
  showModal('Inbound webhook signing key — ' + dom,
    '<p style="color:var(--text-secondary)">This is the key Mailgun signs the inbound deliveries it forwards to this domain with. Copy it from Mailgun: <b>Send &rarr; Domains &rarr; ' + escapeHtml(dom) +
    ' &rarr; Webhook signing key</b>. CoreSwift verifies that signature before a delivery becomes a contact or a ticket, so the stored value has to match that domain&rsquo;s key exactly.</p>' +
    '<p style="color:var(--text-secondary)"><b>Without a key, inbound mail for this domain is refused.</b> A delivery CoreSwift cannot authenticate is answered 401 and creates nothing &mdash; no contact, no ticket, no event. A domain you only send from can stay unset.</p>' +
    (set
      ? '<p style="color:var(--text-secondary)">A key is stored (' + escapeHtml(String(d.webhook_signing_key_length || 0)) + ' characters). It is never shown again: paste a new one to rotate it, or turn inbound off to clear it.</p>'
      : '') +
    '<div class="form-group"><label>' + (set ? 'New signing key (paste to rotate)' : 'Webhook signing key') + '</label>' +
    '<input type="password" id="peWhKey" autocomplete="new-password" placeholder="paste the webhook signing key">' +
    '<span class="form-hint">Stored encrypted on this account, never echoed back. What is stored is what the signature is checked against.</span></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peWhSave">Save key</button>' +
    (set ? '<button class="btn btn-secondary" id="peWhClear">Turn inbound off</button>' : ''));
  const save = document.getElementById('peWhSave');
  const clear = document.getElementById('peWhClear');
  if (save) save.addEventListener('click', async function () {
    const v = String(document.getElementById('peWhKey').value || '').trim();
    if (!v) { toast('Paste the domain\'s webhook signing key from Mailgun, or press Cancel', 'error'); return; }
    save.disabled = true;
    if (clear) clear.disabled = true;
    await peWebhookPatch(domainId, save, clear, { webhook_signing_key: v },
      'Signing key saved — inbound mail for this domain can now be authenticated',
      'Saved, but the server still cannot open the stored key');
  });
  if (clear) clear.addEventListener('click', async function () {
    clear.disabled = true;
    if (save) save.disabled = true;
    await peWebhookPatch(domainId, save, clear, { webhook_signing_key: null },
      'Inbound turned off — deliveries for this domain are refused until a key is set again',
      'The server did not clear the key');
  });
}

async function peWebhookPatch(domainId, save, clear, body, okMsg, badMsg) {
  try {
    const r = await API.patch('/private-email/domains/' + encodeURIComponent(domainId), body);
    closeModal();
    const want = body.webhook_signing_key === null ? 'missing' : 'usable';
    const got = r && r.webhook_signing_key_status;
    if (got === want) {
      toast(okMsg, 'success');
    } else if (got === 'unreadable') {
      toast(badMsg, 'error');
    } else {
      toast('Saved — inbound mail for this domain is now ' + (got === 'usable' ? 'authenticated' : 'refused'), got === 'usable' ? 'success' : 'error');
    }
    await loadInboxTab();
  } catch (e) {
    toast('Could not save the signing key: ' + e.message, 'error');
    if (save) save.disabled = false;
    if (clear) clear.disabled = false;
  }
}

// ── Verification re-check (t_f02ade57) ────────────────────────────────────────────────────────
// A domain added while Mailgun still reported it unverified stays `verified=false` until something
// asks Mailgun again. Only a `verified` row carries this account's mail, so without a re-check the
// customer would have to re-paste an API key that was never wrong to get mail onto a domain Mailgun
// had already activated. The server decides: Mailgun's own `state` is the verdict, never this page.
function peVerifyCell(d) {
  const badge = d.verified
    ? '<span class="badge badge-success">verified</span>'
    : '<span class="badge badge-warning">pending DNS</span>';
  return badge
    + ' <button class="btn btn-ghost btn-xs" onclick="peRecheckDomain(\'' + d.id + '\')" title="Ask Mailgun again for this domain">Re-check</button>'
    // The records checklist (kanban t_2b371936). GET /api/private-email/domains/:id/records was
    // reachable ONLY from the first-run setup page, which the Inbox tab renders while the workspace
    // has no mailbox — so every established customer (the ones adding a SECOND domain) had no way to
    // see the DNS values a new domain needs. This is that door, on the row that owns the domain.
    + ' <button class="btn btn-ghost btn-xs" onclick="peShowDomainRecords(\'' + d.id + '\')" title="The DNS records this domain needs">DNS records</button>';
}

// GET /api/private-email/domains/:id/records, on demand, for ANY domain of the account.
//
// The values come from the customer's own mail provider (never a hardcoded DKIM), grouped the way
// the provider reports them, each with a working Copy button and the same Active / Waiting / Needs
// attention vocabulary the setup page uses. A provider that refuses is shown as its own sentence
// where the list would be — never an empty table the customer reads as "nothing to add".
async function peShowDomainRecords(domainId) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  const name = d.domain || 'this domain';
  window.showModal('DNS records for ' + escapeHtml(name),
    '<div id="peRecBody"><div class="loading-wrap"><div class="spinner"></div> Reading from your mail provider...</div></div>',
    '<button class="btn btn-ghost danger-text" onclick="peRemoveDomain(\'' + domainId + '\')" style="margin-right:auto">Remove this domain</button>'
    + '<button class="btn btn-secondary" onclick="closeModal()">Close</button>');
  const body = document.getElementById('peRecBody');
  if (!body) return;
  const statusCell = function (x) {
    if (x.valid === true) return '<span class="badge badge-success">Active</span>';
    if (x.attention) return '<span class="badge badge-warning">Needs attention</span>';
    if (x.valid === false) return '<span class="badge badge-warning">Waiting</span>';
    return '<span class="badge badge-muted">Add this</span>';
  };
  try {
    const r = await API.get('/private-email/domains/' + encodeURIComponent(domainId) + '/records');
    const groups = (r && r.groups) || [];
    const html = groups.map(function (g) {
      const rows = (g.records || []).map(function (x) {
        return '<tr>'
          + '<td><strong>' + escapeHtml(x.type || '') + '</strong></td>'
          + '<td><code style="word-break:break-all">' + escapeHtml(x.name || '') + '</code></td>'
          + '<td><code style="word-break:break-all">' + escapeHtml(x.value || '') + '</code>'
          + (x.purpose ? '<div style="font-size:11px;color:var(--text-secondary)">' + escapeHtml(x.purpose) + '</div>' : '')
          + (x.note ? '<div style="font-size:11px;color:#92400e">' + escapeHtml(x.note) + '</div>' : '')
          + '</td>'
          + '<td>' + (x.priority == null ? '' : escapeHtml(String(x.priority))) + '</td>'
          + '<td>' + statusCell(x) + '</td>'
          + '<td><button class="btn btn-ghost btn-xs" data-copy="' + escapeHtml(x.value || '') + '">Copy</button></td>'
          + '</tr>';
      }).join('');
      return '<h4 style="margin:14px 0 4px">' + escapeHtml(g.title || 'Records') + '</h4>'
        + (rows
          ? '<table style="width:100%;border-collapse:collapse"><thead><tr style="text-align:left">'
            + '<th>Type</th><th>Name</th><th>Value</th><th>Priority</th><th>Status</th><th></th>'
            + '</tr></thead><tbody>' + rows + '</tbody></table>'
          : '<p style="font-size:13px;color:var(--text-secondary)">Your provider reports no records for this group.</p>');
    }).join('');
    // ── WHERE TO POST THE MAIL (David, 2026-11-20) ──────────────────────────────────────────────────
    // The DNS records only get mail as far as the provider. This URL is what turns arrived mail into
    // messages in this account, and EVERY account needs it, so it is shown on every domain rather than
    // left to a setup call. The signing key next to it is stated as a fact, not a hint: a URL with no key
    // leaves the receiver refusing deliveries, which reads as "mail is broken" when it is really
    // "the proof is missing".
    var hook = '';
    if (r && r.inbound_webhook_url) {
      hook = '<h4 style="margin:16px 0 4px">Where your mail provider posts incoming mail</h4>'
        + '<p style="font-size:12px;color:var(--text-secondary);margin:0 0 6px">'
        + 'Paste this into your mail provider as the webhook / route destination (Mailgun: Routes, '
        + 'or the domain\'s receiving settings). It is the same address for every domain.</p>'
        + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        + '<code style="word-break:break-all">' + escapeHtml(r.inbound_webhook_url) + '</code>'
        + '<button class="btn btn-ghost btn-xs" data-copy="' + escapeHtmlAttr(r.inbound_webhook_url) + '">Copy</button>'
        + '</div>'
        + (r.inbound_signing_key_configured
            ? '<p style="font-size:12px;color:#065f46;margin:8px 0 0">Signing key: <strong>set</strong> — deliveries are authenticated.</p>'
            : '<p style="font-size:12px;color:#92400e;margin:8px 0 0">Signing key: <strong>not set</strong> — your provider will reach this '
              + 'address and CoreSwift will refuse every delivery, because nothing proves it came from your provider. '
              + 'Paste the domain\'s <em>webhook signing key</em> (Mailgun: the domain\'s own settings, a 32-character '
              + 'value — not the sending API key) into the signing key field, then send yourself a test.</p>');
    }
    body.innerHTML = (html || '<p>Your mail provider returned no records for this domain.</p>')
      + hook
      + '<p style="font-size:12px;color:var(--text-secondary);margin-top:10px">Add these at your DNS host (Cloudflare: DNS &rarr; Records), then press <strong>Re-check</strong> on the domain row. Mail records stay DNS-only (grey cloud); the branded inbox CNAME is the one exception.</p>';
    Array.prototype.forEach.call(body.querySelectorAll('[data-copy]'), function (b) {
      b.onclick = function () {
        const v = b.getAttribute('data-copy') || '';
        const done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, done);
        else done();
      };
    });
  } catch (e) {
    body.innerHTML = icErr('Could not read this domain\u2019s records', e.message || String(e));
  }
}

// DELETE /api/private-email/domains/:id — the OTHER route that had no caller (kanban t_2b371936).
//
// Deleting a domain also deletes the inboxes ON it (the database cascades), and a customer who
// mistypes a domain or hits the plan's domain ceiling had no way to take it back. A typed
// confirmation names that consequence; mail already received stays (the message rows keep their own
// copy and only lose the mailbox link).
async function peRemoveDomain(domainId) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  const name = d.domain || '';
  const boxes = (PE.boxes || []).filter(function (b) { return b.domain_id === domainId; }).length;
  const typed = window.prompt('Remove ' + name + '?\n\n'
    + (boxes ? boxes + ' inbox' + (boxes === 1 ? '' : 'es') + ' on this domain will be removed too (mail already received stays).\n\n' : '')
    + 'Type the domain name to confirm:');
  if ((typed || '').trim().toLowerCase() !== name.toLowerCase()) {
    toast('Nothing was removed \u2014 the name did not match', 'error');
    return;
  }
  try {
    await API.del('/private-email/domains/' + encodeURIComponent(domainId));
    toast('Domain removed', 'success');
    closeModal();
    await loadInboxTab();
  } catch (e) {
    toast('Could not remove the domain: ' + (e.message || e), 'error');
  }
}

// Asks the provider again for THIS domain only (POST /api/private-email/domains/:id/verify), then
// re-reads the tab so the transport banner above moves with it: the banner is drawn from
// GET /api/comms/providers — the same store the delivery path reads — so it cannot disagree with
// where the mail will really leave from.
async function peRecheckDomain(domainId) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  const btns = document.querySelectorAll('[onclick*="peRecheckDomain(\'' + domainId + '\')"]');
  Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
  try {
    const r = await API.post('/private-email/domains/' + encodeURIComponent(domainId) + '/verify');
    const st = (r && r.mailgun_state) || 'unknown';
    if (r && r.verified && r.changed) {
      toast('Mailgun reports "' + st + '" — mail from this account now leaves on ' + (d.domain || 'your domain'), 'success');
    } else if (r && r.verified) {
      toast('Mailgun reports "' + st + '" — already verified, nothing changed', 'success');
    } else {
      toast('Mailgun still reports "' + st + '" — the platform mail transport keeps carrying your mail until the domain is active', 'error');
    }
    await loadInboxTab();
  } catch (e) {
    toast('Could not re-check: ' + e.message, 'error');
    Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
  }
}

function peKeyStatusBadge(k) {
  if (k.key_status === 'usable') return '<span class="badge badge-success">readable</span>';
  if (k.key_status === 'unreadable') return '<span class="badge badge-error">re-enter key</span>';
  if (k.key_status === 'empty') return '<span class="badge badge-warning">empty</span>';
  return '<span class="badge badge-muted">—</span>';
}

function peKeysCard() {
  if (PE.keysError) return '<br>' + card('🔑 Saved provider keys', icErr('Could not read your saved keys', PE.keysError), '');
  const keys = PE.keys || [];
  const bad = keys.filter(function (k) { return k.key_status === 'unreadable'; }).length;
  const rows = keys.map(function (k) {
    return [
      escapeHtml(k.label || '—'),
      escapeHtml(k.provider || 'mailgun'),
      peKeyStatusBadge(k),
      (k.key_status === 'unreadable'
        ? '<button class="btn btn-primary btn-xs" onclick="peReenterSavedKey(\'' + k.id + '\')">Re-enter</button> '
        : '') +
      '<button class="btn btn-ghost btn-xs" onclick="peDeleteSavedKey(\'' + k.id + '\')">Delete</button>'
    ];
  });
  return '<br>' + card('🔑 Saved provider keys',
    '<p style="color:var(--text-secondary);margin:0">Named keys a domain can pick instead of pasting its own. ' +
    (bad
      ? '<strong>' + bad + ' of ' + keys.length + ' cannot be opened by the server</strong> — sends using them fail until the key is entered again.'
      : 'Every saved key can be opened by the server.') + '</p>',
    '<button class="btn btn-secondary btn-sm" onclick="peAddSavedKey()">+ Add key</button>') +
    dataTable(['Label', 'Provider', 'Status', 'Actions'], rows, 'No saved keys yet.');
}

function peReenterDomainKey(domainId) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  const smtp = d.provider_type === 'smtp';
  showModal('Re-enter the ' + (smtp ? 'SMTP password' : 'Mailgun API key') + ' for ' + (d.domain || 'this domain'),
    '<p style="color:var(--text-secondary)">' + escapeHtml(d.credential_hint || 'The stored credential cannot be opened by this deployment.') + '</p>' +
    '<div class="form-group"><label>New ' + (smtp ? 'SMTP password' : 'Mailgun API key') + '</label>' +
    '<input type="password" id="peReKey" autocomplete="new-password" placeholder="paste the credential">' +
    '<span class="form-hint">Stored encrypted, never echoed back.</span></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peReKeySave">Save and re-check</button>');
  const b = document.getElementById('peReKeySave');
  if (!b) return;
  b.addEventListener('click', async function () {
    const v = String(document.getElementById('peReKey').value || '').trim();
    if (!v) { toast('Paste the new credential', 'error'); return; }
    b.disabled = true;
    try {
      const r = await API.patch('/private-email/domains/' + encodeURIComponent(domainId),
        smtp ? { smtp_password: v } : { mailgun_api_key: v });
      closeModal();
      if (r && r.credential_status === 'usable') toast('Credential saved — the domain can send again', 'success');
      else toast('Saved, but the stored credential still cannot be opened', 'error');
      await loadInboxTab();
    } catch (e) { toast('Could not save the credential: ' + e.message, 'error'); b.disabled = false; }
  });
}

function peReenterSavedKey(keyId) {
  const k = (PE.keys || []).filter(function (x) { return x.id === keyId; })[0] || {};
  showModal('Re-enter “' + (k.label || 'saved key') + '”',
    '<p style="color:var(--text-secondary)">The stored key cannot be opened by the server. Saving here keeps the same key id, so every domain already using it starts working again — no domain has to be re-pointed.</p>' +
    '<div class="form-group"><label>New key</label><input type="password" id="peReSaved" autocomplete="new-password"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peReSavedSave">Save and re-check</button>');

  if (!b) return;
  b.addEventListener('click', async function () {
    const v = String(document.getElementById('peReSaved').value || '').trim();
    if (!v) { toast('Paste the new key', 'error'); return; }

      const r = await API.post('/private-email/keys', {

    } catch (e) { toast('Could not replace the key: ' + e.message, 'error'); b.disabled = false; }
