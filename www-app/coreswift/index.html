// ========== TEAM & INVITES (POST /api/auth/invite, GET /api/auth/invites) ==========
// The API is the real gate: create_invite/list_invites answer 403 for any role other than
// owner/admin. canManageTeam() only decides whether the controls are rendered at all, so a
// member never sees a button that would dead-end on an error.
function canManageTeam() {
  return !!(STATE.user && (STATE.user.role === 'owner' || STATE.user.role === 'admin'));
}

async function createInvite() {
  if (!canManageTeam()) { toast('Only the owner or an admin can invite teammates', 'error'); return; }
  const sel = document.getElementById('inviteRole');
  const role = sel ? sel.value : 'member';
  const btn = document.getElementById('inviteBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  try {
    const d = await API.post('/auth/invite', { role: role });
    const full = window.location.origin + (d.invite_url || ('/auth/register?invite_token=' + d.invite_token));
    const inp = document.getElementById('inviteUrl');
    if (inp) inp.value = full;
    const box = document.getElementById('inviteResult');
    if (box) box.style.display = 'block';
    toast('Invite link created — ' + (d.role || role) + ', expires in ' + (d.expires_in_days || 7) + ' days', 'success');
    loadInvites();
  } catch (e) {
    toast('Could not create the invite: ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '➕ Create invite link'; }
  }
}

function copyInviteUrl() {
  const inp = document.getElementById('inviteUrl');
  if (!inp || !inp.value) return;
  inp.focus();
  inp.select();
  const done = () => toast('Invite link copied — send it to your teammate', 'success');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(inp.value).then(done, () => { document.execCommand('copy'); done(); });
    } else if (document.execCommand('copy')) { done(); }
  } catch (e) { /* the selection is left in place as the manual fallback */ }
}

async function loadInvites() {
  const wrap = document.getElementById('invitesWrap');
  if (!wrap) return;
  if (!canManageTeam()) { wrap.innerHTML = ''; return; }
  try {
    const d = await API.get('/auth/invites');
    wrap.innerHTML = invitesTable((d && d.invites) || []);
  } catch (e) {
    wrap.innerHTML = card('Invites', '<p style="color:var(--danger,#f66);margin:0">Could not load invites: ' + escapeHtml(e.message) + '</p>');
  }
}

function invitesTable(rows) {
  if (!rows.length) {
    return card('Invites', '<div class="empty-state"><div class="empty-icon">📨</div><h3>No invites yet</h3>' +
      '<p>Create one above — the link is what lets a teammate join this workspace.</p></div>');
  }
  const now = Date.now();
  const body = rows.map(r => {
    const exp = r.expires_at ? new Date(r.expires_at).getTime() : 0;
    const state = r.accepted ? '<span style="color:var(--success,#34d399)">Accepted</span>'
      : (exp && exp < now ? '<span style="color:var(--text-muted)">Expired</span>'
                          : '<span style="color:var(--accent,#38bdf8)">Pending</span>');
    return '<tr>' +
      '<td>' + escapeHtml(r.role || 'member') + '</td>' +
      '<td>' + state + '</td>' +
      '<td>' + escapeHtml(fmtTeamDate(r.expires_at)) + '</td>' +
      '<td>' + escapeHtml(fmtTeamDate(r.created_at)) + '</td>' +
      '<td><code style="font-size:.72rem">' + escapeHtml(String(r.token || '').slice(0, 8)) + '…</code></td>' +
    '</tr>';
  }).join('');
  return card('Invites',
    '<div class="table-wrap"><table><thead><tr><th>Role</th><th>Status</th><th>Expires</th><th>Created</th><th>Token</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div>');
}

function fmtTeamDate(v) { return v ? new Date(v).toLocaleString() : '—'; }

// ========== INIT ==========
window.addEventListener('DOMContentLoaded', () => {
  // Invite landing: POST /api/auth/invite returns /auth/register?invite_token=<uuid>, but
  // nginx try_files sends that path to THIS shell (there is no /auth/register file) — the
  // token used to be dropped on the floor. Hand it to the sign-in page, which can consume it.
  const landingInvite = new URLSearchParams(window.location.search).get('invite_token');
  if (landingInvite && !localStorage.getItem('crm_token')) {
    window.location.replace('/login?invite_token=' + encodeURIComponent(landingInvite));
    return;
  }
  const token = localStorage.getItem('crm_token');
  const userStr = localStorage.getItem('crm_user');
  if (token && userStr) {
    try {
      STATE.token = token;
      STATE.user = JSON.parse(userStr);
      showApp();
    } catch(e) {
      logout(true);
    }
  }
  // Dismiss banner if it was dismissed
  if (localStorage.getItem('crm_banner_dismissed')) {
    document.getElementById('upgradeBanner').classList.add('dismissed');
  }
});

// Close dropdown on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown')) {
    document.getElementById('userMenu').classList.remove('show');
  }
});

// ===== KEYBOARD SHORTCUTS (added 2026-08-21) =====
// Gmail-style navigation. ? = help. g + key = go to tab. single keys = quick actions.
(function () {
  if (window.__crmShortcutsInstalled) return;
  window.__crmShortcutsInstalled = true;

  var pendingG = null; // 'g' two-key navigation buffer
  var gTimer = null;

  // key -> { desc, fn }
  var NAV = {
    d: { desc: 'g d  → Dashboard', tab: 'dashboard' },
    c: { desc: 'g c  → Contacts', tab: 'contacts' },
    o: { desc: 'g o  → Companies', tab: 'companies' },
    p: { desc: 'g p  → Pipelines & Deals', tab: 'pipelines' },
    m: { desc: 'g m  → Campaigns', tab: 'campaigns' },
    l: { desc: 'g l  → Lists', tab: 'lists' },
    a: { desc: 'g a  → Analytics', tab: 'analytics' },
    r: { desc: 'g r  → Rules', tab: 'rules' },
    t: { desc: 'g t  → Tags', tab: 'tags' },
    s: { desc: 'g s  → Lead Scoring', tab: 'lead-scoring' },
    e: { desc: 'g e  → Email Templates', tab: 'email-templates' },
    i: { desc: 'g i  → Messages', tab: 'messages' },
    n: { desc: 'g n  → Notifications', tab: 'notifications' },
    x: { desc: 'g x  → Telnyx SMS/Voice', tab: 'telnyx' },
    k: { desc: 'g k  → Support Tickets', tab: 'tickets' },
    b: { desc: 'g b  → Private Email (Inbox)', tab: 'inbox' },
    y: { desc: 'g y  → Calendar', tab: 'calendar' },
    u: { desc: 'g u  → Bookings', tab: 'bookings' },
    q: { desc: 'g q  → AI Assistant', tab: 'ai-assistant' },
    g: { desc: 'g g  → Tracked Links', tab: 'tracked-links' },
    h: { desc: 'g h  → Checklists', tab: 'checklists' },
    w: { desc: 'g w  → Round Robin', tab: 'round-robin' },
    f: { desc: 'g f  → Profile', tab: 'profile' },
    z: { desc: 'g z  → Integration Center', tab: 'integrations' }
  };

  // single-key quick actions
  var ACTIONS = {
    c: { desc: 'c  → New Contact', fn: function () { showAddContactModal(); } },
    o: { desc: 'o  → New Company', fn: function () { showAddCompanyModal(); } },
    d: { desc: 'd  → New Deal', fn: function () { showAddDealModal(); } },
    l: { desc: 'l  → New List', fn: function () { showAddListModal(); } },
    t: { desc: 't  → New Tag', fn: function () { showAddTagModal(); } },
    k: { desc: 'k  → New Ticket', fn: function () { showAddTicketModal(); } },
    m: { desc: 'm  → Compose Message', fn: function () { showComposeModal(); } },
    p: { desc: 'p  → New Campaign', fn: function () { showAddCampaignModal(); } },
    e: { desc: 'e  → New Email Template', fn: function () { showAddTemplateModal(); } }
  };

  function isTyping(el) {
    if (!el) return false;
    var tag = (el.tagName || '').toLowerCase();
    var editable = el.isContentEditable || el.getAttribute && el.getAttribute('contenteditable') === 'true';
    return tag === 'input' || tag === 'textarea' || tag === 'select' || editable;
  }

  function modalOpen() {
    var el = document.getElementById('modalContainer');
    return !!(el && el.innerHTML && el.innerHTML.trim() !== '');
  }

  function clearG() { pendingG = null; if (gTimer) { clearTimeout(gTimer); gTimer = null; } }

  function toastShortcuts(list) {
    var rows = list.map(function (it) {
      var k = it.desc.split('→')[0].trim();
      var label = it.desc.indexOf('→') > -1 ? it.desc.split('→')[1].trim() : it.desc;
      return '<div class="shortcut-row" style="display:flex;justify-content:space-between;gap:20px;padding:6px 0;border-bottom:1px solid var(--border,#eee)">' +
        '<span style="color:var(--muted,#666)">' + escapeHtml(label) + '</span>' +
        '<code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">' + escapeHtml(k) + '</code></div>';
    }).join('');
    showModal('⌨️ Keyboard Shortcuts',
      '<div style="font-size:13px;max-height:60vh;overflow:auto">' + rows +
      '<div class="shortcut-row" style="padding:6px 0;border-bottom:1px solid var(--border,#eee)"><span style="color:var(--muted,#666)">Help — all shortcuts</span><code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">?</code></div>' +
      '<div class="shortcut-row" style="padding:6px 0"><span style="color:var(--muted,#666)">Close / cancel</span><code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">Esc</code></div>' +
      '</div>',
      '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
  }

  function focusSearch() {
    var first = document.querySelector('#tabPanels input[type="search"], #tabPanels input[placeholder*="earch"], #tabPanels input[placeholder*="Search"]');
    if (first) { first.focus(); return true; }
    return false;
  }

  document.addEventListener('keydown', function (e) {
    // Always allow Escape to close modal / clear g-buffer
    if (e.key === 'Escape') { clearG(); closeModal(); return; }

    if (isTyping(e.target)) return; // never hijack while typing

    // handle 'g' prefix
    if (pendingG) {
      var k2 = (e.key || '').toLowerCase();
      if (e.key === 'Escape' || e.key === '?' || e.key === 'g') { clearG(); }
      else if (NAV[k2]) {
        e.preventDefault(); e.stopPropagation();
        clearG();
        if (STATE && STATE.user) { switchTab(NAV[k2].tab); }
      } else { clearG(); return; }
      return;
    }

    var key = (e.key || '').toLowerCase();
    var ctrl = e.ctrlKey || e.metaKey;

    // '?' help
    if (e.key === '?' || (e.shiftKey && key === '/')) {
      e.preventDefault();
      toastShortcuts(Object.keys(NAV).map(function (k) { return NAV[k]; }).concat(
        Object.keys(ACTIONS).map(function (k) { return ACTIONS[k]; })));
      return;
    }

    // '/' global search (non-shift)
    if (key === '/' && !e.shiftKey && !ctrl) {
      e.preventDefault();
      if (!focusSearch()) toastShortcuts([{ desc: 'No search box on this tab' }]);
      return;
    }

    // step through modal actions
    if (modalOpen()) return;

    if (key === 'g') {
      e.preventDefault(); pendingG = 'g';
      if (gTimer) clearTimeout(gTimer);
      gTimer = setTimeout(clearG, 1200);
      return;
    }

    if (!ctrl && ACTIONS[key]) {
      e.preventDefault();
      ACTIONS[key].fn();
    }
  });
})();
// ===== END KEYBOARD SHORTCUTS =====

</script>
</body>
