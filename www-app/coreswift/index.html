}

function peAddSavedKey() {
  showModal('Add a saved key',
    '<div class="form-group"><label>Label</label><input type="text" id="peNewKeyLabel" placeholder="Mailgun production" autocomplete="off"></div>' +
    '<div class="form-group"><label>Provider</label><select id="peNewKeyProvider"><option value="mailgun">Mailgun</option></select></div>' +
    '<div class="form-group"><label>API key</label><input type="password" id="peNewKeyValue" autocomplete="new-password"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peNewKeySave">Add key</button>');
  const b = document.getElementById('peNewKeySave');
  if (!b) return;
  b.addEventListener('click', async function () {
    const label = String(document.getElementById('peNewKeyLabel').value || '').trim();
    const v = String(document.getElementById('peNewKeyValue').value || '').trim();
    if (!label || !v) { toast('Label and key are required', 'error'); return; }
    b.disabled = true;
    try {
      await API.post('/private-email/keys', { label: label, api_key: v, provider: document.getElementById('peNewKeyProvider').value });
      closeModal(); toast('Key saved', 'success'); await loadInboxTab();
    } catch (e) { toast('Could not save the key: ' + e.message, 'error'); b.disabled = false; }
  });
}

function peDeleteSavedKey(keyId) {
  const k = (PE.keys || []).filter(function (x) { return x.id === keyId; })[0];
  confirmThen('Delete the saved key' + (k && k.label ? ' "' + k.label + '"' : '') + '? Domains using it lose their credential and stop sending until they are given another one.', function () {
    API.del('/private-email/keys/' + encodeURIComponent(keyId))
      .then(function () { toast('Key deleted', 'success'); loadInboxTab(); })
      .catch(function (e) { toast('Could not delete: ' + e.message, 'error'); });
  });
}

async function peSend() {
  const btn = document.getElementById('peSendBtn');
  const from = document.getElementById('peFrom').value.trim();
  const to = document.getElementById('peTo').value.trim();
  const subject = document.getElementById('peSubject').value.trim();
  const body = document.getElementById('peBody').value.trim();
  if (!from || !to || !subject || !body) { toast('From, To, Subject and Body are required', 'error'); return; }
  if (btn) btn.disabled = true;
  try {
    await API.post('/private-email/send', { from_address: from, to: to, subject: subject, body: body });
    toast('Email sent', 'success');
    document.getElementById('peBody').value = '';
  } catch (e) { toast('Send failed: ' + e.message, 'error'); }
  finally { if (btn) btn.disabled = false; }
}

// ── Add a domain: the credential step (kanban t_ff03e048) ───────────────────
// This modal used to collect Domain / Label / Provider and post exactly those, so
// EVERY "Add domain" was a 400 from a handler that requires a credential:
//   mailgun -> "Either mailgun_api_key or api_key_id is required"
//   smtp    -> "smtp_host is required for SMTP provider"
// Add-domain is the front door of the whole Private Email feature (domains ->
// mailboxes -> send/inbound), so the feature could not be entered at all.
// SENDING and RECEIVING are two separate choices (kanban t_04db9228 / t_422cf04d), and the
// provider list reflects only what the send path really does: Mailgun, or SMTP — which is how this
// deployment carries Amazon SES, SendGrid, Postmark, Google Workspace and a customer's own server.
// WHAT RECEIVES is its own select below it (Mailgun, SendGrid Inbound Parse, or nowhere); it is a
// separate column (inbound_provider), so choosing SMTP sending never takes inbound mail away and
// choosing SendGrid receiving never moves the customer's outbound mail. Do not merge the two lists
// back into one "provider": that is the shape that used to make a SendGrid choice create a Mailgun
// domain, and the shape that left an SMTP domain unable to receive at all.
// Mailgun sending needs the key of the account that ALREADY carries the domain
// (validate_mailgun_domain does GET /v3/domains/<domain> with that key), so a platform-wide key is
// not an option for a customer's own domain; when Mailgun RECEIVES only, the same key is used to
// show and re-check the domain's records — the copy under the field says which of the two it is.

// ── HOW THIS ACCOUNT SENDS (kanban B208, 2026-11-21) ─────────────────────────────────────────────
// The send path has carried three transports for a while — Mailgun's API, SMTP.com's HTTP API, and a
// generic SMTP relay — but nothing in the product could CHOOSE one, so an account was tied to Mailgun
// by the absence of a control rather than on purpose. This is that control: point a verified domain at
// your own server (Amazon SES, Postmark, Google Workspace, your host) and every automation, campaign
// and receipt for that domain leaves through it instead.
async function peRenderRelay() {
  const el = document.getElementById('peRelay');
  if (!el) return;
  let domains = [];
  try { const d = await API.get('/private-email/domains'); domains = Array.isArray(d) ? d : ((d && (d.items || d.domains)) || []); } catch (e) { el.innerHTML = ''; return; }
  if (!domains.length) { el.innerHTML = ''; return; }
  const rows = domains.map(function (d) {
    const name = d.domain || d.name || '';
    const how = d.provider_type || d.sending_provider || 'mailgun';
    const label = how === 'smtp_relay' ? '<span class="badge badge-success">your own mail server</span>'
      : how === 'smtp' ? '<span class="badge badge-muted">SMTP.com (vendor)</span>'
      : '<span class="badge badge-muted">Mailgun</span>';
    return '<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border,#2a2a2a)">' +
      '<strong style="flex:1;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(name) + '</strong>' + label +
      '<button type="button" class="btn btn-ghost btn-xs" data-perelay="' + escapeHtmlAttr(String(d.id)) + '" data-pedomain="' + escapeHtmlAttr(name) + '">Change</button>' +
      '</div>';
  }).join('');
  el.innerHTML = card('How this account sends',
    '<p style="color:var(--text-secondary);margin:0 0 10px">Mail can leave through Mailgun or through <strong>your own mail server</strong> — Amazon SES, Postmark, Google Workspace, or any SMTP host you already pay for. Switching moves nothing else: your inboxes, history and records stay exactly where they are.</p>' +
    rows +
    '<p style="color:var(--text-secondary);font-size:12px;margin:12px 0 0">A domain on your own server needs the DNS records your new provider gives you; the records table above belongs to Mailgun.</p>');
}

function peRelayModal(domainId, domainName) {
  const cur = (PE.domains || []).find(function (d) { return String(d.id) === String(domainId); }) || {};
  const how = cur.provider_type || cur.sending_provider || 'mailgun';
  showModal('How ' + domainName + ' sends',
    '<div class="form-group"><label>Transport</label><select id="peRelayKind" onchange="peRelayFields()">' +
      '<option value="mailgun"' + (how === 'mailgun' ? ' selected' : '') + '>Mailgun (its API)</option>' +
      '<option value="smtp_relay"' + (how === 'smtp_relay' ? ' selected' : '') + '>My own mail server (SMTP)</option>' +
    '</select></div>' +
    '<div id="peRelayBody">' +
    '<p style="color:var(--text-secondary);font-size:12px;margin:0 0 10px">Your server needs a host, a username and a password. If the username is an email address, the From uses that address.</p>' +
    '<div class="form-group"><label>Host</label><input type="text" id="peRelayHost" placeholder="smtp.postmarkapp.com"></div>' +
    '<div class="form-group"><label>Port</label><input type="number" id="peRelayPort" placeholder="587" min="1" max="65535"></div>' +
    '<div class="form-group"><label>Username</label><input type="text" id="peRelayUser" placeholder="often your sending address"></div>' +
    '<div class="form-group"><label>Password</label><input type="password" id="peRelayPass" placeholder="leave blank to keep the stored one"></div>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="peRelayTls" checked> Use TLS (STARTTLS)</label>' +
    '</div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peRelaySave">Save</button>');
  peRelayFields();
  const save = document.getElementById('peRelaySave');
  if (save) save.onclick = function () { peRelaySave(domainId); };
}

function peRelayFields() {
  const k = document.getElementById('peRelayKind');
  const body = document.getElementById('peRelayBody');
  if (k && body) body.style.display = (k.value === 'smtp_relay') ? '' : 'none';
}

async function peRelaySave(domainId) {
  const kind = document.getElementById('peRelayKind').value;
  const payload = { sending_provider: kind };
  if (kind === 'smtp_relay') {
    const host = (document.getElementById('peRelayHost').value || '').trim();
    const port = (document.getElementById('peRelayPort').value || '').trim();
    const user = (document.getElementById('peRelayUser').value || '').trim();
    const pass = (document.getElementById('peRelayPass').value || '').trim();
    if (!host) { toast('Your server needs a host — for example smtp.postmarkapp.com', 'error'); return; }
    payload.smtp_host = host;
    if (port) payload.smtp_port = parseInt(port, 10);
    if (user) payload.smtp_username = user;
    if (pass) payload.smtp_password = pass;
    payload.smtp_tls = document.getElementById('peRelayTls').checked;
  }
  try {
    await API.patch('/private-email/domains/' + encodeURIComponent(domainId), payload);
    closeModal();
    toast(kind === 'smtp_relay' ? 'This domain now sends through your own mail server' : 'This domain sends through Mailgun again', 'success');
    peRenderRelay();
  } catch (e) { toast('Could not change it: ' + (e.message || e), 'error'); }
}

document.addEventListener('click', function (ev) {
  const t = ev.target; if (!t || !t.closest) return;
  const b = t.closest('[data-perelay]');
  if (b) { ev.preventDefault(); peRelayModal(b.getAttribute('data-perelay'), b.getAttribute('data-pedomain') || 'this domain'); }
});

function peProviderFields() {
  const p = document.getElementById('peNewProvider');
  if (!p) return;
  // Sending and receiving are asked separately, but the DEFAULT must stay exactly what this
  // modal did before this choice existed: a Mailgun domain receives with Mailgun, an SMTP one only
  // sends. A choice the operator made by hand is never overwritten.
  const rv = document.getElementById('peNewReceiving');
  if (rv && !window._peRecvTouched) rv.value = (p.value === 'smtp' ? 'none' : 'mailgun');
  peReceivingFields();
  const t = document.getElementById('peDomainSave');
  if (t) t.disabled = false;
}

// Which fields belong to the RECEIVING answer, and the sentence that says what it means.
function peReceivingTouched() { window._peRecvTouched = true; peReceivingFields(); }
function peReceivingFields() {
  const r = document.getElementById('peNewReceiving');
  if (!r) return;
  const pv = document.getElementById('peNewProvider');
  const send = pv ? pv.value : 'mailgun';
  const v = r.value;
  // ONE place decides which blocks are open, because a Mailgun credential is needed by EITHER
  // answer that names Mailgun: sending through it, or receiving through it. The server refuses
  // sending=smtp + receiving=mailgun without that key ("its records can be shown and checked"), so
  // the key fields must be reachable from this modal instead of hidden behind the Sending answer.
  const needsMailgun = (send === 'mailgun') || (v === 'mailgun');
  const mg = document.getElementById('peMailgunFields');
  if (mg) mg.style.display = needsMailgun ? '' : 'none';
  const sm = document.getElementById('peSmtpFields');
  if (sm) sm.style.display = (send === 'smtp' ? '' : 'none');
  const kf = document.getElementById('peRecvKeyFields');
  if (kf) kf.style.display = (v === 'mailgun' ? '' : 'none');
  const sg = document.getElementById('peRecvSgFields');
  if (sg) sg.style.display = (v === 'sendgrid' ? '' : 'none');
  // The Mailgun API key means two different things, so the sentence under it must not promise the
  // wrong one (kanban t_422cf04d): when Mailgun SENDS, the key is verified against Mailgun before
  // the domain is saved; when Mailgun only RECEIVES, the same key is what makes this domain's
  // records readable, and the SMTP credentials above are what actually send. Until this was split,
  // the receiving-only combination told the customer their domain would be "verified against that
  // account before it is saved", which the SMTP create path never does.
  const kh = document.getElementById('peMailgunKeyHint');
  if (kh) kh.innerHTML = (send === 'mailgun')
    ? 'Required. Use the key of the Mailgun account that already carries this domain: the domain is verified against that account before it is saved, so a shared platform key cannot add your domain. Stored encrypted with the domain, never echoed back.'
    : 'Required because Mailgun is the RECEIVER here: CoreSwift uses this key to show and re-check this domain&rsquo;s mail records. Your sending stays on the server above, so this key never sends your mail. Stored encrypted with the domain, never echoed back.';
  const hint = document.getElementById('peNewReceivingHint');
  if (hint) hint.innerHTML = v === 'sendgrid'
    ? 'SendGrid receives this domain through its Inbound Parse webhook. No key to paste here: the address for SendGrid is issued on the domain row after saving.'
    : (v === 'none'
      ? 'This domain only sends. Mail addressed to it is not accepted by this installation.'
      : 'Mailgun receives this domain. Paste this domain&rsquo;s webhook signing key below; without it Mailgun deliveries for this domain are refused (401, nothing created). You can also set or rotate it later from the domain row.');
}

function peOpenAddDomain() {
  // A fresh modal starts with no hand-made choice, so the defaults follow the sending provider.
  window._peRecvTouched = false;
  const savedKeys = (PE.keys || []).filter(function (k) { return (k.provider || 'mailgun') === 'mailgun'; });
  const keyOpts = savedKeys.map(function (k) {
    return '<option value="' + escapeHtmlAttr(k.id) + '">' + escapeHtml(k.label || 'saved key') +
      (k.key_status === 'unreadable' ? ' — cannot be opened by the server' : '') + '</option>';
  }).join('');
  showModal('Add a domain',
    '<div class="form-group"><label>Domain</label>' +
    '<input type="text" id="peNewDomain" placeholder="mail.yourdomain.com" autocomplete="off">' +
    '<span class="form-hint">The sending domain, spelled exactly as the provider knows it.</span></div>' +
    '<div class="form-group"><label>Label (optional)</label><input type="text" id="peNewLabel" autocomplete="off"></div>' +
    '<div class="form-group"><label>Provider</label>' +
    '<select id="peNewProvider" onchange="peProviderFields()">' +
    '<option value="mailgun">Mailgun</option>' +
    '<option value="smtp">SMTP (a mail server you run)</option>' +
    '</select>' +
    '<span class="form-hint">Sending = Mailgun, or ANY SMTP service: Amazon SES, SendGrid, Postmark, Google Workspace, or a mail server you run. Receiving is a separate choice, right below &mdash; so you can, for example, send through Amazon SES and still receive through Mailgun.</span></div>' +
    '<div class="form-group"><label>How this domain receives mail</label>' +
    '<select id="peNewReceiving" onchange="peReceivingTouched()">' +
    '<option value="mailgun">Mailgun</option>' +
    '<option value="sendgrid">SendGrid (Inbound Parse)</option>' +
    '<option value="none">Nowhere — this domain only sends</option>' +
    '</select>' +
    '<span class="form-hint" id="peNewReceivingHint"></span></div>' +
    '<div id="peRecvKeyFields">' +
    '<div class="form-group"><label>Inbound webhook signing key (optional)</label>' +
    '<input type="password" id="peNewWebhook" autocomplete="new-password">' +
    '<span class="form-hint">Only needed to RECEIVE mail on this domain. It is this domain&rsquo;s own <b>webhook signing key</b> from Mailgun &mdash; Send &rarr; Domains &rarr; your domain &rarr; Webhook signing key. Mailgun signs every inbound delivery with it and CoreSwift verifies that signature before a delivery becomes a contact or a ticket; <b>without it, inbound mail for this domain is refused</b> (401, nothing created). Leave empty for a domain you only send from &mdash; you can set or rotate it later from the domain row. Stored encrypted, never echoed back.</span></div>' +
    '</div>' +
    '<div id="peRecvSgFields" style="display:none">' +
    '<span class="form-hint">SendGrid receives this domain through its <b>Inbound Parse</b> webhook. There is nothing to paste here: the address to paste into SendGrid is issued on this domain&rsquo;s own row after it is saved &mdash; open <b>DNS records</b> on the row to copy it.</span></div>' +
    '<div id="peMailgunFields">' +
    '<div class="form-group"><label>Mailgun API key</label>' +
    '<input type="password" id="peNewKey" autocomplete="new-password" placeholder="key-...">' +
    '<span class="form-hint" id="peMailgunKeyHint">Required. Use the key of the Mailgun account that already carries this domain: the domain is verified against that account before it is saved, so a shared platform key cannot add your domain. Stored encrypted with the domain, never echoed back.</span></div>' +
    (keyOpts
      ? '<div class="form-group"><label>or use a saved key</label>' +
        '<select id="peNewSavedKey"><option value="">(paste a new key above)</option>' + keyOpts + '</select>' +
        '<span class="form-hint">Saved keys are the ones listed in "Saved provider keys" below; a domain can point at one instead of carrying its own copy.</span></div>'
      : '') +
    '<div class="form-group"><label>Region</label>' +
    '<select id="peNewRegion"><option value="us">US (api.mailgun.net)</option><option value="eu">EU (api.eu.mailgun.net)</option></select></div>' +
    '</div>' +
    '<div id="peSmtpFields" style="display:none">' +
    '<p style="color:var(--text-secondary);margin:0">Nothing is sent to the mail server before the domain is saved, so a wrong host or password is only reported by the first send.</p>' +
    '<div class="form-group"><label>SMTP host</label>' +
    '<input type="text" id="peNewSmtpHost" placeholder="smtp.yourdomain.com" autocomplete="off"></div>' +
    '<div class="form-group"><label>Port</label><input type="number" id="peNewSmtpPort" value="587"></div>' +
    '<div class="form-group"><label>Username</label><input type="text" id="peNewSmtpUser" autocomplete="off"></div>' +
    '<div class="form-group"><label>Password</label><input type="password" id="peNewSmtpPass" autocomplete="new-password"></div>' +
    '<div class="form-group"><label><input type="checkbox" id="peNewSmtpTls" checked> Use STARTTLS</label></div>' +
    '</div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peDomainSave">Add domain</button>');
  peProviderFields();
  const b = document.getElementById('peDomainSave');
  if (b) b.addEventListener('click', async () => {
    const domain = document.getElementById('peNewDomain').value.trim();
    if (!domain) { toast('Enter the domain', 'error'); return; }
    const provider = document.getElementById('peNewProvider').value;
    const label = document.getElementById('peNewLabel').value.trim();
    const payload = { domain: domain, provider_type: provider };
    // Both answers travel explicitly (defaults preserved by peProviderFields): a domain added
    // here is never silently left on the sending provider's receiving default.
    const recvEl = document.getElementById('peNewReceiving');
    const recv = recvEl ? recvEl.value : '';
    payload.sending_provider = provider;
    if (recv) payload.receiving_provider = recv;
    if (label) payload.label = label;
    if (provider === 'smtp') {
      const host = document.getElementById('peNewSmtpHost').value.trim();
      const user = document.getElementById('peNewSmtpUser').value.trim();
      const pass = document.getElementById('peNewSmtpPass').value;
      if (!host || !user || !pass) { toast('SMTP needs a host, a username and a password', 'error'); return; }
      payload.smtp_host = host;
      payload.smtp_port = parseInt(document.getElementById('peNewSmtpPort').value, 10) || 587;
      payload.smtp_username = user;
      payload.smtp_password = pass;
      payload.smtp_tls = !!document.getElementById('peNewSmtpTls').checked;
    }
    // A Mailgun credential belongs to EITHER answer that names Mailgun (send through it, or
    // receive through it), so it is collected whenever one of the two does.
    const needsMailgun = (provider === 'mailgun') || (recv === 'mailgun');
    if (needsMailgun) {
      const savedEl = document.getElementById('peNewSavedKey');
      const chosen = savedEl ? savedEl.value : '';
      const key = document.getElementById('peNewKey').value.trim();
      payload.mailgun_region = document.getElementById('peNewRegion').value;
      // A saved key wins when one is picked; otherwise the pasted key is required.
      // Failing here beats a 400 after submit, which is what this modal always did.
      if (chosen) payload.api_key_id = chosen;
      else if (key) payload.mailgun_api_key = key;
      else { toast('Paste the Mailgun API key for this domain, or pick a saved key', 'error'); return; }
    }
    // The signing key belongs to the RECEIVING answer, so it is sent for an SMTP-sending domain
    // too (that combination is the whole point of asking the two questions separately). Only sent
    // when something was typed, so an empty box can never clear a key on an add.
    const whEl = document.getElementById('peNewWebhook');
    const wh = whEl ? whEl.value.trim() : '';
    if (wh) payload.webhook_signing_key = wh;
    b.disabled = true;
    try {
      await API.post('/private-email/domains', payload);
      closeModal(); toast('Domain added', 'success'); await loadInboxTab();
      // The same nudge the row's own Receiving select gives: a SendGrid domain is not armed at
      // SendGrid until the address ON THE ROW is pasted into their Inbound Parse settings.
      if (recv === 'sendgrid') {
        toast('Open DNS records on the new domain for the Inbound Parse address to paste into SendGrid.', 'info');
      }
    } catch (e) {
      // A plan gate is a real answer, not a bug — show it where the user is standing.
      toast('Could not add the domain: ' + e.message, 'error');
      b.disabled = false;
    }
  });
}

function peOpenAutoReply() {
  const opts = PE.domains.map(d => '<option value="' + escapeHtmlAttr(d.id) + '">' + escapeHtml(d.domain || '') + '</option>').join('');
  showModal('New auto-reply',
    (opts ? '' : '<p style="color:var(--text-secondary)">An auto-reply belongs to a domain, and this account has none yet.</p>') +
    '<div class="form-group"><label>Domain</label><select id="peArDomain">' + (opts || '<option value="">no domains</option>') + '</select></div>' +
    '<div class="form-group"><label>Name</label><input type="text" id="peArName" autocomplete="off"></div>' +
    '<div class="form-group"><label>Trigger</label>' +
    '<select id="peArTrigger"><option value="all">every message</option><option value="keyword">Keyword</option><option value="sender">Sender</option></select></div>' +
    '<div class="form-group"><label>Trigger value (for keyword/sender)</label><input type="text" id="peArValue" autocomplete="off"></div>' +
    '<div class="form-group"><label>Subject</label><input type="text" id="peArSubject" autocomplete="off"></div>' +
    '<div class="form-group"><label>Body (HTML)</label><input type="text" id="peArBody" autocomplete="off"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peArSave"' + (opts ? '' : ' disabled') + '>Create auto-reply</button>');
  const b = document.getElementById('peArSave');
  if (b) b.addEventListener('click', async () => {
    const domainId = document.getElementById('peArDomain').value;
    const name = document.getElementById('peArName').value.trim();
    const body = document.getElementById('peArBody').value.trim();
    if (!domainId || !name || !body) { toast('Domain, Name and Body are required', 'error'); return; }
    b.disabled = true;
    const payload = {
      domain_id: domainId, name: name,
      trigger_type: document.getElementById('peArTrigger').value,
      body_html: body
    };
    const val = document.getElementById('peArValue').value.trim();
    if (val) payload.trigger_value = val;
    const subj = document.getElementById('peArSubject').value.trim();
    if (subj) payload.subject = subj;
    try {
      await API.post('/private-email/auto-replies', payload);
      closeModal(); toast('Auto-reply created', 'success'); await loadInboxTab();
    } catch (e) { toast('Could not create: ' + e.message, 'error'); b.disabled = false; }
  });
}

  showModal('Support box',
    (opts ? '<p style="color:var(--text-secondary);margin-bottom:14px">Mail forwarded to the chosen mailbox opens a support ticket automatically.</p>'
          : '<p style="color:var(--text-secondary)">This account has no active mailbox yet, so there is nothing to forward to.</p>') +
    '<div class="form-group"><label>Mailbox</label><select id="peSbBox">' + (opts || '<option value="">no mailboxes</option>') + '</select></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peSbSave"' + (opts ? '' : ' disabled') + '>Save</button>');
  const b = document.getElementById('peSbSave');
  if (b) b.addEventListener('click', async () => {
    const boxId = document.getElementById('peSbBox').value;

    b.disabled = true;
    try {
      await API.put('/private-email/support-box', { box_id: boxId });

// ── Native connector SYNC — the unfinished half of the connectors contract ─────
// connect/disconnect/test were wired; pull/push/history were registered with no caller. Both
// directions post what the Rust struct requires. (The Ada campaign trigger card was RETIRED
// 2026-10-02, kanban t_434b240b.)
// The Entity choices are the SELECTED connector's OWN declared vocabulary - meta.entities from
// GET /native/apps, the pull list for Pull and the push list for Push. A connector declares
// exactly the names its pull_entity()/push_entity() accept, so this modal can never offer a name
// the connector refuses. It used to offer one hard-coded list to EVERY connector: measured live
// 2026-10-02, every name in that list was refused by all six registered connectors (funnelswift
// alone accepted one of them, on pull). There is no invented fallback - a connector that declares
// nothing renders no options and that direction's button is disabled.
function icSyncEntities(slug, direction) {
  const app = (IC.apps || []).find(x => x.slug === slug);
  const list = (((app || {}).meta || {}).entities || {})[direction];
  return Array.isArray(list) ? list : [];
}

function icSyncOptions(list) {
  return list.map(e => '<option value="' + escapeHtmlAttr(e) + '">' + escapeHtml(e) + '</option>').join('');
}

function icSyncOpen(slug) {
  const pullList = icSyncEntities(slug, 'pull');
  const pushList = icSyncEntities(slug, 'push');
  showModal('Sync ' + slug,
    ((IC.status[slug] || {}).connected ? '' :
      '<p style="color:var(--warning,#f0ad4e);margin-bottom:10px"><strong>This connector has no credentials stored</strong> — ' +
      'the API will refuse a pull or push for it, and the refusal is shown here verbatim rather than hidden.</p>') +
    '<p style="color:var(--text-secondary);margin-bottom:14px">Pull asks ' + escapeHtml(slug) +
      ' for its records; push sends the payload below to it. Both are logged to this account\'s sync history either way.</p>' +
    '<div class="form-group"><label>Entity to pull</label><select id="icSyncEntityPull"' + (pullList.length ? '' : ' disabled') + '>' +
      (pullList.length ? icSyncOptions(pullList) : '<option value="">' + escapeHtml(slug) + ' declares no pullable entity</option>') + '</select></div>' +
    '<div class="form-group"><label>Entity to push</label><select id="icSyncEntityPush"' + (pushList.length ? '' : ' disabled') + '>' +
      (pushList.length ? icSyncOptions(pushList) : '<option value="">' + escapeHtml(slug) + ' declares no pushable entity</option>') + '</select></div>' +
    '<div class="form-group"><label>Push payload (JSON)</label>' +
    '<input type="text" id="icSyncData" value="[]" autocomplete="off"' + (pushList.length ? '' : ' disabled') + '>' +
    '<span class="form-hint">Only used by Push — it is sent verbatim to the partner app.</span></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-secondary" id="icPullBtn"' + (pullList.length ? '' : ' disabled') + '>Pull from ' + escapeHtml(slug) + '</button>' +
    '<button class="btn btn-primary" id="icPushBtn"' + (pushList.length ? '' : ' disabled') + '>Push to ' + escapeHtml(slug) + '</button>');
  const pb = document.getElementById('icPullBtn');
  const ub = document.getElementById('icPushBtn');
  if (pb) pb.addEventListener('click', () => icSyncRun(slug, 'pull', pb));
  if (ub) ub.addEventListener('click', () => icSyncRun(slug, 'push', ub));
}

async function icSyncRun(slug, direction, btn) {
  const sel = document.getElementById('icSyncEntity' + (direction === 'pull' ? 'Pull' : 'Push'));
  if (!sel || !sel.value) { toast('This connector declares no ' + direction + ' entity', 'error'); return; }
  const entity = sel.value;
  let payload = { entity_type: entity };
  if (direction === 'push') {
    const raw = document.getElementById('icSyncData').value.trim() || '[]';
    try { payload.data = JSON.parse(raw); }
    catch (e) { toast('Push payload is not valid JSON: ' + e.message, 'error'); return; }
  }
  if (btn) btn.disabled = true;
  try {
    const r = await API.post('/native/apps/' + encodeURIComponent(slug) + '/sync/' + direction, payload);
    closeModal();
    toast(direction + ' ok — ' + ((r && r.records) || 0) + ' record(s)', 'success');
    const wrap = document.getElementById('icSyncWrap');
    if (wrap) wrap.innerHTML = card('🔄 Last ' + direction + ' (' + escapeHtml(slug) + ')',
      '<p style="color:var(--text-secondary);margin:0">' + escapeHtml(entity) + ' · status ' + escapeHtml((r && r.status) || '?') +
      ' · records ' + escapeHtml(String((r && r.records) || 0)) + '</p>');
  } catch (e) {
    toast(direction + ' failed: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function icSyncHistory(slug) {
  const wrap = document.getElementById('icSyncWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Loading sync history...</div>';
  try {
    const d = await API.get('/native/apps/' + encodeURIComponent(slug) + '/sync/history');
    const rows = ((d && d.sync_history) || []).map(h => [
      escapeHtml(h.direction || ''),
      escapeHtml(h.entity_type || ''),
      h.status === 'completed' ? '<span class="badge badge-success">completed</span>'
        : (h.status === 'failed' ? '<span class="badge badge-error">failed</span>' : '<span class="badge badge-muted">' + escapeHtml(h.status || '') + '</span>'),
      escapeHtml(String(h.records_succeeded == null ? 0 : h.records_succeeded)) + ' / ' + escapeHtml(String(h.records_processed == null ? 0 : h.records_processed)),
      escapeHtml(h.started_at ? new Date(h.started_at).toLocaleString() : ''),
      h.error_log ? '<code style="font-size:.7rem">' + escapeHtml(JSON.stringify(h.error_log).slice(0, 160)) + '</code>' : ''
    ]);
    wrap.innerHTML = card('🕓 Sync history — ' + escapeHtml(slug),
      '<p style="color:var(--text-secondary);margin:0">Every pull and push on this account, with what it moved and what it failed on.</p>') +
      dataTable(['Direction', 'Entity', 'Status', 'OK / seen', 'Started', 'Error'], rows,
        'No sync has run for this connector yet.');
  } catch (e) {
    wrap.innerHTML = icErr('Could not read the sync history for ' + slug, e.message);
  }
}

async function loadAiTab() {
  const el = document.getElementById('aiBody');
  if (!el) return;

  if (btn) btn.onclick = function () { loadAiTab(); };
  let d;

  } catch (e) {
    // The plan refusal is shown EXACTLY as the server words it — the same plain sentence every
    // sibling panel prints ("AI scoring is not available on your current plan. Upgrade to access
    // it."). Before this the panel substituted its own sentence naming the internal PLAN MODULE KEY
    // (`ai_enabled`) and blaming "the platform admin", which leaked an internal identifier to the
    // customer and hid the upgrade path the plan actually provides (Pro and above carry the module,
    // measured in the live `plan_modules` rows 2026-10-14).
    el.innerHTML = icErr('AI scoring',
      (e && e.planGate)
        ? planGateText(e)

    const rec = document.getElementById('aiRecommend');

  const rows = ((d && d.prioritized) || []).map(function (c) {

      escapeHtml(c.email || '—'),
      '<strong>' + (c.priority_score == null ? '—' : c.priority_score) + '</strong>',

      ' <button class="btn btn-ghost btn-xs" onclick="aiRun(\'timing\',\'' + id + '\')">Timing</button>' +
      ' <button class="btn btn-ghost btn-xs" onclick="aiRun(\'channel\',\'' + id + '\')">Channel</button>' +
      ' <button class="btn btn-ghost btn-xs" onclick="aiRun(\'message\',\'' + id + '\')">Draft</button>'
    ];
  });

    '<p style="color:var(--text-secondary);margin:0">Ranked by the AI scoring module: score, account health and inactivity. ' +
    'Pick an action on a row to ask the assistant about that contact.</p>' +

async function aiRun(action, contactId) {
  const out = document.getElementById('aiResult');
  if (out) out.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Asking the assistant...</div>';
  let d;
  try {
    if (action === 'risk') d = await API.post('/ai/risk', { contact_id: contactId });
    else if (action === 'predict') d = await API.post('/ai/predict', { contact_id: contactId });
    else if (action === 'timing') d = await API.post('/ai/timing', { contact_id: contactId });
    else if (action === 'channel') d = await API.post('/ai/channel', { contact_id: contactId, context: 'churn_risk' });
    else d = await API.post('/ai/message', { contact_id: contactId, context: 'churn_risk', channel: 'email' });
  } catch (e) {
    if (out) out.innerHTML = icErr('The assistant could not answer', e.message);
    return;
  }
  aiShow(action, d);
}

async function aiRecommend() {
  const goalEl = document.getElementById('aiGoal');
  const goal = goalEl ? String(goalEl.value || '').trim() : '';
  if (!goal) { toast('Type a goal first', 'error'); return; }
  const out = document.getElementById('aiResult');
  if (out) out.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Building a recommendation...</div>';
  let d;
  try { d = await API.post('/ai/recommend', { campaign_goal: goal }); }
  catch (e) { if (out) out.innerHTML = icErr('The assistant could not answer', e.message); return; }
  aiShow('recommend', d);
}

function aiShow(action, d) {
  const out = document.getElementById('aiResult');
  if (!out) return;
  const titles = { risk: '🛑 Churn risk', predict: '📈 Win probability', timing: '⏰ Best send time',
                   channel: '📣 Suggested channel', message: '✍️ Drafted follow-up',
                   recommend: '🎯 Campaign recommendation' };
  let body = '<pre style="white-space:pre-wrap;word-break:break-word;font-size:.82rem;margin:0">' +
    escapeHtml(JSON.stringify(d, null, 1)) + '</pre>';
  if (d && d.subject && d.body) {
    body = '<div class="form-group"><label>Subject</label><input type="text" readonly value="' +
      escapeHtmlAttr(d.subject) + '"></div>' +
      '<div class="form-group"><label>Body</label><textarea rows="8" readonly>' + escapeHtml(d.body) + '</textarea></div>' +
      '<p style="color:var(--text-secondary)">Saved to templates as <code>' + escapeHtml(d.template_slug || '') + '</code> ' +
      '(message id ' + escapeHtml(String(d.message_id || '')) + ').</p>' + body;
  }
  out.innerHTML = card(titles[action] || action, body, '');
}

function peOpenNewBox() {
  const verified = (PE.domains || []).filter(function (d) { return !!d.verified; });
  if (!verified.length) { toast('Verify a domain first — press Re-check on the domain row', 'error'); return; }
  PE_NEWBOX.domId = null; PE_NEWBOX.ok = false; PE_NEWBOX.checked = false; PE_NEWBOX.err = null;
  const opts = verified.map(function (d) {
    return '<option value="' + escapeHtmlAttr(d.id) + '">' + escapeHtml(d.domain || '') + '</option>';
  }).join('');
  showModal('New inbox',
    '<div class="form-group"><label>Domain</label>' +
      '<select id="peNewBoxDomain" onchange="peNewBoxCheck(this.value)">' + opts + '</select>' +
      '<span class="form-hint">Only verified domains are listed — an inbox can only receive on a domain whose DNS records pass.</span></div>' +
    '<div class="form-group"><label>Address</label>' +
      '<input type="text" id="peNewBoxLocal" placeholder="info" autocomplete="off" oninput="peNewBoxPaint()">' +
      '<span class="form-hint">The part before the @. <span id="peNewBoxPreview"></span></span></div>' +
    '<p id="peNewBoxState" style="color:var(--text-secondary);margin:0">Checking whether this domain can take an inbox…</p>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peNewBoxCreate" disabled>Create inbox</button>');
  peNewBoxCheck(verified[0].id);
  const b = document.getElementById('peNewBoxCreate');
  if (!b) return;
  b.addEventListener('click', async function () {
    const dom = (document.getElementById('peNewBoxDomain') || {}).value || '';
    const local = String((document.getElementById('peNewBoxLocal') || {}).value || '').trim().toLowerCase();
    if (!local) { toast('Enter the part before the @', 'error'); return; }
    b.disabled = true; b.textContent = 'Creating…';
    try {
      await API.post('/private-email/boxes', { domain_id: dom, local_part: local });
      closeModal(); toast('Inbox created — open it from its row', 'success'); await loadInboxTab();
    } catch (e) {
      b.disabled = false; b.textContent = 'Create inbox';
      toast('Could not create the inbox: ' + ((e && e.message) || e), 'error');
    }
  });
}

async function peNewBoxCheck(domId) {
  PE_NEWBOX.domId = domId; PE_NEWBOX.ok = false; PE_NEWBOX.checked = false; PE_NEWBOX.err = null;
  peNewBoxPaint();
  let rec = null;
  try { rec = await API.get('/private-email/domains/' + encodeURIComponent(domId) + '/records'); }
  catch (e) {
    if (PE_NEWBOX.domId === domId) { PE_NEWBOX.checked = true; PE_NEWBOX.err = ((e && e.message) || String(e)); peNewBoxPaint(); }
    return;
  }
  // A slow answer for a domain the customer has already switched away from must not overwrite the
  // state of the domain they are looking at now.
  if (PE_NEWBOX.domId !== domId) return;
  PE_NEWBOX.checked = true;
  PE_NEWBOX.ok = !!(rec && rec.can_create_mailbox);
  peNewBoxPaint();
}

function peNewBoxPaint() {
  const domEl = document.getElementById('peNewBoxDomain');
  if (!domEl) return;                       // the modal was closed while the check was in flight
  const localEl = document.getElementById('peNewBoxLocal');
  const stateEl = document.getElementById('peNewBoxState');
  const prevEl = document.getElementById('peNewBoxPreview');
  const b = document.getElementById('peNewBoxCreate');
  const local = String((localEl && localEl.value) || '').trim().toLowerCase();
  const dom = (PE.domains || []).filter(function (d) { return d.id === PE_NEWBOX.domId; })[0] || {};
  if (prevEl) prevEl.innerHTML = local ? '<code>' + escapeHtml(local + '@' + (dom.domain || '')) + '</code>' : '';
  if (b) b.disabled = !(local && PE_NEWBOX.ok);
  if (!stateEl) return;
  if (!local) { stateEl.textContent = 'Enter the part before the @ — for example info.'; return; }
  if (!PE_NEWBOX.checked) { stateEl.textContent = 'Checking whether this domain can take an inbox…'; return; }
  if (PE_NEWBOX.err) {
    stateEl.innerHTML = 'Could not check this domain: ' + escapeHtml(PE_NEWBOX.err) +
      '. You can still try — the server refuses an inbox on a domain that cannot receive.';
    if (b) b.disabled = false;               // the server is the last word; let the attempt answer
    return;
  }
  if (PE_NEWBOX.ok) {
    stateEl.innerHTML = 'This domain is verified — <b>' + escapeHtml(local + '@' + (dom.domain || '')) +
      '</b> can receive mail as soon as it is created.';
  } else {
    stateEl.innerHTML = 'This domain is not ready yet: add the DNS records it lists and press <b>Re-check</b> on its row. ' +
      'An inbox made on an unverified domain could not receive mail.';
  }
}

// ── Tags on a contact (assign / unassign / read the entity's tags) ──────────
// ── CSV import / export — guide.html §19 (kanban t_d1b3f5c4) ────────────────
// The API is POST /api/csv/preview, POST /api/csv/import/contacts and
// GET /api/csv/export/contacts. API.call() is JSON-only (it prefixes /api and
// JSON.stringify()s the body), so these talk to the CSV routes with a raw
// fetch and carry the tenant's own bearer token.
let CT_CSV_PENDING = null;

const CT_CSV_FIELDS = [
  ['first_name', ['firstname', 'givenname', 'fname']],
  ['last_name', ['lastname', 'surname', 'familyname', 'lname']],
  ['email', ['email', 'emailaddress', 'mail']],
  ['phone', ['phone', 'phonenumber', 'mobile', 'tel', 'telephone']],
  ['title', ['title', 'jobtitle', 'position']],
  ['company', ['company', 'companyname', 'organization', 'organisation']],
  ['notes', ['notes', 'note', 'comments']],
  ['address_line1', ['address', 'addressline1', 'street']],
  ['city', ['city', 'town']],
  ['state', ['state', 'province', 'region']],
  ['postal_code', ['postalcode', 'zip', 'zipcode']],
  ['country', ['country']]
];

function ctCsvNorm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function ctCsvMap(headers) {
  const used = {};
  const out = [];
  headers.forEach(function (h) {
    const n = ctCsvNorm(h);
    let field = null;
    CT_CSV_FIELDS.forEach(function (pair) {
      if (field || used[pair[0]]) return;
      if (ctCsvNorm(pair[0]) === n || pair[1].indexOf(n) >= 0) field = pair[0];
    });
    if (field) { used[field] = true; out.push({ csv_header: String(h), contact_field: field }); }
  });
  return out;
}

async function ctCsvFetch(path, opts) {
  const o = opts || {};
  o.headers = Object.assign({}, o.headers || {}, { Authorization: 'Bearer ' + STATE.token });
  const res = await fetch('/api/csv/' + path, o);
  if (res.status === 401) { logout(true); throw new Error('Session expired'); }
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const e = await res.json(); if (typeof e.message === 'string') msg = e.message; } catch (_) {}
    throw new Error(msg);
  }
  return res;
}

function ctCsvPreviewBody(headers, map, sample) {
  const mapped = {};
  map.forEach(function (m) { mapped[m.csv_header] = m.contact_field; });
  let chips = '';
  headers.forEach(function (h) {
    const f = mapped[h];
    chips += '<span class="badge ' + (f ? 'badge-success' : 'badge-muted') +
      '" style="margin:2px;display:inline-block">' + escapeHtml(h) +
      (f ? ' &rarr; ' + escapeHtml(f) : ' (skipped)') + '</span>';
  });
  let table = '';
  if (sample && sample.length) {
    table = '<div class="table-wrap" style="margin-top:12px"><table><thead><tr>' +
      headers.map(function (h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      sample.map(function (r) {
        return '<tr>' + headers.map(function (_, i) {
          return '<td>' + escapeHtml(r[i] || '') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  return '<p style="margin:0 0 8px">CoreSwift read the header row. Columns map like this; unmatched ones are skipped.</p>' +
    '<div>' + chips + '</div>' + table +
    '<p style="margin:12px 0 0;color:var(--text-secondary)">Up to 500 rows per import.</p>';
}

function ctCsvImportPick() {
  let inp = document.getElementById('ctCsvFile');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.csv,text/csv';
    inp.id = 'ctCsvFile';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      if (inp.files && inp.files[0]) ctCsvPreview(inp.files[0]);
    });
  }
  inp.value = '';
  inp.click();
}

async function ctCsvPreview(file) {
  CT_CSV_PENDING = null;
  showModal('Import contacts from CSV',
    '<div id="ctCsvBody"><div class="loading-wrap"><div class="spinner"></div> Reading ' +
      escapeHtml(file.name) + '...</div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="ctCsvGo" disabled onclick="ctCsvImport()">Import</button>');
  const fd = new FormData();
  fd.append('file', file);
  const body = document.getElementById('ctCsvBody');
  let d;
  try {
    d = await (await ctCsvFetch('preview', { method: 'POST', body: fd })).json();
  } catch (e) {
    if (body) body.innerHTML = icErr('Could not read the CSV', e.message);
    return;
  }
  const headers = (d && d.headers) || [];
  const map = ctCsvMap(headers);
  if (body && !map.length) {
    body.innerHTML = icErr('No importable columns found',
      'None of these headers match a contact field: ' + headers.join(', '));
    return;
  }
  CT_CSV_PENDING = { file: file, map: map };
  if (body) body.innerHTML = ctCsvPreviewBody(headers, map, (d && d.sample_rows) || []);
  const go = document.getElementById('ctCsvGo');
  if (go) go.disabled = false;
}

async function ctCsvImport() {
  if (!CT_CSV_PENDING) return;
  const fd = new FormData();
  fd.append('file', CT_CSV_PENDING.file);
  fd.append('mappings', JSON.stringify(CT_CSV_PENDING.map));
  const body = document.getElementById('ctCsvBody');
  if (body) body.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Importing...</div>';
  let d;
  try {
    d = await (await ctCsvFetch('import/contacts', { method: 'POST', body: fd })).json();
  } catch (e) {
    if (body) body.innerHTML = icErr('Import failed', e.message);
    return;
  }
  closeModal();
  CT_CSV_PENDING = null;
  toast('Imported ' + d.imported + ' contact' + (d.imported === 1 ? '' : 's') +
    (d.skipped ? ' (' + d.skipped + ' skipped)' : ''), d.skipped ? 'info' : 'success');
  if (typeof TAB_LOADERS !== 'undefined' && TAB_LOADERS['contacts']) TAB_LOADERS['contacts']();
}

async function csvExportContacts() {
  try {
    const res = await ctCsvFetch('export/contacts');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'contacts_export.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('Contacts exported', 'success');

    toast('Export failed: ' + e.message, 'error');
  }
}

// ── Deals (opportunities) CSV — the export's own header names round-trip ────
// The backend has carried GET /api/csv/export/opportunities and POST
// /api/csv/import/opportunities since 2026-10-02, but this console called neither: an account could
// export its CONTACTS and never its deals, and an export you cannot re-import is a backup you cannot
// restore. Both go through the SAME ctCsvFetch helper as the contacts pair (raw fetch + the tenant's
// bearer token), and the importer resolves the export's own column names — name, contact, company,
// pipeline, stage, value, probability, expected_close — so no mapping dialog is needed. A row needs a

let PL_CSV_PENDING = null;

function plCsvImportPick() {

    inp.accept = '.csv,text/csv';

async function plCsvPreview(file) {
  PL_CSV_PENDING = null;
  showModal('Import deals from CSV',
    '<div id="plCsvBody"><div class="loading-wrap"><div class="spinner"></div> Reading ' +
      escapeHtml(file.name) + '...</div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +

  const body = document.getElementById('plCsvBody');
  const fd = new FormData();
  fd.append('file', file);
  let d;
  try {
    d = await (await ctCsvFetch('preview', { method: 'POST', body: fd })).json();
  } catch (e) {
    if (body) body.innerHTML = icErr('Could not read the CSV', e.message);
    return;
  }
  const headers = (d && d.headers) || [];
  const sample = (d && d.sample_rows) || [];
  const KNOWN = ['name', 'contact', 'company', 'pipeline', 'stage', 'value', 'probability',
                 'expected_close', 'expected_close_date', 'created_at'];
  let chips = '';
  headers.forEach(function (h) {
    const ok = KNOWN.indexOf(String(h || '').toLowerCase().trim()) >= 0;
    chips += '<span class="badge ' + (ok ? 'badge-success' : 'badge-muted') +
      '" style="margin:2px;display:inline-block">' + escapeHtml(h) + (ok ? '' : ' (ignored)') + '</span>';
  });
  let table = '';
  if (sample.length) {
    table = '<div class="table-wrap" style="margin-top:12px"><table><thead><tr>' +
      headers.map(function (h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      sample.map(function (r) {
        return '<tr>' + headers.map(function (_, i) {
          return '<td>' + escapeHtml(r[i] || '') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  const hasName = headers.some(function (h) { return String(h || '').toLowerCase().trim() === 'name'; });
  PL_CSV_PENDING = hasName ? file : null;
  if (body) {
    body.innerHTML =
      '<p style="margin:0 0 8px">Each row becomes a deal. A row needs a <strong>name</strong>; the ' +
      'pipeline and stage come from the file when it names them, otherwise from your first pipeline.</p>' +
      '<div>' + chips + '</div>' + table +
      (hasName ? '' : '<p style="color:var(--danger,#b91c1c);margin:12px 0 0">This file has no ' +
        '<strong>name</strong> column, so every row would be skipped. Export deals first to see the ' +
        'columns this importer expects.</p>');
  }
  const go = document.getElementById('plCsvGo');
  if (go) go.disabled = !PL_CSV_PENDING;
}

async function plCsvImport() {
  if (!PL_CSV_PENDING) return;
  const body = document.getElementById('plCsvBody');
  if (body) body.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Importing deals...</div>';

async function ctOpenTags(cid) {
  showModal('Tags on this contact',
    '<div id="ctTagsBody"><div class="loading-wrap"><div class="spinner"></div> Loading tags...</div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
  let who = '';
  try { const c = await API.get('/contacts/' + encodeURIComponent(cid));
        who = (c && (c.name || ((c.first_name || '') + ' ' + (c.last_name || '')).trim())) || ''; } catch (e) {}
  const title = document.querySelector('#modalContainer h3');
  if (title && who) title.textContent = 'Tags — ' + who;
  await ctLoadTags(cid);
}

async function ctLoadTags(cid) {
  const body = document.getElementById('ctTagsBody');
  if (!body) return;
  let all = [], mine = [];
  try {
    all = famList(await API.get('/tags'), 'tags');
    const d = await API.get('/tags/entity/contact/' + encodeURIComponent(cid));
    mine = (d && (d.assignments || d.tags)) || [];
    if (d && d.assignments) {
      // `assignments` carries the assignment id the DELETE route needs; `tags` is the
      // tag rows themselves (kept unchanged for existing consumers).
      mine = d.assignments.map(function (a) {
        const t = (d.tags || []).filter(function (x) { return x.id === a.tag_id; })[0] || {};
        return { assignment_id: a.id, tag_id: a.tag_id, id: a.tag_id, name: t.name, color: t.color };
      });
    } else {
      mine = mine.map(function (t) { return { assignment_id: null, tag_id: t.id, id: t.id, name: t.name, color: t.color }; });
    }
  } catch (e) { body.innerHTML = icErr('Could not read tags', e.message); return; }

  const assignedIds = mine.map(function (m) { return m.tag_id; });
  const avail = all.filter(function (t) { return assignedIds.indexOf(t.id) < 0; });
  body.innerHTML =
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
      (mine.length ? mine.map(function (m) {
        return '<span class="badge" style="background:' + escapeHtmlAttr(m.color || '#6366f1') +
          ';color:' + csBadgeInk(m.color) + ';padding:6px 12px">' + escapeHtml(m.name || m.tag_id) +
          (m.assignment_id ? ' <a href="#" style="color:inherit" onclick="ctUnassignTag(\'' + escapeHtmlAttr(cid) + '\',\'' +
            escapeHtmlAttr(m.assignment_id) + '\');return false" title="Remove tag">✕</a>' : '') +
          '</span>';
      }).join('') : '<span class="config-desc">No tags on this contact yet.</span>') +
    '</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-end">' +
      '<div style="flex:1"><label style="display:block;font-size:.8rem;color:var(--text-secondary);margin-bottom:6px">Add a tag</label>' +
      '<select id="ctTagPick">' + (avail.length

        : '<option value="">No tags left to add</option>') + '</select></div>' +

async function ctAssignTag(cid, tagId) {

}

async function ctUnassignTag(cid, assignmentId) {

    toast('Tag removed', 'success');

// ── Monitoring: the If-Not-Then delay queue (GET list + DELETE cancel) ──────
async function ruleLoadScheduled() {
  const el = document.getElementById('ruleScheduled');
  if (!el) return;
  let d;
  try { d = await API.get('/events/delayed?per_page=25'); }
  catch (e) { el.innerHTML = icErr('Could not read the scheduled follow-up queue', e.message); return; }
  const rows = ((d && d.delayed_actions) || []).map(function (a) {
    return [
      escapeHtml(String(a.condition_type || '')),
      escapeHtml(String(a.action_type || '')),
      a.execute_at ? new Date(a.execute_at).toLocaleString() : '—',
      a.executed ? '<span class="badge badge-muted">executed</span>' :
        (a.cancelled ? '<span class="badge badge-muted">cancelled</span>' : '<span class="badge badge-success">pending</span>'),
      a.cancelled ? '' :
        '<button class="btn btn-ghost btn-xs" onclick="monCancelDelayed(\'' + escapeHtmlAttr(a.id) + '\')">Cancel</button>'
    ];
  });
  el.innerHTML = card('⏱ Scheduled follow-ups (' + ((d && d.total) || 0) + ')',
    '<p style="color:var(--text-secondary);margin:0">The If-Not-Then delay queue. Account-health monitoring schedules these; ' +
    'cancelling one stops the follow-up before it fires.</p>' +
    dataTable(['Condition', 'Action', 'Runs at', 'State', ''], rows, 'Nothing scheduled.'), '');
}

function monCancelDelayed(id) {
  confirmThen('Cancel this scheduled follow-up?', function () {
    API.del('/events/delayed/' + encodeURIComponent(id))
      .then(function () { toast('Scheduled action cancelled', 'success'); ruleLoadScheduled(); })
      .catch(function (e) { toast('Could not cancel: ' + e.message, 'error'); });
  });
}

// ── Workspace switcher (top bar) ── (2026-11-12)
// The five /api/workspaces routes (list/create/rename/set-default/delete) plus the new
// POST /api/workspaces/:id/switch live HERE, in the top-bar menu next to the plan badge — never in
// the side menu. Every rule is the SERVER's and is printed in its own words: one workspace always
// remains, a duplicate name is refused, the first workspace is the default, deleting the default
// promotes the oldest remaining one, the workspace you are signed into cannot be deleted, a
// portfolio business cannot be deleted, and a plan that declares max_workspaces refuses with its
// 402 sentence. A member sees Switch + Add; an owner/admin also sees Rename / Delete / Make default.
const WS = { items: [], current: null, busy: false, biz: [] };

function wsCanManage() {
  const r = (STATE.user && STATE.user.role) || '';
  return ['owner', 'account_owner', 'admin', 'agency_admin', 'impersonated'].indexOf(r) >= 0;
}

async function loadWorkspaces() {
  try {
    const d = await API.get('/workspaces');
    WS.items = (d && Array.isArray(d.workspaces)) ? d.workspaces : [];
  } catch (e) {
    WS.items = [];
  }
  let cur = null;
  try { cur = JSON.parse(localStorage.getItem('crm_workspace') || 'null'); } catch (e) {}
  let match = null;
  if (cur && cur.id) match = WS.items.filter(function (w) { return w.id === cur.id; })[0];
  if (!match) match = WS.items.filter(function (w) { return w.is_default; })[0] || WS.items[0] || null;
  WS.current = match;
  if (match) { try { localStorage.setItem('crm_workspace', JSON.stringify(match)); } catch (e) {} }
  paintSwitcher();
}

function paintSwitcher() {
  const el = document.getElementById('wsCurrentName');
  if (el) el.textContent = WS.current ? WS.current.name : 'Workspace';
}

function toggleWsMenu() {
  const menu = document.getElementById('wsMenu');
  if (!menu) return;
  document.getElementById('userMenu').classList.remove('show');
  if (menu.classList.contains('show')) { menu.classList.remove('show'); return; }
  renderWsMenu();
  menu.classList.add('show');
}

async function renderWsMenu() {
  const menu = document.getElementById('wsMenu');
  if (!menu) return;
  try {
    const d = await API.get('/workspaces');
    WS.items = (d && Array.isArray(d.workspaces)) ? d.workspaces : [];
  } catch (e) { /* keep the last known list; the buttons still name the server's refusal */ }
  const admin = wsCanManage();
  let h = '<div style="padding:10px 14px 4px;font-size:.72rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px">Workspaces</div>';
  if (!WS.items.length) {
    h += '<div style="padding:6px 14px;font-size:.82rem;color:var(--text-secondary)">No workspaces yet.</div>';
  }
  WS.items.forEach(function (w, i) {
    const cur = WS.current && WS.current.id === w.id;
    h += '<div style="display:flex;align-items:center;gap:6px;padding:6px 14px 2px">' +
      '<span style="flex:1;font-weight:' + (cur ? '600' : '400') + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(w.name) + '</span>' +
      (w.is_default ? '<span style="font-size:.68rem;color:var(--text-secondary)">default</span>' : '') +
      (cur ? '<span style="font-size:.8rem">&#10003;</span>' : '') +
      '</div>';
    h += '<div style="display:flex;gap:4px;padding:2px 14px 8px;border-bottom:1px solid var(--border,#2a2a2a)">' +
      (cur ? '' : '<button class="btn btn-ghost btn-xs" onclick="wsSwitch(' + i + ')">Switch</button>') +
      (admin ? '<button class="btn btn-ghost btn-xs" onclick="wsRename(' + i + ')">Rename</button>' : '') +
      (admin && !w.is_default ? '<button class="btn btn-ghost btn-xs" onclick="wsMakeDefault(' + i + ')">Make default</button>' : '') +
      // A control that can only ever answer 409 is worse than no control. The server now says whether
      // this workspace can be deleted, and why not when it cannot, so the row explains itself in place.
      (admin
        ? (w.can_delete === false
            ? '<button class="btn btn-ghost btn-xs" disabled title="' + escapeHtmlAttr(w.delete_blocked_reason || 'This account must keep at least one workspace') + '">Delete</button>'
            : '<button class="btn btn-danger btn-xs" onclick="wsDelete(' + i + ')" data-can-delete="1">Delete</button>')
        : '') +
      '</div>';
  });
  h += '<div class="dropdown-divider"></div>';
  h += '<button class="dropdown-item" onclick="wsAdd()">➕ Add workspace</button>';
  if (STATE.user && STATE.user.platform_admin === true) {
    h += '<div class="dropdown-divider"></div>';
    h += '<div style="padding:8px 14px 4px;font-size:.72rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px">Switch business</div>';
    h += '<div id="wsBizList" style="padding:2px 14px 8px"><span style="font-size:.8rem;color:var(--text-secondary)">Loading…</span></div>';
  }
  menu.innerHTML = h;
  if (STATE.user && STATE.user.platform_admin === true) wsLoadBusinesses();
}

async function wsSwitch(idx) {
  const w = WS.items[idx];
  if (!w || WS.busy) return;
  WS.busy = true;
  try {
    const d = await API.post('/workspaces/' + w.id + '/switch', {});
    const tok = d.access_token || d.token;
    if (!tok) throw new Error('No token returned');
    STATE.token = tok;
    localStorage.setItem('crm_token', tok);
    const ws = d.workspace || w;
    try { localStorage.setItem('crm_workspace', JSON.stringify(ws)); } catch (e) {}
    toast('Switched to ' + (ws.name || w.name), 'success');
    window.location.reload();
  } catch (e) {
    toast((e && e.message) ? e.message : 'Could not switch workspace', 'error');
  } finally { WS.busy = false; }
}

async function wsAdd() {
  if (WS.busy) return;
  const name = (prompt('Name for the new workspace') || '').trim();
  if (!name) return;
  WS.busy = true;
  try {
    await API.post('/workspaces', { name: name });
    toast('Workspace added', 'success');
    await loadWorkspaces();
    renderWsMenu();
  } catch (e) {
    toast((e && e.message) ? e.message : 'Could not add workspace', 'error');
  } finally { WS.busy = false; }
}

async function wsRename(idx) {
  const w = WS.items[idx];
  if (!w || WS.busy) return;
  const name = (prompt('Rename workspace', w.name) || '').trim();
  if (!name || name === w.name) return;
  WS.busy = true;
  try {
    await API.patch('/workspaces/' + w.id, { name: name });
    toast('Workspace renamed', 'success');
    await loadWorkspaces();
    renderWsMenu();
  } catch (e) {
    toast((e && e.message) ? e.message : 'Could not rename workspace', 'error');
  } finally { WS.busy = false; }
}

async function wsMakeDefault(idx) {
  const w = WS.items[idx];
  if (!w || WS.busy) return;
  WS.busy = true;
  try {
    await API.post('/workspaces/' + w.id + '/default', {});
    toast('Default workspace changed', 'success');
    await loadWorkspaces();
    renderWsMenu();
  } catch (e) {
    toast((e && e.message) ? e.message : 'Could not change the default workspace', 'error');
  } finally { WS.busy = false; }
}

async function wsDelete(idx) {
  const w = WS.items[idx];
  if (!w || WS.busy) return;
  if (!confirm('Delete "' + w.name + '"? An account must always keep at least one workspace.')) return;
  WS.busy = true;
  try {
    await API.del('/workspaces/' + w.id);
    toast('Workspace deleted', 'success');
    await loadWorkspaces();
    renderWsMenu();
  } catch (e) {
    toast((e && e.message) ? e.message : 'Could not delete workspace', 'error');
  } finally { WS.busy = false; }
}

async function wsLoadBusinesses() {
  const el = document.getElementById('wsBizList');
  if (!el) return;
  try {
    const d = await API.get('/account');
    const list = (d && d.accounts) ? d.accounts : [];
    WS.biz = list;
    if (!list.length) {
      el.innerHTML = '<span style="font-size:.8rem;color:var(--text-secondary)">No businesses</span>';
      return;
    }
    el.innerHTML = list.map(function (a, i) {
      return '<button class="dropdown-item" style="text-align:left" onclick="wsSwitchBusiness(' + i + ')">' + escapeHtml(a.name) + '</button>';
    }).join('');
  } catch (e) {
    el.innerHTML = '<span style="font-size:.8rem;color:var(--text-secondary)">Could not load businesses</span>';
  }
}

/* Open a portfolio company's own account, from the Portfolio screen (David, 2026-11-21).
   Same impersonation call the business switcher uses; the difference is WHO you are opening — a
   portfolio company, chosen from the list that exists for them, rather than hunted for among
   customers. */
async function pfImpersonate(accountTenantId, name) {
  if (!accountTenantId) { toast('This company has no account yet.', 'error'); return; }
  try {
    const d = await API.post('/admin/impersonate', { tenant_id: accountTenantId });
    const tok = (d && (d.impersonation_token || d.access_token)) || '';
    if (!tok) throw new Error('No token returned');
    STATE.token = tok;
    localStorage.setItem('crm_token', tok);
    localStorage.removeItem('crm_workspace');
    try { localStorage.setItem('crm_impersonating', name || 'portfolio company'); } catch (e) {}
    window.location.reload();
  } catch (e) {
    toast((e && e.message) ? e.message : 'Could not open that company', 'error');
  }
}

async function wsSwitchBusiness(idx) {
  const a = WS.biz[idx];
  if (!a || WS.busy) return;
  WS.busy = true;
  try {
    const d = await API.post('/admin/impersonate', { tenant_id: a.id });
    const tok = d.impersonation_token || d.access_token;
    if (!tok) throw new Error('No token returned');
    STATE.token = tok;
    localStorage.setItem('crm_token', tok);
    localStorage.removeItem('crm_workspace');
    window.location.reload();
  } catch (e) {
    toast((e && e.message) ? e.message : 'Could not switch business', 'error');
  } finally { WS.busy = false; }
}
</script>

// ---------------------------------------------------------------- AUDIT LOG
// Rows are GET /api/audit (tenant-scoped, newest first). The CSV is built from exactly the rows this
// panel read, so pressing Export can never produce a file the screen did not show.
//
// WHAT A ROW CHANGED, in words. Every trail row carries a `changes` document, and the delete paths
// record the record's own name there (contacts: name + email; companies / lists / tags / pipelines /
// deals: name) — deliberately read BEFORE the delete, because afterwards there is no row left to
// look it up. Without this column the panel named a record only by an 8-character id, so
// "contact.deleted" could not be acted on; that was a screen that looked complete and told nobody
// which record went.
function auditRecord(r) {
  var c = r && r.changes;
  if (typeof c === 'string') { try { c = JSON.parse(c); } catch (_) { return c; } }
  if (!c || typeof c !== 'object') return '';
  var name = c.name || c.subject || c.plan_slug || '';
  var extra = (c.email && String(c.email) !== String(name)) ? ' \u2014 ' + c.email : '';
  if (!name && c.value !== undefined && c.value !== null) name = '$' + c.value;
  return name ? String(name) + extra : Object.keys(c).slice(0, 4).join(', ');
}
let AUDIT_ROWS = [];
async function loadAuditTab() {
  const el = document.getElementById('auditContent');
  if (!el) return;
  try {
    const res = await API.get('/audit?per_page=100');
    const rows = famList(res, 'logs');
    AUDIT_ROWS = rows;
    el.innerHTML = dataTable(['When', 'Action', 'Entity', 'Record', 'By', 'IP'],
      rows.map(function (r) {
        return [r.created_at ? new Date(r.created_at).toLocaleString() : '\u2014',
          fh(r.action), fh(r.entity_type), fh(auditRecord(r)),
          fh(r.user_id ? String(r.user_id).slice(0, 8) : 'the platform'),
          fh(r.ip_address)];
      }), 'Nothing recorded for this account yet \u2014 entries appear as people change things.');
  } catch (e) {
    el.innerHTML = '<div class="card"><div class="card-body"><div class="empty-state">' +
      '<div class="empty-icon">\u26a0\ufe0f</div><h3>Could not read the audit trail</h3><p>' +
      escapeHtml((e && e.message) || String(e)) + '</p></div></div></div>';
  }
}
function auditExportCsv() {
  if (!AUDIT_ROWS.length) { toast('Nothing to export yet', 'error'); return; }
  // `changes` rides along: the name of what was removed lives nowhere else once the row is gone.
  const cols = ['created_at', 'action', 'entity_type', 'entity_id', 'changes', 'user_id', 'ip_address'];
  const esc = function (v) {
    if (v && typeof v === 'object') { try { v = JSON.stringify(v); } catch (_) { v = String(v); } }
    v = (v === null || v === undefined) ? '' : String(v);
    return '"' + v.replace(/"/g, '""') + '"';
  };
  const csv = [cols.join(',')].concat(AUDIT_ROWS.map(function (r) {
    return cols.map(function (c) { return esc(r[c]); }).join(',');
  })).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'audit-log-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Exported ' + AUDIT_ROWS.length + (AUDIT_ROWS.length === 1 ? ' entry' : ' entries'), 'success');
}

/* ============================================================================
 * DATA MAPPING — the visual field mapper (spec: docs/coreswift-data-mapping-spec-2026-11-13.md)
 *
 * Three columns: source fields on the left (read from the source app's own describe endpoint),
 * destination inputs in the middle (plain text + {{data pills}}), live preview on the right.
 *
 * The preview here is resolved client-side with exactly the same rules the server's resolver uses
 * (single token keeps its value, mixed text concatenates, an unresolved token contributes nothing).
 * "Test with this row" asks the server for the same resolution and shows both, so a drift between
 * what the operator sees and what the runner does is visible rather than silent.
 * ========================================================================== */

const DM = {
  mappings: [], dest: null, schema: null, sourceApp: '', entity: '',
  current: null, fieldMap: {}, rows: [], dirty: false, runs: [], lastRun: null,
  previewRow: null
};

async function dmCall(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (STATE.token) headers['Authorization'] = 'Bearer ' + STATE.token;
  const opts = { method: method, headers: headers };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (res.status === 401) { logout(true); throw new Error('Session expired'); }
  if (!res.ok) {
    const pick = data ? [data.error, data.message, data.detail].find(function (v) {
      return typeof v === 'string' && v.trim();
    }) : null;
    throw new Error(pick || ('Request failed (' + res.status + ')'));
  }
  return data || {};
}

 * every workspace sells newsletter slots. Everything below talks to /api/booking (operator) and

window.BK = { list: [], current: null, detail: null, type: 'appointment' };

  { id: 'appointment', icon: '🗓️', title: 'Appointment times',

  { id: 'inventory', icon: '📰', title: 'Dated slots for sale',
    blurb: 'Individually priced positions for fixed dates — newsletter placements, ad spots. Generate a whole quarter at once.' },
  { id: 'date_range', icon: '🏷️', title: 'A date range',
    blurb: 'A span of days at a day rate — a featured listing, a rental, equipment on hire.' }
];

if (typeof BK === 'object' && BK && !('wsHosts' in BK)) BK.wsHosts = null;

function bkMoney(cents) {
  const n = (cents || 0) / 100;
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function bkSlug(v) {
  return (v || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}

function bkTypeWords(kind) {
  return ({ appointment: 'Appointment times', inventory: 'Dated slots', date_range: 'Date range' })[kind] || kind;
}

async function bkCall(method, path, body) {

function bkFlash(msg, ok) {
  const el = document.getElementById('bkFlash');
  if (!el) return;
  el.textContent = msg;
  el.className = 'bk-flash ' + (ok === false ? 'bad' : 'good');
  setTimeout(function () { el.textContent = ''; }, 6000);
}

async function bkInit() {
  try {
    if (!window.BK_WS) {
      try {
        // The caller's OWN workspace slug. This asked for `GET /account/profile`, a route that
        // does not exist: the account router's `/:id` matches it and the handler tries to parse
        // "profile" as a UUID, so the server answered 400 ("UUID parsing failed: invalid
        // character: found `p` at 0") and BK_WS stayed EMPTY on every visit. The cost was visible
        // on this very screen: the owner's own calendar address was never shown, and the shared
        // link silently degraded to the one-segment form the calendar cannot disambiguate.
        // `GET /account` IS the real surface — it carries the workspace's `slug` — and the signed
        // in account id picks the caller's own row even for a platform admin, whose list holds
        // every tenant.
        const accRes = await dmCall('GET', '/account');
        const accRows = (accRes && accRes.accounts) || [];
        const myId = (STATE.user && STATE.user.account_id) || '';
        const mine = myId ? accRows.filter(function (a) { return String(a.id) === String(myId); })[0] : null;
        const accRow = mine || (accRows.length === 1 ? accRows[0] : null);
        window.BK_WS = (accRow && (accRow.slug || accRow.tenant_slug)) || '';
      } catch (e) { /* the address simply is not shown */ }
    }
    const res = await bkCall('GET', '/calendars');
    BK.list = (res && res.calendars) ? res.calendars : (Array.isArray(res) ? res : []);
    if (BK.current) {
      const still = BK.list.find(function (c) { return c.id === BK.current; });
      if (still) await bkOpenDetail(BK.current, true); else BK.current = null;
    }
  } catch (e) {
    document.getElementById('bkWrap').innerHTML =
      '<div class="empty-state"><p class="muted">Could not load calendars — ' + escapeHtml(e.message) + '</p></div>';
    return;
  }
  bkRender();
}

function bkRender() {
  const wrap = document.getElementById('bkWrap');
  if (!wrap) return;
  wrap.innerHTML = bkCreatePanel() + (BK.current ? bkDetailPanel() : bkListPanel());
}

function bkCreatePanel() {

      '<span class="bk-type-ico">' + t.icon + '</span>' +

        '<label>Web address<input id="bkSlug" placeholder="consultations"><span class="muted" id="bkSlugHint">used in the public link</span></label>' +
        '<label>Time zone<input id="bkTz" value="America/New_York"></label>' +

      '</div>' +

    '</div>';
}

function bkPickType(id) { BK.type = id; bkRender(); }

async function bkCreate() {
  const name = (document.getElementById('bkName').value || '').trim();

function bkListPanel() {

/* COPY A CALENDAR — ASK THE TWO THINGS THAT MAKE THE COPY USEFUL (David, 2026-11-23).
 *
 * "if a user clicks on clone a calendar this should be another thing to say which workspace as well as
 * a rename so it's just not a clone hyphen."
 *
 * So the dialog asks for a NAME (pre-filled with the source's, so one word makes it distinct), shows the
 * WEB ADDRESS that name produces — every word joined by a hyphen, exactly as typed, because that address
 * becomes the public link — and asks WHICH WORKSPACE the copy belongs to, defaulting to the source's own.
 * The address field stays editable: the server takes what the owner saw and only derives one if it is
 * left empty.
 *
 * What is copied is stated on the dialog rather than discovered afterwards: hours, resources, prices,
 * bundles, tags, lists, notification emails and reminders yes; bookings, orders and the Google mirror no.
 */
function bkCloneOpen(id) {
  const src = BK.list.filter(function (c) { return c.id === id; })[0];
  if (!src) return;
  const items = (WS && WS.items) ? WS.items : [];
  const defWs = src.workspace_id || (WS && WS.current && WS.current.id) || (items[0] && items[0].id) || '';
  const opts = items.length
    ? items.map(function (w) {
        return '<option value="' + w.id + '"' + (String(w.id) === String(defWs) ? ' selected' : '') + '>' +
          escapeHtml(w.name) + (w.is_default ? ' (default)' : '') + '</option>';
      }).join('')
    : '<option value="">Default workspace</option>';
  showModal('Copy &ldquo;' + escapeHtml(src.name) + '&rdquo;',
    '<div class="form-group"><label for="bkCloneName">New name</label>' +
      '<input id="bkCloneName" value="' + escapeHtml(src.name) + '" oninput="bkCloneSync()"></div>' +
    '<div class="form-group"><label for="bkCloneSlug">Web address</label>' +
      '<input id="bkCloneSlug" value="' + escapeHtml(bkSlug(src.name)) + '">' +
      '<span class="muted">Each word joined by a hyphen — this is the public link, and you can edit it.</span></div>' +
    '<div class="form-group"><label for="bkCloneWs">Workspace</label>' +
      '<select id="bkCloneWs">' + opts + '</select>' +
      '<span class="muted">The copy lands in this workspace; the original stays where it is.</span></div>' +
    '<p class="muted" style="margin:10px 0 0">Copied: hours, resources, prices, bundles, tags, lists, ' +
      'notification emails and reminders. Not copied: bookings, orders and the Google Mirror.</p>',
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="bkCloneDo(\'' + id + '\')">Copy calendar</button>', true);
}

/* The address follows the name as it is typed: one hyphen between each word. */
function bkCloneSync() {
  const n = document.getElementById('bkCloneName');
  const s = document.getElementById('bkCloneSlug');
  if (n && s) s.value = bkSlug(n.value);
}

async function bkCloneDo(id) {
  const name = ((document.getElementById('bkCloneName') || {}).value || '').trim();
  const slug = ((document.getElementById('bkCloneSlug') || {}).value || '').trim();
  const wsEl = document.getElementById('bkCloneWs');
  const wid = wsEl ? wsEl.value : '';
  if (!name) { bkFlash('Give the copy its own name — that is what stops it being "clone".', false); return; }
  const btn = document.querySelector('#modalContainer .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Copying…'; }
  try {
    const r = await bkCall('POST', '/calendars/' + encodeURIComponent(id) + '/clone', {
      name: name, slug: slug, workspace_id: wid || undefined
    });
    closeModal();
    await bkInit();
    bkFlash('Copied into ' + (r.workspace_name || 'the workspace') + ' as “' + r.name + '”.', true);
    // Land on the copy: the owner should see what arrived, not hunt for it in the list.
    await bkOpen(r.id);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Copy calendar'; }
    bkFlash(e.message, false);
  }
}

async function bkOpen(id) {

/* WHAT THE CUSTOMER'S CONFIRMATION SAYS (ZaarHub, 2026-11-24).
 *
 * "Is a confirmation email sent to the customer when they book today? If yes, what sends it and where is
 * its wording configured?" It was invisible: the message came from the built-in default, so the account
 * had no template to point at and no way to see or change the words. This shows the message the mailer

function bkConfirmationPanel() {
  return '<div class="card" style="margin-bottom:18px"><h3 style="margin-top:0">The confirmation email your customer gets</h3>' +
