// ===== KEYBOARD SHORTCUTS (added 2026-08-21) =====
// Gmail-style navigation. ? = help. g + key = go to tab. single keys = quick actions.
(function () {
  if (window.__crmShortcutsInstalled) return;
  window.__crmShortcutsInstalled = true;

  var pendingG = null; // 'g' two-key navigation buffer
  var gTimer = null;

  // key -> { desc, fn }
  var NAV = {
    d: { desc: 'g d  → Dashboard', tab: 'dashboard' },
    c: { desc: 'g c  → Contacts', tab: 'contacts' },
    o: { desc: 'g o  → Companies', tab: 'companies' },
    p: { desc: 'g p  → Pipelines & Deals', tab: 'pipelines' },
    m: { desc: 'g m  → Campaigns', tab: 'campaigns' },
    l: { desc: 'g l  → Lists', tab: 'lists' },
    a: { desc: 'g a  → Analytics', tab: 'analytics' },
    r: { desc: 'g r  → Rules', tab: 'rules' },
    t: { desc: 'g t  → Tags', tab: 'tags' },
    s: { desc: 'g s  → Lead Scoring', tab: 'lead-scoring' },
    e: { desc: 'g e  → Email Templates', tab: 'email-templates' },
    i: { desc: 'g i  → Messages', tab: 'messages' },
    n: { desc: 'g n  → Notifications', tab: 'notifications' },
    x: { desc: 'g x  → Telnyx SMS/Voice', tab: 'telnyx' },
    k: { desc: 'g k  → Support Tickets', tab: 'tickets' },
    b: { desc: 'g b  → Private Email (Inbox)', tab: 'inbox' },
    y: { desc: 'g y  → Calendar', tab: 'calendar' },
    u: { desc: 'g u  → Bookings', tab: 'bookings' },
    q: { desc: 'g q  → AI Assistant', tab: 'ai-assistant' },
    g: { desc: 'g g  → Tracked Links', tab: 'tracked-links' },
    h: { desc: 'g h  → Checklists', tab: 'checklists' },
    w: { desc: 'g w  → Round Robin', tab: 'round-robin' },
    f: { desc: 'g f  → Profile', tab: 'profile' },
    z: { desc: 'g z  → Integration Center', tab: 'integrations' }
  };

  // single-key quick actions
  var ACTIONS = {
    c: { desc: 'c  → New Contact', fn: function () { showAddContactModal(); } },
    o: { desc: 'o  → New Company', fn: function () { showAddCompanyModal(); } },
    d: { desc: 'd  → New Deal', fn: function () { plQuickDeal(); } },
    l: { desc: 'l  → New List', fn: function () { switchTab('lists'); lsNewList(); } },
    t: { desc: 't  → New Tag', fn: function () { switchTab('tags'); tgNewTag(); } },
    k: { desc: 'k  → New Ticket', fn: function () { showAddTicketModal(); } },
    m: { desc: 'm  → Compose Message', fn: function () { showComposeModal(); } },
    p: { desc: 'p  → New Campaign', fn: function () { switchTab('campaigns'); cmNewCampaign(); } },
    e: { desc: 'e  → New Email Template', fn: function () { showAddTemplateModal(); } }
  };

  function isTyping(el) {
    if (!el) return false;
    var tag = (el.tagName || '').toLowerCase();
    var editable = el.isContentEditable || el.getAttribute && el.getAttribute('contenteditable') === 'true';
    return tag === 'input' || tag === 'textarea' || tag === 'select' || editable;
  }

  function modalOpen() {
    var el = document.getElementById('modalContainer');
    return !!(el && el.innerHTML && el.innerHTML.trim() !== '');
  }

  function clearG() { pendingG = null; if (gTimer) { clearTimeout(gTimer); gTimer = null; } }

  function toastShortcuts(list) {
    var rows = list.map(function (it) {
      var k = it.desc.split('→')[0].trim();
      var label = it.desc.indexOf('→') > -1 ? it.desc.split('→')[1].trim() : it.desc;
      return '<div class="shortcut-row" style="display:flex;justify-content:space-between;gap:20px;padding:6px 0;border-bottom:1px solid var(--border,#eee)">' +
        '<span style="color:var(--muted,#666)">' + escapeHtml(label) + '</span>' +
        '<code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">' + escapeHtml(k) + '</code></div>';
    }).join('');
    showModal('⌨️ Keyboard Shortcuts',
      '<div style="font-size:13px;max-height:60vh;overflow:auto">' + rows +
      '<div class="shortcut-row" style="padding:6px 0;border-bottom:1px solid var(--border,#eee)"><span style="color:var(--muted,#666)">Help — all shortcuts</span><code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">?</code></div>' +
      '<div class="shortcut-row" style="padding:6px 0"><span style="color:var(--muted,#666)">Close / cancel</span><code style="background:var(--bg,#f3f4f6);padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap">Esc</code></div>' +
      '</div>',
      '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
  }

  function focusSearch() {
    var first = document.querySelector('#tabPanels input[type="search"], #tabPanels input[placeholder*="earch"], #tabPanels input[placeholder*="Search"]');
    if (first) { first.focus(); return true; }
    return false;
  }

  document.addEventListener('keydown', function (e) {
    // Always allow Escape to close modal / clear g-buffer
    if (e.key === 'Escape') { clearG(); closeModal(); return; }

    if (isTyping(e.target)) return; // never hijack while typing

    // handle 'g' prefix
    if (pendingG) {
      var k2 = (e.key || '').toLowerCase();
      if (e.key === 'Escape' || e.key === '?' || e.key === 'g') { clearG(); }
      else if (NAV[k2]) {
        e.preventDefault(); e.stopPropagation();
        clearG();
        if (STATE && STATE.user) { switchTab(NAV[k2].tab); }
      } else { clearG(); return; }
      return;
    }

    var key = (e.key || '').toLowerCase();
    var ctrl = e.ctrlKey || e.metaKey;

    // '?' help
    if (e.key === '?' || (e.shiftKey && key === '/')) {
      e.preventDefault();
      toastShortcuts(Object.keys(NAV).map(function (k) { return NAV[k]; }).concat(
        Object.keys(ACTIONS).map(function (k) { return ACTIONS[k]; })));
      return;
    }

    // '/' global search (non-shift)
    if (key === '/' && !e.shiftKey && !ctrl) {
      e.preventDefault();
      if (!focusSearch()) toastShortcuts([{ desc: 'No search box on this tab' }]);
      return;
    }

    // step through modal actions
    if (modalOpen()) return;

    if (key === 'g') {
      e.preventDefault(); pendingG = 'g';
      if (gTimer) clearTimeout(gTimer);
      gTimer = setTimeout(clearG, 1200);
      return;
    }

    if (!ctrl && ACTIONS[key]) {
      e.preventDefault();
      ACTIONS[key].fn();
    }
  });
})();

  try {
    const [limit, available, active] = await Promise.all([
      API.get('/industries/limit'),

      API.get('/industries'),
    ]);
    const all = famList(available, 'industries');
    const activeSlugs = new Set(famList(active, 'industries').map(d => d.industry_slug));
    const max = (limit && typeof limit.max === 'number') ? limit.max : -1;
    const current = (limit && typeof limit.current === 'number') ? limit.current : activeSlugs.size;
    const cap = (max < 0)
      ? (current + ' active · no ceiling on this plan')
      : (current + ' of ' + max + ' active');
    let rows = all.map(i => {
      const on = activeSlugs.has(i.slug);
      const action = on
        ? '<button class="btn btn-secondary btn-sm" onclick="deactivateIndustry(\'' + i.slug + '\')">Deactivate</button>'
        : '<button class="btn btn-primary btn-sm" onclick="activateIndustry(\'' + i.slug + '\')">Activate</button>';
      return '<tr>' +
        '<td>' + escapeHtml((i.icon || '') + ' ' + (i.name || i.slug)) + '</td>' +
        '<td>' + escapeHtml(i.description || '—') + '</td>' +
        '<td>' + (on ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-muted">Inactive</span>') + '</td>' +
        '<td>' + action + '</td></tr>';
    });
    const head = card('Industry tabs',
      '<p style="color:var(--text-secondary);margin-bottom:12px">' + escapeHtml(cap) +
      ' — an active industry tab is what the workspace dashboard and its automations are shaped from.</p>');
    el.innerHTML = head + (all.length
      ? '<div class="card"><div class="table-wrap"><table><thead><tr><th>Industry</th><th>What it configures</th><th>Status</th><th></th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div></div>'
      : '<div class="card"><div class="card-body"><div class="empty-state"><div class="empty-icon">🏭</div><h3>No industries</h3><p>The catalogue is empty.</p></div></div></div>');
  } catch (e) {
    el.innerHTML = card('Industry tabs',
      '<p style="color:var(--text-secondary)">Industry tabs unavailable: ' + escapeHtml(String(e.message || e)) + '</p>');
  }
}

var notifPollTimer = null;

async function loadNotifCount() {

async function loadNotifications() {
  const el = document.getElementById('notifList');

// ===== BILLING: CREDITS =====
// Credits endpoints (balance / usage) had no caller; the billing page only ever listed plans.
async function loadCredits() {
  const el = document.getElementById('creditsCard');
  if (!el) return;
  try {
    const b = await API.get('/billing/credits/balance');
    const u = await API.get('/billing/credits/usage?per_page=10');
    const allowance = b.allowance || 0, consumed = b.consumed || 0, remaining = b.remaining || 0;
    const pct = allowance > 0 ? Math.min(100, Math.round((consumed / allowance) * 100)) : 0;
    const txns = (u && u.transactions) || [];
    let rows;
    if (txns.length) {
      rows = '<table style="width:100%;border-collapse:collapse;font-size:.82rem"><thead><tr>' +
        '<th style="text-align:left;padding:6px">Action</th><th style="text-align:right;padding:6px">Credits</th>' +
        '<th style="text-align:left;padding:6px">Description</th><th style="text-align:left;padding:6px">Date</th>' +
        '</tr></thead><tbody>' +
        txns.map(function (t) {
          // The API serialises each row as a 5-tuple: [id, action_type, credits, description, created_at]
          const action = Array.isArray(t) ? t[1] : (t.action_type || '');
          const credits = Array.isArray(t) ? t[2] : (t.credits || 0);
          const desc = Array.isArray(t) ? t[3] : (t.description || '');
          const when = Array.isArray(t) ? t[4] : t.created_at;
          const col = credits < 0 ? 'var(--error,#e5484d)' : 'var(--success,#3fb950)';
          return '<tr><td style="padding:6px;border-top:1px solid var(--border,#2a2a2a)">' + escapeHtml(String(action)) + '</td>' +
            '<td style="padding:6px;text-align:right;border-top:1px solid var(--border,#2a2a2a);color:' + col + '">' + credits + '</td>' +
            '<td style="padding:6px;border-top:1px solid var(--border,#2a2a2a)">' + escapeHtml(String(desc || '')) + '</td>' +
            '<td style="padding:6px;border-top:1px solid var(--border,#2a2a2a)">' + (when ? new Date(when).toLocaleString() : '—') + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else {
      rows = '<div class="empty-state" style="padding:12px"><p>No credit transactions yet.</p></div>';
    }
    el.innerHTML = card('Credits',
      '<div class="stats-grid">' +
        '<div class="stat-card accent"><div class="stat-value">' + remaining + '</div><div class="stat-label">Remaining</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + consumed + ' / ' + allowance + '</div><div class="stat-label">Used this period (' + pct + '%)</div></div>' +
      '</div>' + rows +
      '<p class="config-desc" style="margin-top:10px">Credit packs are purchased through checkout. The old self-serve “buy credits” route granted credits with no payment attached and was removed.</p>');
  } catch (e) {
    el.innerHTML = card('Credits', '<p style="color:var(--text-secondary)">Credits endpoint: ' + escapeHtml(e.message) + '</p>');
  }
}

// ===== AFFILIATES =====
// The tenant Affiliates tab shipped as placeholderPanel(...) over a backend that was never broken.
// Probed LIVE 2026-09-22 with a real tenant-owner token (before this change):
//   no affiliate profile: GET /profile /referrals /payouts /stats /my-products -> 404 with a MEANINGFUL
//     body ("No affiliate profile" / "Affiliate profile not found. Create one first."), /products -> 200
//   with a profile created through this same API: POST /profile 201; GET /profile|/referrals|/payouts|
//     /stats|/my-products 200; POST /my-products/unselect -> "Product unselected";
//     POST /redeem/<unknown code> -> 404 "Invalid or inactive affiliate code" (correct behaviour)
// => the fix is this surface. Every control below performs a real request (no toast-only buttons).
// The routes sit behind FeatureGate("affiliates"); a plan that sets it false answers 402, which
// API.call turns into the upgrade banner — handled below as a plan message, not an error.
let AFF = { profile: null };

function affMoney(v) { return '$' + (Number(v || 0)).toFixed(2); }

function affJoinCard() {
  return card('Become an affiliate',
    '<p class="config-desc">This account has no affiliate profile yet. Create one to get a referral ' +
    'code and earn commission on the products you promote.</p>' +
    '<button class="btn btn-primary btn-sm" id="affJoinBtn" onclick="createAffiliateProfile()">Create affiliate profile</button>');
}

function affProfileCard(p, s) {
  const ctype = String(p.commission_type || '');
  const rate = String(p.commission_rate != null ? p.commission_rate : '\u2014') + (ctype === 'percentage' ? '%' : '');
  let body =
    '<div class="stats-grid">' +
      '<div class="stat-card accent"><div class="stat-value" id="affCode">' + escapeHtml(String(p.code || '\u2014')) + '</div><div class="stat-label">Referral code</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + escapeHtml(rate) + '</div><div class="stat-label">Commission (' + escapeHtml(ctype || '\u2014') + ')</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + affMoney(p.total_earned) + '</div><div class="stat-label">Total earned</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + affMoney(p.total_paid) + '</div><div class="stat-label">Total paid</div></div>' +
    '</div>';
  if (s) {
    body +=
    '<div class="stats-grid" style="margin-top:10px">' +
      '<div class="stat-card"><div class="stat-value">' + (s.total_referrals || 0) + '</div><div class="stat-label">Referrals</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + (s.pending_referrals || 0) + '</div><div class="stat-label">Pending</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + (s.converted_referrals || 0) + '</div><div class="stat-label">Converted</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + affMoney(s.pending_payout) + '</div><div class="stat-label">Pending payout</div></div>' +
    '</div>';
  }
  body +=
    '<p class="config-desc" style="margin-top:10px">Share <code>' + escapeHtml(String(p.code || '')) + '</code> \u2014 ' +
      (p.is_active === false ? 'this profile is currently INACTIVE.' : 'this profile is active.') + '</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">' +
      '<button class="btn btn-secondary btn-sm" onclick="copyAffiliateCode()">Copy referral code</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="showRedeemCodeModal()">Redeem a code</button>' +
    '</div>';
  return card('Affiliate profile', body);
}

async function loadAffiliates() {
  const el = document.getElementById('affSummary');
  if (!el) return;
  AFF = { profile: null };
  ['affReferrals', 'affPayouts', 'affProducts'].forEach(function (id) {
    const n = document.getElementById(id);
    if (n) n.innerHTML = '';
  });
  try {
    const p = await API.get('/affiliates/profile');
    AFF.profile = p;
    el.innerHTML = affProfileCard(p);
    await loadAffiliateStats();
    await loadAffiliateReferrals();
    await loadAffiliatePayouts();
    await loadAffiliateProducts();
  } catch (e) {
    const msg = (e && e.message) || String(e);
    if (msg.indexOf('Payment required') !== -1) {
      el.innerHTML = card('Affiliates',
        '<p class="config-desc">The affiliate program is not enabled on this plan. Upgrade to turn it on.</p>');
    } else if (/No affiliate profile/i.test(msg)) {
      el.innerHTML = affJoinCard();
    } else {
      el.innerHTML = card('Affiliates', '<p class="config-desc">Affiliates endpoint: ' + escapeHtml(msg) + '</p>');
    }
  }

//   GET    /api/affiliates/products/tags   the ACTIVE catalogue with tag names, grouped by tag
// `my-products` below lists what an affiliate may pick from, so the catalogue lives on this tab.
// Server-side the write verbs are owner/admin only (403 for a member), which is why this panel —
// and only this panel — renders for those roles; the affiliate's own picker stays for everyone.
// ============================================================================

const AFF_BOARD_ROLES = ['owner', 'account_owner', 'admin', 'agency_admin'];
function affIsAdmin() {
  return !!(STATE.user && AFF_BOARD_ROLES.indexOf(STATE.user.role) >= 0);
}

// Board state, kept separate from AFF (which is null until an affiliate profile exists).
let AFFB = { rows: null, tags: null };
let AFFB_TAGMAP = {};

async function affBoardTags() {
  if (!AFFB.tags) {
    try { AFFB.tags = famList(await API.get('/tags'), 'tags'); } catch (_) { AFFB.tags = []; }
    AFFB_TAGMAP = {};
    AFFB.tags.forEach(function (t) { AFFB_TAGMAP[t.id] = t.name; });
  }
  return AFFB.tags;
}

function affCommission(p) {
  if (p.commission_type === 'fixed') return affMoney(p.commission_amount) + ' (fixed)';
  return String(p.commission_rate != null ? p.commission_rate : '\u2014') + '%';
}

async function loadAffiliateBoard() {
  const el = document.getElementById('affBoard');
  if (!el) return;
  if (!affIsAdmin()) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Loading the product board...</div>';
  await affBoardTags();

  let h = '';
  // ── management view: every row, active or not (that is what GET /products returns) ──
  try {
    const d = await API.get('/affiliates/products');
    const rows = famList(d, 'products');
    AFFB.rows = rows;
    h += card('Product board',
      '<p class="config-desc">The catalogue your affiliates promote. Inactive products stay here ' +
      'but are hidden from the picker they see.</p>') +
      dataTable(['Product', 'Tag', 'Price', 'Commission', 'Status', 'Order', ''],
        rows.map(function (p) {
          const id = escapeHtmlAttr(String(p.id));
          return [
            escapeHtml(String(p.name || '\u2014')),
            escapeHtml(String(AFFB_TAGMAP[p.tag_id] || '\u2014')),
            affMoney(p.price),
            escapeHtml(affCommission(p)),
            p.is_active === false ? '<span class="badge badge-muted">inactive</span>'
                                  : '<span class="badge badge-primary">active</span>',
            escapeHtml(String(p.sort_order != null ? p.sort_order : 0)),
            '<button class="btn btn-ghost btn-sm" onclick="showProductModal(\'' + id + '\')">Edit</button> ' +
            '<button class="btn btn-ghost btn-sm" onclick="toggleProductActive(\'' + id + '\', ' +
              (p.is_active === false) + ')">' + (p.is_active === false ? 'Activate' : 'Deactivate') + '</button> ' +
            '<button class="btn btn-ghost btn-sm" onclick="deleteProductRow(\'' + id + '\', \'' +
              escapeHtmlAttr(String(p.name || '')) + '\')">Delete</button>'
          ];
        }),
        'No products on the board yet \u2014 use “+ Add product” so your affiliates have something to promote.');
  } catch (e) {
    h += card('Product board', '<p class="config-desc">Products endpoint: ' +
      escapeHtml((e && e.message) || String(e)) + '</p>');
  }

  // ── affiliate-facing catalogue: ACTIVE rows + tag names (GET /products/tags) ──
  try {
    const d = await API.get('/affiliates/products/tags');
    const rows = famList(d, 'products');
    const groups = {};
    const order = [];
    rows.forEach(function (p) {
      const k = p.tag_name || 'Untagged';
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(p);
    });
    let body = '<p class="config-desc">Active products only, grouped by tag \u2014 this is exactly ' +
      'what the picker above draws from (' + rows.length + ' product' + (rows.length === 1 ? '' : 's') + ').</p>';
    if (!rows.length) {
      body += '<div class="empty-state"><h3>Nothing active yet</h3>' +
        '<p>Activate a product on the board above to make it promotable.</p></div>';
    }
    order.forEach(function (k) {
      body += '<p class="config-desc" style="margin:12px 0 4px"><strong>' + escapeHtml(k) + '</strong> ' +
        '(' + groups[k].length + ')</p>' +
        dataTable(['Product', 'Price', 'Commission', 'Checkout'],
          groups[k].map(function (p) {
            return [
              escapeHtml(String(p.name || '\u2014')),
              affMoney(p.price),
              escapeHtml(affCommission(p)),
              p.checkout_url
                ? '<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="' +
                  escapeHtmlAttr(String(p.checkout_url)) + '">Open</a>'
                : '\u2014'
            ];
          }), '');
    });
    h += '<div id="affBoardCatalogue">' + card('Catalogue affiliates can promote', body) + '</div>';
  } catch (e) {
    h += '<div id="affBoardCatalogue">' + card('Catalogue affiliates can promote',
      '<p class="config-desc">Catalogue endpoint: ' +
      escapeHtml((e && e.message) || String(e)) + '</p>') + '</div>';
  }

  el.innerHTML = h;
}

async function toggleProductActive(id, makeActive) {

    await API.patch('/affiliates/products/' + id, { is_active: !!makeActive });
    toast(makeActive ? 'Product activated' : 'Product deactivated', 'success');
  } catch (e) {
    toast((e && e.message) || 'Could not change that product', 'error');

  await loadAffiliateBoard();
}

async function showProductModal(id) {

  }
  let opts = '<option value="">No tag</option>';

    '<div class="form-group"><label>Commission type</label>' +
      '<select id="pbType">' +
        '<option value="percentage"' + (ctype === 'percentage' ? ' selected' : '') + '>percentage</option>' +
        '<option value="fixed"' + (ctype === 'fixed' ? ' selected' : '') + '>fixed</option>' +
      '</select></div>' +
    '<div class="form-group"><label>Commission rate (% of price)</label>' +
      '<input id="pbRate" type="number" step="0.01" min="0" value="' + escapeHtmlAttr(v('commission_rate', '10')) + '"></div>' +
    '<div class="form-group"><label>Commission amount (used when the type is fixed)</label>' +
      '<input id="pbAmount" type="number" step="0.01" min="0" value="' + escapeHtmlAttr(v('commission_amount', '0')) + '"></div>' +
    '<div class="form-group"><label>Tag</label><select id="pbTag">' + opts + '</select></div>' +
    '<div class="form-group"><label>Checkout URL</label>' +
      '<input id="pbCheckout" value="' + escapeHtmlAttr(v('checkout_url')) + '"></div>' +
    '<div class="form-group"><label>Image URL</label>' +
      '<input id="pbImage" value="' + escapeHtmlAttr(v('image_url')) + '"></div>' +
    '<div class="form-group"><label>Sort order</label>' +
      '<input id="pbSort" type="number" step="1" value="' + escapeHtmlAttr(v('sort_order', '0')) + '"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="pbSave" onclick="saveProduct(' +
      (id ? "'" + escapeHtmlAttr(String(id)) + "'" : 'null') + ')">' +
      (id ? 'Save product' : 'Create product') + '</button>');
}

async function saveProduct(id) {
  function val(elId) { const n = document.getElementById(elId); return n ? n.value.trim() : ''; }
  function num(elId, dflt) {
    const raw = val(elId);
    if (raw === '') return dflt;
    const n = Number(raw);
    return isNaN(n) ? dflt : n;
  }
  const name = val('pbName');
  if (!name) { toast('A product name is required', 'error'); return; }
  const tag = val('pbTag');
  const body = {
    name: name,
    price: num('pbPrice', 0),
    commission_type: val('pbType') || 'percentage',
    commission_rate: num('pbRate', 10),
    commission_amount: num('pbAmount', 0),
    sort_order: num('pbSort', 0)
  };
  // PATCH is a partial update: `null` means "leave unchanged" server-side, so text fields are sent
  // as '' (which clears them) and tag_id has its own explicit `clear_tag` flag — otherwise picking
  // "No tag" would silently keep the old tag and still report success.
  if (id) {
    body.description = val('pbDesc');
    body.image_url = val('pbImage');
    body.checkout_url = val('pbCheckout');
    if (tag) body.tag_id = tag; else body.clear_tag = true;
  } else {
    body.description = val('pbDesc') || null;
    body.image_url = val('pbImage') || null;
    body.checkout_url = val('pbCheckout') || null;
    body.tag_id = tag || null;
  }
  const btn = document.getElementById('pbSave');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  try {
    if (id) await API.patch('/affiliates/products/' + id, body);
    else await API.post('/affiliates/products', body);
    closeModal();
    toast(id ? 'Product updated' : 'Product created', 'success');
  } catch (e) {
    toast((e && e.message) || 'Could not save the product', 'error');
    if (btn) { btn.disabled = false; btn.textContent = id ? 'Save product' : 'Create product'; }
    return;
  }
  await loadAffiliateBoard();
}


// ============================================================================
// WIRED FAMILIES — every family below was a registered, live backend block that no
// shipped surface called, sitting under a tab that was a placeholder or a fake.
// Each surface here renders real rows from the family's own endpoints and every
// control performs a real request (no toast-only buttons).
// Server counterpart repaired in the same change: src/pipelines/*, src/scoring/*,
// src/tags/*, src/integrations/*, src/automation/actions.rs.
// ============================================================================

function famList(res, key) {
  if (Array.isArray(res)) return res;
  if (res && Array.isArray(res[key])) return res[key];
  if (res && res.data && Array.isArray(res.data)) return res.data;
  return [];
}

// ONE feature shape for every plan card in this shell. GET /api/billing/plans returns each plan's
// `features` as a JSONB OBJECT ({"max_contacts":100,"api_access":true, …}) — NOT a list — so
// (p.features || []).slice(0, 6) threw "slice is not a function" and no plan card could paint.
// Show what the plan really enables (true) or sizes (a positive number); a plain array is still
// honoured for a plan that stores a list.
function planFeatureList(raw) {
  const out = [];
  if (Array.isArray(raw)) {
    raw.slice(0, 6).forEach(f => out.push(typeof f === 'string' ? f : (f && (f.name || f.key)) || ''));
  } else if (raw && typeof raw === 'object') {
    Object.keys(raw).forEach(k => {
      const v = raw[k];
      if (v === true) out.push(k.replace(/_/g, ' '));
      else if (typeof v === 'number' && v > 0) out.push(k.replace(/_/g, ' ') + ' (' + v + ')');
    });
  }
  return out.slice(0, 6);
}
function fh(v) { return escapeHtml(String(v === null || v === undefined || v === '' ? '—' : v)); }
function famErr(el, label, e) {
  el.innerHTML = card(label, '<p style="color:var(--text-secondary)">' + escapeHtml(label) +
    ' endpoint: ' + escapeHtml(e.message) + '</p>');
}
function confirmThen(msg, fn) { if (window.confirm(msg)) fn(); }

// ---------------------------------------------------------------- PIPELINES
let PL_DATA = [];
function plCache(pid) { return PL_DATA.find(function (x) { return x.pipeline.id === pid; }) || null; }

function pipelinesShell() {
  return pageHeader('Pipelines & Deals', 'Track deals through your sales pipeline',
    '<button class="btn btn-primary btn-sm" onclick="plNewPipeline()">+ New Pipeline</button>') +
  '<div id="plContent"><div class="loading-wrap"><div class="spinner"></div> Loading pipelines...</div></div>';
}

async function loadPipelinesTab() {
  const el = document.getElementById('plContent');
  if (!el) return;
  try {
    const pipes = famList(await API.get('/pipelines'), 'pipelines');
    PL_DATA = [];
    if (!pipes.length) {
      el.innerHTML = card('Pipelines', '<div class="empty-state"><div class="empty-icon">📈</div>' +
        '<h3>No pipelines yet</h3><p>Create your first sales pipeline to start tracking deals.</p></div>');
      return;
    }
    let h = '';
    for (const row of pipes) {
      const p = row.pipeline || row;
      let stages = row.stages || [];
      let opps = [];
      try { stages = famList(await API.get('/pipelines/' + p.id + '/stages'), 'stages'); } catch (_) {}
      try { opps = famList(await API.get('/pipelines/' + p.id + '/opportunities?per_page=50'), 'opportunities'); } catch (_) {}
      PL_DATA.push({ pipeline: p, stages: stages, opps: opps });
      const won = opps.filter(function (o) { return o.is_won; }).length;
      const lost = opps.filter(function (o) { return o.is_lost; }).length;
      const open = opps.length - won - lost;
      h += '<div class="card" style="margin-bottom:16px">' +
        '<div class="card-header">📈 ' + fh(p.name) +
          ' <span class="badge badge-primary">' + opps.length + ' deals</span> ' +
          '<span class="badge badge-success">' + won + ' won</span> ' +
          '<span class="badge badge-muted">' + open + ' open</span> ' +
          '<span class="badge badge-error">' + lost + ' lost</span>' +
          '<button class="btn btn-secondary btn-xs" onclick="plAddStage(\'' + p.id + '\')">+ Stage</button> ' +
          '<button class="btn btn-primary btn-xs" onclick="plAddDeal(\'' + p.id + '\')">+ Deal</button> ' +
          '<button class="btn btn-ghost btn-xs" onclick="plDeletePipeline(\'' + p.id + '\')">Delete pipeline</button>' +
        '</div><div class="card-body">';
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
      if (!stages.length) h += '<span class="config-desc">No stages on this pipeline — add one to move deals through it.</span>';
      stages.forEach(function (s) {
        h += '<span class="badge badge-warning" style="padding:6px 10px">' + fh(s.name) +
          (s.probability !== null && s.probability !== undefined ? ' · ' + s.probability + '%' : '') +
          (s.is_won ? ' 🏆' : '') + (s.is_lost ? ' ✕' : '') +
          ' <a href="#" title="Edit stage" onclick="plEditStage(\'' + p.id + '\',\'' + s.id + '\');return false">✎</a>' +
          ' <a href="#" title="Delete stage" onclick="plDeleteStage(\'' + p.id + '\',\'' + s.id + '\');return false">🗑</a>' +
        '</span>';
      });

      // Drag a card between stage columns to move a deal. The board and the table below it are two
      // views of the same data; both call PATCH /api/pipelines/:pid/stages/:sid/move/:oid.
      h += '<div style="color:var(--text-muted);font-size:12px;margin-bottom:6px">Drag a deal card between stages to move it.</div>';
      h += plBoard(p, stages, opps);
      h += '</div>';
      const rows = opps.map(function (o) {
        const st = stages.find(function (s) { return s.id === o.stage_id; });
        return [
          fh(o.name),
          o.value !== null && o.value !== undefined ? '$' + Number(o.value).toLocaleString() : '—',
          fh(o.currency),
          st ? fh(st.name) : '—',
          o.is_won ? '<span class="badge badge-success">won</span>'
                   : (o.is_lost ? '<span class="badge badge-error">lost</span>'
                                : '<span class="badge badge-muted">open</span>'),
          '<select onchange="plMoveDeal(\'' + p.id + '\',\'' + o.id + '\',this.value)" ' +
            'style="padding:4px 8px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary)">' +
            '<option value="">Move to…</option>' +
            stages.map(function (s) { return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>'; }).join('') +
          '</select>',
          '<button class="btn btn-ghost btn-xs" onclick="plDeleteDeal(\'' + p.id + '\',\'' + o.id + '\')">Delete</button>'
        ];
      });
      h += dataTable(['Deal', 'Value', 'Cur', 'Stage', 'Status', 'Move', ''], rows,
        'No deals in this pipeline yet — use “+ Deal”.');
      h += '</div></div>';
    }
    el.innerHTML = h;
  } catch (e) { famErr(el, 'Pipelines', e); }
}

async function plAddDeal(pid, presetStageId) {

  const plp = plCache(pid);
  const stageOpts = ((plp && plp.stages) || []).map(function (s) {

  }).join('');

    const cs = famList(await API.get('/contacts'), 'contacts');

      opts += '<option value="' + c.id + '">' + escapeHtml(nm) + '</option>';
    });

  showModal('New Deal',

    '<div class="form-group"><label>Contact</label><select id="dlContact">' + opts + '</select></div>' +
    '<div class="form-group"><label>Stage</label><select id="dlStage">' + stageOpts + '</select></div>' +
    '<div class="form-group"><label>Value</label><input type="number" id="dlValue" step="0.01"></div>' +
    '<div class="form-group"><label>Currency</label><input type="text" id="dlCur" value="USD"></div>' +
    '<div class="form-group"><label>Probability %</label><input type="number" id="dlProb" min="0" max="100"></div>' +

// ---------------------------------------------------------------- DRAG & DROP BOARD
// HTML5 native drag and drop: the card carries draggable="true", each stage column accepts a drop.
// `PL_DRAG` is the reliable payload (a JS variable); `dataTransfer` is set as well so a drop from a
// different tab or a synthetic event still resolves the deal.
let PL_DRAG = null;

function plBoard(p, stages, opps) {
  if (!stages.length) return '';
  const cols = stages.map(function (s) {
    const cards = opps.filter(function (o) { return o.stage_id === s.id; });
    return '<div class="pl-col" data-stage="' + s.id + '" data-pipeline="' + p.id + '"' +
        ' ondragover="plDragOver(event, this)" ondragleave="plDragLeave(this)"' +
        ' ondrop="plDrop(event, this, \'' + s.id + '\')"' +
        ' style="flex:1 1 220px;min-width:200px;background:var(--bg-secondary);border:1px dashed var(--border);border-radius:10px;padding:8px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<strong style="font-size:13px">' + fh(s.name) + (s.is_won ? ' 🏆' : '') + (s.is_lost ? ' ✕' : '') + '</strong>' +
        '<span><span class="badge badge-muted">' + cards.length + '</span> ' +
        '<button class="btn btn-ghost btn-xs" title="New deal on this stage" onclick="plAddDeal(\'' + p.id + '\',\'' + s.id + '\')">+</button></span>' +
      '</div>' +
      (cards.length ? cards.map(function (o) {
        return '<div class="pl-card" draggable="true" data-opp="' + o.id + '"' +
          ' ondragstart="plDragStart(event, \'' + p.id + '\', \'' + o.id + '\')" ondragend="plDragEnd(this)"' +
          ' style="background:var(--bg-primary,#16161a);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab">' +
          '<div style="font-weight:600;font-size:13px">' + fh(o.name) + '</div>' +
          '<div style="color:var(--text-muted);font-size:12px">' +
            (o.value !== null && o.value !== undefined ? '$' + Number(o.value).toLocaleString() : '—') +
            (o.probability !== null && o.probability !== undefined ? ' · ' + o.probability + '%' : '') +
          '</div></div>';
      }).join('') : '<div style="color:var(--text-muted);font-size:12px;padding:6px">Drop a deal here</div>') +
    '</div>';
  }).join('');
  return '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px">' + cols + '</div>';
}

function plDragStart(ev, pid, oid) {
  PL_DRAG = { pipelineId: pid, oppId: oid };
  try { ev.dataTransfer.setData('text/plain', oid); ev.dataTransfer.effectAllowed = 'move'; } catch (_) {}
  try { ev.currentTarget.style.opacity = '0.5'; } catch (_) {}
}

function plDragEnd(el) {
  try { el.style.opacity = '1'; } catch (_) {}
  PL_DRAG = null;
}

function plDragOver(ev, col) {
  ev.preventDefault();                       // without this the drop event never fires
  try { ev.dataTransfer.dropEffect = 'move'; } catch (_) {}
  col.style.borderColor = 'var(--primary,#6366f1)';
  col.style.background = 'rgba(99,102,241,0.08)';
}

function plDragLeave(col) {
  col.style.borderColor = 'var(--border)';
  col.style.background = 'var(--bg-secondary)';
}

function plDrop(ev, col, stageId) {
  ev.preventDefault();
  plDragLeave(col);
  const drag = PL_DRAG;
  let oid = drag ? drag.oppId : null;
  if (!oid) { try { oid = ev.dataTransfer.getData('text/plain'); } catch (_) {} }
  const pid = (drag && drag.pipelineId) || col.getAttribute('data-pipeline') || '';
  if (!oid || !pid) { toast('Nothing to move', 'error'); return; }
  plMoveDealAsync(pid, oid, stageId);
}

function plMoveDealAsync(pid, oppId, stageId) {
  if (!stageId) return Promise.resolve();
  return API.patch('/pipelines/' + pid + '/stages/' + stageId + '/move/' + oppId, {})
    .then(function (r) {
      toast('Deal moved to ' + (r && r.status ? r.status : 'new stage'), 'success');
      loadPipelinesTab();
      return r;
    })
    .catch(function (e) {
      toast('Move failed: ' + e.message, 'error');
      loadPipelinesTab();
      throw e;
    });
}

function plDeleteDeal(pid, oppId) {
  confirmThen('Delete this deal?', function () {
    API.del('/pipelines/' + pid + '/opportunities/' + oppId)
      .then(function () { toast('Deal deleted', 'success'); loadPipelinesTab(); })
      .catch(function (e) { toast('Delete failed: ' + e.message, 'error'); });
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// BYOK / OAuth-gated blocks — google-calendar, telnyx, private-email, native sync
//
// Every route in these four blocks was registered on the backend with no shipped
// caller. This is the caller. Ground rules that shaped it:
//  * a PER-TENANT credential (provider_keys, via the Integration Center) is the only
//    way in. With no key there is no fake success: each surface renders the exact
//    sentence the API answered, plus where to fix it;
//  * a machine surface (Google's OAuth redirect, provider webhooks) is never driven
//    from here — Google calls it, this only STARTS the flow;
//  * every request body is what the Rust struct actually requires, probed live first
//    (send-sms wants from/to/body; numbers wants `number`; sync/pull wants
//    entity_type; auto-replies wants domain_id; send wants from_address).
// ═══════════════════════════════════════════════════════════════════════════════

function gcRender() {
  const el = document.getElementById('gcContent');
  if (!el) return;

      ? '<span class="badge badge-success">linked</span>' +

      escapeHtmlAttr(c.slug) + '">Edit</button>';

      actions += ' <button class="btn btn-secondary btn-xs" data-gc="sync" data-id="' +
        escapeHtmlAttr(c.id) + '">Sync now</button>';

    return [escapeHtml(c.name), '<code>' + escapeHtml(c.slug) + '</code>', badge, actions];
  });

  el.innerHTML = card('📅 Booking calendars &rarr; Google Calendar',
      '<p style="color:var(--text-secondary);margin:0">CoreSwift pushes a calendar\'s bookings OUT as Google Calendar events and pulls busy times back IN. ' +
      (GC.configured
        ? 'A Google OAuth client is stored on this account, so consent can start now.'
        : '<strong>No Google OAuth client is stored on this account yet.</strong> Add your client ID and secret under <em>Provider keys</em> in the ' +
          'Integration Center — the connect button will then print the exact redirect URI to register on your Google client.') +
      '</p>') +
    dataTable(['Calendar', 'Slug', 'Google Calendar', ''], rows,
      'No booking calendars yet — use “+ New Calendar” to create one.');

function gcBind(root) {
  root.querySelectorAll('[data-gc]').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.getAttribute('data-gc');
      const id = b.getAttribute('data-id');
      if (act === 'connect') gcConnect(id, b);
      else if (act === 'sync') gcSync(id, b);
      else if (act === 'edit') gcEditCalendar(id);
    });
  });
}

async function gcConnect(calendarId, btn) {
  const flow = document.getElementById('gcFlow');
  if (btn) btn.disabled = true;
  try {
    const d = await API.get('/google-calendar/connect-url?calendar_id=' + encodeURIComponent(calendarId));
    if (flow) {
      flow.innerHTML = card('🔗 Finish the Google handshake',
        '<p style="color:var(--text-secondary)">1. This deployment\'s callback URL — it must be registered byte-for-byte on your Google OAuth client:<br>' +
        '<code>' + escapeHtml(d.redirect_uri || '') + '</code></p>' +
        '<p style="color:var(--text-secondary)">2. Open the consent screen and approve. Google sends the browser back to CoreSwift, which stores the refresh token on this calendar.</p>' +
        '<a class="btn btn-primary btn-sm" href="' + escapeHtmlAttr(d.connect_url || '#') + '" target="_blank" rel="noopener">Open Google consent</a>');
    }
  } catch (e) {
    if (flow) flow.innerHTML = icErr('Google Calendar is not ready for this account', e.message);
    toast('Connect failed: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function gcSync(calendarId, btn) {
  const flow = document.getElementById('gcFlow');
  if (btn) btn.disabled = true;
  try {
    const r = await API.post('/google-calendar/sync/' + encodeURIComponent(calendarId), { full_sync: true });
    const pushed = (r && r.pushed_events) || [];
    const pulled = (r && r.pulled_events) || [];
    toast('Sync complete — pushed ' + pushed.length + ', pulled ' + pulled.length, 'success');
    if (flow) {
      flow.innerHTML = card('🔄 Last sync',
        '<p style="color:var(--text-secondary);margin:0">pushed ' + pushed.length + ' · pulled ' + pulled.length + '</p>');
    }
  } catch (e) {
    toast('Sync failed: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function txConfigured() { return !!(TX.config && TX.config.api_key_set); }

function txRenderSend() {

async function txSend() {

async function txRelease(id) {

async function txClaim(number) {

function txBind(root) {

// ── Mail transport banner (t_d9d6120a) ─────────────────────────────────────────
// Which transport carries THIS workspace's mail, straight from GET /api/comms/providers. The
// delivery path resolves the transport from the same two stores, so this panel cannot name one the
// send path would not use. "none" is rendered as an explicit error: without it, messages are
// queued and then fail permanently without the workspace ever finding out.
function peTransportCard(t) {
  if (!t) return icErr('Mail transport unknown', 'the provider panel returned no transport block, so it cannot say where your mail goes.');
  var dom = escapeHtml(t.domain || ''), from = escapeHtml(t.from || '');
  if (t.source === 'tenant') {
    return card('<span class="badge badge-success">your domain</span> Mail transport',
      '<p style="margin:0">Mail from this workspace leaves on <code>' + dom + '</code>, sent as <code>' + from + '</code>' +
      (t.byok_source === 'private_email_domains'
        ? ' &mdash; the verified domain you added in this tab.'
        : ' &mdash; the provider domain saved in your provider settings.') +
      ' The transport is decided per message, from this same configuration.</p>');
  }
  if (t.source === 'platform') {
    return card('<span class="badge badge-warning">platform mail transport</span> Mail transport',
      '<p style="margin:0">Mail from this workspace leaves on the <b>platform mail transport</b> as <code>' + from +
      '</code>, not on a domain you own, so it is the platform (not your brand) that receivers see. ' +
      'Add your own domain below &mdash; Mailgun has to report it as <b>verified</b> &mdash; and mail will leave on your domain instead.</p>');
  }
  return icErr('No mail transport: email cannot be delivered from this workspace',
    'Nothing is configured to carry this workspace\u2019s mail, so any message queued now fails permanently. Add a provider domain in this tab before sending.');
}

async function loadInboxTab() {
  const el = document.getElementById('peDomains');
  if (!el) return;
  let domains = [], boxes = [], auto = [], support = null, errs = {};
  try { const d = await API.get('/private-email/domains'); domains = Array.isArray(d) ? d : ((d && (d.items || d.domains)) || []); }
  catch (e) { errs.domains = e.message; }
  try { const d = await API.get('/private-email/boxes'); boxes = Array.isArray(d) ? d : ((d && (d.items || d.boxes)) || []); }
  catch (e) { errs.boxes = e.message; }
  try { const d = await API.get('/private-email/auto-replies'); auto = Array.isArray(d) ? d : ((d && (d.items || d.auto_replies)) || []); }
  catch (e) { errs.autoReplies = e.message; }
  try { support = await API.get('/private-email/support-box'); } catch (e) { errs.support = e.message; }
  // The saved-key store is where a domain's credential can live by reference; read it here so the
  // tab can show a key that exists but cannot be opened (t_72f0bc83).
  let keys = [], keysErr = null;
  try { const d = await API.get('/private-email/keys'); keys = Array.isArray(d) ? d : ((d && (d.items || d.keys)) || []); }
  catch (e) { keysErr = e.message; }
  PE.domains = domains; PE.boxes = boxes; PE.autoReplies = auto; PE.support = support;
  PE.keys = keys; PE.keysError = keysErr;
  // Which transport will carry this workspace's mail (t_d9d6120a). Read from the same endpoint the
  // delivery path's decision comes from, so this panel cannot promise a transport the send path
  // would not use.
  let transport = null, transportErr = null;
  try { transport = await API.get('/comms/providers'); }
  catch (e) { transportErr = e.message; }
  PE.transport = (transport && transport.email_transport) ? transport.email_transport : null;
  const transportEl = document.getElementById('peTransport');
  if (transportEl) {
    transportEl.innerHTML = transportErr
      ? icErr('Could not read which transport carries your mail', transportErr)
      : peTransportCard(PE.transport);
  }

  if (errs.support) document.getElementById('peSupport').innerHTML = icErr('Could not read the support box', errs.support);
  else {
    const on = !!(support && support.configured);
    document.getElementById('peSupport').innerHTML = card('🎫 Support box &rarr; tickets',
      '<p style="color:var(--text-secondary);margin:0">' + (on
        ? 'Mail forwarded to <code>' + escapeHtml(support.email_address || '') + '</code> becomes a support ticket automatically.' +
          (support.forwarding_instructions ? '<br>' + escapeHtml(support.forwarding_instructions) : '')
        : 'No support box yet. Pick one of this account\'s mailboxes and forwarding to it will open tickets automatically.') + '</p>',
      '<button class="btn btn-primary btn-sm" onclick="peOpenSupportBox()">' + (on ? 'Change support box' : 'Set support box') + '</button>');
  }

  if (errs.domains) el.innerHTML = icErr('Could not read your domains', errs.domains);
  else {
    const rows = PE.domains.map(d => [
      '<code>' + escapeHtml(d.domain || '') + '</code>',
      escapeHtml(d.label || '—'),
      escapeHtml(d.provider_type || 'mailgun'),
      peVerifyCell(d),
      d.catch_all_enabled ? 'catch-all' : '—',
      peCredentialCell(d)
    ]);
    el.innerHTML = card('🌐 Domains you send from',
      '<p style="color:var(--text-secondary);margin:0">Each domain is the provider-level identity CoreSwift sends and receives with. Credentials are per account, never a platform default.</p>',
      '<button class="btn btn-primary btn-sm" onclick="peOpenAddDomain()">+ Add domain</button>') +
      dataTable(['Domain', 'Label', 'Provider', 'Verification', 'Catch-all', 'Credential'], rows,
        'No domains on this account yet.') + peKeysCard();
  }

  document.getElementById('peBoxes').innerHTML = card('📬 Mailboxes',
    '<p style="color:var(--text-secondary);margin:0">A mailbox is an address on one of your domains. Outbound mail can only be sent FROM a mailbox.</p>') +
    dataTable(['Address', 'Local part', 'Status', 'Forwarding', 'Actions'],
      PE.boxes.map(b => [

// ── Credential health: a stored key nobody can open must not read as configured ────────────────
// The server decides credential_status / key_status by OPENING the stored ciphertext, never from its
// shape (t_72f0bc83): 'usable' | 'unreadable' | 'empty' | 'missing'. Before this, a row that exists
// but cannot be opened rendered exactly like a healthy one, and the only symptom was a failed send.
function peCredentialCell(d) {
  const s = d.credential_status;
  if (s === 'usable') return '<span class="badge badge-success">readable</span>';
  if (s === 'unreadable') {
    return '<span class="badge badge-error">re-enter key</span> ' +
      '<button class="btn btn-primary btn-xs" onclick="peReenterDomainKey(\'' + d.id + '\')">Re-enter</button>';
  }
  if (s === 'empty') return '<span class="badge badge-warning">empty key</span>';
  return '<span class="badge badge-muted">no key</span>';
}

// ── Verification re-check (t_f02ade57) ────────────────────────────────────────────────────────
// A domain added while Mailgun still reported it unverified stays `verified=false` until something
// asks Mailgun again. Only a `verified` row carries this workspace's mail, so without a re-check the
// customer would have to re-paste an API key that was never wrong to get mail onto a domain Mailgun
// had already activated. The server decides: Mailgun's own `state` is the verdict, never this page.
function peVerifyCell(d) {
  const badge = d.verified
    ? '<span class="badge badge-success">verified</span>'
    : '<span class="badge badge-warning">pending DNS</span>';
  return badge + ' <button class="btn btn-ghost btn-xs" onclick="peRecheckDomain(\'' + d.id + '\')" title="Ask Mailgun again for this domain">Re-check</button>';
}

// Asks the provider again for THIS domain only (POST /api/private-email/domains/:id/verify), then
// re-reads the tab so the transport banner above moves with it: the banner is drawn from
// GET /api/comms/providers — the same store the delivery path reads — so it cannot disagree with
// where the mail will really leave from.
async function peRecheckDomain(domainId) {
  const d = (PE.domains || []).filter(function (x) { return x.id === domainId; })[0] || {};
  const btns = document.querySelectorAll('[onclick*="peRecheckDomain(\'' + domainId + '\')"]');
  Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
  try {
    const r = await API.post('/private-email/domains/' + encodeURIComponent(domainId) + '/verify');
    const st = (r && r.mailgun_state) || 'unknown';
    if (r && r.verified && r.changed) {
      toast('Mailgun reports "' + st + '" — mail from this workspace now leaves on ' + (d.domain || 'your domain'), 'success');
    } else if (r && r.verified) {
      toast('Mailgun reports "' + st + '" — already verified, nothing changed', 'success');
    } else {
      toast('Mailgun still reports "' + st + '" — the platform mail transport keeps carrying your mail until the domain is active', 'error');
    }
    await loadInboxTab();
  } catch (e) {
    toast('Could not re-check: ' + e.message, 'error');
    Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
  }
}

// ── Add a domain: the credential step (kanban t_ff03e048) ───────────────────
// This modal used to collect Domain / Label / Provider and post exactly those, so
// EVERY "Add domain" was a 400 from a handler that requires a credential:
//   mailgun -> "Either mailgun_api_key or api_key_id is required"
//   smtp    -> "smtp_host is required for SMTP provider"
// Add-domain is the front door of the whole Private Email feature (domains ->
// mailboxes -> send/inbound), so the feature could not be entered at all.
// The provider list also offered SendGrid, which this deployment does not
// implement: add_domain() routes everything that is not "smtp" to
// add_mailgun_domain(), which stores provider_type='mailgun' — picking SendGrid
// silently created a Mailgun domain that then demanded a Mailgun key.
// Mailgun needs the key of the account that ALREADY carries the domain
// (validate_mailgun_domain does GET /v3/domains/<domain> with that key), so a
// platform-wide key is not an option for a customer's own domain; the key field
// is required and the copy says why.
function peProviderFields() {
  const p = document.getElementById('peNewProvider');
  if (!p) return;
  const mg = document.getElementById('peMailgunFields');
  const sm = document.getElementById('peSmtpFields');
  if (mg) mg.style.display = (p.value === 'smtp' ? 'none' : '');
  if (sm) sm.style.display = (p.value === 'smtp' ? '' : 'none');
  const t = document.getElementById('peDomainSave');
  if (t) t.disabled = false;
}

function peOpenAddDomain() {
  const savedKeys = (PE.keys || []).filter(function (k) { return (k.provider || 'mailgun') === 'mailgun'; });
  const keyOpts = savedKeys.map(function (k) {
    return '<option value="' + escapeHtmlAttr(k.id) + '">' + escapeHtml(k.label || 'saved key') +
      (k.key_status === 'unreadable' ? ' — cannot be opened by the server' : '') + '</option>';
  }).join('');
  showModal('Add a domain',

    '<span class="form-hint">The sending domain, spelled exactly as the provider knows it.</span></div>' +

    '<div class="form-group"><label>Provider</label>' +
    '<select id="peNewProvider" onchange="peProviderFields()">' +
    '<option value="mailgun">Mailgun</option>' +
    '<option value="smtp">SMTP (a mail server you run)</option>' +
    '</select>' +
    '<span class="form-hint">SendGrid / SES / Postmark are not implemented in this deployment, so they are not offered — choosing one here used to silently create a Mailgun domain.</span></div>' +
    '<div id="peMailgunFields">' +
    '<div class="form-group"><label>Mailgun API key</label>' +
    '<input type="password" id="peNewKey" autocomplete="new-password" placeholder="key-...">' +
    '<span class="form-hint">Required. Use the key of the Mailgun account that already carries this domain: the domain is verified against that account before it is saved, so a shared platform key cannot add your domain. Stored encrypted with the domain, never echoed back.</span></div>' +
    (keyOpts
      ? '<div class="form-group"><label>or use a saved key</label>' +
        '<select id="peNewSavedKey"><option value="">(paste a new key above)</option>' + keyOpts + '</select>' +
        '<span class="form-hint">Saved keys are the ones listed in "Saved provider keys" below; a domain can point at one instead of carrying its own copy.</span></div>'
      : '') +
    '<div class="form-group"><label>Region</label>' +
    '<select id="peNewRegion"><option value="us">US (api.mailgun.net)</option><option value="eu">EU (api.eu.mailgun.net)</option></select></div>' +
    '</div>' +
    '<div id="peSmtpFields" style="display:none">' +
    '<p style="color:var(--text-secondary);margin:0">Nothing is sent to the mail server before the domain is saved, so a wrong host or password is only reported by the first send.</p>' +
    '<div class="form-group"><label>SMTP host</label>' +
    '<input type="text" id="peNewSmtpHost" placeholder="smtp.yourdomain.com" autocomplete="off"></div>' +
    '<div class="form-group"><label>Port</label><input type="number" id="peNewSmtpPort" value="587"></div>' +
    '<div class="form-group"><label>Username</label><input type="text" id="peNewSmtpUser" autocomplete="off"></div>' +
    '<div class="form-group"><label>Password</label><input type="password" id="peNewSmtpPass" autocomplete="new-password"></div>' +
    '<div class="form-group"><label><input type="checkbox" id="peNewSmtpTls" checked> Use STARTTLS</label></div>' +
    '</div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peDomainSave">Add domain</button>');
  peProviderFields();
  const b = document.getElementById('peDomainSave');
  if (b) b.addEventListener('click', async () => {
    const domain = document.getElementById('peNewDomain').value.trim();
    if (!domain) { toast('Enter the domain', 'error'); return; }
    const provider = document.getElementById('peNewProvider').value;
    const label = document.getElementById('peNewLabel').value.trim();
    const payload = { domain: domain, provider_type: provider };
    if (label) payload.label = label;
    if (provider === 'smtp') {
      const host = document.getElementById('peNewSmtpHost').value.trim();
      const user = document.getElementById('peNewSmtpUser').value.trim();
      const pass = document.getElementById('peNewSmtpPass').value;
      if (!host || !user || !pass) { toast('SMTP needs a host, a username and a password', 'error'); return; }
      payload.smtp_host = host;
      payload.smtp_port = parseInt(document.getElementById('peNewSmtpPort').value, 10) || 587;
      payload.smtp_username = user;
      payload.smtp_password = pass;
      payload.smtp_tls = !!document.getElementById('peNewSmtpTls').checked;
    } else {
      const savedEl = document.getElementById('peNewSavedKey');
      const chosen = savedEl ? savedEl.value : '';
      const key = document.getElementById('peNewKey').value.trim();
      payload.mailgun_region = document.getElementById('peNewRegion').value;
      // A saved key wins when one is picked; otherwise the pasted key is required.
      // Failing here beats a 400 after submit, which is what this modal always did.
      if (chosen) payload.api_key_id = chosen;
      else if (key) payload.mailgun_api_key = key;
      else { toast('Paste the Mailgun API key for this domain, or pick a saved key', 'error'); return; }
    }
    b.disabled = true;
    try {
      await API.post('/private-email/domains', payload);
      closeModal(); toast('Domain added', 'success'); await loadInboxTab();
    } catch (e) {
      // A plan gate is a real answer, not a bug — show it where the user is standing.
      toast('Could not add the domain: ' + e.message, 'error');
      b.disabled = false;
    }
  });
}

    '<p style="color:var(--text-secondary);margin-bottom:14px">Pull asks ' + escapeHtml(slug) +
      ' for its records; push sends the payload below to it. Both are logged to this account\'s sync history either way.</p>' +
    '<div class="form-group"><label>Entity</label><select id="icSyncEntity">' + opts + '</select></div>' +
    '<div class="form-group"><label>Push payload (JSON)</label>' +
    '<input type="text" id="icSyncData" value="[]" autocomplete="off">' +
    '<span class="form-hint">Only used by Push — it is sent verbatim to the partner app.</span></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-secondary" id="icPullBtn">Pull from ' + escapeHtml(slug) + '</button>' +
    '<button class="btn btn-primary" id="icPushBtn">Push to ' + escapeHtml(slug) + '</button>');
  const pb = document.getElementById('icPullBtn');
  const ub = document.getElementById('icPushBtn');
  if (pb) pb.addEventListener('click', () => icSyncRun(slug, 'pull', pb));
  if (ub) ub.addEventListener('click', () => icSyncRun(slug, 'push', ub));
}

async function icSyncRun(slug, direction, btn) {
  const entity = document.getElementById('icSyncEntity').value;
  let payload = { entity_type: entity };
  if (direction === 'push') {
    const raw = document.getElementById('icSyncData').value.trim() || '[]';
    try { payload.data = JSON.parse(raw); }
    catch (e) { toast('Push payload is not valid JSON: ' + e.message, 'error'); return; }
  }
  if (btn) btn.disabled = true;
  try {
    const r = await API.post('/native/apps/' + encodeURIComponent(slug) + '/sync/' + direction, payload);
    closeModal();
    toast(direction + ' ok — ' + ((r && r.records) || 0) + ' record(s)', 'success');
    const wrap = document.getElementById('icSyncWrap');
    if (wrap) wrap.innerHTML = card('🔄 Last ' + direction + ' (' + escapeHtml(slug) + ')',
      '<p style="color:var(--text-secondary);margin:0">' + escapeHtml(entity) + ' · status ' + escapeHtml((r && r.status) || '?') +
      ' · records ' + escapeHtml(String((r && r.records) || 0)) + '</p>');
  } catch (e) {
    toast(direction + ' failed: ' + e.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function icSyncHistory(slug) {
  const wrap = document.getElementById('icSyncWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Loading sync history...</div>';
  try {
    const d = await API.get('/native/apps/' + encodeURIComponent(slug) + '/sync/history');
    const rows = ((d && d.sync_history) || []).map(h => [
      escapeHtml(h.direction || ''),
      escapeHtml(h.entity_type || ''),
      h.status === 'completed' ? '<span class="badge badge-success">completed</span>'
        : (h.status === 'failed' ? '<span class="badge badge-error">failed</span>' : '<span class="badge badge-muted">' + escapeHtml(h.status || '') + '</span>'),
      escapeHtml(String(h.records_succeeded == null ? 0 : h.records_succeeded)) + ' / ' + escapeHtml(String(h.records_processed == null ? 0 : h.records_processed)),
      escapeHtml(h.started_at ? new Date(h.started_at).toLocaleString() : ''),
      h.error_log ? '<code style="font-size:.7rem">' + escapeHtml(JSON.stringify(h.error_log).slice(0, 160)) + '</code>' : ''
    ]);
    wrap.innerHTML = card('🕓 Sync history — ' + escapeHtml(slug),
      '<p style="color:var(--text-secondary);margin:0">Every pull and push on this account, with what it moved and what it failed on.</p>') +
      dataTable(['Direction', 'Entity', 'Status', 'OK / seen', 'Started', 'Error'], rows,
        'No sync has run for this connector yet.');
  } catch (e) {
    wrap.innerHTML = icErr('Could not read the sync history for ' + slug, e.message);
  }
}

function aiShell() {

    '<div id="aiBody"><div class="loading-wrap"><div class="spinner"></div> Scoring your contacts...</div></div>' +
    '<div id="aiResult"></div>' +
    '<br><div id="aiRecommend"></div>';
}

async function loadAiTab() {
  const el = document.getElementById('aiBody');
  if (!el) return;
  const btn = document.getElementById('aiRefresh');
  if (btn) btn.onclick = function () { loadAiTab(); };
  let d;
  try {
    d = await API.post('/ai/prioritize', { limit: 25 });
  } catch (e) {
    el.innerHTML = icErr('AI scoring is not switched on for this account',
      String(e.message) === 'Payment required'
        ? 'The AI scoring module (ai_enabled) is not part of this plan. The platform admin turns it on per plan.'
        : e.message);
    const rec = document.getElementById('aiRecommend');
    if (rec) rec.innerHTML = '';
    return;
  }
  const rows = ((d && d.prioritized) || []).map(function (c) {
    const id = escapeHtmlAttr(c.contact_id);
    return [
      escapeHtml(c.name || '—'),
      escapeHtml(c.email || '—'),
      '<strong>' + (c.priority_score == null ? '—' : c.priority_score) + '</strong>',
      escapeHtml(c.risk_level || 'healthy'),
      c.days_inactive == null ? '—' : c.days_inactive + 'd',
      escapeHtml(c.recommended_action || '—'),
      '<button class="btn btn-ghost btn-xs" onclick="aiRun(\'risk\',\'' + id + '\')">Risk</button>' +
      ' <button class="btn btn-ghost btn-xs" onclick="aiRun(\'predict\',\'' + id + '\')">Win %</button>' +
      ' <button class="btn btn-ghost btn-xs" onclick="aiRun(\'timing\',\'' + id + '\')">Timing</button>' +
      ' <button class="btn btn-ghost btn-xs" onclick="aiRun(\'channel\',\'' + id + '\')">Channel</button>' +
      ' <button class="btn btn-ghost btn-xs" onclick="aiRun(\'message\',\'' + id + '\')">Draft</button>'
    ];
  });
  el.innerHTML = card('Priority queue (' + rows.length + ' of ' + ((d && d.count) || 0) + ')',
    '<p style="color:var(--text-secondary);margin:0">Ranked by the AI scoring module: score, account health and inactivity. ' +
    'Pick an action on a row to ask the assistant about that contact.</p>' +
    dataTable(['Contact', 'Email', 'Priority', 'Risk', 'Inactive', 'Recommended', 'Ask the assistant'],
      rows, 'No contacts to score yet.'), '');

  const rec2 = document.getElementById('aiRecommend');
  if (rec2) {
    rec2.innerHTML = card('🎯 Recommend a campaign',
      '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">' +
        '<div style="flex:1;min-width:240px"><label style="display:block;font-size:.8rem;color:var(--text-secondary);margin-bottom:6px">Goal</label>' +
        '<input type="text" id="aiGoal" placeholder="re-engage trial users who never imported contacts"></div>' +
        '<button class="btn btn-primary btn-sm" id="aiGoalGo">Recommend</button>' +
      '</div>', '');
    const g = document.getElementById('aiGoalGo');
    if (g) g.addEventListener('click', aiRecommend);
  }
}

async function aiRun(action, contactId) {
  const out = document.getElementById('aiResult');
  if (out) out.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Asking the assistant...</div>';
  let d;
  try {
    if (action === 'risk') d = await API.post('/ai/risk', { contact_id: contactId });
    else if (action === 'predict') d = await API.post('/ai/predict', { contact_id: contactId });
    else if (action === 'timing') d = await API.post('/ai/timing', { contact_id: contactId });
    else if (action === 'channel') d = await API.post('/ai/channel', { contact_id: contactId, context: 'churn_risk' });
    else d = await API.post('/ai/message', { contact_id: contactId, context: 'churn_risk', channel: 'email' });
  } catch (e) {
    if (out) out.innerHTML = icErr('The assistant could not answer', e.message);
    return;
  }
  aiShow(action, d);
}

async function aiRecommend() {
  const goalEl = document.getElementById('aiGoal');
  const goal = goalEl ? String(goalEl.value || '').trim() : '';
  if (!goal) { toast('Type a goal first', 'error'); return; }
  const out = document.getElementById('aiResult');
  if (out) out.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Building a recommendation...</div>';
  let d;
  try { d = await API.post('/ai/recommend', { campaign_goal: goal }); }
  catch (e) { if (out) out.innerHTML = icErr('The assistant could not answer', e.message); return; }
  aiShow('recommend', d);
}

function aiShow(action, d) {
  const out = document.getElementById('aiResult');
  if (!out) return;
  const titles = { risk: '🛑 Churn risk', predict: '📈 Win probability', timing: '⏰ Best send time',
                   channel: '📣 Suggested channel', message: '✍️ Drafted follow-up',
                   recommend: '🎯 Campaign recommendation' };
  let body = '<pre style="white-space:pre-wrap;word-break:break-word;font-size:.82rem;margin:0">' +
    escapeHtml(JSON.stringify(d, null, 1)) + '</pre>';
  if (d && d.subject && d.body) {
    body = '<div class="form-group"><label>Subject</label><input type="text" readonly value="' +
      escapeHtmlAttr(d.subject) + '"></div>' +
      '<div class="form-group"><label>Body</label><textarea rows="8" readonly>' + escapeHtml(d.body) + '</textarea></div>' +
      '<p style="color:var(--text-secondary)">Saved to templates as <code>' + escapeHtml(d.template_slug || '') + '</code> ' +
      '(message id ' + escapeHtml(String(d.message_id || '')) + ').</p>' + body;
  }
  out.innerHTML = card(titles[action] || action, body, '');
}
