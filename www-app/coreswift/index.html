  const addr = b ? b.email_address : id;
  confirmThen('Deactivate ' + addr + '? The server marks the mailbox deprovisioned — it keeps its history and stops being usable for outbound mail.', function () {
    API.del('/private-email/boxes/' + encodeURIComponent(id))
      .then(function () { toast('Mailbox deactivated', 'success'); loadInboxTab(); })
      .catch(function (e) { toast('Could not deactivate: ' + e.message, 'error'); });
  });
}

function peEditAutoReply(id) {
  const a = PE.autoReplies.filter(function (x) { return x.id === id; })[0];
  if (!a) { toast('Auto-reply not found — reload the tab', 'error'); return; }
  showModal('Auto-reply ' + (a.name || ''),
    '<div class="form-group"><label>Subject</label><input type="text" id="peArSubject" value="' + escapeHtmlAttr(a.subject || '') + '"></div>' +
    '<div class="form-group"><label>Body (HTML)</label><textarea rows="6" id="peArBody">' + escapeHtml(a.body_html || '') + '</textarea></div>' +
    '<div class="form-group"><label>Delay (minutes)</label><input type="number" id="peArDelay" min="0" value="' + (a.delay_minutes == null ? 0 : a.delay_minutes) + '"></div>' +
    '<div class="form-group"><label>Active</label><select id="peArActive">' +
      '<option value="on"' + (a.is_active ? ' selected' : '') + '>on</option>' +
      '<option value="off"' + (a.is_active ? '' : ' selected') + '>off</option></select></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="peArSave">Save</button>');
  const s = document.getElementById('peArSave');
  if (!s) return;
  s.addEventListener('click', async function () {
    s.disabled = true;
    try {
      await API.patch('/private-email/auto-replies/' + encodeURIComponent(id), {
        subject: String(document.getElementById('peArSubject').value || ''),
        body_html: String(document.getElementById('peArBody').value || ''),
        delay_minutes: parseInt(document.getElementById('peArDelay').value, 10) || 0,
        is_active: String(document.getElementById('peArActive').value) === 'on'
      });
      closeModal(); toast('Auto-reply updated', 'success'); await loadInboxTab();
    } catch (e) { toast('Could not save: ' + e.message, 'error'); s.disabled = false; }
  });
}

function peDeleteAutoReply(id) {
  const a = PE.autoReplies.filter(function (x) { return x.id === id; })[0];
  confirmThen('Delete the auto-reply' + (a && a.name ? ' "' + a.name + '"' : '') + '? This cannot be undone.', function () {
    API.del('/private-email/auto-replies/' + encodeURIComponent(id))
      .then(function () { toast('Auto-reply deleted', 'success'); loadInboxTab(); })
      .catch(function (e) { toast('Could not delete: ' + e.message, 'error'); });
  });
}

// ── Tags on a contact (assign / unassign / read the entity's tags) ──────────
// ── CSV import / export — guide.html §19 (kanban t_d1b3f5c4) ────────────────
// The API is POST /api/csv/preview, POST /api/csv/import/contacts and
// GET /api/csv/export/contacts. API.call() is JSON-only (it prefixes /api and
// JSON.stringify()s the body), so these talk to the CSV routes with a raw
// fetch and carry the tenant's own bearer token.
let CT_CSV_PENDING = null;

const CT_CSV_FIELDS = [
  ['first_name', ['firstname', 'givenname', 'fname']],
  ['last_name', ['lastname', 'surname', 'familyname', 'lname']],
  ['email', ['email', 'emailaddress', 'mail']],
  ['phone', ['phone', 'phonenumber', 'mobile', 'tel', 'telephone']],
  ['title', ['title', 'jobtitle', 'position']],
  ['company', ['company', 'companyname', 'organization', 'organisation']],
  ['notes', ['notes', 'note', 'comments']],
  ['address_line1', ['address', 'addressline1', 'street']],
  ['city', ['city', 'town']],
  ['state', ['state', 'province', 'region']],
  ['postal_code', ['postalcode', 'zip', 'zipcode']],
  ['country', ['country']]
];

function ctCsvNorm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function ctCsvMap(headers) {
  const used = {};
  const out = [];
  headers.forEach(function (h) {
    const n = ctCsvNorm(h);
    let field = null;
    CT_CSV_FIELDS.forEach(function (pair) {
      if (field || used[pair[0]]) return;
      if (ctCsvNorm(pair[0]) === n || pair[1].indexOf(n) >= 0) field = pair[0];
    });
    if (field) { used[field] = true; out.push({ csv_header: String(h), contact_field: field }); }
  });
  return out;
}

async function ctCsvFetch(path, opts) {
  const o = opts || {};
  o.headers = Object.assign({}, o.headers || {}, { Authorization: 'Bearer ' + STATE.token });
  const res = await fetch('/api/csv/' + path, o);
  if (res.status === 401) { logout(true); throw new Error('Session expired'); }
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const e = await res.json(); if (typeof e.message === 'string') msg = e.message; } catch (_) {}
    throw new Error(msg);
  }
  return res;
}

function ctCsvPreviewBody(headers, map, sample) {
  const mapped = {};
  map.forEach(function (m) { mapped[m.csv_header] = m.contact_field; });
  let chips = '';
  headers.forEach(function (h) {
    const f = mapped[h];
    chips += '<span class="badge ' + (f ? 'badge-success' : 'badge-muted') +
      '" style="margin:2px;display:inline-block">' + escapeHtml(h) +
      (f ? ' &rarr; ' + escapeHtml(f) : ' (skipped)') + '</span>';
  });
  let table = '';
  if (sample && sample.length) {
    table = '<div class="table-wrap" style="margin-top:12px"><table><thead><tr>' +
      headers.map(function (h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      sample.map(function (r) {
        return '<tr>' + headers.map(function (_, i) {
          return '<td>' + escapeHtml(r[i] || '') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  return '<p style="margin:0 0 8px">CoreSwift read the header row. Columns map like this; unmatched ones are skipped.</p>' +
    '<div>' + chips + '</div>' + table +
    '<p style="margin:12px 0 0;color:var(--text-secondary)">Up to 500 rows per import.</p>';
}

function ctCsvImportPick() {
  let inp = document.getElementById('ctCsvFile');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.csv,text/csv';
    inp.id = 'ctCsvFile';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      if (inp.files && inp.files[0]) ctCsvPreview(inp.files[0]);
    });
  }
  inp.value = '';
  inp.click();
}

async function ctCsvPreview(file) {
  CT_CSV_PENDING = null;
  showModal('Import contacts from CSV',
    '<div id="ctCsvBody"><div class="loading-wrap"><div class="spinner"></div> Reading ' +
      escapeHtml(file.name) + '...</div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="ctCsvGo" disabled onclick="ctCsvImport()">Import</button>');
  const fd = new FormData();
  fd.append('file', file);
  const body = document.getElementById('ctCsvBody');
  let d;
  try {
    d = await (await ctCsvFetch('preview', { method: 'POST', body: fd })).json();
  } catch (e) {
    if (body) body.innerHTML = icErr('Could not read the CSV', e.message);
    return;
  }
  const headers = (d && d.headers) || [];
  const map = ctCsvMap(headers);
  if (body && !map.length) {
    body.innerHTML = icErr('No importable columns found',
      'None of these headers match a contact field: ' + headers.join(', '));
    return;
  }
  CT_CSV_PENDING = { file: file, map: map };
  if (body) body.innerHTML = ctCsvPreviewBody(headers, map, (d && d.sample_rows) || []);
  const go = document.getElementById('ctCsvGo');
  if (go) go.disabled = false;
}

async function ctCsvImport() {
  if (!CT_CSV_PENDING) return;
  const fd = new FormData();
  fd.append('file', CT_CSV_PENDING.file);
  fd.append('mappings', JSON.stringify(CT_CSV_PENDING.map));
  const body = document.getElementById('ctCsvBody');
  if (body) body.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> Importing...</div>';
  let d;
  try {
    d = await (await ctCsvFetch('import/contacts', { method: 'POST', body: fd })).json();
  } catch (e) {
    if (body) body.innerHTML = icErr('Import failed', e.message);
    return;
  }
  closeModal();
  CT_CSV_PENDING = null;
  toast('Imported ' + d.imported + ' contact' + (d.imported === 1 ? '' : 's') +
    (d.skipped ? ' (' + d.skipped + ' skipped)' : ''), d.skipped ? 'info' : 'success');
  if (typeof TAB_LOADERS !== 'undefined' && TAB_LOADERS['contacts']) TAB_LOADERS['contacts']();
}

async function csvExportContacts() {
  try {
    const res = await ctCsvFetch('export/contacts');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'contacts_export.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('Contacts exported', 'success');
  } catch (e) {
    toast('Export failed: ' + e.message, 'error');
  }
}

async function ctOpenTags(cid) {
  showModal('Tags on this contact',
    '<div id="ctTagsBody"><div class="loading-wrap"><div class="spinner"></div> Loading tags...</div></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
  let who = '';
  try { const c = await API.get('/contacts/' + encodeURIComponent(cid));
        who = (c && (c.name || ((c.first_name || '') + ' ' + (c.last_name || '')).trim())) || ''; } catch (e) {}
  const title = document.querySelector('#modalContainer h3');
  if (title && who) title.textContent = 'Tags — ' + who;
  await ctLoadTags(cid);
}

async function ctLoadTags(cid) {
  const body = document.getElementById('ctTagsBody');
  if (!body) return;
  let all = [], mine = [];
  try {
    all = famList(await API.get('/tags'), 'tags');
    const d = await API.get('/tags/entity/contact/' + encodeURIComponent(cid));
    mine = (d && (d.assignments || d.tags)) || [];
    if (d && d.assignments) {
      // `assignments` carries the assignment id the DELETE route needs; `tags` is the
      // tag rows themselves (kept unchanged for existing consumers).
      mine = d.assignments.map(function (a) {
        const t = (d.tags || []).filter(function (x) { return x.id === a.tag_id; })[0] || {};
        return { assignment_id: a.id, tag_id: a.tag_id, id: a.tag_id, name: t.name, color: t.color };
      });
    } else {
      mine = mine.map(function (t) { return { assignment_id: null, tag_id: t.id, id: t.id, name: t.name, color: t.color }; });
    }
  } catch (e) { body.innerHTML = icErr('Could not read tags', e.message); return; }

  const assignedIds = mine.map(function (m) { return m.tag_id; });
  const avail = all.filter(function (t) { return assignedIds.indexOf(t.id) < 0; });
  body.innerHTML =
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
      (mine.length ? mine.map(function (m) {
        return '<span class="badge" style="background:' + escapeHtmlAttr(m.color || 'var(--accent-subtle)') +
          ';color:#fff;padding:6px 12px">' + escapeHtml(m.name || m.tag_id) +
          (m.assignment_id ? ' <a href="#" onclick="ctUnassignTag(\'' + escapeHtmlAttr(cid) + '\',\'' +
            escapeHtmlAttr(m.assignment_id) + '\');return false" title="Remove tag">✕</a>' : '') +
          '</span>';
      }).join('') : '<span class="config-desc">No tags on this contact yet.</span>') +
    '</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-end">' +
      '<div style="flex:1"><label style="display:block;font-size:.8rem;color:var(--text-secondary);margin-bottom:6px">Add a tag</label>' +
      '<select id="ctTagPick">' + (avail.length
        ? avail.map(function (t) { return '<option value="' + escapeHtmlAttr(t.id) + '">' + escapeHtml(t.name) + '</option>'; }).join('')
        : '<option value="">No tags left to add</option>') + '</select></div>' +
      '<button class="btn btn-primary btn-sm" id="ctTagAdd"' + (avail.length ? '' : ' disabled') + '>Assign</button>' +
    '</div>' +
    (all.length ? '' : '<p style="color:var(--text-secondary);margin-top:10px">No tags exist yet — create some on the Tags tab.</p>');
  const add = document.getElementById('ctTagAdd');
  if (add) add.addEventListener('click', function () {
    const sel = document.getElementById('ctTagPick');
    if (sel && sel.value) ctAssignTag(cid, sel.value);
  });
}

async function ctAssignTag(cid, tagId) {
  try {
    await API.post('/tags/assign', { tag_id: tagId, entity_type: 'contact', entity_id: cid });
    toast('Tag assigned', 'success');
  } catch (e) { toast('Could not assign: ' + e.message, 'error'); }
  await ctLoadTags(cid);
  if (typeof loadTagsTab === 'function' && document.getElementById('tagsTable')) loadTagsTab();
}

async function ctUnassignTag(cid, assignmentId) {
  try {
    await API.del('/tags/assign/' + encodeURIComponent(assignmentId));
    toast('Tag removed', 'success');
  } catch (e) { toast('Could not remove: ' + e.message, 'error'); }
  await ctLoadTags(cid);
  if (typeof loadTagsTab === 'function' && document.getElementById('tagsTable')) loadTagsTab();
}

// ── Monitoring: the If-Not-Then delay queue (GET list + DELETE cancel) ──────
async function ruleLoadScheduled() {
  const el = document.getElementById('ruleScheduled');
  if (!el) return;
  let d;
  try { d = await API.get('/events/delayed?per_page=25'); }
  catch (e) { el.innerHTML = icErr('Could not read the scheduled follow-up queue', e.message); return; }
  const rows = ((d && d.delayed_actions) || []).map(function (a) {
    return [
      escapeHtml(String(a.condition_type || '')),
      escapeHtml(String(a.action_type || '')),
      a.execute_at ? new Date(a.execute_at).toLocaleString() : '—',
      a.executed ? '<span class="badge badge-muted">executed</span>' :
        (a.cancelled ? '<span class="badge badge-muted">cancelled</span>' : '<span class="badge badge-success">pending</span>'),
      a.cancelled ? '' :
        '<button class="btn btn-ghost btn-xs" onclick="monCancelDelayed(\'' + escapeHtmlAttr(a.id) + '\')">Cancel</button>'
    ];
  });
  el.innerHTML = card('⏱ Scheduled follow-ups (' + ((d && d.total) || 0) + ')',
    '<p style="color:var(--text-secondary);margin:0">The If-Not-Then delay queue. Account-health monitoring schedules these; ' +
    'cancelling one stops the follow-up before it fires.</p>' +
    dataTable(['Condition', 'Action', 'Runs at', 'State', ''], rows, 'Nothing scheduled.'), '');
}

function monCancelDelayed(id) {
  confirmThen('Cancel this scheduled follow-up?', function () {
    API.del('/events/delayed/' + encodeURIComponent(id))
      .then(function () { toast('Scheduled action cancelled', 'success'); ruleLoadScheduled(); })
      .catch(function (e) { toast('Could not cancel: ' + e.message, 'error'); });
  });
}

TAB_LOADERS['ai-assistant'] = loadAiTab;
TAB_RENDERERS['bookings'] = bookingsShell;
TAB_LOADERS['bookings'] = loadBookingsTab;

// The delay queue is the "If-Not-Then" engine, so it lives on the TENANT Rules tab.
// (It first went on `monitoring` — that entry is in ADMIN_MENU, platform operators only, so a
// customer could never reach the panel. Measured: the nav entry is absent for a tenant token.)
(function () {
  const rulesShell0 = TAB_RENDERERS['rules'];
  const rulesLoad0 = TAB_LOADERS['rules'];
  if (rulesShell0) {
    TAB_RENDERERS['rules'] = function () {
      return rulesShell0() + '<br><div id="ruleScheduled"></div>';
    };
  }
  TAB_LOADERS['rules'] = async function () {
    if (rulesLoad0) { try { await rulesLoad0(); } catch (e) { /* the panel below still renders */ } }
    ruleLoadScheduled();
  };
})();
