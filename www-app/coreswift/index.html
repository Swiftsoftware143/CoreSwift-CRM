  loadUsage();
}

// ===== ACCOUNT USAGE (GET /api/auth/me/usage) =====
// Server-side counts for the tenant. The endpoint existed for months with no caller.
async function loadUsage() {
  const el = document.getElementById('userUsage');
  if (!el || !STATE.token) return;
  try {
    const u = await API.get('/auth/me/usage');
    // `industries` is the count the Industries tab's own gate enforces (same expression,
    // server-side), so this line and that panel can never disagree.
    //
    // Contacts carry the plan's CEILING (kanban t_3e3965fc). The ceiling is a hard stop only where
    // the TENANT adds a contact (this console, CSV import) — a lead another app captured keeps
    // landing either way — so an account over its ceiling is a normal state, and this readout is
    // where its owner is told. `contacts_limit` is absent from a server that predates the field, so
    // fall back to the bare count rather than printing `undefined`.
    const contacts = (u.contacts || 0);
    const hasCeiling = (typeof u.contacts_limit === 'number');
    const over = (u.contacts_over_limit === true);
    // Every count on this line agrees with its noun. The tickets arm below has always done this;
    // the rest of the line printed "1 users" for every workspace — i.e. every workspace at signup.
    const cnt = (n, one, many) => Number(n || 0) + ' ' + (Number(n || 0) === 1 ? one : many);
    const contactsTxt = hasCeiling
      ? (contacts + '/' + u.contacts_limit + ' ' + (Number(u.contacts_limit) === 1 ? 'contact' : 'contacts'))
      : cnt(contacts, 'contact', 'contacts');
    // The help desk's readout (kanban t_969f576a, decision (a)). The public intake is NOT plan-gated
    // while the ticket queue IS, so an account without Support tickets can collect real customer
    // requests its own queue refuses to open. `support_intake_unreadable` is that state, and it is
    // decided server-side by the SAME resolve the gate enforces. Zero tickets prints nothing.
    const tk = (u.tickets || 0);
    const tkUnreadable = (u.support_intake_unreadable === true);
    const tkTxt = (tk > 0)
      ? (' · ' + tk + (tk === 1 ? ' ticket' : ' tickets') + (tkUnreadable ? ' ⚠ cannot open' : ''))
      : '';
    el.textContent = 'Usage: ' + contactsTxt + (over ? ' ⚠ over plan limit' : '') + ' · ' + cnt(u.users, 'user', 'users') + ' · ' + cnt(u.pipelines, 'pipeline', 'pipelines') + ' · ' + cnt(u.industries, 'industry', 'industries') + tkTxt;
    el.style.color = (over || tkUnreadable) ? 'var(--warning,#f59e0b)' : '';
    renderPlanNotices(u, over);
  } catch (_) { el.textContent = 'Usage: unavailable'; }
}

// Plan notices on the Dashboard — ONE composer, because both notices share the same slot.
//
// 1. The contact ceiling: it refuses a contact the TENANT adds, while a lead a sibling app already
//    captured is still accepted (capture-over-ceiling, kanban t_3e3965fc), so an account can sit
//    above its ceiling and has to be told.
// 2. The help desk's PUBLIC INTAKE (kanban t_969f576a, decision (a)): the intake arms are NOT
//    plan-gated while the ticket queue IS, so an account whose plan excludes Support tickets can
//    collect customer requests it cannot read. The decision was to keep accepting them — the caller
//    is the workspace's OWN customer, and refusing would lose the request outright — and to end the
//    silence instead, which is what this notice does.
// Both are driven by the SAME GET /api/auth/me/usage readout the dropdown renders, so a notice can
// never disagree with the number the gate enforces; each clears itself when its state goes away.
function renderPlanNotices(u, over) {
  const el = document.getElementById('dashboardExtra');
  if (!el) return;
  let html = '';
  if (over) {
    html += card('⚠ Over your plan\u2019s contact limit',
      '<p style="color:var(--text-secondary);margin-bottom:10px">This account holds <strong>' + (u.contacts || 0) + ' of ' + u.contacts_limit + '</strong> contacts. Leads captured by your connected apps keep arriving, so the count can pass the limit — but a new contact you add here, or by CSV import, is refused until the workspace is under the limit or on a bigger plan.</p>',
      '<button class="btn btn-primary btn-sm" onclick="switchTab(&#39;billing&#39;)">💳 See plans</button>');
  }
  if (u.support_intake_unreadable === true) {
    const n = (u.tickets || 0);
    html += card('⚠ Customer requests you cannot open',
      '<p style="color:var(--text-secondary);margin-bottom:10px">This account is holding <strong>' + n + (n === 1 ? ' customer request' : ' customer requests') + '</strong> in a support queue this plan refuses to open. The intake is not plan-gated, so requests keep arriving through the 💬 <strong>My Support</strong> portal and the embed widget — nothing is lost. They appear in <strong>Support Tickets</strong> as soon as the plan includes it.</p>',
      '<button class="btn btn-primary btn-sm" onclick="switchTab(&#39;billing&#39;)">💳 See plans</button>');
  }
  el.innerHTML = html;
}

function startNotifPoll() {
  stopNotifPoll();

function stopNotifPoll() {

async function loadNotifications() {
  const el = document.getElementById('notifList');

async function markAllNotificationsRead() {

// ===== BILLING: SUBSCRIPTION =====
// ===== BILLING: YOUR BILL (kanban t_5d1d6d31) =====
// Inbox is a STANDALONE $1/mo door, not an add-on: upgrading to a CRM plan ENDS the $1 line in
// the same action, so a customer is never billed $30 and never holds two subscriptions.
// GET /api/billing/summary is the ONE read behind this card — the amount due comes from the plan
// the workspace is on; "your $1 ended" comes from the append-only ledger the database keeps, where
// a partial unique index makes more than one OPEN line physically impossible.
function planLabel(slug) {
  const s = String(slug || '');
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}

// A stored period end that is already in the PAST must never be printed as an upcoming event.
// Measured 2026-11-19: every workspace whose paid period had ended was told "The next charge is on
// <a date two weeks ago>" — the sentence asserts a future the calendar has already passed.
function periodEndInPast(iso) {
  if (!iso) return false;
  const t = new Date(iso).getTime();
  if (isNaN(t)) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return t < today.getTime();
}
function periodEndDate(iso) {
  try { return iso ? new Date(iso).toLocaleDateString() : ''; } catch (e) { return ''; }
}

async function loadBillState() {
  const el = document.getElementById('billCard');
  if (!el) return;
  try {
    const b = await API.get('/billing/summary');
    const p = b && b.plan;
    const amount = Number((b && b.amount_due) || 0);
    const period = (b && b.amount_due_period) || 'month';
    const money = function (n) { return '$' + Number(n || 0).toFixed(2); };
    const when = function (iso) {
      try { return iso ? new Date(iso).toLocaleDateString() : ''; } catch (e) { return ''; }
    };
    const prev = b && b.previous_line;
    let prevHtml = '';
    if (prev && amount > 0) {
      const line = money(prev.price_monthly) + ' ' + planLabel(prev.plan_slug);
      if (prev.move === 'upgrade') {
        prevHtml = '<p class="config-desc" data-bill-previous="upgrade"><strong>' + escapeHtml(line)
          + ' subscription ended the moment you upgraded'
          + (prev.ended_at ? ' (' + escapeHtml(when(prev.ended_at)) + ')' : '')
          + '.</strong> It is gone from the bill — you pay ' + escapeHtml(money(amount)) + ' a '
          + escapeHtml(period) + ', never both.</p>';
      } else if (prev.move === 'downgrade') {
        prevHtml = '<p class="config-desc" data-bill-previous="downgrade"><strong>You moved down from '
          + escapeHtml(line) + ' on ' + escapeHtml(when(prev.ended_at)) + '.</strong> You pay '
          + escapeHtml(money(amount)) + ' a ' + escapeHtml(period)
          + ', and your mailbox and every message stay exactly where they are.</p>';
      } else if (prev.move === 'canceled') {
        prevHtml = '<p class="config-desc" data-bill-previous="canceled">Your ' + escapeHtml(line)
          + ' subscription ended on ' + escapeHtml(when(prev.ended_at)) + '.</p>';
      }
    }
    if (!p || amount === 0) {
      el.innerHTML = card('Your bill',
        '<div class="stat-card accent" data-bill-amount="0"><div class="stat-value">$0.00</div>'
        + '<div class="stat-label">Free plan — nothing is billed</div></div>'
        + '<p class="config-desc" style="margin-top:10px">No subscription is charged to this account. '
        + 'One plan at a time, always.</p>' + prevHtml);
      return;
    }
    const next = b.current_period_ends_at
      ? (periodEndInPast(b.current_period_ends_at)
          ? ' The period this plan was paid for ended on ' + periodEndDate(b.current_period_ends_at)
            + ', and no renewal has been recorded since \u2014 so nothing has been charged for the time after it.'
          : ' The next charge is on ' + periodEndDate(b.current_period_ends_at) + '.')
      : '';
    el.innerHTML = card('Your bill',
      '<div class="stats-grid">'
      + '<div class="stat-card accent" data-bill-amount="' + escapeHtml(String(amount)) + '">'
      + '<div class="stat-value">' + escapeHtml(money(amount))
      + '<span style="font-size:14px">/' + escapeHtml(period) + '</span></div>'
      + '<div class="stat-label">You pay — ' + escapeHtml(p.name || planLabel(p.slug)) + '</div></div>'
      + '<div class="stat-card" data-bill-lines="' + escapeHtml(String(b.open_lines || 0)) + '">'
      + '<div class="stat-value">' + escapeHtml(String(b.one_subscription === false ? (b.open_lines || 0) : 1)) + '</div>'
      + '<div class="stat-label">Subscription' + (b.one_subscription === false ? 's' : '') + '</div></div>'
      + '</div>'
      + '<p class="config-desc" style="margin-top:10px"><strong>One subscription.</strong> A workspace holds '
      + 'one plan at a time, so nothing is ever charged on top of this amount.' + escapeHtml(next) + '</p>'
      + prevHtml);
  } catch (e) {
    el.innerHTML = card('Your bill',
      '<p class="config-desc">' + escapeHtml(e.message || String(e)) + '</p>');
  }
}

// GET /api/billing/subscription and POST /api/billing/subscription/cancel exist and are live;
// neither had a caller, so a tenant had no way to see or cancel its plan.
// Fields shown are the ones the API actually returns (captured live 2026-09-22): id, tenant_id,
// plan_id, status, billing_cycle, current_period_*, canceled_at, trial_ends_at. There is no
// plan_name/plan_slug in this response, so no plan name is invented here.
//
// kanban t_8d91f70c — "Billing cycle" is DELIBERATELY not shown any more. The panel printed it
// while NO served surface could set it: both writers of tenant_plans.billing_cycle
// (POST/PATCH /api/billing/subscription) gate on the tenant's plan/billing record, which is an
// OPERATOR write (plan_id + feature_overrides are entitlement writes and there is no payment path
// in this app — checkout was retired 2026-09-25), and the tenants' own tokens answered 403.
// For every live row the stat could only ever print the free seat's literal default ('monthly'),
// i.e. it advertised a billing arrangement the workspace does not have. Cancel stays: cancelling
// to Free is a tenant-scoped action (is_tenant_billing_owner) and still works.
// kanban t_36824987 — a Free seat's OWN tenant_plans row is status='active' (all three live
// tenant_plans rows are free|active|monthly), so `status` alone CANNOT tell a paid subscription from
// the Free plan: the card used to offer an already-Free workspace a Cancel button whose confirm()
// read "This account drops to the Free plan immediately." — a paid subscription that does not exist.
// Which plan is Free is resolved HERE, from the plan list itself (`slug` is its only stable handle)
// and never from STATE.planId/planName: checkPlan() is async and runs beside this loader, and the
// shell re-renders on every keystroke, so a STATE read would make the card depend on a race. Compare
// the plan ID, never the name. A paid seat still gets the Cancel button and the real sentence.
async function loadSubscriptionState() {
  const el = document.getElementById('subscriptionCard');
  if (!el) return;
  try {
    const s = await API.get('/billing/subscription');
    const status = (s && s.status) || 'none';
    const ends = s && (s.current_period_ends_at || s.canceled_at);
    const planId = (s && s.plan_id) ? String(s.plan_id) : null;
    let freePlanId = null;
    try {
      const plans = famList(await API.get('/billing/plans'), 'plans');
      const free = (plans || []).find(function (p) {
        return String((p && p.slug) || '').toLowerCase() === 'free';
      });
      if (free && free.id) freePlanId = String(free.id);
    } catch (e) { /* no plan list, no determination: fall through to the status-only reading */ }
    const onFree = planId !== null && freePlanId !== null && planId === freePlanId;
    const active = !onFree && (status === 'active' || status === 'trialing');
    el.innerHTML = card('Subscription',
      '<div class="stats-grid">' +
        '<div class="stat-card accent"><div class="stat-value">' + escapeHtml(String(status)) + '</div><div class="stat-label">Status</div></div>' +
      '</div>' +
      '<p class="config-desc" style="margin-top:10px">' +
        (onFree
          ? 'You are on the Free plan \u2014 there is no paid subscription to cancel.'
          : active
            ? 'Cancelling drops this account to the Free plan immediately. '
              + (ends
                  ? (periodEndInPast(ends)
                      ? 'The period that was paid for ended on ' + periodEndDate(ends)
                        + ', and no renewal has been recorded since.'
                      : 'Current period ends ' + periodEndDate(ends) + '.')
                  : '')
            : 'No paid subscription is active.') +
      '</p>');
    const btn = document.getElementById('cancelSubBtn');
    if (btn) btn.style.display = active ? '' : 'none';
  } catch (e) {
    el.innerHTML = card('Subscription',
      '<p class="config-desc">' + escapeHtml(e.message || String(e)) + '</p>');
  }
}

async function cancelSubscription() {
  if (!confirm('Cancel your subscription? This account drops to the Free plan immediately.')) return;
  const btn = document.getElementById('cancelSubBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Cancelling…'; }
  try {
    await API.post('/billing/subscription/cancel', {});
    toast('Subscription cancelled — you are on the Free plan', 'success');
    await loadSubscriptionState();
    await loadCredits();
  } catch (e) {
    toast(e.message || 'Could not cancel the subscription', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Cancel subscription'; }
  }
}

// ===== BILLING: CREDITS =====
// Credits endpoints (balance / usage) had no caller; the billing page only ever listed plans.
async function loadCredits() {
  const el = document.getElementById('creditsCard');
  if (!el) return;
  try {
    const b = await API.get('/billing/credits/balance');
    const u = await API.get('/billing/credits/usage?per_page=10');
    const allowance = b.allowance || 0, consumed = b.consumed || 0, remaining = b.remaining || 0;
    const pct = allowance > 0 ? Math.min(100, Math.round((consumed / allowance) * 100)) : 0;
    const txns = (u && u.transactions) || [];
    let rows;
    if (txns.length) {
      rows = '<table style="width:100%;border-collapse:collapse;font-size:.82rem"><thead><tr>' +
        '<th style="text-align:left;padding:6px">Action</th><th style="text-align:right;padding:6px">Credits</th>' +
        '<th style="text-align:left;padding:6px">Description</th><th style="text-align:left;padding:6px">Date</th>' +
        '</tr></thead><tbody>' +
        txns.map(function (t) {
          // The API serialises each row as a 5-tuple: [id, action_type, credits, description, created_at]
          const action = Array.isArray(t) ? t[1] : (t.action_type || '');
          const credits = Array.isArray(t) ? t[2] : (t.credits || 0);
          const desc = Array.isArray(t) ? t[3] : (t.description || '');
          const when = Array.isArray(t) ? t[4] : t.created_at;
          const col = credits < 0 ? 'var(--error,#e5484d)' : 'var(--success,#3fb950)';
          return '<tr><td style="padding:6px;border-top:1px solid var(--border,#2a2a2a)">' + escapeHtml(String(action)) + '</td>' +
            '<td style="padding:6px;text-align:right;border-top:1px solid var(--border,#2a2a2a);color:' + col + '">' + credits + '</td>' +
            '<td style="padding:6px;border-top:1px solid var(--border,#2a2a2a)">' + escapeHtml(String(desc || '')) + '</td>' +
            '<td style="padding:6px;border-top:1px solid var(--border,#2a2a2a)">' + (when ? new Date(when).toLocaleString() : '—') + '</td></tr>';
        }).join('') + '</tbody></table>';
    } else {
      rows = '<div class="empty-state" style="padding:12px"><p>No credit transactions yet.</p></div>';
    }
    el.innerHTML = card('Credits',
      '<div class="stats-grid">' +
        '<div class="stat-card accent"><div class="stat-value">' + remaining + '</div><div class="stat-label">Remaining</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + consumed + ' / ' + allowance + '</div><div class="stat-label">Used this period (' + pct + '%)</div></div>' +
      '</div>' + rows +
      '<p class="config-desc" style="margin-top:10px">Credits are consumed by the features above. There is no self-serve purchase route: the old “buy credits” route granted credits with no payment attached and was removed, and the unfinished checkout route it pointed at was retired rather than shipped (2026-09-25).</p>');
  } catch (e) {
    el.innerHTML = card('Credits', '<p style="color:var(--text-secondary)">' + escapeHtml(readFailed('your credit balance')) + '</p>');
  }
}

// Payment history (item 2 of t_05d1f961): measured, not assumed, on 2026-09-22.
// GET /billing/checkout/sessions stays DELETED — it read a `checkout_sessions` table that did not
// exist (guaranteed 500), and it was never re-registered. The whole checkout surface followed it on
// 2026-09-25 (t_0fe500d4): the checkout-create route, the four provider session helpers, the two
// public provider webhooks and migration 097 dropped the table.
//   - There is no payments/invoices table in this schema at all.
//   - `payment_webhook_events` (provider_type, event_type, event_id, raw_body, headers, status,
//     error_message, created_at) has NO tenant_id column — it is an ops record of inbound provider
//     events, so it cannot honestly be rendered as one tenant's payment history.
//   - The only tenant-scoped money ledger is `credit_transactions`, and it is already on this tab
//     (loadCredits() renders action / credits / description / date for the signed-in tenant).
// So payment history = the Credits ledger above; no new route was wired to a non-existent table.

// ={20,}
// WIRED FAMILIES — every family below was a registered, live backend block that no
// shipped surface called, sitting under a tab that was a placeholder or a fake.
// Each surface here renders real rows from the family's own endpoints and every
// control performs a real request (no toast-only buttons).
// Server counterpart repaired in the same change: src/pipelines/*, src/scoring/*,
// src/tags/*, src/integrations/*, src/automation/actions.rs.
// ============================================================================

function famList(res, key) {
  if (Array.isArray(res)) return res;
  if (res && Array.isArray(res[key])) return res[key];
  if (res && res.data && Array.isArray(res.data)) return res.data;
  return [];
}

// ONE feature shape for every plan card in this shell. GET /api/billing/plans returns each plan's
// `features` as a JSONB OBJECT ({"max_contacts":100,"api_access":true, …}) — NOT a list — so
// (p.features || []).slice(0, 6) threw "slice is not a function" and no plan card could paint.
// Show what the plan really enables (true) or sizes (a positive number); a plain array is still
// honoured for a plan that stores a list.
// A plan card is read by a BUYER, so the JSONB object in `plans.features` is translated into plain
// English ONCE, here, for both shells (the tenant's Compare Plans card and the admin Billing tab).
// It used to print the machine key itself — "max users (1)", "api calls per day (100)",
// "account health monitoring" — with a ✓ in front of a LIMIT, which reads as a benefit. A ceiling
// now reads as a ceiling ("Up to 100 contacts"), a module reads in the words the console itself
// uses ("Support tickets"), and the numbers a buyer compares first come first.
const PLAN_NUM = (n) => Number(n).toLocaleString('en-US');
const PLAN_FEATURE_COPY = {
  max_contacts: (n) => 'Up to ' + PLAN_NUM(n) + ' contacts',
  max_users: (n) => (n === 1 ? '1 user' : 'Up to ' + PLAN_NUM(n) + ' users'),
  campaigns: () => 'Email campaigns',
  catch_all: () => 'Catch-all mailboxes',
  email_templates: () => 'Email templates',
  support_tickets: () => 'Support tickets',
  ai_enabled: () => 'AI assistant',
  automation_enabled: () => 'Automation rules',
  private_email: () => 'Your own private email domain',
  agency_workspace: () => 'Agency workspace',
  pipelines: (n) => (n === 1 ? '1 pipeline' : 'Up to ' + PLAN_NUM(n) + ' pipelines'),
  integrations: (n) => (n === 1 ? '1 integration' : 'Up to ' + PLAN_NUM(n) + ' integrations'),
  email_domains: (n) => (n === 1 ? '1 email domain' : 'Up to ' + PLAN_NUM(n) + ' email domains'),
  email_mailboxes: (n) => (n === 1 ? '1 mailbox' : 'Up to ' + PLAN_NUM(n) + ' mailboxes'),
  max_widgets: (n) => (n === 1 ? '1 website widget' : 'Up to ' + PLAN_NUM(n) + ' website widgets'),
  storage_gb: (n) => (n < 1 ? Math.round(n * 1000) + ' MB' : PLAN_NUM(n) + ' GB') + ' of file storage',
  api_calls_per_day: (n) => PLAN_NUM(n) + ' API calls a day',
  email_history_days: (n) => 'Up to ' + PLAN_NUM(n) + ' days of email history',
  onboarding_checklists: () => 'Onboarding checklists',
  account_health_monitoring: () => 'Account health monitoring',
};
// Three numbers, then the modules that actually differ between plans, then the remaining ceilings:
// six lines have to carry the whole comparison, so the top of the card is the part a buyer decides on.
const PLAN_FEATURE_ORDER = ['max_contacts', 'max_users', 'pipelines', 'ai_enabled', 'automation_enabled',
  'campaigns', 'catch_all', 'email_templates', 'support_tickets', 'private_email', 'agency_workspace',
  'integrations', 'email_domains', 'email_mailboxes', 'max_widgets', 'storage_gb',
  'api_calls_per_day', 'email_history_days', 'onboarding_checklists', 'account_health_monitoring'];

function planFeatureKeyLabel(k) {
  const s = String(k).replace(/_/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function planFeatureList(raw) {
  if (Array.isArray(raw)) {
    return raw.slice(0, 6).map(f => (typeof f === 'string' ? f : (f && (f.name || f.key)) || '')).filter(Boolean);
  }
  if (!raw || typeof raw !== 'object') return [];
  // false / 0 / null means the plan does NOT include it: printing a ✓ there is a promise the app
  // does not keep, so those keys stay off the card entirely.
  const say = (k) => {
    const v = raw[k];
    if (v === true) return PLAN_FEATURE_COPY[k] ? PLAN_FEATURE_COPY[k]() : planFeatureKeyLabel(k);
    if (typeof v === 'number' && v > 0) {
      return PLAN_FEATURE_COPY[k] ? PLAN_FEATURE_COPY[k](v) : planFeatureKeyLabel(k) + ' (' + PLAN_NUM(v) + ')';
    }
    return null;
  };
  const known = PLAN_FEATURE_ORDER.filter(k => Object.prototype.hasOwnProperty.call(raw, k)).map(say).filter(Boolean);
  const rest = Object.keys(raw)
    .filter(k => PLAN_FEATURE_ORDER.indexOf(k) === -1)
    .map(say).filter(Boolean);
  return known.concat(rest).slice(0, 6);
}
function fh(v) { return escapeHtml(String(v === null || v === undefined || v === '' ? '—' : v)); }
function famErr(el, label, e) {
  // A 402 is the plan gate, not a failed load: name the limit (the SERVER's own sentence) instead
  // of printing the request's own words. Same treatment the Webhooks panel gives its 402.
  if (e && e.planGate) {
    el.innerHTML = card(label, '<p style="color:var(--text-secondary)">\u{1F512} ' +
      escapeHtml(e.planMessage || 'This feature is not included in your current plan.') + '</p>');
    return;
  }
  el.innerHTML = card(label, '<p style="color:var(--text-secondary)">' + escapeHtml(readFailed(String(label || 'this screen').toLowerCase())) + '</p>');
}
function confirmThen(msg, fn) { if (window.confirm(msg)) fn(); }

// ---------------------------------------------------------------- PIPELINES / DEALS
// The DEAL TAB (David, 2026-11-20 — kanban t_2df68850).
//
// The deal record is CoreSwift's `opportunities` table; this tab is the software-wide surface over
// it. Nothing here is industry-specific: an account that needs courier fields (Xride) adds them
// as CUSTOM FIELDS, which is the same mechanism any other industry uses.
//
// Money is shown per currency, never added across currencies. David's standing rule (2026-11-20):
// the US DOLLAR is the default currency, so an account that has not chosen one prices its deals in
// USD and reports in USD — nobody is asked to choose one first, and a first deal is never refused.
let PL_DATA = [];
let PL_FILTER = { q: '', owner_id: '', stage_id: '', source: '', status: '', from: '', to: '', rotting: false };
let PL_REPORT = [];
let PL_CURRENCY = null;          // the workspace DEFAULT currency (what a new deal is priced in)
let PL_REPORTING = null;         // what reports are computed in
let PL_CURRENCY_SOURCE = null;   // 'workspace' (chosen here) or 'standing_default' (USD by rule)
let PL_ISO = [];                 // the real ISO 4217 codes the server accepts
let PL_TEAM = [];
let PL_DETAIL = null;

// Every deal carries a stored rate and the currency that rate converts INTO (David, 2026-11-20).
// A deal already in the reporting currency is worth its own value; anything else is worth
// value × its STORED rate — never today's market, so a past period does not move.
function plReportingValue(deal) {
  const v = Number(deal && deal.value);
  if (!isFinite(v)) return null;
  const cur = ((deal && deal.currency) || '').toUpperCase();
  if (PL_REPORTING && cur === PL_REPORTING) return v;
  if (PL_REPORTING && deal && deal.exchange_rate && (deal.reporting_currency || cur).toUpperCase() === PL_REPORTING) {
    return v * Number(deal.exchange_rate);
  }
  return null;
}

// The currency picker is a real ISO 4217 list from the server, never free text: a three-letter
// string that is not a currency cannot be converted, so it is refused at the source.
function plCurrencyOptions(selected) {
  const codes = (PL_ISO && PL_ISO.length) ? PL_ISO.slice() : [(PL_CURRENCY || 'USD')];
  const sel = (selected || '').toUpperCase();
  let html = '';
  if (sel && codes.indexOf(sel) === -1) html += '<option value="' + sel + '" selected>' + escapeHtml(sel) + '</option>';
  codes.forEach(function (c) {
    html += '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' + c + '</option>';
  });
  return html;
}

// Sum a set of deals into the reporting currency, and count the ones that cannot be converted so
// the number is never quietly short.
function plReportingSum(deals, weighted) {
  let total = 0, unconverted = 0;
  (deals || []).forEach(function (d) {
    const v = plReportingValue(d);
    if (v === null) { unconverted += 1; return; }
    total += weighted ? v * (Number(d.probability) || 0) / 100 : v;
  });
  return { total: total, unconverted: unconverted };
}

function plCache(pid) { return PL_DATA.find(function (x) { return x.pipeline.id === pid; }) || null; }

function plMoney(value, currency) {
  if (value === null || value === undefined || value === '') return '—';
  const n = Number(value);
  if (!isFinite(n)) return '—';
  // No currency, no dollar sign: an amount whose currency is unknown is not a dollar amount.
  if (!currency) return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  try {
    return n.toLocaleString(undefined, { style: 'currency', currency: currency, maximumFractionDigits: 2 });
  } catch (_) {
    return currency + ' ' + n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }
}

function plCurrencies(deals) {
  const seen = [];
  (deals || []).forEach(function (d) {
    const c = (d.currency || '').trim().toUpperCase();
    if (c && seen.indexOf(c) === -1) seen.push(c);
  });
  return seen;
}

// Won value is per currency: an account selling in two currencies has two figures, never one
// number that adds dollars to euros (David, 2026-11-20). `total_revenue` is null in that case.
function dashWonValue(stats) {
  if (!stats) return '—';
  const rows = Array.isArray(stats.revenue_by_currency) ? stats.revenue_by_currency : [];
  if (rows.length > 1) {
    return rows.map(function (r) { return plMoney(r.value, r.currency); }).join(' + ');
  }
  if (rows.length === 1) return plMoney(rows[0].value, rows[0].currency);
  // No currency named anywhere → no currency symbol: `plMoney` with a blank code prints the
  // number alone. (`money()` was never defined; this tile threw before the deal tab's own
  // formatter existed, and the dashboard showed a red "money is not defined" instead of a figure.)
  return stats.total_revenue === null || stats.total_revenue === undefined
    ? '—'
    : plMoney(stats.total_revenue, PL_CURRENCY || '');
}

function plFilterQuery() {
  const parts = [];
  if (PL_FILTER.q) parts.push('q=' + encodeURIComponent(PL_FILTER.q));
  if (PL_FILTER.owner_id) parts.push('owner_id=' + encodeURIComponent(PL_FILTER.owner_id));
  if (PL_FILTER.stage_id) parts.push('stage_id=' + encodeURIComponent(PL_FILTER.stage_id));
  if (PL_FILTER.source) parts.push('source=' + encodeURIComponent(PL_FILTER.source));
  if (PL_FILTER.status) parts.push('status=' + encodeURIComponent(PL_FILTER.status));
  if (PL_FILTER.from) parts.push('from=' + PL_FILTER.from);
  if (PL_FILTER.to) parts.push('to=' + PL_FILTER.to);
  if (PL_FILTER.rotting) parts.push('rotting=true');
  return parts.length ? '?' + parts.join('&') : '';
}

function plApplyFilters() {
  PL_FILTER.q = (document.getElementById('plFilterQ') || {}).value || '';
  PL_FILTER.owner_id = (document.getElementById('plFilterOwner') || {}).value || '';
  PL_FILTER.stage_id = (document.getElementById('plFilterStage') || {}).value || '';
  PL_FILTER.source = ((document.getElementById('plFilterSource') || {}).value || '').trim();
  PL_FILTER.status = (document.getElementById('plFilterStatus') || {}).value || '';
  PL_FILTER.from = (document.getElementById('plFilterFrom') || {}).value || '';
  PL_FILTER.to = (document.getElementById('plFilterTo') || {}).value || '';
  PL_FILTER.rotting = !!((document.getElementById('plFilterRotting') || {}).checked);
  loadPipelinesTab();
}

function plClearFilters() {
  PL_FILTER = { q: '', owner_id: '', stage_id: '', source: '', status: '', from: '', to: '', rotting: false };
  ['plFilterQ', 'plFilterSource', 'plFilterFrom', 'plFilterTo'].forEach(function (id) {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  ['plFilterOwner', 'plFilterStage', 'plFilterStatus'].forEach(function (id) {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  const r = document.getElementById('plFilterRotting'); if (r) r.checked = false;
  loadPipelinesTab();
}

async function loadPipelinesTab() {
  const el = document.getElementById('plContent');
  if (!el) return;
  try {
    // Team (owner pickers) and the workspace currency are read once per tab visit; both are needed
    // before a single deal can be created or filtered by owner.
    if (!PL_TEAM.length) {
      try { PL_TEAM = (await API.get('/deals/team')).people || []; } catch (_) {}
      try { await plLoadSources(); } catch (_) {}
    }
    if (PL_CURRENCY === null) {
      try {
        const cur = await API.get('/deals/currency');
        PL_CURRENCY = cur.currency || '';
        PL_REPORTING = cur.reporting_currency || PL_CURRENCY;
        PL_CURRENCY_SOURCE = cur.source || null;
        PL_ISO = cur.iso_currencies || [];
      } catch (_) {}
    }
    const noteEl = document.getElementById('plCurrencyNote');
    if (noteEl) {
      noteEl.innerHTML = PL_CURRENCY
        ? 'Default currency: <strong>' + escapeHtml(PL_CURRENCY) + '</strong>' +
          (PL_CURRENCY_SOURCE === 'standing_default' ? ' <span class="config-desc">(the standing default — set another per workspace)</span>' : '') +
          ' · reports in <strong>' + escapeHtml(PL_REPORTING || PL_CURRENCY) + '</strong> · <a href="#" onclick="plDealSettings();return false">change</a> · <a href="#" onclick="plRefreshRates();return false">refresh rates</a>'
        : '';
    }
    const pipes = famList(await API.get('/pipelines'), 'pipelines');
    PL_DATA = [];
    let stageOptions = '<option value="">Any stage</option>';
    for (const row of pipes) {
      const p = row.pipeline || row;
      let stages = row.stages || [];
      try { stages = famList(await API.get('/pipelines/' + p.id + '/stages'), 'stages'); } catch (_) {}
      PL_DATA.push({ pipeline: p, stages: stages, opps: [] });
      stages.forEach(function (s) {
        stageOptions += '<option value="' + s.id + '"' + (PL_FILTER.stage_id === s.id ? ' selected' : '') + '>' +
          escapeHtml(p.name + ' · ' + s.name) + '</option>';
      });
    }
    const sel = document.getElementById('plFilterStage');
    if (sel) sel.innerHTML = stageOptions;
    const ownerSel = document.getElementById('plFilterOwner');
    if (ownerSel) {
      ownerSel.innerHTML = '<option value="">Anyone</option>' + PL_TEAM.map(function (u) {
        return '<option value="' + u.id + '"' + (PL_FILTER.owner_id === u.id ? ' selected' : '') + '>' + escapeHtml(u.name) + '</option>';
      }).join('');
    }

    let filtered = { deals: [], total: 0, total_value: 0, weighted_value: 0 };
    try { filtered = await API.get('/deals' + plFilterQuery() + (plFilterQuery() ? '&' : '?') + 'per_page=100'); } catch (e) { toast('Deals: ' + e.message, 'error'); }
    const deals = filtered.deals || [];
    // Hand each pipeline the deals that belong to it, so the board and the table read ONE result set.
    PL_DATA.forEach(function (entry) {
      entry.opps = deals.filter(function (d) { return d.pipeline_id === entry.pipeline.id; });
    });

    if (!pipes.length) {
      el.innerHTML = card('Pipelines', '<div class="empty-state"><div class="empty-icon">📈</div>' +
        '<h3>No pipelines yet</h3><p>Create your first sales pipeline to start tracking deals.</p></div>');
      return;
    }

    let h = '';
    for (const entry of PL_DATA) {
      const p = entry.pipeline, stages = entry.stages, opps = entry.opps;
      const won = opps.filter(function (o) { return o.is_won; }).length;
      const lost = opps.filter(function (o) { return o.is_lost; }).length;
      const open = opps.length - won - lost;
      h += '<div class="card" style="margin-bottom:16px">' +
        '<div class="card-header">📈 ' + fh(p.name) +
          ' <span class="badge badge-primary">' + opps.length + ' deals</span> ' +
          '<span class="badge badge-success">' + won + ' won</span> ' +
          '<span class="badge badge-muted">' + open + ' open</span> ' +
          '<span class="badge badge-error">' + lost + ' lost</span>' +
          '<button class="btn btn-secondary btn-xs" onclick="plAddStage(\'' + p.id + '\')">+ Stage</button> ' +
          '<button class="btn btn-primary btn-xs" onclick="plAddDeal(\'' + p.id + '\')">+ Deal</button> ' +
          '<button class="btn btn-secondary btn-xs" onclick="plStageHooks(\'' + p.id + '\')">Stage hooks</button> ' +
          '<button class="btn btn-ghost btn-xs" onclick="plDeletePipeline(\'' + p.id + '\')">Delete pipeline</button>' +
        '</div><div class="card-body">';
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
      if (!stages.length) h += '<span class="config-desc">No stages on this pipeline — add one to move deals through it.</span>';
      stages.forEach(function (s) {
        const stageDeals = opps.filter(function (o) { return o.stage_id === s.id; });
        const cur = plCurrencies(stageDeals);
        // Totals are per currency: a stage holding USD and EUR deals shows two figures, never one sum.
        const totals = cur.map(function (c) {
          const sum = stageDeals.filter(function (o) { return (o.currency || '').toUpperCase() === c; })
            .reduce(function (a, o) { return a + (Number(o.value) || 0); }, 0);
          return plMoney(sum, c);
        }).join(' + ');
        // Beside the per-currency figures, the reporting-currency equivalent from each deal's
        // STORED rate — one number that reconciles, and never a raw mixed sum.
        const repSum = plReportingSum(stageDeals, false);
        const repLine = (PL_REPORTING && cur.length ? ' ≈ ' + plMoney(repSum.total, PL_REPORTING) : '');
        h += '<span class="badge badge-warning" style="padding:6px 10px">' + fh(s.name) +
          (s.probability !== null && s.probability !== undefined ? ' · ' + s.probability + '%' : '') +
          (stageDeals.length ? ' · ' + stageDeals.length + ' (' + totals + repLine + ')' : '') +
          (s.is_won ? ' 🏆' : '') + (s.is_lost ? ' ✕' : '') +
          ' <a href="#" title="Edit stage" onclick="plEditStage(\'' + p.id + '\',\'' + s.id + '\');return false">✎</a>' +
          ' <a href="#" title="Delete stage" onclick="plDeleteStage(\'' + p.id + '\',\'' + s.id + '\');return false">🗑</a>' +
        '</span>';
      });

      h += '<div style="color:var(--text-muted);font-size:12px;margin-bottom:6px">Drag a deal card between stages to move it. Click a card to open the deal.</div>';
      h += plBoard(p, stages, opps);
      h += '</div>';
      const rows = opps.map(function (o) {
        const st = stages.find(function (s) { return s.id === o.stage_id; });
        const owner = PL_TEAM.find(function (u) { return u.id === o.owner_id; });
        return [
          '<a href="#" onclick="plOpenDeal(\'' + o.id + '\');return false">' + fh(o.name) + '</a>',
          plMoney(o.value, o.currency),
          st ? fh(st.name) : '—',
          owner ? fh(owner.name) : (o.external_ref ? '<span class="badge badge-muted">API</span>' : '—'),
          o.probability !== null && o.probability !== undefined ? o.probability + '%' : '—',
          o.is_won ? '<span class="badge badge-success">won</span>'
                   : (o.is_lost ? '<span class="badge badge-error">lost</span>'
                                : '<span class="badge badge-muted">open</span>'),
          o.external_ref ? fh(o.external_ref) : '—',
          '<select onchange="plMoveDeal(\'' + p.id + '\',\'' + o.id + '\',this.value)" ' +
            'style="padding:4px 8px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary)">' +
            '<option value="">Move to…</option>' +
            stages.map(function (s) { return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>'; }).join('') +
          '</select>',
          '<button class="btn btn-ghost btn-xs" onclick="plOpenDeal(\'' + o.id + '\')">Open</button> ' +
          '<button class="btn btn-ghost btn-xs" onclick="plDeleteDeal(\'' + p.id + '\',\'' + o.id + '\')">Delete</button>'
        ];
      });
      h += dataTable(['Deal', 'Value', 'Stage', 'Owner', 'Prob.', 'Status', 'Ext. ref', 'Move', ''], rows,
        'No deals match these filters yet.');
      h += '</div>';
    }
    el.innerHTML = h;

    // The filter's own totals, above the board: what the CURRENT filter is worth, per currency.
    const summaryEl = document.getElementById('plReport');
    if (summaryEl) {
      const cur = plCurrencies(deals);
      const totalsLine = cur.length
        ? cur.map(function (c) {
            const rowsC = deals.filter(function (d) { return (d.currency || '').toUpperCase() === c; });
            const total = rowsC.reduce(function (a, d) { return a + (Number(d.value) || 0); }, 0);
            const weighted = rowsC.reduce(function (a, d) {
              return a + ((Number(d.value) || 0) * (Number(d.probability) || 0) / 100);
            }, 0);
            return '<div><strong>' + c + '</strong>: ' + plMoney(total, c) + ' total · ' +
              plMoney(weighted, c) + ' weighted</div>';
          }).join('')
        : '<div style="color:var(--text-secondary)">No deals match these filters.</div>';
      const repSum = plReportingSum(deals, false);
      const repWeighted = plReportingSum(deals, true);
      const repLine = PL_REPORTING
        ? '<div style="margin-top:6px"><strong>In ' + escapeHtml(PL_REPORTING) + '</strong>: ' +
          plMoney(repSum.total, PL_REPORTING) + ' total · ' + plMoney(repWeighted.total, PL_REPORTING) +
          ' weighted' + (repSum.unconverted ? ' · ' + repSum.unconverted + ' deal(s) could not be converted' : '') + '</div>'
        : '';
      summaryEl.innerHTML = '<div class="card" style="margin-bottom:16px"><div class="card-header">📊 What this filter is worth</div>' +
        '<div class="card-body" style="font-size:13px">' + totalsLine + repLine +
        '<div style="color:var(--text-secondary);font-size:12px;margin-top:6px">' + deals.length + ' deal(s) shown. Weighted value = value × probability. Amounts are never added across currencies; the reporting line uses the rate each deal stored.</div>' +
        '</div></div>';
    }
  } catch (e) { famErr(el, 'Pipelines', e); }
}

    : (deal.is_lost ? '<span class="badge badge-error">lost</span>' : '<span class="badge badge-muted">open</span>');

  let fields = '';
  (d.custom_fields || []).forEach(function (f) {
    if (f.field_type === 'money') {
      // A money field is an AMOUNT PLUS ITS OWN CURRENCY CODE (David's condition 7) — the same
      // rules as the deal's value, so it carries a code and a stored rate of its own.
      const amt = (f.money_amount === null || f.money_amount === undefined) ? '' : Number(f.money_amount);
      const cur = f.money_currency || deal.currency || PL_CURRENCY || '';

async function plSaveDeal() {
  if (!PL_DETAIL) return;
  const deal = PL_DETAIL.deal;
  const body = {
    notes: (document.getElementById('plDetailNotes') || {}).value || null,
    owner_id: (document.getElementById('plDetailOwner') || {}).value || null
  };
  const fields = {};
  document.querySelectorAll('[data-field]').forEach(function (el) {
    fields[el.getAttribute('data-field')] = el.value;
  });
  // A money field posts amount + currency, so the server stores the rate that was true that day.
  document.querySelectorAll('[data-money-amount]').forEach(function (el) {
    const key = el.getAttribute('data-money-amount');
    const raw = (el.value || '').trim();
    if (raw === '') { fields[key] = null; return; }
    const sel = document.querySelector('[data-money-currency="' + key + '"]');
    fields[key] = { amount: Number(raw), currency: (sel && sel.value) || PL_CURRENCY || null };
  });
  if (Object.keys(fields).length) body.custom_fields = fields;
  try {
    await API.patch('/deals/' + deal.id, body);
    toast('Deal saved', 'success');
    await plOpenDeal(deal.id);
    loadPipelinesTab();
  } catch (e) { toast('Save failed: ' + e.message, 'error'); }
}

async function plMarkStatus(status) {
  if (!PL_DETAIL) return;

  let lostReason = null;
  if (status === 'lost') {
    let reasons = [];

    const opts = reasons.filter(function (r) { return r.is_active; })
      .map(function (r) { return '<option value="' + escapeHtml(r.label) + '">' + escapeHtml(r.label) + '</option>'; }).join('');
    showModal('Why was this deal lost?',
      '<div class="form-group"><label>Reason</label><select id="plLostReason"><option value="">No reason</option>' + opts + '</select></div>' +
      '<div class="form-group"><label>Or write your own</label><input type="text" id="plLostReasonFree"></div>',
      '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" onclick="plConfirmLost()">Mark lost</button>');

  }
  try {
    await API.post('/deals/' + deal.id + '/status', { status: status });

    await plOpenDeal(deal.id);
    loadPipelinesTab();

function plUploadFile() {
  if (!PL_DETAIL) return;
  const input = document.getElementById('plNewFile');
  const file = input && input.files && input.files[0];
  if (!file) return;
  if (file.size > 6 * 1024 * 1024) { toast('Files must be 6 MB or smaller', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async function () {
    try {
      const b64 = String(reader.result).split(',')[1] || '';
      await API.post('/deals/' + PL_DETAIL.deal.id + '/attachments', {
        filename: file.name,
        content_type: file.type || 'application/octet-stream',
        content_base64: b64
      });
      toast('File attached', 'success');
      await plOpenDeal(PL_DETAIL.deal.id);
    } catch (e) { toast('Upload failed: ' + e.message, 'error'); }
  };
  reader.readAsDataURL(file);
}

function plDownloadFile(attId, filename) {
  if (!PL_DETAIL) return;
  // A download needs the session token, which a bare link cannot carry — fetch it and hand the
  // browser a blob instead.
  fetch('/api/deals/' + PL_DETAIL.deal.id + '/attachments/' + attId, {
    headers: { 'Authorization': 'Bearer ' + STATE.token }
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.blob();
  }).then(function (blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename || 'attachment';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }).catch(function (e) { toast('Download failed: ' + e.message, 'error'); });
}

async function plDeleteFile(attId) {
  if (!PL_DETAIL) return;
  try {
    await API.del('/deals/' + PL_DETAIL.deal.id + '/attachments/' + attId);
    await plOpenDeal(PL_DETAIL.deal.id);
  } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

// ── deals settings: the workspace's two currencies, and the rate table they read ───────────
// David's amendment (2026-11-20): an account states a DEFAULT currency (what a new deal is priced
// in) and a REPORTING currency (what its reports are computed in). Both are picked from the real
// ISO 4217 list, and the panel shows the rates the deals will store today.
async function plDealSettings() {
  if (PL_CURRENCY === null || !PL_ISO.length) {
    try {
      const c = await API.get('/deals/currency');
      PL_CURRENCY = c.currency || '';
      PL_REPORTING = c.reporting_currency || PL_CURRENCY;
      PL_CURRENCY_SOURCE = c.source || null;
      PL_ISO = c.iso_currencies || [];
    } catch (_) {}
  }
  let rates = [];
  try { rates = (await API.get('/deals/fx-rates')).rates || []; } catch (_) {}
  const wanted = [PL_CURRENCY, PL_REPORTING, 'USD', 'EUR', 'GBP', 'CAD', 'MXN'];
  const shown = rates.filter(function (r) { return wanted.indexOf(r.currency) !== -1; });
  const rateLine = shown.length
    ? shown.map(function (r) { return r.currency + ' ' + Number(r.usd_rate).toFixed(4) + ' per USD (' + r.as_of + ')'; }).join(' · ')
    : 'No rates in the table yet — press “Refresh rates”.';
  showModal('Deals settings',
    '<div class="form-group"><label>Default currency — what a new deal is priced in</label>' +
      '<select id="dlDefaultCur">' + plCurrencyOptions(PL_CURRENCY) + '</select>' +
      '<div class="config-desc">A deal that names no currency takes this one. <strong>USD is the standing default</strong> — an account that has not chosen here is a dollar workspace, and a first deal is never refused for the want of a default.</div></div>' +
    '<div class="form-group"><label>Reporting currency — what totals and reports compute in</label>' +
      '<select id="dlReportingCur">' + plCurrencyOptions(PL_REPORTING || PL_CURRENCY) + '</select>' +
      '<div class="config-desc">Every deal stores the rate that converts it into this currency, on the day it was written. Changing this re-quotes open history from the rate that was true on each deal\'s own date — it never re-prices from today\'s market.</div></div>' +
    '<div class="form-group"><label>Today\'s rates</label>' +
      '<div class="config-desc" id="dlRateLine">' + escapeHtml(rateLine) + '</div>' +
      '<button class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="plRefreshRates(true)">Refresh rates now</button></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="plSaveCurrency()">Save</button>');
}

    if (fromSettings) plDealSettings();

async function plSaveCurrency() {
  const defEl = document.getElementById('dlDefaultCur');
  const repEl = document.getElementById('dlReportingCur');
  const fallback = ((document.getElementById('plCurrencyInput') || {}).value || '').trim().toUpperCase();
  const body = {};
  if (defEl) body.currency = defEl.value;
  else if (fallback) body.currency = fallback;
  if (repEl) body.reporting_currency = repEl.value;
  if (!body.currency && !body.reporting_currency) { toast('Choose a currency', 'error'); return; }
  try {
    const r = await API.put('/deals/currency', body);
    PL_CURRENCY = r.currency || PL_CURRENCY;

let PL_SOURCES = null;
window.PL_SOURCES = [];
async function plLoadSources() {
  if (PL_SOURCES) return PL_SOURCES;
  PL_SOURCES = [];
  try {
    // The workspace's own settings, read with the workspace id from the session's own claim. An
    // account id is not guessed from the account list: the token says which workspace this is.
    var aid = '';
    try {
      var tk = localStorage.getItem('crm_token') || '';
      var payload = JSON.parse(atob((tk.split('.')[1] || '').replace(/-/g, '+').replace(/_/g, '/')));
      aid = payload.aid || payload.account_id || payload.tenant_id || '';
    } catch (_) {}
    if (aid) {
      const r = await API.get('/account/' + encodeURIComponent(aid) + '/settings');
      const list = (r && r.settings && r.settings.deal_sources) || [];
      if (Array.isArray(list)) PL_SOURCES = list.filter(function (x) { return typeof x === 'string' && x.trim(); });
    }
  } catch (e) { PL_SOURCES = []; }
  window.PL_SOURCES = PL_SOURCES || [];
  return PL_SOURCES;
}

// ---------------------------------------------------------------- DRAG & DROP BOARD
// HTML5 native drag and drop: the card carries draggable="true", each stage column accepts a drop.
// `PL_DRAG` is the reliable payload (a JS variable); `dataTransfer` is set as well so a drop from a
// different tab or a synthetic event still resolves the deal.
let PL_DRAG = null;

function plBoard(p, stages, opps) {
  if (!stages.length) return '';
  const cols = stages.map(function (s) {
    const cards = opps.filter(function (o) { return o.stage_id === s.id; });
    return '<div class="pl-col" data-stage="' + s.id + '" data-pipeline="' + p.id + '"' +
        ' ondragover="plDragOver(event, this)" ondragleave="plDragLeave(this)"' +
        ' ondrop="plDrop(event, this, \'' + s.id + '\')"' +
        ' style="flex:1 1 220px;min-width:200px;background:var(--bg-secondary);border:1px dashed var(--border);border-radius:10px;padding:8px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<strong style="font-size:13px">' + fh(s.name) + (s.is_won ? ' 🏆' : '') + (s.is_lost ? ' ✕' : '') + '</strong>' +
        '<span><span class="badge badge-muted">' + cards.length + '</span> ' +
        '<button class="btn btn-ghost btn-xs" title="New deal on this stage" onclick="plAddDeal(\'' + p.id + '\',\'' + s.id + '\')">+</button></span>' +
      '</div>' +
      (cards.length ? cards.map(function (o) {
        // Click opens the deal; the drag handle is the same card, so a click after a drag is
        // suppressed by the browser's own click-cancel on dragend.
        return '<div class="pl-card" draggable="true" data-opp="' + o.id + '"' +
          ' onclick="plOpenDeal(\'' + o.id + '\')"' +
          ' ondragstart="plDragStart(event, \'' + p.id + '\', \'' + o.id + '\')" ondragend="plDragEnd(this)"' +
          ' style="background:var(--bg-primary,#16161a);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab">' +
          '<div style="font-weight:600;font-size:13px">' + fh(o.name) +
            (o.external_ref ? ' <span class="badge badge-muted" title="Created by an outside system">API</span>' : '') + '</div>' +
          '<div style="color:var(--text-muted);font-size:12px">' +
            plMoney(o.value, o.currency) +
            (o.probability !== null && o.probability !== undefined ? ' · ' + o.probability + '%' : '') +
          '</div></div>';
      }).join('') : '<div style="color:var(--text-muted);font-size:12px;padding:6px">Drop a deal here</div>') +
    '</div>';
  }).join('');
  return '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px">' + cols + '</div>';
}

function plDragStart(ev, pid, oid) {
  PL_DRAG = { pipelineId: pid, oppId: oid };
  try { ev.dataTransfer.setData('text/plain', oid); ev.dataTransfer.effectAllowed = 'move'; } catch (_) {}
  try { ev.currentTarget.style.opacity = '0.5'; } catch (_) {}
}

function plDragEnd(el) {
  try { el.style.opacity = '1'; } catch (_) {}
  PL_DRAG = null;
}

function plDragOver(ev, col) {
  ev.preventDefault();                       // without this the drop event never fires
  try { ev.dataTransfer.dropEffect = 'move'; } catch (_) {}
  col.style.borderColor = 'var(--primary,#6366f1)';
  col.style.background = 'rgba(99,102,241,0.08)';
}

function plDragLeave(col) {
  col.style.borderColor = 'var(--border)';
  col.style.background = 'var(--bg-secondary)';
}

function plDrop(ev, col, stageId) {
  ev.preventDefault();
  plDragLeave(col);
  const drag = PL_DRAG;
  let oid = drag ? drag.oppId : null;
  if (!oid) { try { oid = ev.dataTransfer.getData('text/plain'); } catch (_) {} }
  const pid = (drag && drag.pipelineId) || col.getAttribute('data-pipeline') || '';
  if (!oid || !pid) { toast('Nothing to move', 'error'); return; }
  plMoveDealAsync(pid, oid, stageId);
}

function plMoveDealAsync(pid, oppId, stageId) {
  if (!stageId) return Promise.resolve();
  // The deal writer's stage route (not the raw pipelines one) so the move also records the
  // stage clock, the history row, the timeline entry and any stage automation hook.
  return API.post('/deals/' + oppId + '/stage', { stage_id: stageId })
    .then(function (r) {
      const d = (r && r.deal) || {};
      toast(d.is_won ? 'Deal won' : (d.is_lost ? 'Deal lost' : 'Deal moved'), 'success');
      loadPipelinesTab();
      return r;
    })
    .catch(function (e) {
      toast('Move failed: ' + e.message, 'error');
      loadPipelinesTab();
      throw e;
    });
}

// ── THE MAIL GATE (David, 2026-11-20) ─────────────────────────────────────────────────────────────
// "Once they try to go to a feature that requires any of them, that gate will stop them from breaking
// anything on their end or assuming the system doesn't work."
//
// A feature that needs mail asks this first. If the lane is not ready the feature is REPLACED by the
// setup it needs — not a dead button and not a silent no-op. The answer comes from the server
// (`/private-email/readiness`), so the gate cannot disagree with what the send path will do.
let MAIL_READY = null;

async function loadMailReadiness(force) {
  if (MAIL_READY && !force) return MAIL_READY;
  try { MAIL_READY = await API.get('/private-email/readiness'); }
  catch (e) { MAIL_READY = null; }
  return MAIL_READY;
}

function mailLane(ready, lane) {
  const lanes = (ready && ready.lanes) || [];
  return lanes.filter(function (l) { return l.lane === lane; })[0] || null;
}

// Returns the blocking screen, or null when the lane is ready. `what` names the feature so the words
// belong to the page the person actually opened.
// A lane that is missing but does not have to stop the whole page: say what will not work, on the page
// where it will not work, with the fix one click away. Used by pages that are useful without mail
// (rules that tag or score, tickets that still queue) but send mail as part of their job.
function mailLaneBanner(ready, lane, effect) {
  const l = mailLane(ready, lane);
  if (!l || l.ready) return '';
  return '<div class="card" style="border-left:3px solid #f59e0b;margin-bottom:12px">' +
    '<strong>' + escapeHtml(effect) + '</strong>' +
    '<div style="margin-top:6px;font-size:13px">' + escapeHtml(l.reason || '') + '</div>' +
    (l.action ? '<div style="margin-top:6px;font-size:12.5px;opacity:.85">' + escapeHtml(l.action) + '</div>' : '') +
    '<div style="margin-top:10px"><button class="btn btn-primary btn-xs" onclick="switchTab(\'inbox\')">Set up email</button></div>' +
    '</div>';
}

function mailGateScreen(ready, lane, what) {
  const l = mailLane(ready, lane);
  if (!l || l.ready) return null;
  return pageHeader(what, 'This feature sends or receives mail, so it needs one thing set up first',
      '<button class="btn btn-primary btn-sm" onclick="switchTab(\'inbox\')">Set it up</button> ' +
      '<button class="btn btn-secondary btn-sm" onclick="mailGateRetry()">I have just set it up</button>') +
    '<div class="card" style="border-left:3px solid #f59e0b">' +
    '<strong>' + escapeHtml(l.title || lane) + '</strong>' +

// strategy'). The two retired values are still LABELLED, so a team created before this change
// shows on its card why its assignments are refused instead of a raw slug.
const RR_STRATEGY_LABELS = { round_robin: 'Round robin', least_loaded: 'Least busy', weighted: 'Weighted (not supported by the assignment engine)', random: 'Random (not supported by the assignment engine)' };

// RAW USER ID and claimed "the platform exposes no endpoint that lists an account’s users";
// that route exists and is tenant-scoped, so the id box was the only thing missing a source.
async function rrAddMember(teamId) {
  let roster = [];
  try {
    roster = famList(await API.get('/auth/team/members'), 'members');
  } catch (e) {
    toast('Could not load the workspace members: ' + planGateText(e), 'error');
    return;
  }
  const active = roster.filter(function (u) { return u && u.id && u.is_active !== false; });
  if (!active.length) {
    toast('This account has no other members yet. Invite a teammate first, then add them to a team.', 'error');
    return;
  }
  const opts = active.map(function (u) {
    const label = (u.name && String(u.name).trim()) ? String(u.name).trim() : (u.email || u.id);
    const mail = (u.email && label !== u.email) ? ' — ' + u.email : '';
    return '<option value="' + u.id + '">' + escapeHtml(label + mail) + '</option>';
  }).join('');
  showModal('Add Team Member',
    '<div class="form-group"><label>Workspace member</label><select id="rrUserId">' + opts + '</select></div>' +
    '<p class="form-hint">Everyone listed is a person on this account. Only active members are offered.</p>' +
    '<div class="form-group"><label>Weight (stored; the two strategies here do not use it)</label><input type="number" id="rrWeight" value="1" min="1"></div>' +

      max_concurrent_bookings: parseInt(document.getElementById('rrMax').value, 10) || 10

document.addEventListener('click', function (ev) {
  const t = ev.target; if (!t || !t.closest) return;
  if (t.closest('[data-dlf-add]')) { ev.preventDefault(); dlAddField(); return; }
  const del = t.closest('[data-dlf-del]');
  if (del) { ev.preventDefault(); dlDeleteField(del.getAttribute('data-dlf-del'), del.getAttribute('data-dlf-label') || 'this field'); }
});

  try { const q = await API.get('/notifications/queue'); queue = (q && Array.isArray(q.items)) ? q.items : []; } catch (_) {}
  NTR.rules = rules;
  const ruleRows = rules.map(function (r) {
    return [
      '<strong>' + escapeHtml(r.trigger_event || '—') + '</strong>',
      escapeHtml(r.action || '—'),

      '<button type="button" class="btn btn-ghost btn-xs" data-ntr-del="' + escapeHtmlAttr(String(r.id)) + '">Remove</button>'
    ];
  });
  const qRows = queue.slice(0, 10).map(function (i) {
    return [escapeHtml(i.title || i.trigger_event || i.kind || '—'), escapeHtml(String(i.created_at || '').slice(0, 16).replace('T', ' ')), escapeHtml(i.status || (i.sent ? 'sent' : 'waiting'))];
  });
  const body =
    '<p style="color:var(--text-secondary);margin:0 0 10px">What CoreSwift does on your behalf when something happens — a deal goes quiet, a form is filled in, a booking lands. These are the rules behind the alerts in the list above.</p>' +

    (rules.length ? dataTable(['When', 'Do', 'About', 'State', ''], ruleRows, '') :
      '<p style="color:var(--text-secondary);font-size:13px">No rules yet. A rule is "when X happens, do Y" — start with the one thing you keep doing by hand.</p>') +
    (queue.length ? '<h4 style="margin:18px 0 6px">Waiting to go out (' + queue.length + ')</h4>' + dataTable(['What', 'When', 'State'], qRows, '') : '');
  el.innerHTML = card('Alert rules', body);

  showModal('New alert rule',
    '<div class="form-group"><label>When this happens</label><input type="text" id="ntrTrigger" placeholder="deal.stalled" autofocus>' +
      '<p style="color:var(--text-secondary);font-size:12px;margin:4px 0 0">The event name this system publishes — for example <code>deal.stalled</code>, <code>contact.created</code>, <code>booking.confirmed</code>.</p></div>' +
    // These four are the API's own enum (src/notifications/handlers.rs valid_actions). An invented
    // "webhook" option here answered 422 on save — the screen must not offer a value the route refuses.
    '<div class="form-group"><label>Do this</label><select id="ntrAction">' +
      '<option value="in_app">Put it in this feed</option>' +
      '<option value="send_email">Send an email</option>' +
      '<option value="send_sms">Send a text message</option>' +
      '<option value="send_whatsapp">Send a WhatsApp message</option></select></div>' +
    '<div class="form-group"><label>About (optional)</label><input type="text" id="ntrTarget" placeholder="deal"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="ntrSave">Create rule</button>');
  document.getElementById('ntrSave').onclick = async function () {
    const trigger_event = (document.getElementById('ntrTrigger').value || '').trim();
    const action = document.getElementById('ntrAction').value;
    const target_entity = (document.getElementById('ntrTarget').value || '').trim();
    if (!trigger_event) { toast('Name the event first', 'error'); return; }
    try {
      await API.post('/notifications/rules', { trigger_event: trigger_event, action: action, target_entity: target_entity || null, is_active: true });
      closeModal(); toast('Rule created', 'success'); ntLoadRules();
    } catch (e) { toast('Could not create it: ' + (e.message || e), 'error'); }
  };
}

document.addEventListener('click', async function (ev) {
  const t = ev.target; if (!t || !t.closest) return;
  if (t.closest('[data-ntr-add]')) { ev.preventDefault(); ntAddRule(); return; }
  const tg = t.closest('[data-ntr-toggle]');
  if (tg) {
    ev.preventDefault();
    const id = tg.getAttribute('data-ntr-toggle');
    const nowActive = tg.getAttribute('data-ntr-active') === '1';
    try { await API.call('PATCH', '/notifications/rules/' + encodeURIComponent(id), { is_active: !nowActive }); toast(nowActive ? 'Rule paused' : 'Rule switched on', 'success'); ntLoadRules(); }
    catch (e) { toast('Could not change it: ' + (e.message || e), 'error'); }
    return;
  }
  const del = t.closest('[data-ntr-del]');
  if (del) {
    ev.preventDefault();
    if (!confirm('Remove this alert rule? Nothing already sent is affected.')) return;
    try { await API.del('/notifications/rules/' + encodeURIComponent(del.getAttribute('data-ntr-del'))); toast('Rule removed', 'success'); ntLoadRules(); }

});


// ── OPERATOR ACTIONS (2026-11-21) ────────────────────────────────────────────────────────────────
// The list of what an operator can do comes FROM the server (GET /api/admin/chat-action/intents), so
// this screen can never offer an action the API would refuse, and the result it shows is the API's own
// answer. Creating an account goes through the one engine that already knows how — not a second
// implementation of tenant creation living in the browser.
var OPS = { intents: [] };

function opsShell() {
  return pageHeader('Operator Actions', 'The handful of things an operator can do on a customer account',
    '<button class="btn btn-secondary btn-sm" onclick="opsLoad()">↻ Reload</button>') +
    '<div class="card"><div class="card-body">' +
      '<p style="color:var(--text-secondary);margin:0 0 12px">Each action below is run by the server exactly as an agent would run it. The list is read from the API, never typed here.</p>' +
      '<div id="opsIntents"><div class="loading-wrap"><div class="spinner"></div> Asking the server what it can do…</div></div>' +
      '<div id="opsForm" style="margin-top:16px"></div>' +
    '</div></div>' +
    '<div id="opsResult"></div>';
}

async function opsLoad() {
  const el = document.getElementById('opsIntents');
  if (!el) return;
  try {
    const d = await API.get('/admin/chat-action/intents');
    OPS.intents = (d && Array.isArray(d.intents)) ? d.intents : [];
  } catch (e) {
    el.innerHTML = '<p style="color:var(--text-secondary)">Could not read the action list: ' + escapeHtml(e.message || String(e)) + '</p>';
    return;
  }
  el.innerHTML = OPS.intents.length
    ? dataTable(['Action', 'What it does', 'Needs'], OPS.intents.map(function (i) {
        return ['<strong>' + escapeHtml(i.name) + '</strong>', escapeHtml(i.description || ''),
                '<code>' + escapeHtml((i.required_fields || []).join(', ') || '—') + '</code>'];
      }), '')
    : '<p style="color:var(--text-secondary)">The server offered no actions.</p>';
  opsPick(OPS.intents.length ? OPS.intents[0].name : '');
}

function opsPick(name) {
  const box = document.getElementById('opsForm');
  if (!box || !name) return;
  const it = OPS.intents.find(function (x) { return x.name === name; });
  if (!it) { box.innerHTML = ''; return; }
  const fields = (it.required_fields || []).map(function (f) {
    return '<div class="form-group"><label>' + escapeHtml(f) + '</label><input type="text" data-ops-field="' + escapeHtmlAttr(f) + '" placeholder="' + escapeHtml(f) + '"></div>';
  }).join('');
  const optional = (it.optional_fields || []).length
    ? '<p style="color:var(--text-secondary);font-size:12px;margin:0 0 8px">Optional: <code>' + escapeHtml((it.optional_fields || []).join(', ')) + '</code></p>' : '';
  const opts = OPS.intents.map(function (x) {
    return '<option value="' + escapeHtmlAttr(x.name) + '"' + (x.name === name ? ' selected' : '') + '>' + escapeHtml(x.name) + '</option>';
  }).join('');
  box.innerHTML = '<div class="form-group"><label for="opsIntent">Action</label><select id="opsIntent" onchange="opsPick(this.value)">' + opts + '</select></div>' +
    fields + optional + '<button type="button" class="btn btn-primary" id="opsRun">Run it</button>' +
    '<p style="color:var(--text-secondary);font-size:12px;margin:10px 0 0">Creating an account makes a real customer account and mints its API key. Nothing here can be undone from this screen.</p>';
  const run = document.getElementById('opsRun');
  if (run) run.onclick = function () { opsRun(name); };
}

async function opsRun(name) {
  const params = {};
  document.querySelectorAll('[data-ops-field]').forEach(function (inp) { params[inp.getAttribute('data-ops-field')] = inp.value.trim(); });
  const box = document.getElementById('opsResult');
  if (box) box.innerHTML = '<div class="card"><div class="card-body"><div class="loading-wrap"><div class="spinner"></div> Running…</div></div></div>';
  try {
    const r = await API.post('/admin/chat-action', { intent: name, params: params });
    if (box) box.innerHTML = '<div class="card"><div class="card-body"><h3 style="margin:0 0 6px">The server answered</h3>' +
      '<pre style="white-space:pre-wrap;font-size:12px;margin:0">' + escapeHtml(JSON.stringify(r, null, 2)) + '</pre></div></div>';
    toast('Done', 'success');
  } catch (e) {
    if (box) box.innerHTML = '<div class="card"><div class="card-body"><h3 style="margin:0 0 6px">It was refused</h3>' +
      '<p style="color:var(--text-secondary);margin:0">' + escapeHtml(e.message || String(e)) + '</p></div></div>';
    toast('Refused: ' + (e.message || e), 'error');
  }
}

// Limits, the catalogue of things it may ask for, and everything waiting for a person. Nothing here acts
// on its own: approving is a button a human presses, and a refusal is kept as a record.
function agentShell() {
  return pageHeader('Agent', 'What the agent may do on its own, and what is waiting for you',
    '<button class="btn btn-secondary btn-sm" onclick="agentLoad()">Refresh</button>') +
    '<div id="agentLimits"><div class="loading-wrap"><div class="spinner"></div> Loading…</div></div>' +
    '<div id="agentQueue" style="margin-top:16px"></div>' +
    '<div id="agentKinds" style="margin-top:16px"></div>';
}

async function agentLoad() {
  const limitsEl = document.getElementById('agentLimits');
  const queueEl = document.getElementById('agentQueue');
  const kindsEl = document.getElementById('agentKinds');
  if (!limitsEl) return;
  let limits = null, actions = [], kinds = [];
  try {
    const res = await Promise.all([
      API.get('/agent/limits'),
      API.get('/agent/actions'),
      API.get('/agent/kinds')
    ]);
    limits = res[0]; actions = (res[1] && res[1].actions) || []; kinds = (res[2] && res[2].kinds) || [];
  } catch (e) {
    limitsEl.innerHTML = icErr('Could not load the agent', e.message);
    return;
  }
  const money = (c) => '$' + (Number(c || 0) / 100).toFixed(2);
  const on = !!(limits && limits.enabled);
  let h = card('⚖️ What it may do on its own',
    '<p style="color:var(--text-secondary);margin:0 0 10px">The agent is <strong>' + (on ? 'ON' : 'OFF') +
    '</strong> for this account. Anything above either limit waits for you — it is never done quietly.</p>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">' +
      '<label style="font-size:.78rem;color:var(--text-secondary)">Per action<br>' +
        '<input id="agentPerAction" type="number" min="0" step="1" value="' +
          escapeHtmlAttr(String(limits ? limits.per_action_cents : 0)) + '" style="width:130px"></label>' +
      '<label style="font-size:.78rem;color:var(--text-secondary)">Ceiling (cents)<br>' +
        '<input id="agentCeiling" type="number" min="0" step="1" value="' +
          escapeHtmlAttr(String(limits ? limits.ceiling_cents : 0)) + '" style="width:130px"></label>' +
      '<label style="font-size:.78rem;color:var(--text-secondary);display:flex;align-items:center;gap:6px">' +
        '<input id="agentEnabled" type="checkbox"' + (on ? ' checked' : '') + '> Enabled</label>' +
      '<button class="btn btn-primary btn-sm" onclick="agentSaveLimits()">Save</button>' +
    '</div>' +
    '<p style="color:var(--text-muted);font-size:.74rem;margin:10px 0 0">Currently ' + money(limits && limits.per_action_cents) +
      ' per action, ceiling ' + money(limits && limits.ceiling_cents) + '. A per-action limit can never exceed the ceiling.</p>');
  limitsEl.innerHTML = h;

  if (!actions.length) {
    queueEl.innerHTML = card('📋 Nothing waiting', '<p style="color:var(--text-secondary);margin:0">The agent has not asked to do anything.</p>');
  } else {
    let rows = '<div style="overflow:auto"><table class="table"><thead><tr><th>When</th><th>Action</th><th>Status</th><th>Why</th><th></th></tr></thead><tbody>';
    actions.forEach(function (a) {
      var badge = a.status === 'executed' ? 'badge-primary'
        : a.status === 'failed' ? 'badge-danger'
        : a.status === 'refused' ? 'badge-muted' : 'badge-warning';
      var why = a.held_because || a.reason || a.detail || '';
      var buttons = (a.status === 'proposed' || a.status === 'approved')
        ? '<button class="btn btn-primary btn-xs" onclick="agentDecide(\'' + a.id + '\',\'approve\')">Approve</button> ' +
          '<button class="btn btn-secondary btn-xs" onclick="agentDecide(\'' + a.id + '\',\'refuse\')">Refuse</button>'
        : '';
      rows += '<tr><td>' + (a.created_at ? new Date(a.created_at).toLocaleString() : '') + '</td>' +
        '<td>' + escapeHtml(a.kind) + '</td>' +
        '<td><span class="badge ' + badge + '">' + escapeHtml(a.status) + '</span></td>' +
        '<td style="font-size:.78rem;color:var(--text-secondary)">' + escapeHtml(why) + '</td>' +
        '<td>' + buttons + '</td></tr>';
    });
    rows += '</tbody></table></div>';
    queueEl.innerHTML = card('📋 What it asked for', rows);
  }

  if (kinds.length) {
    var body = '<ul style="margin:0;padding-left:18px;color:var(--text-secondary);font-size:.82rem">' +
      kinds.map(function (k) {
        return '<li><strong>' + escapeHtml(k.label) + '</strong> — ' + escapeHtml(k.description) +
          (k.spends ? ' <span class="badge badge-warning">spends money</span>' : '') + '</li>';
      }).join('') + '</ul>';
    kindsEl.innerHTML = card('🧾 What it can ask for', body);
  }
}

async function agentSaveLimits() {
  var body = {
    per_action_cents: parseInt(document.getElementById('agentPerAction').value || '0', 10),
    ceiling_cents: parseInt(document.getElementById('agentCeiling').value || '0', 10),
    enabled: document.getElementById('agentEnabled').checked
  };
  try {
    await API.put('/agent/limits', body);
    toast('Agent limits saved');
    agentLoad();
  } catch (e) { toast('Could not save: ' + e.message, 'error'); }
}

async function agentDecide(id, what) {
  try {
    await API.post('/agent/actions/' + id + '/' + what, {});
    toast(what === 'approve' ? 'Approved and carried out' : 'Refused');
    agentLoad();
  } catch (e) { toast('Could not ' + what + ': ' + e.message, 'error'); }
}

function scAddWebhook() {

    '<div class="form-group"><label>Web address</label><input type="text" id="scwUrl" placeholder="https://…"></div>' +
    // `min_score` is REQUIRED by POST /api/scoring/webhooks (its absence answered 422 "missing field
    // min_score"), so the form asks for it instead of letting the save fail.
    '<div class="form-group"><label>Send when the score is at least</label><input type="number" id="scwMin" value="50" min="0"></div>' +
    '<div class="form-group"><label>Send when the score is at most (optional)</label><input type="number" id="scwMax" placeholder="no limit"></div>' +
    '<div class="form-group"><label>Signing secret (optional)</label><input type="text" id="scwSecret" placeholder="leave empty if the receiver does not check one">' +
      '<p style="color:var(--text-secondary);font-size:12px;margin:4px 0 0">Stored encrypted; it travels as a signature header so the receiver can prove the call came from you.</p></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="scwSave">Add</button>');
  document.getElementById('scwSave').onclick = async function () {
    const name = (document.getElementById('scwName').value || '').trim();
    const url = (document.getElementById('scwUrl').value || '').trim();
    const secret = (document.getElementById('scwSecret').value || '').trim();
    const minRaw = (document.getElementById('scwMin').value || '').trim();
    const maxRaw = (document.getElementById('scwMax').value || '').trim();
    if (!name || !url) { toast('A name and a web address are both needed', 'error'); return; }
    const min_score = minRaw === '' ? 0 : parseInt(minRaw, 10);

    try {
      await API.post('/scoring/webhooks', {
        name: name, url: url, min_score: min_score,
        max_score: maxRaw === '' ? null : parseInt(maxRaw, 10),
        headers: secret ? { 'X-Signature-Secret': secret } : {}
      });
      closeModal(); toast('Destination added', 'success'); scLoadWebhooks();
    } catch (e) { toast('Could not add it: ' + (e.message || e), 'error'); }
  };
}

async function rrAssignLead() {
  let teams = [];
  try { teams = (await API.get('/round-robin/teams')) || []; } catch (_) {}
  teams = Array.isArray(teams) ? teams : [];
  if (!teams.length) { toast('Create a team first — assignment needs one to rotate around.', 'info'); return; }
  const opts = teams.map(function (t) { return '<option value="' + escapeHtmlAttr(String(t.id)) + '">' + escapeHtml(t.name || t.id) + '</option>'; }).join('');
  showModal('Hand a lead to the team',
    '<p style="color:var(--text-secondary);font-size:13px;margin:0 0 12px">Round robin gives the next lead to the next person in turn, so the work spreads instead of landing on whoever answers first.</p>' +
    '<div class="form-group"><label>Team</label><select id="rrTeam">' + opts + '</select></div>' +
    '<div class="form-group"><label>Contact email (optional)</label><input type="text" id="rrContact" placeholder="the person being handed over"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="rrGo">Assign now</button>');
  document.getElementById('rrGo').onclick = async function () {
    const team_id = document.getElementById('rrTeam').value;
    const email = (document.getElementById('rrContact').value || '').trim();
    let contact_id = null;
    if (email) {
      try {
        const found = await API.get('/contacts/search?q=' + encodeURIComponent(email));
        const list = (found && (found.contacts || found.items)) || [];
        const hit = list.find(function (c) { return (c.email || '').toLowerCase() === email.toLowerCase(); });
        contact_id = hit ? hit.id : null;
        if (!contact_id) { toast('No contact with that email — the lead is assigned without one.', 'info'); }
      } catch (_) {}
    }
    try {
      const r = await API.post('/round-robin/assign', { team_id: team_id, contact_id: contact_id });
      closeModal();
      const who = (r && (r.assigned_to_name || r.assigned_to_email || (r.member && (r.member.name || r.member.email)))) || 'the next person in turn';
      toast('Assigned to ' + who, 'success');
      if (typeof loadRoundRobinTab === 'function') loadRoundRobinTab();
    } catch (e) { toast('Could not assign: ' + (e.message || e), 'error'); }
  };
}

      catch (e) { toast('Could not remove it: ' + (e.message || e), 'error'); }
    }
  });
}
