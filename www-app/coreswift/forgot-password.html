<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password — CoreSwift CRM</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e1e4ed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1d27;border:1px solid #2d3248;border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:22px;font-weight:700;text-align:center}
.sub{color:#8b8fa3;font-size:13px;text-align:center;margin:6px 0 20px;line-height:1.5}
label{display:block;font-size:12px;color:#8b8fa3;margin:12px 0 5px}
input{background:#232736;border:1px solid #2d3248;color:#e1e4ed;padding:11px 13px;border-radius:8px;font-size:14px;width:100%}
input:focus{outline:none;border-color:#38bdf8}
button{width:100%;margin-top:18px;background:#38bdf8;color:#0b1220;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.msg.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.msg.ok{display:block;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#6ee7b7}
.foot{text-align:center;font-size:12px;color:#8b8fa3;margin-top:18px}
a{color:#38bdf8}
</style>
</head>
<body>
<div class="card">
  <h1>Reset your password</h1>
  <p class="sub">Enter your email and we&rsquo;ll send you a reset code.</p>
  <form id="f">
    <label for="e">Email</label>
    <input id="e" type="email" autocomplete="email" required>
    <button type="submit" id="b">Send reset code</button>
  </form>
  <div class="msg" id="m"></div>
  <div class="foot"><a href="/login">&larr; Back to sign in</a></div>
</div>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f'), e = document.getElementById('e'),
      b = document.getElementById('b'), m = document.getElementById('m');
  function show(k, html) { m.className = 'msg ' + k; m.innerHTML = html; }
  // The API's refusal body is {"code":422,"error":true,"message":"…"} — `error` is a FLAG, not
  // copy. `d.error || d.message` therefore short-circuited on `true` and the box rendered the
  // literal string "true" for every refusal (a malformed address, a 429). Prefer `message`, then
  // a string `error`, then the status.
  function msgOf(d, status, fb) {
    if (d) {
      if (typeof d.message === 'string' && d.message) return d.message;
      if (typeof d.error === 'string' && d.error) return d.error;
    }
    if (status === 429) return 'Too many reset requests. Please wait a few minutes and try again.';
    return status ? fb + ' (HTTP ' + status + ')' : fb;
  }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = e.value.trim();
    if (!email) { show('err', 'Enter your email address'); return; }
    b.disabled = true; b.textContent = 'Sending...';
    fetch('/api/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = {}; try { d = JSON.parse(t) || {}; } catch (err) { d = {}; }
        return { ok: r.ok, status: r.status, d: d };
      });
    }).then(function (x) {
      if (!x.ok) throw new Error(msgOf(x.d, x.status, 'Request failed'));
      show('ok', msgOf(x.d, 0, 'If that email is registered, a reset code has been sent.') +
        ' Open the <a href="/auth/reset-password">reset page</a> and enter the code from the email.');
      b.disabled = false; b.textContent = 'Send reset code';
    }).catch(function (err) {
      show('err', err.message); b.disabled = false; b.textContent = 'Send reset code';
    });
  });
})();
</script>
</body>
</html>
