<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirm your new sign-in email — CoreSwift CRM</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e1e4ed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1d27;border:1px solid #2d3248;border-radius:12px;padding:28px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:21px;font-weight:700;text-align:center}
.sub{color:#8b8fa3;font-size:13px;text-align:center;margin:6px 0 18px;line-height:1.5}
.msg{display:none;padding:11px 13px;border-radius:8px;font-size:13.5px;line-height:1.5}
.msg.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.msg.ok{display:block;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#6ee7b7}
.msg.info{display:block;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.35);color:#bae6fd}
.foot{text-align:center;font-size:12px;color:#8b8fa3;margin-top:18px}
a{color:#38bdf8}
a.btn{display:inline-block;margin-top:4px;background:#38bdf8;color:#0b1220;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Confirm your new sign-in email</h1>
  <p class="sub" id="lede">Checking your confirmation link&hellip;</p>
  <div class="msg" id="m" role="status" aria-live="polite"></div>
  <div class="foot" id="lk"><a href="/login">&larr; Back to sign in</a></div>
</div>
<script>
/* kanban t_bd31809e — the SECOND arm of the sign-in-address change.
   This page is opened from a mailbox, so it carries no session: the token in the URL IS the
   credential. It posts that token once, anonymously, to /api/auth/email-change/confirm, and the
   server moves users.email for the row that token names. The link works once — a second open (or a
   reload) answers "invalid or has expired", which is what stops a forwarded mail from being reused.
   The vhost answers this path with its own exact-location rule (location = /confirm-email-change)
   AND exempts it from the credential-arg redirect (map cs_cred_redirect); without either the mailed
   link either fell through to the SPA shell or arrived with the code stripped. */
(function () {
  'use strict';
  var m = document.getElementById('m'), lede = document.getElementById('lede'),
      lk = document.getElementById('lk');
  function show(k, text) { m.className = 'msg ' + k; m.textContent = text; }
  // The API's refusal body is {"code":400,"error":true,"message":"…"} — `error` is a FLAG, so prefer
  // `message` and only then a STRING error (a boolean `error` rendered as the literal "true").
  function msgOf(d, status, fb) {
    if (d) {
      if (typeof d.message === 'string' && d.message) return d.message;
      if (typeof d.error === 'string' && d.error) return d.error;
    }
    return status ? fb + ' (HTTP ' + status + ')' : fb;
  }
  var token = '';
  try { token = (new URLSearchParams(window.location.search).get('token') || '').trim(); } catch (e) {}
  // Take the code out of the address bar BEFORE any request of ours can carry it in a Referer, and so
  // a refresh or a bookmark cannot keep it. The value lives in `token` for the one POST below.
  try { if (token) window.history.replaceState({}, '', window.location.pathname); } catch (e) {}
  if (!token) {
    lede.textContent = 'This link is incomplete.';
    show('err', 'The confirmation code is missing from the link. Open the link from your email again, or ask for a new one from Profile in your workspace.');
    return;
  }
  fetch('/api/auth/email-change/confirm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  }).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (e) {}
      return { ok: r.ok, status: r.status, d: d };
    });
  }).then(function (x) {
    if (!x.ok) throw new Error(msgOf(x.d, x.status, 'That confirmation link did not work'));
    lede.textContent = 'Done.';
    show('ok', msgOf(x.d, 0, 'Your sign-in address has been changed.') + ' Use the new address the next time you sign in.');
    lk.innerHTML = '<a class="btn" href="/login">Go to sign in</a>';
  }).catch(function (err) {
    lede.textContent = 'That link did not work.';
    show('err', (err && err.message) || 'That confirmation link is invalid or has expired.');
  });
})();
</script>
</body>
</html>
