<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — CoreSwift CRM</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e1e4ed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1d27;border:1px solid #2d3248;border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:22px;font-weight:700;text-align:center}
.sub{color:#8b8fa3;font-size:13px;text-align:center;margin:6px 0 20px}
.tabs{display:flex;margin-bottom:20px;border-bottom:1px solid #2d3248}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer;font-size:14px;font-weight:600;color:#8b8fa3;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#38bdf8;border-bottom-color:#38bdf8}
.pane{display:none}.pane.on{display:block}
label{display:block;font-size:12px;color:#8b8fa3;margin:12px 0 5px}
input{background:#232736;border:1px solid #2d3248;color:#e1e4ed;padding:11px 13px;border-radius:8px;font-size:14px;width:100%}
input:focus{outline:none;border-color:#38bdf8}
button{width:100%;margin-top:18px;background:#38bdf8;color:#0b1220;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.msg.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.msg.ok{display:block;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#6ee7b7}
.foot{text-align:center;font-size:12px;color:#8b8fa3;margin-top:18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #0b1220;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>CoreSwift CRM</h1>
  <p class="sub">Sign in to your workspace</p>
  <div class="tabs">
    <div class="tab on" id="tabLogin">Sign in</div>
    <div class="tab" id="tabRegister">Create account</div>
  </div>

  <form class="pane on" id="paneLogin">
    <label for="liEmail">Email</label><input id="liEmail" type="email" autocomplete="email" required>
    <label for="liPass">Password</label><input id="liPass" type="password" autocomplete="current-password" required>
    <button type="submit" id="liBtn">Sign in</button>
    <p class="foot" style="margin-top:12px"><a href="/forgot-password.html" style="color:#38bdf8">Forgot password?</a> &middot; <a href="https://coreswiftcrm.com/privacy" style="color:#38bdf8">Privacy</a> &middot; <a href="https://coreswiftcrm.com/terms" style="color:#38bdf8">Terms</a></p>
  </form>

  <form class="pane" id="paneRegister">
    <div class="msg ok" id="inviteNote" style="display:none;margin:0 0 14px"></div>
    <label for="rgName">Full name</label><input id="rgName" autocomplete="name" required>
    <label for="rgEmail">Work email</label><input id="rgEmail" type="email" autocomplete="email" required>
    <button type="submit" id="rgBtn">Create free account</button>
    <p class="foot" style="margin-top:12px" id="rgFoot">Starts on the Free plan — no credit card required.</p>
  </form>

  <div class="msg" id="msg"></div>
  <div class="foot">CoreSwift CRM &copy; 2026</div>
</div>
<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'cs_token', USER_KEY = 'cs_user', ACCOUNT_KEY = 'cs_account';
  // Invite landing (?invite_token=<uuid>): the workspace already exists, so the invitee only
  // creates their own login and joins it. POST /api/auth/register requires the token.
  var INVITE = '';
  try { INVITE = new URLSearchParams(window.location.search).get('invite_token') || ''; } catch (e) { INVITE = ''; }
  var msg = document.getElementById('msg');

  function show(text, ok) {
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    msg.textContent = text;
  }
  function hide() { msg.className = 'msg'; msg.textContent = ''; }

  // Already signed in? Go straight to the app — unless this is an invite link, which has to
  // show the register pane (it may well be opened in a browser that is already signed in).
  if (!INVITE && sessionStorage.getItem(TOKEN_KEY) && sessionStorage.getItem(USER_KEY)) {
    window.location.replace('/');
    return;
  }

  document.getElementById('tabLogin').addEventListener('click', function () { swap(true); });
  document.getElementById('tabRegister').addEventListener('click', function () { swap(false); });
  function swap(isLogin) {
    hide();
    document.getElementById('tabLogin').classList.toggle('on', isLogin);
    document.getElementById('tabRegister').classList.toggle('on', !isLogin);
    document.getElementById('paneLogin').classList.toggle('on', isLogin);
    document.getElementById('paneRegister').classList.toggle('on', !isLogin);
  }

  // The marketing site's Sign-up / "Start Free" links 301 here with ?register=1 (coreswift.conf),
  // so open the create-account pane directly: the visitor who asked to sign UP must not be shown a
  // sign-in form with a "Create account" toggle they have to find. Mirrors WorkflowSwift's login.
  try { if (new URLSearchParams(window.location.search).get('register')) swap(false); } catch (e) {}

  if (INVITE) {
    // Joining an existing workspace: no workspace to name, the token decides the tenant.
    swap(false);
    document.getElementById('rgBtn').textContent = 'Join workspace';
    document.getElementById('rgFoot').textContent = 'You will be added to the workspace as soon as you sign up.';
    var note = document.getElementById('inviteNote');
    note.textContent = 'You have been invited to join a CoreSwift CRM workspace. Create your login below — you will join the existing workspace, not a new one.';
    note.style.display = 'block';
    document.title = 'Join your workspace — CoreSwift CRM';
  }

  function submit(url, body, btn, label, okText) {
    hide();
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>' + label;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (!res.ok) {
          throw new Error((data && (data.message || data.error)) || ('Request failed (HTTP ' + res.status + ')'));
        }
        if (!data || !data.access_token) { throw new Error('Login succeeded but no access token was returned.'); }
        sessionStorage.setItem(TOKEN_KEY, data.access_token);
        sessionStorage.setItem(USER_KEY, JSON.stringify(data.team_member || {}));
        sessionStorage.setItem(ACCOUNT_KEY, JSON.stringify(data.account || {}));
        // The SPA at '/' reads localStorage 'crm_token'/'crm_user'. Mirror the session into
        // those keys or signing in here bounces to '/' and the SPA shows the login form again.
        localStorage.setItem('crm_token', data.access_token);
        localStorage.setItem('crm_user', JSON.stringify(data.team_member || {}));
        show(okText, true);
        window.location.replace('/');
      });
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = label;
      show(e.message, false);
    });
  }

  // ── The mail-independent way in (kanban t_d841df4f) ────────────────────────────────────────────
  // `POST /api/auth/initial-password` takes the SIGNUP SESSION'S own token, needs no email at all,
  // and is gated in SQL on `users.password_undelivered` — so it can never overwrite a password the
  // customer already knows, and a replay is refused. Every sibling app offers the same door on this
  // arm (ADASwift, FunnelSwift, IncentiveSwift, missedcallrespondr, WorkflowSwift).
  //
  // The field is a SIBLING of the message box, never markup appended into it: a later follow-up does
  // `msg.appendChild(...)`, and rebuilding that box's contents would destroy the input and its
  // listener mid-typing. Built with the DOM API and `textContent`, so nothing typed here is ever
  // re-parsed as HTML.
  function offerInitialPassword(token, email) {
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:12px;padding:12px;border:1px solid rgba(56,189,248,.4);background:rgba(56,189,248,.08);border-radius:8px';
    var title = document.createElement('div');
    title.style.cssText = 'font-weight:700;font-size:13px;margin-bottom:6px';
    title.textContent = 'Set your password now';
    var hint = document.createElement('div');
    hint.style.cssText = 'font-size:12px;color:#8b8fa3;margin-bottom:8px';
    hint.textContent = 'You are already signed up — choose the password you will sign in with. No email needed.';
    var input = document.createElement('input');
    input.type = 'password';
    input.id = 'initPw';
    input.minLength = 8;
    input.autocomplete = 'new-password';
    input.placeholder = 'At least 8 characters';
    var save = document.createElement('button');
    save.type = 'button';
    save.textContent = 'Save password';
    var note = document.createElement('div');
    note.style.cssText = 'font-size:12px;line-height:1.5;margin-top:8px';
    box.appendChild(title);
    box.appendChild(hint);
    box.appendChild(input);
    box.appendChild(save);
    box.appendChild(note);
    msg.parentNode.insertBefore(box, msg.nextSibling);

    save.addEventListener('click', function () {
      var pw = input.value || '';
      if (pw.length < 8) {
        note.style.color = '#fca5a5';
        note.textContent = 'That is shorter than 8 characters — try again.';
        return;
      }
      if (!token) {
        note.style.color = '#fca5a5';
        note.textContent = 'Your signup session has expired. Ask for a reset code, or write to support.';
        return;
      }
      save.disabled = true;
      // A direct fetch, NOT the shared API helper: this route answers 401 when there is nothing
      // left to set, and that must render beside the field instead of being treated as a dead
      // session and bouncing the page.
      fetch('/api/auth/initial-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ password: pw })
      }).then(function (r) {
        return r.text().then(function (t) {
          var d = null;
          try { d = t ? JSON.parse(t) : null; } catch (e) { d = null; }
          if (!r.ok) {
            throw new Error((d && (d.message || d.error)) || 'Could not save that password.');
          }
          while (box.firstChild) { box.removeChild(box.firstChild); }
          var ok = document.createElement('div');
          ok.style.cssText = 'font-size:13px;color:#6ee7b7;font-weight:700';
          ok.textContent = 'Password saved. Signing you in with it…';
          box.appendChild(ok);
          document.getElementById('liEmail').value = email;
          setTimeout(function () {
            swap(true);
            document.getElementById('liPass').focus();
          }, 900);
        });
      }).catch(function (err) {
        save.disabled = false;
        note.style.color = '#fca5a5';
        note.textContent = err.message;
      });
    });
  }

  document.getElementById('paneLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    submit('/api/auth/login', {
      email: document.getElementById('liEmail').value.trim(),
      password: document.getElementById('liPass').value
    }, document.getElementById('liBtn'), 'Sign in', 'Welcome back — opening your workspace…');
  });

  document.getElementById('paneRegister').addEventListener('submit', function (e) {
    e.preventDefault();
    hide();
    // A whitespace-only "Full name" passes the HTML `required` attribute (a space is still a
    // non-empty string, so the browser submits) and trims to "" right here — and the server used
    // to store it verbatim. Measured LIVE 2026-10-16: POST /api/auth/register {"name":"   "}
    // answered 201 and minted a workspace labelled "   's Workspace" whose owner has no name.
    // Refused here with a sentence so the user never pays a round-trip for it; the BACKEND gate
    // now refuses the same input with 422 "name: is required" at the ONE account writer
    // (auth::signup::create_account, kanban t_0ab34bd3), which BOTH /api/auth/register and the
    // machine provisioning door inherit — a direct API caller gets the same answer.
    var name = document.getElementById('rgName').value.trim();
    if (!name) { show('Please enter your name.', false); return; }
    var btn = document.getElementById('rgBtn');
    var body = {
      name: name,
      email: document.getElementById('rgEmail').value.trim()
      // NO password: the server mints the login credentials and emails them (David's signup
      // model). Nothing is stored here and there is no auto-login — the user confirms their
      // address by signing in with the password we sent.
    };
    if (INVITE) {
      // resolve_account() joins the inviter's tenant when this field is present and ignores
      // account_name/account_slug, so they are deliberately omitted on the invite path.
      body.invite_token = INVITE;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>' + (INVITE ? 'Joining…' : 'Creating account…');
    fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (err) { data = null; }
        if (!res.ok) {
          throw new Error((data && (data.message || data.error)) || ('Request failed (HTTP ' + res.status + ')'));
        }
        // Did the login mail actually leave? The API answers `credentials_emailed` (kanban
        // t_d841df4f). `false` means the account exists but its generated password is in nobody's
        // inbox — a send failure, or an address the sender withholds. Promising "check your email"
        // on that arm was a lie, and the reset link below travels the SAME mail path that just
        // failed, so it was a dead end. Offer the mail-independent door instead: the token this
        // response already carries is all `POST /api/auth/initial-password` needs.
        var mailed = !(data && data.credentials_emailed === false);
        if (!mailed) {
          show(INVITE
            ? 'You have joined the workspace — but we could not send your login details to ' + body.email + '.'
            : 'Account created — but we could not send your login details to ' + body.email + '.',
            false);
          offerInitialPassword(data && data.access_token, body.email);
          btn.disabled = false;
          btn.textContent = 'Set your password below';
          return;
        }
        // The account exists and the credentials were emailed. Show the two-step confirmation and
        // stop — no session is stored, so the user must sign in with the password we sent.
        show(INVITE
          ? 'You have joined the workspace. Check your email — we sent your login details to ' + body.email + '.'
          : 'Account created! Check your email — we sent your login details to ' + body.email +
            '. You can change your password any time in your profile settings.', true);
        // A customer whose credentials mail never arrived has a way back in (cron 2026-10-19):
        // the address they just typed is carried into the reset-request page, so nothing is retyped.
        (function () {
          var d = document.createElement('div');
          d.style.cssText = 'margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);font-size:13px';
          d.appendChild(document.createTextNode('Nothing in your inbox after a minute? Check your spam folder, then '));
          var a = document.createElement('a');
          a.href = '/forgot-password.html?email=' + encodeURIComponent(body.email);
          a.style.fontWeight = '600';
          a.textContent = 'send yourself a reset code';
          d.appendChild(a);
          d.appendChild(document.createTextNode('.'));
          msg.appendChild(d);
        })();
        btn.disabled = false;
        btn.textContent = INVITE ? 'Join workspace' : 'Check your email';
      });
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = INVITE ? 'Join workspace' : 'Create free account';
      show(err.message, false);
    });
  });
})();
</script>
</body>
</html>
