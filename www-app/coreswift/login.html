<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — CoreSwift CRM</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e1e4ed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1d27;border:1px solid #2d3248;border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:22px;font-weight:700;text-align:center}
.sub{color:#8b8fa3;font-size:13px;text-align:center;margin:6px 0 20px}
.tabs{display:flex;margin-bottom:20px;border-bottom:1px solid #2d3248}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer;font-size:14px;font-weight:600;color:#8b8fa3;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#38bdf8;border-bottom-color:#38bdf8}
.pane{display:none}.pane.on{display:block}
label{display:block;font-size:12px;color:#8b8fa3;margin:12px 0 5px}
input{background:#232736;border:1px solid #2d3248;color:#e1e4ed;padding:11px 13px;border-radius:8px;font-size:14px;width:100%}
input:focus{outline:none;border-color:#38bdf8}
button{width:100%;margin-top:18px;background:#38bdf8;color:#0b1220;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.msg.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.msg.ok{display:block;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#6ee7b7}
.foot{text-align:center;font-size:12px;color:#8b8fa3;margin-top:18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #0b1220;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>CoreSwift CRM</h1>
  <p class="sub">Sign in to your workspace</p>
  <div class="tabs">
    <div class="tab on" id="tabLogin">Sign in</div>
    <div class="tab" id="tabRegister">Create account</div>
  </div>

  <form class="pane on" id="paneLogin">
    <label for="liEmail">Email</label><input id="liEmail" type="email" autocomplete="email" required>
    <label for="liPass">Password</label><input id="liPass" type="password" autocomplete="current-password" required>
    <button type="submit" id="liBtn">Sign in</button>
  </form>

  <form class="pane" id="paneRegister">
    <div class="msg ok" id="inviteNote" style="display:none;margin:0 0 14px"></div>
    <label for="rgName">Full name</label><input id="rgName" autocomplete="name" required>
    <label for="rgEmail">Work email</label><input id="rgEmail" type="email" autocomplete="email" required>
    <button type="submit" id="rgBtn">Create free account</button>
    <p class="foot" style="margin-top:12px" id="rgFoot">Starts on the Free plan — no credit card required.</p>
  </form>

  <div class="msg" id="msg"></div>
  <div class="foot">CoreSwift CRM &copy; 2026</div>
</div>
<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'cs_token', USER_KEY = 'cs_user', ACCOUNT_KEY = 'cs_account';
  // Invite landing (?invite_token=<uuid>): the workspace already exists, so the invitee only
  // creates their own login and joins it. POST /api/auth/register requires the token.
  var INVITE = '';
  try { INVITE = new URLSearchParams(window.location.search).get('invite_token') || ''; } catch (e) { INVITE = ''; }
  var msg = document.getElementById('msg');

  function show(text, ok) {
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    msg.textContent = text;
  }
  function hide() { msg.className = 'msg'; msg.textContent = ''; }

  // Already signed in? Go straight to the app — unless this is an invite link, which has to
  // show the register pane (it may well be opened in a browser that is already signed in).
  if (!INVITE && sessionStorage.getItem(TOKEN_KEY) && sessionStorage.getItem(USER_KEY)) {
    window.location.replace('/');
    return;
  }

  document.getElementById('tabLogin').addEventListener('click', function () { swap(true); });
  document.getElementById('tabRegister').addEventListener('click', function () { swap(false); });
  function swap(isLogin) {
    hide();
    document.getElementById('tabLogin').classList.toggle('on', isLogin);
    document.getElementById('tabRegister').classList.toggle('on', !isLogin);
    document.getElementById('paneLogin').classList.toggle('on', isLogin);
    document.getElementById('paneRegister').classList.toggle('on', !isLogin);
  }

  if (INVITE) {
    // Joining an existing workspace: no workspace to name, the token decides the tenant.
    swap(false);
    document.getElementById('rgBtn').textContent = 'Join workspace';
    document.getElementById('rgFoot').textContent = 'You will be added to the workspace as soon as you sign up.';
    var note = document.getElementById('inviteNote');
    note.textContent = 'You have been invited to join a CoreSwift CRM workspace. Create your login below — you will join the existing workspace, not a new one.';
    note.style.display = 'block';
    document.title = 'Join your workspace — CoreSwift CRM';
  }

  function submit(url, body, btn, label, okText) {
    hide();
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>' + label;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (!res.ok) {
          throw new Error((data && (data.message || data.error)) || ('Request failed (HTTP ' + res.status + ')'));
        }
        if (!data || !data.access_token) { throw new Error('Login succeeded but no access token was returned.'); }
        sessionStorage.setItem(TOKEN_KEY, data.access_token);
        sessionStorage.setItem(USER_KEY, JSON.stringify(data.team_member || {}));
        sessionStorage.setItem(ACCOUNT_KEY, JSON.stringify(data.account || {}));
        // The SPA at '/' reads localStorage 'crm_token'/'crm_user'. Mirror the session into
        // those keys or signing in here bounces to '/' and the SPA shows the login form again.
        localStorage.setItem('crm_token', data.access_token);
        localStorage.setItem('crm_user', JSON.stringify(data.team_member || {}));
        show(okText, true);
        window.location.replace('/');
      });
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = label;
      show(e.message, false);
    });
  }

  document.getElementById('paneLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    submit('/api/auth/login', {
      email: document.getElementById('liEmail').value.trim(),
      password: document.getElementById('liPass').value
    }, document.getElementById('liBtn'), 'Sign in', 'Welcome back — opening your workspace…');
  });

  document.getElementById('paneRegister').addEventListener('submit', function (e) {
    e.preventDefault();
    hide();
    var btn = document.getElementById('rgBtn');
    var body = {
      name: document.getElementById('rgName').value.trim(),
      email: document.getElementById('rgEmail').value.trim()
      // NO password: the server mints the login credentials and emails them (David's signup
      // model). Nothing is stored here and there is no auto-login — the user confirms their
      // address by signing in with the password we sent.
    };
    if (INVITE) {
      // resolve_account() joins the inviter's tenant when this field is present and ignores
      // account_name/account_slug, so they are deliberately omitted on the invite path.
      body.invite_token = INVITE;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>' + (INVITE ? 'Joining…' : 'Creating account…');
    fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (err) { data = null; }
        if (!res.ok) {
          throw new Error((data && (data.message || data.error)) || ('Request failed (HTTP ' + res.status + ')'));
        }
        // The account exists and the credentials were emailed. Show the two-step confirmation and
        // stop — no session is stored, so the user must sign in with the password we sent.
        show(INVITE
          ? 'You have joined the workspace. Check your email — we sent your login details to ' + body.email + '.'
          : 'Account created! Check your email — we sent your login details to ' + body.email +
            '. You can change your password any time in your profile settings.', true);
        btn.disabled = false;
        btn.textContent = INVITE ? 'Join workspace' : 'Check your email';
      });
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = INVITE ? 'Join workspace' : 'Create free account';
      show(err.message, false);
    });
  });
})();
</script>
</body>
</html>
