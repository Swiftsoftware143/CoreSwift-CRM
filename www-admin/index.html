<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreSwift CRM Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f1117;--bg-secondary:#1a1d27;--bg-card:#222532;
  --bg-hover:#2a2d3a;--bg-active:#2d3152;
  --text-primary:#e8eaed;--text-secondary:#9aa0a6;--text-muted:#6b7280;
  --accent:#6366f1;--accent-hover:#818cf8;--accent-subtle:rgba(99,102,241,.12);
  --success:#22c55e;--warning:#f59e0b;--error:#ef4444;
  --border:#2d3148;--border-light:#383c52;
  --radius-sm:4px;--radius:8px;--radius-lg:12px;
  --sidebar-w:260px;--sidebar-collapsed:60px;--header-h:56px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);display:flex;min-height:100vh;overflow:hidden;line-height:1.5}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ===== LOGIN ===== */
.login-wrap{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;background:var(--bg-primary)}
.login-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:420px;max-width:90vw;box-shadow:var(--shadow-lg)}
.login-card .logo{font-size:2rem;margin-bottom:8px;text-align:center}
.login-card h1{font-size:1.4rem;margin-bottom:4px;text-align:center}
.login-card .sub{color:var(--text-secondary);margin-bottom:28px;text-align:center;font-size:.9rem}
.login-error{background:rgba(239,68,68,.12);color:var(--error);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:.85rem;display:none}

/* ===== FORMS ===== */
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:.82rem;color:var(--text-secondary);font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.88rem;outline:none;transition:border-color .2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-hint{font-size:.78rem;color:var(--text-muted);margin-top:4px}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:.88rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-secondary{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg-hover)}
.btn-danger{background:var(--error);color:#fff}.btn-danger:hover{opacity:.9}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid transparent}.btn-ghost:hover{color:var(--text-primary);background:var(--bg-hover)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-xs{padding:3px 8px;font-size:.75rem;border-radius:3px}
.btn-block{width:100%;justify-content:center}
.btn-icon{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center}.btn-icon:hover{color:var(--text-primary);background:var(--bg-hover)}

/* ===== LAYOUT ===== */
.sidebar{width:var(--sidebar-w);background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:100;transition:width .2s ease;overflow:hidden;flex-shrink:0}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar.collapsed .nav-text,.sidebar.collapsed .nav-arrow,.sidebar.collapsed .sidebar-brand-text,.sidebar.collapsed .nav-group-label{opacity:0;pointer-events:none;transition:opacity .1s}
.sidebar.collapsed .nav-item{padding:10px 0;justify-content:center}
.sidebar.collapsed .nav-icon{margin-right:0;font-size:1.2rem}
.main-wrap{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;transition:margin-left .2s ease}
.main-wrap.expanded{margin-left:var(--sidebar-collapsed)}

/* ===== HEADER ===== */
.header{height:var(--header-h);background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.header-title{font-size:1.1rem;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.user-btn{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);cursor:pointer;font-size:.85rem;transition:all .2s}
.user-btn:hover{background:var(--bg-hover)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;color:#fff;flex-shrink:0}
.dropdown{position:relative}
.dropdown-menu{position:absolute;top:100%;right:0;margin-top:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);min-width:200px;box-shadow:var(--shadow-lg);z-index:200;display:none;overflow:hidden}
.dropdown-menu.show{display:block}
.dropdown-item{padding:10px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.85rem;color:var(--text-primary);transition:background .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.dropdown-item:hover{background:var(--bg-hover)}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}

/* ===== SIDEBAR NAV ===== */
.sidebar-header{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;height:var(--header-h)}
.sidebar-brand{font-size:1rem;font-weight:700;white-space:nowrap}
.sidebar-logo{font-size:1.4rem}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{padding:4px 0}
.nav-divider{padding:8px 20px;font-size:.7rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--text-secondary);font-size:.88rem;transition:all .15s;border-left:3px solid transparent;white-space:nowrap}
.nav-item:hover{color:var(--text-primary);background:var(--bg-hover)}
.nav-item.active{color:#fff;background:var(--accent-subtle);border-left-color:var(--accent)}
.nav-item .nav-icon{width:20px;text-align:center;flex-shrink:0;font-size:1rem}
.nav-item .nav-text{flex:1}
.nav-item .nav-arrow{font-size:.7rem;transition:transform .2s;color:var(--text-muted)}
.nav-item.group-expanded .nav-arrow{transform:rotate(90deg)}
.nav-group-items{overflow:hidden;max-height:0;transition:max-height .3s ease}
.nav-group-items.expanded{max-height:600px}
.nav-group-items .nav-item{padding-left:44px;font-size:.84rem}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0}
.collapse-btn{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-muted);font-size:.82rem;background:none;border:none;width:100%;padding:6px 0;font-family:inherit}
.collapse-btn:hover{color:var(--text-primary)}
.admin-section{display:none}
.admin-section.visible{display:block}

/* ===== MAIN CONTENT ===== */
.content{flex:1;overflow-y:auto;padding:0}
.content-inner{padding:24px;max-width:1400px}
.page-header{margin-bottom:24px}
.page-header h2{font-size:1.5rem;font-weight:600;margin-bottom:4px}
.page-header p{color:var(--text-secondary);font-size:.9rem}
.page-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===== BANNER ===== */
.upgrade-banner{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.1));border:1px solid var(--accent);border-radius:var(--radius);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.upgrade-banner p{font-size:.9rem;color:var(--text-primary);margin:0}
.upgrade-banner .plan-name{color:var(--accent-hover);font-weight:600}
.upgrade-banner .banner-actions{display:flex;gap:8px;flex-shrink:0}
.upgrade-banner.dismissed{display:none}

/* ===== CARDS ===== */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.9rem}
.card-body{padding:20px}
.card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px}

/* ===== STATS GRID ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:default}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .stat-icon{font-size:1.5rem;margin-bottom:8px}
.stat-card .stat-value{font-size:1.8rem;font-weight:700;margin-bottom:2px}
.stat-card .stat-label{font-size:.82rem;color:var(--text-secondary)}
.stat-card.accent{border-left:3px solid var(--accent)}

/* ===== TABLE ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 14px;font-size:.88rem;border-bottom:1px solid var(--border);color:var(--text-primary)}
tr:hover td{background:var(--bg-hover)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px}
.empty-state h3{font-size:1.1rem;margin-bottom:6px;color:var(--text-secondary)}
.empty-state p{font-size:.88rem;max-width:400px;margin:0 auto 16px}

/* ===== BADGES ===== */
.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:500}
.badge-primary{background:var(--accent-subtle);color:var(--accent-hover)}
.badge-success{background:rgba(34,197,94,.12);color:var(--success)}
.badge-warning{background:rgba(245,158,11,.12);color:var(--warning)}
.badge-error{background:rgba(239,68,68,.12);color:var(--error)}
.badge-muted{background:var(--bg-secondary);color:var(--text-muted)}

/* ===== TOASTS ===== */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:var(--radius);font-size:.88rem;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;display:flex;align-items:center;gap:10px;min-width:300px;max-width:450px}
.toast-success{background:#065f46;color:#d1fae5;border:1px solid #059669}
.toast-error{background:#7f1d1d;color:#fecaca;border:1px solid #dc2626}
.toast-info{background:#1e3a5f;color:#dbeafe;border:1px solid #3b82f6}
.toast-warning{background:#78350f;color:#fef3c7;border:1px solid #f59e0b}
.toast-close{margin-left:auto;cursor:pointer;opacity:.7;background:none;border:none;color:inherit;font-size:1rem}
.toast-close:hover{opacity:1}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:520px;max-width:90vw;max-height:85vh;overflow-y:auto;animation:modalIn .2s ease}
.modal-lg{width:700px}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg-card);z-index:1}
.modal-header h3{font-size:1.1rem;font-weight:600}
.modal-body{padding:24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--bg-card)}
@keyframes modalIn{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

/* ===== GRID ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ===== PROVIDER CARDS ===== */
.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.provider-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s}
.provider-card:hover{border-color:var(--accent)}
.provider-card.connected{border-color:var(--success)}
.provider-card .provider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.provider-card .provider-name{font-weight:600;font-size:.95rem}
.provider-card .provider-status{font-size:.78rem}
.provider-card .provider-desc{font-size:.82rem;color:var(--text-secondary);margin-bottom:14px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.connected{background:var(--success)}
.status-dot.disconnected{background:var(--text-muted)}

/* ===== CHAT ===== */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 180px);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.chat-msg{padding:10px 14px;border-radius:var(--radius);max-width:80%;font-size:.88rem;line-height:1.5}
.chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.chat-msg.assistant{align-self:flex-start;background:var(--bg-secondary);border:1px solid var(--border)}
.chat-input-area{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border)}
.chat-input-area input{flex:1;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.88rem;outline:none}
.chat-input-area input:focus{border-color:var(--accent)}
.chat-msg .msg-role{font-size:.72rem;color:var(--text-muted);margin-bottom:4px}

/* ===== SEARCH BAR ===== */
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.88rem;outline:none}
.search-bar input:focus{border-color:var(--accent)}

/* ===== TOGGLE ===== */
.toggle{position:relative;display:inline-block;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.2s}
.toggle-slider:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:var(--text-primary);border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px)}

/* ===== CONFIG LIST ===== */
.config-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden}
.config-item{background:var(--bg-card);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.config-item .config-info{flex:1}
.config-item .config-label{font-weight:500;font-size:.9rem}
.config-item .config-desc{font-size:.8rem;color:var(--text-secondary);margin-top:2px}

/* ===== PLANS ===== */
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.plan-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;transition:all .2s;position:relative}
.plan-card:hover{border-color:var(--accent)}
.plan-card.current{border-color:var(--accent);background:var(--accent-subtle)}
.plan-card .plan-badge{position:absolute;top:12px;right:12px}
.plan-card .plan-name{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.plan-card .plan-price{font-size:2rem;font-weight:700;margin:12px 0}
.plan-card .plan-price span{font-size:.9rem;color:var(--text-secondary);font-weight:400}
.plan-card .plan-features{list-style:none;padding:0;margin:16px 0;text-align:left}
.plan-card .plan-features li{padding:6px 0;font-size:.85rem;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.plan-card .plan-features li.check{color:var(--text-primary)}

/* ===== PLACEHOLDER ===== */
.placeholder-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.placeholder-panel .placeholder-icon{font-size:3.5rem;margin-bottom:16px}
.placeholder-panel h3{font-size:1.2rem;margin-bottom:8px}
.placeholder-panel p{color:var(--text-secondary);font-size:.9rem;max-width:450px;margin:0 auto 20px}

/* ===== LOADING ===== */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--text-secondary)}

.hidden{display:none!important}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/favicon.svg"></head>
<body>


<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo">🏢</div>
    <h1>CoreSwift CRM</h1>
    <p class="sub">Admin Dashboard</p>
    <div id="loginError" class="login-error"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com" value="">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Sign In</button>
  </div>
</div>


<div id="appWrap" class="hidden" style="display:none">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">🏢</span>
      <span class="sidebar-brand sidebar-brand-text">CoreSwift CRM</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
    </nav>
    <div class="sidebar-footer">
      <button class="collapse-btn" onclick="toggleSidebar()">
        <span id="collapseIcon">◀</span>
        <span class="nav-text">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-wrap" id="mainWrap">
    <header class="header">
      <div class="header-left">
        <span class="header-title" id="pageTitle">Dashboard</span>
      </div>
      <div class="header-right">
        <div class="dropdown">
          <button class="user-btn" onclick="toggleUserMenu()">
            <div class="avatar" id="userAvatar">S</div>
            <span id="userEmail">admin</span>
            <span style="font-size:.7rem">▾</span>
          </button>
          <div class="dropdown-menu" id="userMenu">
            <button class="dropdown-item" onclick="switchTab('profile')">👤 Profile</button>
            <button class="dropdown-item" onclick="switchTab('billing')">💳 Plans &amp; Billing</button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" onclick="logout()" style="color:var(--error)">🚪 Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="content" id="mainContent">
      <div class="content-inner">
        <div id="upgradeBanner" class="upgrade-banner dismissed">
          <p>You're on the <span class="plan-name" id="currentPlanName">Free</span> plan. <span>Upgrade for more features.</span></p>
          <div class="banner-actions">
            <button class="btn btn-primary btn-sm" onclick="openUpgradeModal()">Upgrade Now</button>
            <button class="btn btn-ghost btn-sm" onclick="dismissBanner()">Dismiss</button>
          </div>
        </div>
        <div id="tabPanels"></div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL CONTAINER -->
<div id="modalContainer"></div>

<script>



const STATE = {
  token: null,
  user: null,
  activeTab: 'dashboard',
  sidebarCollapsed: false,
  planName: 'Free',
  providers: {},
  integrations: {}
};

const API = {
  async call(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (STATE.token) headers['Authorization'] = `Bearer ${STATE.token}`;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api' + path, opts);
    if (res.status === 401) { logout(true); throw new Error('Session expired'); }
    if (res.status === 402) { showUpgradeBanner(); throw new Error('Payment required'); }
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const e = await res.json(); msg = e.error || e.message || msg; } catch(_){}
      throw new Error(msg);
    }
    return res.status === 204 ? null : res.json();
  },
  get(path) { return this.call('GET', path); },
  post(path, body) { return this.call('POST', path, body); },
  put(path, body) { return this.call('PUT', path, body); },
  patch(path, body) { return this.call('PATCH', path, body); },
  del(path) { return this.call('DELETE', path); }
};

// ── Modules & Plans: the data-driven module/feature registry ─────────────────
// Every tool is a MODULE and everything it can do is a FEATURE of it — both are ROWS in the
// database now, so there is no hardcoded module list anywhere in this file. The panel renders
// straight from GET /api/admin/modules and writes back through
// POST /api/admin/plans/:slug/modules and POST /api/admin/plans/:slug/features.
let MR_DATA = null;
const MR_CELL = 'text-align:center;padding:7px 8px;border-bottom:1px solid var(--border,#2a2a2a)';

async function loadFeatureMatrix() {
  const wrap = document.getElementById('fpWrap');
  if (!wrap) return;
  try {
    MR_DATA = await API.get('/admin/modules');
    renderModuleMatrix();
  } catch (e) {
    wrap.innerHTML = '<div style="padding:20px;color:var(--danger,#f66)">Could not load the module registry: ' +
      escapeHtml(e.message) + '</div>';
  }
}

function renderModuleMatrix() {
  const wrap = document.getElementById('fpWrap');
  if (!wrap || !MR_DATA) return;
  const plans = MR_DATA.plans || [], mods = MR_DATA.modules || [];
  if (!plans.length || !mods.length) {
    wrap.innerHTML = '<div style="padding:20px;color:var(--text-muted)">The registry returned no plans or no modules.</div>';
    return;
  }
  let h = '<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;min-width:900px">' +
    '<thead><tr><th style="text-align:left;padding:8px;border-bottom:2px solid var(--border,#333)">Module / feature</th>';
  plans.forEach(p => {
    h += '<th style="text-align:center;padding:8px;border-bottom:2px solid var(--border,#333)">' +
      escapeHtml(p.name || p.slug) + '</th>';
  });
  h += '</tr></thead><tbody>';
  mods.forEach(m => {
    const ma = m.assignments || {};
    h += '<tr style="background:rgba(255,255,255,0.035)">' +
      '<td style="padding:8px;border-bottom:1px solid var(--border,#2a2a2a)">' +
      '<strong>' + escapeHtml((m.icon ? m.icon + ' ' : '') + m.name) + '</strong>' +
      (m.is_active ? '' : ' <span style="font-size:11px;color:var(--text-muted)">(inactive)</span>') +
      '<br><span style="color:var(--text-muted);font-size:11px">module &middot; ' + escapeHtml(m.key) + '</span></td>';
    plans.forEach(p => {
      const on = !!(ma[p.slug] && ma[p.slug].enabled);
      h += '<td style="' + MR_CELL + 'background:rgba(255,255,255,0.035)">' +
        '<input type="checkbox" style="width:18px;height:18px;cursor:pointer"' + (on ? ' checked' : '') +
        ' onchange="saveModule(this)" data-slug="' + escapeHtml(p.slug) + '" data-key="' + escapeHtml(m.key) + '"></td>';
    });
    h += '</tr>';
    (m.features || []).forEach(f => {
      const fa = f.assignments || {};
      h += '<tr><td style="padding:6px 8px 6px 28px;border-bottom:1px solid var(--border,#222)">' +
        '<span style="color:var(--text-secondary)">' + escapeHtml(f.name) + '</span><br>' +
        '<span style="color:var(--text-muted);font-size:11px">' + escapeHtml(f.key) + ' &middot; ' +
        escapeHtml(f.kind) + (f.unit ? ' (' + escapeHtml(f.unit) + ')' : '') + '</span></td>';
      plans.forEach(p => {
        const a = fa[p.slug] || {};
        h += '<td style="' + MR_CELL + '">';
        if (f.kind === 'limit') {
          h += '<input type="number" step="any" placeholder="—" value="' +
            (a.limit_value === null || a.limit_value === undefined ? '' : escapeHtmlAttr(String(a.limit_value))) + '"' +
            ' style="width:92px;padding:4px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-primary)"' +
            ' onchange="saveFeature(this, true)" data-slug="' + escapeHtml(p.slug) + '" data-key="' + escapeHtml(f.key) + '">';
        } else {
          h += '<input type="checkbox" style="width:18px;height:18px;cursor:pointer"' + (a.enabled ? ' checked' : '') +
            ' onchange="saveFeature(this, false)" data-slug="' + escapeHtml(p.slug) + '" data-key="' + escapeHtml(f.key) + '">';
        }
        h += '</td>';
      });
      h += '</tr>';
    });
  });
  h += '</tbody></table></div>' +
    '<p style="color:var(--text-secondary);margin-top:12px;max-width:900px">Tick a <strong>module</strong> to grant the whole tool to a plan, ' +
    'then fine-tune its individual <strong>features</strong> underneath. A feature of kind <em>limit</em> takes a number (leave it empty to switch the limit off). ' +
    'Changes save immediately and are enforced on the next request; a key no plan has been assigned denies by default.</p>' +
    tenantOverrideCard();
  wrap.innerHTML = h;
}

async function loadTenantEntitlements() {
  const el = document.getElementById('toTenant'), out = document.getElementById('toResult');
  if (!el || !out) return;
  const id = (el.value || '').trim();
  if (!id) { out.innerHTML = '<p style="color:var(--warning,#fa0)">Enter a tenant id first.</p>'; return; }
  out.innerHTML = '<div style="color:var(--text-muted)">Loading…</div>';
  try {
    const d = await API.get('/admin/tenants/' + encodeURIComponent(id) + '/entitlements');
    const ents = d.entitlements || [];
    let t = '<div style="color:var(--text-secondary);margin-bottom:8px">Plan: <strong>' +
      escapeHtml((d.plan && (d.plan.name || d.plan.slug)) || 'none assigned') + '</strong> &middot; denied: ' +
      escapeHtml((d.denied || []).join(', ') || 'none') + '</div>' +
      '<div style="overflow:auto;max-height:420px"><table style="width:100%;border-collapse:collapse">' +
      '<thead><tr><th style="text-align:left;padding:6px 10px;border-bottom:1px solid var(--border,#333)">Key</th>' +
      '<th style="text-align:left;padding:6px 10px;border-bottom:1px solid var(--border,#333)">Effective</th>' +
      '<th style="text-align:left;padding:6px 10px;border-bottom:1px solid var(--border,#333)">Limit</th>' +
      '<th style="text-align:left;padding:6px 10px;border-bottom:1px solid var(--border,#333)">Why</th>' +
      '<th style="text-align:left;padding:6px 10px;border-bottom:1px solid var(--border,#333)">Override</th></tr></thead><tbody>';
    ents.forEach(e => {
      t += '<tr><td style="padding:6px 10px">' + escapeHtml(e.key) + '</td>' +
        '<td style="padding:6px 10px">' + (e.enabled
          ? '<span style="color:var(--success,#4c4)">granted</span>'
          : '<span style="color:var(--danger,#f66)">denied</span>') + '</td>' +
        '<td style="padding:6px 10px;color:var(--text-muted)">' +
          escapeHtml(e.limit_value === null || e.limit_value === undefined ? '—' : String(e.limit_value)) + '</td>' +
        '<td style="padding:6px 10px;color:var(--text-muted)">' + escapeHtml(e.source) + '</td>' +
        '<td style="padding:6px 10px"><input type="checkbox" style="width:16px;height:16px;cursor:pointer"' +
          (e.enabled ? ' checked' : '') + ' onchange="saveOverride(this)" data-tenant="' + escapeHtml(id) +
          '" data-key="' + escapeHtml(e.key) + '">' +
          (e.source === 'tenant_override' ? ' <span style="font-size:11px;color:var(--accent,#6af)">override</span>' : '') +
        '</td></tr>';
    });
    out.innerHTML = t + '</tbody></table></div>';
  } catch (e) {
    out.innerHTML = '<p style="color:var(--danger,#f66)">Could not load entitlements: ' + escapeHtml(e.message) + '</p>';
  }
}

async function saveModule(el) {
  const slug = el.dataset.slug, key = el.dataset.key, on = el.checked;
  el.disabled = true;
  try {
    await API.post('/admin/plans/' + encodeURIComponent(slug) + '/modules', { module_key: key, enabled: on });
    if (MR_DATA) {
      const m = (MR_DATA.modules || []).find(x => x.key === key);
      if (m) { m.assignments = m.assignments || {}; m.assignments[slug] = { enabled: on }; }
    }
    toast(key + ' module turned ' + (on ? 'ON' : 'OFF') + ' for ' + slug, 'success');
  } catch (e) {
    el.checked = !on;
    toast('Save failed: ' + e.message, 'error');
  } finally {
    el.disabled = false;
  }
}

async function saveFeature(el, isLimit) {
  const slug = el.dataset.slug, key = el.dataset.key;
  let body;
  if (isLimit) {
    const raw = (el.value || '').trim();
    body = { feature_key: key, enabled: raw !== '', limit_value: raw === '' ? null : Number(raw) };
  } else {
    body = { feature_key: key, enabled: el.checked };
  }
  el.disabled = true;
  try {
    await API.post('/admin/plans/' + encodeURIComponent(slug) + '/features', body);
    toast(key + ' saved for ' + slug, 'success');
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
  } finally {
    el.disabled = false;
  }
}

async function saveOverride(el) {
  const tenant = el.dataset.tenant, key = el.dataset.key, on = el.checked;
  el.disabled = true;
  try {
    await API.post('/admin/tenants/' + encodeURIComponent(tenant) + '/overrides', { feature_key: key, enabled: on });
    toast(key + ' override set to ' + (on ? 'granted' : 'denied'), 'success');
    loadTenantEntitlements();
  } catch (e) {
    el.checked = !on;
    toast('Override failed: ' + e.message, 'error');
  } finally {
    el.disabled = false;
  }
}

// Toast
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const icons = { success:'✓', error:'✕', info:'ℹ', warning:'⚠' };
  const t = document.createElement('div');
  t.className = 'toast toast-'+type;
  t.innerHTML = `<span>${icons[type]||''}</span><span>${escapeHtml(msg)}</span><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(t);
  setTimeout(() => { if(t.parentElement) t.remove(); }, 5000);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Auth
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; errEl.style.display='block'; return; }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    if (!res.ok) {
      let msg = 'Invalid credentials';
      try { const e = await res.json(); msg = e.error || e.message || msg; } catch(_){}
      throw new Error(msg);
    }
    const data = await res.json();
    STATE.token = data.access_token || data.token;
    // The API returns `team_member` and NEVER `user`, so `data.user || {...role:'agency_admin'}`
    // always fell through and stamped EVERY login as a platform admin — which silently
    // defeated the role-filtered nav (every tenant rendered the platform menu).
    // Read the real role; a missing role must never default to a platform one.
    const acct = data.team_member || data.user || {};
    STATE.user = Object.assign({ email: email, name: email.split('@')[0] }, acct);
    if (!STATE.user.role) STATE.user.role = 'member';
    localStorage.setItem('crm_token', STATE.token);
    localStorage.setItem('crm_user', JSON.stringify(STATE.user));
    showApp();
    toast('Welcome back, ' + (STATE.user.name || STATE.user.email), 'success');
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function logout(silent) {
  STATE.token = null;
  STATE.user = null;
  localStorage.removeItem('crm_token');
  localStorage.removeItem('crm_user');
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  if (!silent) toast('Signed out', 'info');
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  // `#appWrap` ships as <div id="appWrap" class="hidden" style="display:none">, and the stylesheet
  // has `.hidden{display:none!important}`. An inline style cannot beat `!important`, and this
  // function only cleared the inline one — so a SUCCESSFUL login hid the login card and left the
  // entire console at display:none: blank page, on login and on every reload (the DOMContentLoaded
  // restore calls this same function). Drop the class as well; that is the only thing that beats it.
  const wrap = document.getElementById('appWrap');
  wrap.classList.remove('hidden');
  wrap.style.display = '';
  document.getElementById('userEmail').textContent = STATE.user.email;
  document.getElementById('userAvatar').textContent = (STATE.user.name || STATE.user.email)[0].toUpperCase();
  renderSidebar();
  switchTab('dashboard');
  checkPlan();
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let h = '';
  function item(it, indent) {
    const isGroup = it.type === 'group';
    if (isGroup) {
      const gid = 'group-'+it.label.toLowerCase().replace(/[^a-z]/g,'');
      h += `<div class="nav-item" onclick="toggleGroup('${gid}')" data-group="${gid}">
        <span class="nav-icon">${it.icon}</span>
        <span class="nav-text">${it.label}</span>
        <span class="nav-arrow">▶</span>
      </div>`;
      h += `<div class="nav-group-items" id="${gid}">`;
      it.children.forEach(c => item(c, true));
      h += '</div>';
    } else {
      h += `<div class="nav-item${STATE.activeTab===it.id?' active':''}" onclick="switchTab('${it.id}')" data-tab="${it.id}">
        <span class="nav-icon">${it.icon}</span>
        <span class="nav-text">${it.label}</span>
      </div>`;
    }
  }
  MENU.forEach(it => item(it, false));
  h += '<div class="nav-divider">── SETTINGS ──</div>';
  SETTINGS_MENU.forEach(it => item(it, false));
  // Admin menu is for platform operators — the DB uses three admin vocabularies
  // ('agency_admin' for the platform admin, 'owner'/'admin' for tenant owners).
  // Platform operators ONLY. 'owner'/'admin' are TENANT-owner vocabularies above — every
  // real tenant user is 'owner', so including them exposed the whole platform menu
  // (Features & Plans, Site Configuration, Telnyx/Email admin, Billing, Users) to customers.
  // The server rejects them anyway (tenant -> 403 on the plan registry), so this was a UI
  // leak that dead-ends on an error, not an escalation. Keep tenant-visible items in MENU
  // or SETTINGS_MENU instead.
  //
  // The ROLE STRING is not authority either — it is the same vocabulary. The real flag is
  // `users.is_platform_admin`, resolved server-side from the token subject
  // (src/auth/platform_admin.rs), and the API hands it to the client in the login payload
  // (top level AND inside `team_member`). Measured 2026-09-22 19:1x: a user with
  // is_platform_admin = true but role 'owner' — i.e. ANY operator granted the documented way —
  // saw NO admin menu at all (no Modules & Plans, no Affiliates), before AND after a reload,
  // while every /api/admin/* route would have answered 200. The tenant shell
  // (www-app/coreswift) already resolved this the same way; this console had not.
  // An ABSENT field means UNKNOWN (a session stored before this shipped) and only then is the
  // old role list consulted, so an already-signed-in operator keeps their menu.
  const PLATFORM_ROLES = ['agency_admin', 'platform_admin', 'superadmin'];
  const isPlatform = STATE.user && (STATE.user.platform_admin === undefined
    ? PLATFORM_ROLES.indexOf(STATE.user.role) >= 0
    : STATE.user.platform_admin === true);
  if (isPlatform) {
    h += '<div class="nav-divider">── ADMIN ──</div>';
    ADMIN_MENU.forEach(it => item(it, false));
  }
  nav.innerHTML = h;

  // Restore expanded groups
  document.querySelectorAll('.nav-group-items').forEach(g => {
    if (STATE.expandedGroups && STATE.expandedGroups[g.id]) {
      g.classList.add('expanded');
      const btn = g.previousElementSibling;
      if (btn) btn.classList.add('group-expanded');
    }
  });
}

function toggleGroup(gid) {
  const items = document.getElementById(gid);
  const btn = document.querySelector(`[data-group="${gid}"]`);
  if (!items) return;
  const isExpanded = items.classList.toggle('expanded');
  if (btn) btn.classList.toggle('group-expanded', isExpanded);
  if (!STATE.expandedGroups) STATE.expandedGroups = {};
  STATE.expandedGroups[gid] = isExpanded;
}

function switchTab(tabId) {
  STATE.activeTab = tabId;
  document.getElementById('pageTitle').textContent = getTabLabel(tabId);
  // Update sidebar active
  document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tabId);
  });
  renderTab(tabId);
  // Close user menu
  document.getElementById('userMenu').classList.remove('show');
}

function getTabLabel(id) {
  const all = [...MENU, ...SETTINGS_MENU, ...ADMIN_MENU];
  for (const it of all) {
    if (it.id === id) return it.label;
    if (it.type === 'group' && it.children) {
      for (const c of it.children) if (c.id === id) return c.label;
    }
  }
  return id.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}



// ===== UPGRADE BANNER =====
async function checkPlan() {
  try {
    // GET /api/billing/plans answers an ENVELOPE ({page,per_page,plans,total}) with the 6 real plans
    // under `plans`; reading it raw made `plans.length > 0` false for EVERY caller, so STATE.planName
    // was never set and showUpgradeBanner() never ran — the in-app upsell banner stayed hidden.
    const plans = famList(await API.get('/billing/plans'), 'plans');
    if (plans.length > 0) {
      // Find user's current plan or default to first
      const current = plans.find(p => p.is_current || p.is_default) || plans[0];
      STATE.planName = current.name || 'Free';
      document.getElementById('currentPlanName').textContent = STATE.planName;
      if (STATE.planName.toLowerCase() === 'free' || STATE.planName.toLowerCase() === 'starter') {
        if (!localStorage.getItem('crm_banner_dismissed')) {
          showUpgradeBanner();
        }
      }
    }
  } catch(e) {
    // Plan endpoint might not exist — that's fine
  }
}

function showUpgradeBanner() {
  document.getElementById('upgradeBanner').classList.remove('dismissed');
}

function dismissBanner() {
  document.getElementById('upgradeBanner').classList.add('dismissed');
  localStorage.setItem('crm_banner_dismissed', '1');
}

async function openUpgradeModal() {
  let plansHtml = '<div class="loading-wrap"><div class="spinner"></div> Loading plans...</div>';
  showModal('Upgrade Your Plan', plansHtml, '', true);
  try {
    // same envelope: without the unwrap `plans.forEach` did not exist and the modal could not list a
    // single plan (it painted an error instead of "No plans available")
    const plans = famList(await API.get('/billing/plans'), 'plans');
    if (plans.length === 0) {
      document.querySelector('#modalContainer .modal-body').innerHTML = '<p class="empty-state">No plans available</p>';
      return;
    }
    plansHtml = '<div class="plans-grid">';
    plans.forEach(p => {
      const isCurrent = p.name === STATE.planName;
      const price = p.price_monthly || p.price || 0;
      const features = planFeatureList(p.features);
      plansHtml += `<div class="plan-card${isCurrent?' current':''}">
        ${isCurrent ? '<span class="badge badge-primary plan-badge">Current</span>' : ''}
        <div class="plan-name">${escapeHtml(p.name)}</div>
        <div class="plan-price">$${price}<span>/mo</span></div>
        <ul class="plan-features">
          ${features.map(f => `<li class="check">✓ ${escapeHtml(f)}</li>`).join('')}
        </ul>
        <button class="btn ${isCurrent ? 'btn-secondary' : 'btn-primary'} btn-block" ${isCurrent?'disabled':''}>
          ${isCurrent ? 'Current Plan' : 'Upgrade'}
        </button>
      </div>`;
    });
    plansHtml += '</div>';
    document.querySelector('#modalContainer .modal-body').innerHTML = plansHtml;
  } catch(e) {
    document.querySelector('#modalContainer .modal-body').innerHTML = `<p style="color:var(--error)">Failed to load plans: ${escapeHtml(e.message)}</p>`;
  }
}

// ===== TAB RENDERING =====
function renderTab(tabId) {
  const container = document.getElementById('tabPanels');
  const fn = TAB_RENDERERS[tabId];
  if (fn) {
    container.innerHTML = fn();
    // If there's an async loader, call it
    if (TAB_LOADERS[tabId]) {
      TAB_LOADERS[tabId]();
    }
  } else {
    container.innerHTML = placeholderPanel(getTabLabel(tabId), 'This feature is under development.', '🚧');
  }
}

function placeholderPanel(title, desc, icon) {
  return `<div class="placeholder-panel">
    <div class="placeholder-icon">${icon||'🚧'}</div>
    <h3>${title}</h3>
    <p>${desc||'Configure this feature to get started.'}</p>
    <button class="btn btn-secondary" onclick="switchTab('integrations')">🔌 Open Integration Center</button>
  </div>`;
}

function pageHeader(title, desc, actions) {
  return `<div class="page-header">
    <h2>${title}</h2>
    ${desc ? `<p>${desc}</p>` : ''}
    ${actions ? `<div class="page-actions">${actions}</div>` : ''}
  </div>`;
}

function card(header, body, footer) {
  return `<div class="card">
    ${header ? `<div class="card-header">${header}</div>` : ''}
    ${body ? `<div class="card-body">${body}</div>` : ''}
    ${footer ? `<div class="card-footer">${footer}</div>` : ''}
  </div>`;
}

function dataTable(headers, rows, emptyMsg) {
  if (!rows || rows.length === 0) {
    return `<div class="card"><div class="card-body"><div class="empty-state">
      <div class="empty-icon">📭</div>
      <h3>No data yet</h3>
      <p>${emptyMsg || 'Nothing to display right now.'}</p>
    </div></div></div>`;
  }
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></div>`;
}

async function saveSiteConfig() {
  const getVal = (id) => {
    const el = document.getElementById(id);
    if (!el) return '';
    if (el.type === 'checkbox') return el.checked;
    return el.value;
  };

  const payload = {
    title: getVal('cfg_title'),
    description: getVal('cfg_description'),
    keywords: getVal('cfg_keywords'),
    og_title: getVal('cfg_og_title'),
    og_description: getVal('cfg_og_description'),
    og_image_url: getVal('cfg_og_image_url'),
    favicon_url: getVal('cfg_favicon_url'),
    canonical_url: getVal('cfg_canonical_url'),
    ga_id: getVal('cfg_ga_id'),
    gtm_id: getVal('cfg_gtm_id'),
    head_scripts: getVal('cfg_head_scripts'),
    body_scripts: getVal('cfg_body_scripts'),
    homepage: {
      headline: getVal('cfg_homepage_headline'),
      subheadline: getVal('cfg_homepage_subheadline')
    },
    legal_tos: getVal('cfg_legal_tos'),
    legal_privacy: getVal('cfg_legal_privacy'),
    legal_refunds: getVal('cfg_legal_refunds'),
    schema_json: getVal('cfg_schema_json'),
    enable_signups: getVal('cfg_enable_signups'),
    maintenance_mode: getVal('cfg_maintenance_mode'),
    rate_limit: parseInt(getVal('cfg_rate_limit')) || 60,
    session_timeout: parseInt(getVal('cfg_session_timeout')) || 30
  };

  try {
    const res = await API.put('/admin/site', payload);
    toast('Site configuration saved. Marketing HTML + legal pages regenerated.', 'success');
    SITE_CONFIG = { ...SITE_CONFIG, ...payload };
  } catch(e) {
    toast('Save failed: ' + e.message, 'error');
  }
}

function escapeHtmlAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Affiliates panel ─────────────────────────────────────────────────────────
// Wired onto the eight routes the affiliates module already served. Kept defensive on purpose:
// the API answers three different envelopes (`{referrals:…}`, `{promoting:…,available:…}` and a
// bare object for profile/stats), and the module is plan-gated, so a 402 has to read as a plan
// message rather than as "no data".
function affMoney(v) {
  const n = Number(v);
  return Number.isFinite(n) ? '$' + n.toFixed(2) : '$0.00';
}
function affShell(id, inner) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = inner;
}

async function loadAffiliates() {
  const notice = document.getElementById('affNotice');
  if (!document.getElementById('affStats')) return;   // tab was switched away mid-load

  let stats = null, profile = null, planBlocked = false;
  try {
    stats = await API.get('/affiliates/stats');
  } catch (e) {
    planBlocked = /Payment required|plan/i.test(String(e.message || e));
  }
  try { profile = await API.get('/affiliates/profile'); } catch (e) {
    if (!/404/.test(String(e.message || ''))) {
      if (/Payment required|plan/i.test(String(e.message || e))) planBlocked = true;
    }
  }

  if (planBlocked) {
    notice.innerHTML = '<div class="card"><div class="card-body"><p style="color:var(--text-secondary)">' +
      '<strong>Affiliates are not included in the current plan.</strong> The server refuses the whole ' +
      'module with “Payment required” (plan flag <code>affiliates</code>). Switch the flag on for this ' +
      'plan in <a href="#" onclick="switchTab(\'billing\');return false">Billing &amp; Plans</a> to use it.</p></div></div>';
    ['affStats', 'affProfile', 'affProducts', 'affReferrals', 'affPayouts'].forEach(id => affShell(id, ''));
    return;
  }
  notice.innerHTML = '';

  // stats
  if (stats && typeof stats === 'object' && !Array.isArray(stats)) {
    const items = [
      { icon: '📨', label: 'Total Referrals', value: stats.total_referrals || 0 },
      { icon: '⏳', label: 'Pending', value: stats.pending_referrals || 0 },
      { icon: '✅', label: 'Converted', value: stats.converted_referrals || 0 },
      { icon: '💵', label: 'Total Earned', value: affMoney(stats.total_earned) },
      { icon: '🏦', label: 'Total Paid', value: affMoney(stats.total_paid) },
      { icon: '🔜', label: 'Pending Payout', value: affMoney(stats.pending_payout) },
    ];
    affShell('affStats', items.map(it => `<div class="stat-card${it.icon === '💵' ? ' accent' : ''}">
      <div class="stat-icon">${it.icon}</div><div class="stat-value">${it.value}</div>
      <div class="stat-label">${it.label}</div></div>`).join(''));
  } else {
    affShell('affStats', '');
  }

  // profile — create it if this account has none yet (self-serve, POST /affiliates/profile)
  if (!profile || !profile.code) {
    // Every other section is profile-gated server-side (they answer 404 "No affiliate profile"),
    // so say that ONCE here instead of rendering three separate error lines.
    affShell('affStats', '');
    affShell('affProfile', card('Affiliate Profile', `
      <p style="color:var(--text-secondary);margin-bottom:12px">No affiliate profile yet. Creating one
      issues your referral code and starts tracking referrals, commissions and payouts — the sections
      below fill in as soon as it exists.</p>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <label style="display:block"><span class="stat-label">Commission rate (%)</span>
          <input id="affRate" type="number" step="0.1" min="0" value="20" style="padding:8px;border:1px solid var(--border);border-radius:6px;width:140px"></label>
        <label style="display:block"><span class="stat-label">Commission type</span>
          <select id="affType" style="padding:8px;border:1px solid var(--border);border-radius:6px">
            <option value="percentage">percentage</option><option value="fixed">fixed</option></select></label>
        <button class="btn btn-primary btn-sm" data-ops="affiliate-profile-create" onclick="affSaveProfile(true)">Create profile</button>
      </div>
      <div id="affProfileMsg" style="margin-top:8px"></div>`));
    affShell('affProducts', card('Products', '<p style="color:var(--text-secondary)">Products you can promote appear here once your affiliate profile exists.</p>'));
    affShell('affReferrals', '');
    affShell('affPayouts', '');
    return;
  }

  affShell('affProfile', card('Affiliate Profile', `
      <div class="stats-grid">
        <div class="stat-card accent"><div class="stat-icon">🔗</div>
          <div class="stat-value" style="font-size:18px">${escapeHtml(profile.code || '—')}</div>
          <div class="stat-label">Referral code</div></div>
        <div class="stat-card"><div class="stat-icon">📐</div>
          <div class="stat-value">${escapeHtml(String(profile.commission_rate ?? '—'))}${profile.commission_type === 'fixed' ? '' : '%'}</div>
          <div class="stat-label">Commission (${escapeHtml(profile.commission_type || 'percentage')})</div></div>
        <div class="stat-card"><div class="stat-icon">💵</div>
          <div class="stat-value">${affMoney(profile.total_earned)}</div><div class="stat-label">Earned</div></div>
        <div class="stat-card"><div class="stat-icon">🏦</div>
          <div class="stat-value">${affMoney(profile.total_paid)}</div><div class="stat-label">Paid out</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:12px">
        <label style="display:block"><span class="stat-label">Commission rate</span>
          <input id="affRate" type="number" step="0.1" min="0" value="${escapeHtml(String(profile.commission_rate ?? 0))}" style="padding:8px;border:1px solid var(--border);border-radius:6px;width:140px"></label>
        <label style="display:block"><span class="stat-label">Type</span>
          <select id="affType" style="padding:8px;border:1px solid var(--border);border-radius:6px">
            <option value="percentage"${profile.commission_type === 'percentage' ? ' selected' : ''}>percentage</option>
            <option value="fixed"${profile.commission_type === 'fixed' ? ' selected' : ''}>fixed</option></select></label>
        <label style="display:block"><span class="stat-label">Active</span>
          <select id="affActive" style="padding:8px;border:1px solid var(--border);border-radius:6px">
            <option value="true"${profile.is_active !== false ? ' selected' : ''}>yes</option>
            <option value="false"${profile.is_active === false ? ' selected' : ''}>no</option></select></label>
        <button class="btn btn-primary btn-sm" data-ops="affiliate-profile-save" onclick="affSaveProfile(false)">Save</button>
      </div>
      <div id="affProfileMsg" style="margin-top:8px"></div>`));

  // products: what this affiliate promotes vs what the tenant offers
  try {
    const mine = await API.get('/affiliates/my-products');
    const promoting = (mine && mine.promoting) || [];
    const available = (mine && mine.available) || [];
    const rows = promoting.map(p => [
      escapeHtml(p.name || '—'),
      affMoney(p.price),
      escapeHtml(String(p.commission_rate ?? '—')) + (p.commission_type === 'fixed' ? '' : '%'),
      '<span class="badge badge-success">promoting</span>',

      affMoney(r.commission_amount),
      String(r.created_at || '').slice(0, 10),
      r.paid_at ? String(r.paid_at).slice(0, 10) : 'not paid',
    ]);
    affShell('affReferrals', card('Referrals', dataTable(
      ['Referred', 'Status', 'Commission', 'Created', 'Paid'], rows, 'No referrals yet.')));
  } catch (e) {
    affShell('affReferrals', card('Referrals', '<p style="color:var(--text-secondary)">Could not load referrals: ' + escapeHtml(String(e.message || e)) + '</p>'));
  }

  // payouts
  try {
    const d = await API.get('/affiliates/payouts');
    const rows = ((d && d.payouts) || []).map(p => [
      affMoney(p.amount),
      `<span class="badge ${String(p.status).toLowerCase() === 'paid' ? 'badge-success' : 'badge-muted'}">${escapeHtml(p.status || '—')}</span>`,
      escapeHtml(p.payment_method || '—'),
      String(p.created_at || '').slice(0, 10),
      p.paid_at ? String(p.paid_at).slice(0, 10) : '—',
    ]);
    affShell('affPayouts', card('Payouts', dataTable(
      ['Amount', 'Status', 'Method', 'Created', 'Paid'], rows, 'No payouts recorded yet.')));
  } catch (e) {
    affShell('affPayouts', card('Payouts', '<p style="color:var(--text-secondary)">Could not load payouts: ' + escapeHtml(String(e.message || e)) + '</p>'));

async function affSaveProfile(isCreate) {
  const msg = document.getElementById('affProfileMsg');
  const rate = parseFloat((document.getElementById('affRate') || {}).value || '0');
  const type = (document.getElementById('affType') || {}).value || 'percentage';
  const activeEl = document.getElementById('affActive');
  const body = { commission_rate: rate, commission_type: type };
  if (activeEl) body.is_active = activeEl.value === 'true';
  try {
    if (isCreate) await API.post('/affiliates/profile', body);
    else await API.patch('/affiliates/profile', body);
    if (msg) msg.innerHTML = '<span style="color:var(--success,#059669)">Saved.</span>';
    await loadAffiliates();
  } catch (e) {
    if (msg) msg.innerHTML = '<span style="color:var(--danger,#dc2626)">' + escapeHtml(String(e.message || e)) + '</span>';
  }
}

async function affSelectProduct(id) {
  const msg = document.getElementById('affProductMsg');
  try { await API.post('/affiliates/my-products/select', { product_id: id }); await loadAffiliates(); }
  catch (e) { if (msg) msg.innerHTML = '<span style="color:var(--danger,#dc2626)">' + escapeHtml(String(e.message || e)) + '</span>'; }
}

async function affUnselectProduct(id) {
  const msg = document.getElementById('affProductMsg');
  try { await API.post('/affiliates/my-products/unselect', { product_id: id }); await loadAffiliates(); }
  catch (e) { if (msg) msg.innerHTML = '<span style="color:var(--danger,#dc2626)">' + escapeHtml(String(e.message || e)) + '</span>'; }
}

const TAB_LOADERS = {
  'affiliates': async () => { await loadAffiliates(); },
  // The Modules & Plans panel must load from TAB_LOADERS, not from inside its renderer: the
  // renderer runs BEFORE its HTML is in the document, so an in-renderer load saw no `#fpWrap`,
  // bailed out, and the panel sat on "Loading feature registry..." for ever. Every other
  // server-backed panel here registers a loader for the same reason.
  'features-plans': async () => { await loadFeatureMatrix(); },
  'dashboard': async () => {
    // EVERY tile names its SOURCE OF TRUTH and only ever renders a number that came back from it.
    // This loader used to render eight tiles, six of them from keys GET /api/dashboard/stats has
    // never answered (`stats.active_deals || stats.deals || 0`), so every tenant was shown a hard 0
    // it could not tell from a real one — and the route's real won value had no surface at all
    // (kanban t_02c55c8c).
    //   total_contacts / total_companies / total_opportunities / total_revenue -> GET /api/dashboard/stats
    //   Pipelines     -> GET /api/pipelines       (the tenant's ACTIVE pipelines — the read its tab makes)
    //   Open Tickets  -> GET /api/tickets/stats   (count of status = 'open')
    //   Tracked Links -> GET /api/tracked-links   (the tenant's links)
    // A source that does not answer (module off -> 402, endpoint down) renders '—', never a fabricated
    // 0. Two tiles were DROPPED because there is no source to name: "Emails Sent" (nothing in this API

    // event_type only — there is no week window, so "this week" could only be guessed). The admin
    // console carries the SAME tiles from the SAME keys: change the two shells together.
    const source = async (p) => { try { return await API.get(p); } catch(_) { return null; } };
    const cnt = (v) => (typeof v === 'number' && isFinite(v)) ? v : '—';
    const money = (v) => (typeof v === 'number' && isFinite(v)) ? '$' + v.toFixed(2) : '—';
    try {
      const [stats, pipes, tickets, links] = await Promise.all([
        source('/dashboard/stats'), source('/pipelines'), source('/tickets/stats'),
        source('/tracked-links')
      ]);
      let html = '';
      if (stats || pipes || tickets || links) {
        const items = [
          { icon:'👥', label:'Total Contacts', value: cnt(stats && stats.total_contacts) },
          { icon:'🏢', label:'Companies', value: cnt(stats && stats.total_companies) },
          { icon:'🎯', label:'Opportunities', value: cnt(stats && stats.total_opportunities) },
          { icon:'💰', label:'Won Deal Value', value: money(stats && stats.total_revenue) },
          { icon:'📈', label:'Pipelines', value: cnt(pipes && Array.isArray(pipes.pipelines) ? pipes.pipelines.length : null) },
          { icon:'🎫', label:'Open Tickets', value: cnt(tickets && tickets.open) },
          { icon:'🔗', label:'Tracked Links', value: cnt(links && Array.isArray(links.links) ? links.links.length : null) },
        ];
        items.forEach(it => {
          html += `<div class="stat-card${it.icon==='👥'?' accent':''}">
            <div class="stat-icon">${it.icon}</div>
            <div class="stat-value">${it.value}</div>
            <div class="stat-label">${it.label}</div>
          </div>`;
        });
      }
      document.getElementById('statsGrid').innerHTML = html || '<div class="card"><div class="card-body"><p style="color:var(--text-secondary)">Dashboard stats unavailable — no source answered.</p></div></div>';
    } catch(e) {
      document.getElementById('statsGrid').innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--text-secondary)">Dashboard stats unavailable: ${escapeHtml(String(e.message || e))}</p></div></div>`;
    }

  'pipelines': async () => {
    try {
      // GET /api/pipelines answers an ENVELOPE of WRAPPERS — {pipelines:[{pipeline:{…},stages:[…]}]} —
      // and each pipeline's deals live behind their own route. This reader tested Array.isArray() on the
      // envelope and then read a nested `deals` key the route has never returned, so the tab painted
      // "No pipelines yet" for every tenant and its deal table could never hold a row. The unwrap, the
      // wrapper hop, the opportunities read and the three counters are the TENANT shell's own
      // (nginx/www-app/coreswift/index.html loadPipelinesTab), copied expression-for-expression.
      const pipes = famList(await API.get('/pipelines'), 'pipelines');
      let html = '';
      if (pipes.length > 0) {
        for (const row of pipes) {
          const p = row.pipeline || row;
          let opps = [];
          try { opps = famList(await API.get('/pipelines/' + p.id + '/opportunities?per_page=50'), 'opportunities'); } catch (_) {}
          const won = opps.filter(function (o) { return o.is_won; }).length;
          const lost = opps.filter(function (o) { return o.is_lost; }).length;
          const open = opps.length - won - lost;
          html += '<div class="card" style="margin-bottom:16px">' +
            '<div class="card-header">📈 ' + fh(p.name) +
              ' <span class="badge badge-primary">' + opps.length + ' deals</span> ' +
              '<span class="badge badge-success">' + won + ' won</span> ' +
              '<span class="badge badge-muted">' + open + ' open</span> ' +
              '<span class="badge badge-error">' + lost + ' lost</span>' +
            '</div><div class="card-body">' +
              '<div class="table-wrap"><table>' +
                '<thead><tr><th>Deal</th><th>Value</th><th>Probability</th></tr></thead><tbody>';
          if (opps.length === 0) {
            html += '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">No deals in this pipeline</td></tr>';
          } else {
            opps.forEach(o => {
              // The old Contact and Stage columns are gone rather than re-fed: the opportunity row
              // carries contact_id/stage_id, not names, and GET /api/pipelines has never returned a
              // nested `deals` key — both cells were fed by keys that do not exist (t_4b1081bf's rule:
              // a cell fed by a key the route never returns is a lie; removal is the honest arm).
              html += '<tr>' +
                '<td>' + fh(o.name) + '</td>' +
                '<td>' + (o.value !== null && o.value !== undefined ? '$' + Number(o.value).toLocaleString() : '—') + '</td>' +
                '<td>' + (o.probability !== null && o.probability !== undefined ? o.probability + '%' : '—') + '</td>' +
              '</tr>';
            });
          }
          html += '</tbody></table></div></div></div>';
        }
      } else {
        html = '<div class="card"><div class="card-body"><div class="empty-state"><div class="empty-icon">📈</div><h3>No pipelines yet</h3><p>Create your first sales pipeline to start tracking deals.</p></div></div></div>';
      }
      document.getElementById('pipelinesContent').innerHTML = html;
    } catch(e) {
      document.getElementById('pipelinesContent').innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--text-secondary)">Pipelines endpoint: ${escapeHtml(e.message)}</p></div></div>`;
    }
  },

// ========== MODAL GENERATORS ==========
// ── INTEGRATION CENTER ───────────────────────────────────────────────────────
// One surface for every credential this account owns (BYOK), sourced from the API —
// never from a hardcoded list:
//   GET    /native/apps                    -> the first-party capture connectors
//   GET    /native/apps/:slug/status       -> THIS account's connection state
//   POST   /native/apps/:slug/test         -> live test, stores nothing
//   POST   /native/apps/:slug/connect      -> test, then store the credentials
//   POST   /native/apps/:slug/disconnect   -> forget the credentials
//   GET    /available-providers            -> the provider catalogue (DB-backed)
//   GET    /provider-keys                  -> stored keys, returns {count, items}
//   POST   /provider-keys                  -> upsert a key
//   PATCH  /provider-keys/:provider        -> toggle is_active without resending the secret
//   DELETE /provider-keys/:provider        -> remove
//
// What this replaced, so nobody reintroduces it: the old view hardcoded ten providers
// (five of which do not exist in available_providers, so saving them always 422'd),
// named none of the six native connectors, and read the key list as a bare array even
// though the API returns {count, items} — which is why every provider read
// "Not connected" no matter what the account had stored.

const IC = { apps: [], status: {}, providers: [], keys: {}, overview: null, isAdmin: false, loaded: false };

const IC_ADMIN_ROLES = ['owner', 'account_owner', 'admin', 'agency_admin'];

// The sister products, as cross-sell/upgrade paths. A tenant who already runs one of
// these and not CoreSwift is exactly who the upsell targets.
const IC_SISTERS = [
  { slug:'funnelswift',          name:'FunnelSwift',          url:'https://app.funnelswift.net',         pitch:'Sales funnels and landing pages. Funnel opt-ins land in CoreSwift as contacts.' },
  { slug:'workflowswift',        name:'WorkflowSwift',        url:'https://app.workflowswift.com',       pitch:'Workflow automation on n8n — enrich and route leads before they reach the CRM.' },
  { slug:'missedcall-responder', name:'MissedCall Responder', url:'https://app.missedcallrespondr.com',   pitch:'Missed-call text-back. Every recovered caller becomes a lead in CoreSwift.' },
  { slug:'adaswift',             name:'AdaSwift',             url:'https://app.adaswift.com',            pitch:'Accessibility scanning and client reporting for agencies.' },
  { slug:'multi-directory',      name:'Multi-Directory',      url:'https://directory.swiftsoftware.net', pitch:'Publish and follow up across business directories.' },
  { slug:'cheatlayer',           name:'CheatLayer',           url:'https://cheatlayer.com',              pitch:'Browser automation and scraping — scrape-to-lead.' }
];

// Pre-filled API base per connector. The connector health-checks <base>/api/health
// (WorkflowSwift: <base>/health, FunnelSwift: <base>/v1/health), so a wrong value is
// caught by the test before anything is stored.
const IC_BASE_DEFAULT = {
  'adaswift': 'https://app.adaswift.com',
  'cheatlayer': 'https://cheatlayer.com',
  'funnelswift': 'https://app.funnelswift.net',
  'workflowswift': 'https://app.workflowswift.com',
  'missedcall-responder': 'https://app.missedcallrespondr.com',
  'multi-directory': 'https://directory.swiftsoftware.net'
};

const IC_FIELD_LABEL = { api_key: 'API Key', base_url: 'API Base URL', webhook_secret: 'Webhook Secret' };

const IC_FIELD_HINT = {
  base_url: 'The address this app answers on, e.g. https://app.funnelswift.net — the connection test calls it directly.',
  webhook_secret: 'The signing secret this app sends with its webhook payloads.'
};

const IC_PROVIDER_ICON = { brain:'🤖', mail:'✉️', newspaper:'📰', database:'🗄️', key:'🔑', phone:'📱', message:'💬', chart:'📈', search:'🔎', globe:'🌐' };

function icIsAdmin() {
  return !!(STATE.user && IC_ADMIN_ROLES.indexOf(STATE.user.role) >= 0);
}

function icErr(title, msg) {
  const upgrade = /payment required|forbidden|not entitled/i.test(msg || '')
    ? ' This module may be switched off on your plan — check <strong>Features &amp; Plans</strong>.'
    : '';
  return '<div class="card"><div class="card-body"><p style="color:var(--error);margin:0">' +
    escapeHtml(title) + ': ' + escapeHtml(msg || 'request failed') + upgrade + '</p></div></div>';
}

function icBind(el) {
  el.querySelectorAll('[data-ic]').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.getAttribute('data-ic');
      const slug = b.getAttribute('data-slug');
      const provider = b.getAttribute('data-provider');
      if (act === 'connect') icOpenConnect(slug);
      else if (act === 'disconnect') icDisconnectApp(slug);
      else if (act === 'provider') icOpenProvider(provider);
      else if (act === 'provider-del') icDeleteProvider(provider);
    });
  });
  el.querySelectorAll('[data-ic-toggle]').forEach(c => {
    c.addEventListener('change', () => icToggleProvider(c.getAttribute('data-ic-toggle'), c.checked));
  });
}

async function loadIntegrationCenter() {
  IC.isAdmin = icIsAdmin();
  await Promise.all([icLoadApps(), icLoadProviders(), icLoadOverview()]);
  icRenderUpgradePaths();

}

// ── Native connectors: the capture apps that push leads INTO CoreSwift ──
async function icLoadApps() {
  const wrap = document.getElementById('icNativeWrap');
  if (!wrap) return;
  let apps = [];
  try {
    const d = await API.get('/native/apps');
    apps = (d && d.apps) || [];
  } catch (e) {
    wrap.innerHTML = icErr('Could not load native connectors', e.message);
    return;
  }
  IC.apps = apps;

  // Connection state is per-connector (and per-account) — one call each, in parallel.
  const status = {};
  await Promise.all(apps.map(async a => {
    try { status[a.slug] = await API.get('/native/apps/' + encodeURIComponent(a.slug) + '/status'); }
    catch (e) { status[a.slug] = { connected: false, status_error: e.message }; }
  }));
  IC.status = status;
  icRenderApps();
}

function icRenderApps() {
  const el = document.getElementById('icNativeWrap');
  if (!el) return;
  const rows = IC.apps.map(a => {
    const st = IC.status[a.slug] || {};
    const connected = !!st.connected;
    const access = a.access_level === 'admin_tenant' ? 'This account' : 'Platform admin';

    let statusCell;
    if (connected) {
      statusCell = '<span class="status-dot connected"></span> ' +
        (st.last_test_ok === false
          ? '<span class="badge badge-warning">connected, last test failed</span>'
          : '<span class="badge badge-success">connected</span>');
      if (st.last_test_at) {
        statusCell += '<div style="font-size:.72rem;color:var(--text-muted)">tested ' +
          escapeHtml(new Date(st.last_test_at).toLocaleString()) + '</div>';
      }
      if (st.error_message) {
        statusCell += '<div style="font-size:.72rem;color:var(--warning,#f0ad4e)">' + escapeHtml(st.error_message) + '</div>';
      }
    } else {
      statusCell = '<span class="status-dot disconnected"></span> <span class="badge badge-muted">not connected</span>';
      if (st.status_error) {
        statusCell += '<div style="font-size:.72rem;color:var(--text-muted)">' + escapeHtml(st.status_error) + '</div>';
      }
    }

    // Platform-level connectors need an admin; tenant-level ones any account owner.
    const canManage = a.access_level === 'admin_tenant' || IC.isAdmin;
    let actions = '';
    if (canManage) {
      actions += '<button class="btn ' + (connected ? 'btn-secondary' : 'btn-primary') + ' btn-xs" data-ic="connect" data-slug="' +
        escapeHtmlAttr(a.slug) + '">' + (connected ? 'Reconfigure' : 'Connect') + '</button>';
      if (connected) {
        actions += ' <button class="btn btn-ghost btn-xs" data-ic="disconnect" data-slug="' +
          escapeHtmlAttr(a.slug) + '">Disconnect</button>';
      }
    } else {
      actions += '<span style="font-size:.72rem;color:var(--text-muted)">platform-admin connection</span>';
    }

    return [
      '<strong>' + escapeHtml(a.name) + '</strong>' +
        '<div style="font-size:.74rem;color:var(--text-muted);max-width:360px">' + escapeHtml(a.description || '') + '</div>',
      escapeHtml(access),
      statusCell,
      actions
    ];
  });

  el.innerHTML = card('📥 Lead capture apps &rarr; CoreSwift',
    '<p style="color:var(--text-secondary);margin:0">Each of these apps captures leads. Connect it and its captured leads flow <strong>into this account</strong> — ' +
    'CoreSwift is the single home for them, so you work every lead here instead of in six places. ' +
    'Credentials are stored per account (never as a platform-wide default) and the connection is only saved after a live test passes.</p>') +
    dataTable(['App', 'Credentials', 'Status', ''], rows,
      IC.apps.length ? 'No connectors registered.' : 'No native connectors are registered on this platform yet.');

  icBind(el);
}

function icOpenConnect(slug) {
  const a = IC.apps.find(x => x.slug === slug);
  if (!a) return;
  const fields = (a.auth_fields && a.auth_fields.length) ? a.auth_fields : ['api_key'];
  const st = IC.status[slug] || {};
  const sister = IC_SISTERS.find(s => s.slug === slug);

  let body = '<p style="color:var(--text-secondary);margin-bottom:14px">' + escapeHtml(a.description || '') + '</p>';
  if (sister) {
    body += '<p style="color:var(--text-secondary);margin-bottom:14px">Direction in CoreSwift is <strong>inbound</strong>: once live, ' +
      escapeHtml(sister.name) + ' pushes its captured leads into this account.</p>';
  }
  fields.forEach(f => {
    const secret = /key|secret|token|password/i.test(f);
    const def = f === 'base_url' ? ((st.config && st.config.base_url) || IC_BASE_DEFAULT[slug] || '') : '';
    body += '<div class="form-group"><label>' + escapeHtml(IC_FIELD_LABEL[f] || f) + '</label>' +
      '<input type="' + (secret ? 'password' : 'text') + '" id="icF_' + escapeHtmlAttr(f) + '" value="' + escapeHtmlAttr(def) + '" autocomplete="off">' +
      (IC_FIELD_HINT[f] ? '<span class="form-hint">' + escapeHtml(IC_FIELD_HINT[f]) + '</span>' : '') +
      '</div>';
  });
  body += '<p class="form-hint">Connecting runs a live test first — a bad key or URL is reported here and nothing is stored.</p>';

  showModal('Connect ' + escapeHtml(a.name), body,
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-secondary" id="icTestBtn">Test only</button>' +
    '<button class="btn btn-primary" id="icConnectBtn">Test &amp; connect</button>');

  const readCreds = () => {
    const c = {};
    fields.forEach(f => {
      const el = document.getElementById('icF_' + f);
      c[f] = el ? el.value.trim() : '';
    });

  };
  const tb = document.getElementById('icTestBtn');
  if (tb) tb.addEventListener('click', () => icTestCreds(slug, readCreds(), tb));

function famList(res, key) {
  if (Array.isArray(res)) return res;
  if (res && Array.isArray(res[key])) return res[key];
  if (res && res.data && Array.isArray(res.data)) return res.data;
  return [];
}

// ONE feature shape for every plan card in this shell. GET /api/billing/plans returns each plan's
// `features` as a JSONB OBJECT ({"max_contacts":100,"api_access":true, …}) — NOT a list — so
// (p.features || []).slice(0, 6) threw "slice is not a function" and no plan card could paint.
// Show what the plan really enables (true) or sizes (a positive number); a plain array is still
// honoured for a plan that stores a list.
function planFeatureList(raw) {
  const out = [];
  if (Array.isArray(raw)) {
    raw.slice(0, 6).forEach(f => out.push(typeof f === 'string' ? f : (f && (f.name || f.key)) || ''));
  } else if (raw && typeof raw === 'object') {
    Object.keys(raw).forEach(k => {
      const v = raw[k];
      if (v === true) out.push(k.replace(/_/g, ' '));
      else if (typeof v === 'number' && v > 0) out.push(k.replace(/_/g, ' ') + ' (' + v + ')');
    });
  }
  return out.slice(0, 6);
}
function fh(v) { return escapeHtml(String(v === null || v === undefined || v === '' ? '—' : v)); }

    mine = (d && (d.assignments || d.tags)) || [];
    if (d && d.assignments) {
      // `assignments` carries the assignment id the DELETE route needs; `tags` is the
      // tag rows themselves (kept unchanged for existing consumers).
      mine = d.assignments.map(function (a) {
        const t = (d.tags || []).filter(function (x) { return x.id === a.tag_id; })[0] || {};
        return { assignment_id: a.id, tag_id: a.tag_id, id: a.tag_id, name: t.name, color: t.color };
      });
    } else {
      mine = mine.map(function (t) { return { assignment_id: null, tag_id: t.id, id: t.id, name: t.name, color: t.color }; });
    }
  } catch (e) { body.innerHTML = icErr('Could not read tags', e.message); return; }

  const assignedIds = mine.map(function (m) { return m.tag_id; });
  const avail = all.filter(function (t) { return assignedIds.indexOf(t.id) < 0; });
  body.innerHTML =
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
      (mine.length ? mine.map(function (m) {
        return '<span class="badge" style="background:' + escapeHtmlAttr(m.color || 'var(--accent-subtle)') +
          ';color:#fff;padding:6px 12px">' + escapeHtml(m.name || m.tag_id) +
          (m.assignment_id ? ' <a href="#" onclick="ctUnassignTag(\'' + escapeHtmlAttr(cid) + '\',\'' +
            escapeHtmlAttr(m.assignment_id) + '\');return false" title="Remove tag">✕</a>' : '') +
          '</span>';
      }).join('') : '<span class="config-desc">No tags on this contact yet.</span>') +
    '</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-end">' +
      '<div style="flex:1"><label style="display:block;font-size:.8rem;color:var(--text-secondary);margin-bottom:6px">Add a tag</label>' +
      '<select id="ctTagPick">' + (avail.length
        ? avail.map(function (t) { return '<option value="' + escapeHtmlAttr(t.id) + '">' + escapeHtml(t.name) + '</option>'; }).join('')
        : '<option value="">No tags left to add</option>') + '</select></div>' +
      '<button class="btn btn-primary btn-sm" id="ctTagAdd"' + (avail.length ? '' : ' disabled') + '>Assign</button>' +
    '</div>' +
    (all.length ? '' : '<p style="color:var(--text-secondary);margin-top:10px">No tags exist yet — create some on the Tags tab.</p>');
  const add = document.getElementById('ctTagAdd');
  if (add) add.addEventListener('click', function () {
    const sel = document.getElementById('ctTagPick');
    if (sel && sel.value) ctAssignTag(cid, sel.value);
  });
}
