async function openTicket(id) {
  try {
    const data = await API.get('/tickets/' + id);
    const t = (data && data.ticket) || {};
    const msgs = (data && data.messages) || [];
    let html = '<div class="card"><div class="card-body">' +
      '<p style="margin-bottom:8px"><strong>' + escapeHtml(t.subject || 'Ticket') + '</strong></p>' +
      '<p style="color:var(--text-secondary);white-space:pre-wrap">' + escapeHtml(t.description || '') + '</p>' +
      '<p style="color:var(--text-muted);font-size:12px">Status: ' + escapeHtml(t.status || 'open') +
      ' · Priority: ' + escapeHtml(t.priority || 'medium') + ' · Source: ' + escapeHtml(t.source || 'form') + '</p>' +
      // CS-22: what the customer needs in order to see this request in the 💬 My Support portal —
      // their address plus a reference. The ticket id is already on screen; nothing is hardcoded.
      '<p style="color:var(--text-muted);font-size:12px">Customer portal reference: <code>' +
        escapeHtml(String(t.id || id).slice(0, 8)) + '</code> — the customer opens My Support and signs in with their email address and this reference.</p>' +
      '</div></div>';
    html += '<div class="card" style="margin-top:12px"><div class="card-header">Thread</div><div class="card-body">';
    if (!msgs.length) {
      html += '<p style="color:var(--text-secondary)">No replies yet.</p>';
    } else {
      msgs.forEach(m => {
        html += '<div style="border-left:3px solid var(--border);padding:6px 10px;margin-bottom:8px">' +
          '<div style="font-size:12px;color:var(--text-muted)">' + escapeHtml(m.sender_type || '') + ' · ' +
          escapeHtml(m.created_at ? new Date(m.created_at).toLocaleString() : '') + '</div>' +
          '<div style="white-space:pre-wrap">' + escapeHtml(m.message || '') + '</div></div>';
      });
    }
    html += '<div class="form-group"><label>Reply</label><textarea rows="3" id="tkReplyBox"></textarea></div>';
    html += '</div></div>';
    showModal('🎫 ' + escapeHtml(t.subject || 'Ticket'), html,
      '<button class="btn btn-ghost" onclick="closeModal()">Close</button>' +
      '<button class="btn btn-primary" onclick="replyTicket(\'' + id + '\')">Send reply</button>', true);
  } catch (e) {
    toast('Could not open the ticket: ' + e.message, 'error');
  }
}
async function replyTicket(id) {
  const el = document.getElementById('tkReplyBox');
  const message = el ? el.value.trim() : '';
  if (!message) { toast('Write a reply first', 'error'); return; }
  try {
    // CS-22: a reply written in the tenant console is the STAFF side of the thread. It used to be
    // stored as sender_type 'contact', which made the agent's own answer read as the customer's —
    // wrong in this console and wrong in the customer portal, where 'contact' renders as "you".
    await API.post('/tickets/' + id + '/messages', { message: message, sender_type: 'agent' });
    toast('Reply sent', 'success');
    openTicket(id);
  } catch (e) { toast('Reply failed: ' + e.message, 'error'); }
}

async function saveNewCompany() {
  const name = coModalValue('coAddName');
  if (!name) { toast('Company name is required', 'error'); return; }
  // POST /api/companies takes every profile column as OPTIONAL (CreateCompanyRequest; only `name`
  // is required), so blanks are omitted instead of stored as empty strings.
  const body = { name: name };
  CO_FORM_FIELDS.forEach(f => {
    if (f.key === 'name') return;
    const v = coModalValue('coAdd' + f.id);
    if (v) body[f.key] = v;
  });
  try {
    await API.post('/companies', body);
    closeModal();
    toast('Company created', 'success');
    if (typeof TAB_LOADERS !== 'undefined' && TAB_LOADERS['companies']) TAB_LOADERS['companies']();

let CO_EDIT = null;   // { id, orig } — the row the editor was opened on

// Company editor — GET /api/companies/{id} prefills it, PATCH /api/companies/{id} saves it.
// Until t_f582ff76 this was toast('Editing company: ' + id), so the row was unreadable and
// uneditable from the tab.
async function editCompany(id) {
  let c;
  try { c = await API.get('/companies/' + encodeURIComponent(id)); }
  catch (e) { toast('Could not load company: ' + e.message, 'error'); return; }
  if (!c || !c.id) { toast('Company not found', 'error'); return; }
  CO_EDIT = { id: id, orig: c };
  showModal('Edit Company',
    CO_FORM_FIELDS.map(f => coFieldHtml('coEdit', f, c[f.key])).join(''),
    '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary btn-sm" data-ops="company-update" onclick="saveCompanyEdit()">Save</button>');
}

async function saveCompanyEdit() {
  const cur = CO_EDIT;
  if (!cur || !cur.id) { toast('No company selected', 'error'); return; }
  const name = coModalValue('coEditName');
  if (!name) { toast('Company name is required', 'error'); return; }
  // Only CHANGED fields are sent: PATCH binds every column as COALESCE($n, column)
  // (src/companies/handlers.rs::update), so NULL means "leave it alone" and an empty string is the
  // one value that CLEARS a text column. That is survivable here because `companies.domain` is
  // indexed but NOT unique — the contact editor's blank-email 500 (idx_contacts_tenant_email) has
  // no counterpart on this table (measured: \d companies).
  const body = {};
  CO_FORM_FIELDS.forEach(f => {
    const v = coModalValue('coEdit' + f.id);
    const raw = cur.orig[f.key];
    const was = (raw === null || raw === undefined) ? '' : String(raw);
    if (v !== was) body[f.key] = v;
  });
  if (!Object.keys(body).length) { closeModal(); toast('No changes to save', 'info'); return; }
  try {
    await API.patch('/companies/' + encodeURIComponent(cur.id), body);
    closeModal();
    toast('Company updated', 'success');
    if (typeof TAB_LOADERS !== 'undefined' && TAB_LOADERS['companies']) TAB_LOADERS['companies']();
  } catch (e) {
    toast('Update failed: ' + e.message, 'error');
  }
}

    return false;
  }

  document.addEventListener('keydown', function (e) {
    // Always allow Escape to close modal / clear g-buffer
    if (e.key === 'Escape') { clearG(); closeModal(); return; }

    if (isTyping(e.target)) return; // never hijack while typing

    // handle 'g' prefix
    if (pendingG) {
      var k2 = (e.key || '').toLowerCase();
      if (e.key === 'Escape' || e.key === '?' || e.key === 'g') { clearG(); }
      else if (NAV[k2]) {
        e.preventDefault(); e.stopPropagation();
        clearG();
        if (STATE && STATE.user) { switchTab(NAV[k2].tab); }
      } else { clearG(); return; }
      return;
    }

    var key = (e.key || '').toLowerCase();
    var ctrl = e.ctrlKey || e.metaKey;

    // '?' help
    if (e.key === '?' || (e.shiftKey && key === '/')) {
      e.preventDefault();
      toastShortcuts(Object.keys(NAV).map(function (k) { return NAV[k]; }).concat(
        Object.keys(ACTIONS).map(function (k) { return ACTIONS[k]; })));
      return;
    }

    // '/' global search (non-shift)
    if (key === '/' && !e.shiftKey && !ctrl) {
      e.preventDefault();
      if (!focusSearch()) toastShortcuts([{ desc: 'No search box on this tab' }]);
      return;
    }

    // step through modal actions
    if (modalOpen()) return;

    if (key === 'g') {
      e.preventDefault(); pendingG = 'g';
      if (gTimer) clearTimeout(gTimer);
      gTimer = setTimeout(clearG, 1200);
      return;
    }

    if (!ctrl && ACTIONS[key]) {
      e.preventDefault();
      ACTIONS[key].fn();
    }
  });
})();
// ===== END KEYBOARD SHORTCUTS =====

</script>
</body>
</html>
