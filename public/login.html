<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#6366f1,#4f46e5);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px;width:400px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-card .emoji{font-size:40px;text-align:center;margin-bottom:8px}
.login-card h1{font-size:24px;font-weight:700;text-align:center;color:#1e293b;margin-bottom:4px}
.login-card p.sub{text-align:center;color:#64748b;font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:4px}
.form-group input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none}
.form-group input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(0,0,0,.08)}
.btn{width:100%;padding:10px;border:none;border-radius:8px;font-size:15px;font-weight:600;color:#fff;background:#6366f1;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{color:#ef4444;font-size:13px;margin-bottom:12px;display:none}
.error.show{display:block}
.loading{text-align:center;margin-top:12px;font-size:13px;color:#64748b;display:none}
</style>
</head>
<body>
<div class="login-card">
<div style="text-align:center;margin-bottom:16px;">
 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="140" height="35" style="display:inline-block;">
 <defs>
 <linearGradient id="logoGradLogin" x1="0%" y1="100%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#2563EB" />
 <stop offset="100%" stop-color="#06B6D4" />
 </linearGradient>
 </defs>
 <g transform="translate(5, 4)">
 <rect width="32" height="32" rx="8" fill="#F1F5F9"/>
 <path d="M 22 8 A 8 8 0 0 1 22 24" fill="none" stroke="url(#logoGradLogin)" stroke-width="2.5" stroke-linecap="round" />
 <path d="M 12 24 L 21 11 L 17 18 L 24 18 L 14 27 L 16 21 Z" fill="url(#logoGradLogin)" />
 </g>
 <text x="46" y="26" fill="#0F172A" style="font-family: inherit; font-weight: 800; font-size: 18px; letter-spacing: -0.03em;">CoreSwift</text>
 <text x="126" y="26" fill="#2563EB" style="font-family: inherit; font-weight: 800; font-size: 18px; letter-spacing: -0.03em;">CRM</text>
 </svg>
 </div>
<p class="sub" style="margin-top:0;">Client Relationship Management</p>
<div class="error" id="login-error"></div>
<form id="login-form">
<div class="form-group">
<label>Email</label>
<input type="email" id="login-email" placeholder="your@email.com" required autocomplete="email">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="login-password" placeholder="Enter password" required autocomplete="current-password">
</div>
<button type="submit" class="btn" id="login-btn">Sign In</button>
</form>
<div class="loading" id="login-loading">Signing in...</div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async function(e){
e.preventDefault();
var btn = document.getElementById('login-btn');
var err = document.getElementById('login-error');
var loading = document.getElementById('login-loading');
err.classList.remove('show');
btn.disabled = true;
loading.style.display = 'block';
try{
var res = await fetch('/api/v1/auth/login', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
email: document.getElementById('login-email').value,
password: document.getElementById('login-password').value
})
});
var data = await res.json();
if(!res.ok) throw new Error(data.error || data.message || 'Login failed');
var token = data.token || data.access_token;
if(token) localStorage.setItem('token', token);
window.location.href = '/dashboard';
}catch(ex){
err.textContent = ex.message;
err.classList.add('show');
btn.disabled = false;
loading.style.display = 'none';
}
});
</script>
</body>
